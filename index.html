/* ───────────────────────── 7. CLIMATE CASINO CH 19–20 ───────────────────────── */
M.push({t:"Carbon prices & national policy (Nordhaus 19–20)", c:[
{t:"Why a carbon price?", h:`
<p>Climate policy is "a tale of two sciences": the <b>natural</b> sciences diagnose the problem, and the <b>social</b> sciences design the cure.</p>
<p>What makes billions of people buy efficient cars, holiday closer to home, redesign factories and invest in low-carbon R&amp;D? The single most important missing mechanism is a <b>high price on CO₂ emissions</b>.</p>
<ul>
<li>CO₂ is an <b>externality</b>. When I run my air conditioner I pay for the electricity but not the CO₂ damage, because the US carbon price is zero.</li>
<li>The fix (Pigou): "Everyone, everywhere, and for the indefinite future must face prices that reflect the social costs of their activities."</li>
<li>A high carbon price signals harm the way a sky-high Manhattan land price signals "this is no place for a golf course".</li>
</ul>
<div class="prob"><b>Household example ($25/t CO₂)</b>10,000 kWh/yr at 10¢ = $1,000. Half coal, half gas → 8 t CO₂.<br>8 × $25 = <b>+$200 a year</b>, a <b>20%</b> rise in the electricity bill.</div>`},
{t:"Two ways, and who writes the cheque", h:`
<p>There are only <b>two</b> ways to put a market price on emissions:</p>
<ol><li><b>Carbon tax</b>: pay per ton emitted, like a petrol tax.</li><li><b>Cap and trade</b>: cap total emissions, issue permits, and let firms trade them.</li></ol>
<p><b>Who pays?</b> Administratively it's cheapest to collect from <b>refineries</b> (oil) and <b>power plants</b> (coal), and to cover imports and exports.</p>
<p>"<b>The only good tax is an invisible tax</b>." Half of US Social Security tax is "paid" by firms, so people don't feel it, though it really comes out of wages. So taxing <b>upstream</b> may reduce opposition.</p>
<div class="key">Economically it makes <b>no difference</b> whether the producer, refiner or petrol station pays. The carbon price is passed on to consumers either way.</div>`},
{t:"Three jobs a carbon price does", h:`
<ol>
<li><b>Consumers</b> learn which goods are carbon-heavy. Flying gets dearer relative to local trips or the train.</li>
<li><b>Producers</b> learn which inputs are carbon-heavy. Coal power costs rise sharply, gas less, nuclear and wind not at all. In 2012, 16 of 21 US utilities already planned with a CO₂ price averaging just under $25 for 2020.</li>
<li><b>Innovators</b> learn where to aim R&amp;D. GE spent $5 bn on R&amp;D in 2012. Expected high carbon prices shift its bets from coal to wind and nuclear.</li>
</ol>
<p><b>It also economises on information.</b> Should you fly (350 kg CO₂) or drive (400 kg) from Denver to Albuquerque? Then there are the airport trips, how full the plane is, and the carbon embodied in tyres and aluminium. With a universal carbon price, all of that is already in the ticket and fuel prices. You don't need to calculate anything.</p>
<p>Advantages: strong incentives, <b>even-handed</b>, reaches every part of the economy from production to innovation, and <b>economises on information</b>.</p>`},
{t:"Setting the right price", h:`
<p><b>Approach 1 · Social cost of carbon (SCC)</b>: the economic damage from <b>one additional ton</b> of CO₂. It guides tax levels, cap levels, international minimum prices and US regulations (vehicle fuel efficiency, building standards, new power plants). The US government's best estimate was about <b>$25/t for 2015</b>.</p>
<p><b>Approach 2 · IAM price path</b> to hit a temperature target. For <b>2½°C</b> (13 models, full participation, efficient): start at about <b>$25 in 2015</b>, rise about <b>5%/yr real</b> to <b>$53 in 2030</b> and <b>$93 in 2040</b>. Models vary widely.</p>
<table>
<tr><th>Wholesale, $25/t tax (Table 8)</th><th class="r">Before</th><th class="r">After</th><th class="r">Change</th></tr>
<tr><td>Coal ($/mmbtu)</td><td class="r">1.8</td><td class="r">4.1</td><td class="r"><b>+134%</b></td></tr>
<tr><td>Industrial electricity (¢/kWh)</td><td class="r">6.9</td><td class="r">9.0</td><td class="r">+31%</td></tr>
<tr><td>Natural gas ($/mmbtu)</td><td class="r">4.5</td><td class="r">5.8</td><td class="r">+30%</td></tr>
<tr><td>Petroleum ($/mmbtu)</td><td class="r">17.2</td><td class="r">19.1</td><td class="r">+11%</td></tr>
</table>
<p>Coal is hit hardest. Petroleum is hit least because it has high value per unit of CO₂.</p>`},
{t:"Household impact & the fiscal case", h:`
<table>
<tr><th>Item, $25/t (Table 9)</th><th class="r">t CO₂</th><th class="r">Extra spend</th><th class="r">%</th></tr>
<tr><td>Year's electricity</td><td class="r">9.34</td><td class="r">$233.40</td><td class="r"><b>19.45</b></td></tr>
<tr><td>Year's driving</td><td class="r">4.68</td><td class="r">$116.90</td><td class="r">7.79</td></tr>
<tr><td>Transcontinental flight</td><td class="r">0.67</td><td class="r">$16.80</td><td class="r">5.61</td></tr>
<tr><td>Communications / financial services</td><td class="r">0.01 / 0.02</td><td class="r">$0.36 / $0.41</td><td class="r">0.04</td></tr>
<tr class="hl"><td>All household consumption</td><td class="r">29.48</td><td class="r">$737</td><td class="r"><b>0.92</b></td></tr>
</table>
<p>Carbon-heavy goods get relatively dearer, so people buy less of them: the "law of downward-sloping demand".</p>
<p><b>US carbon tax path (Table 10)</b>: $25 (2015) → $30 (2020) → $53 (2030). Revenue $147 bn → <b>$168 bn in 2020 (about 1% of GDP)</b> → $277 bn (1.25%). Emissions fall from 6.3 to 5.2 bn t, stabilising at about the 2000 level. US debt/GDP went from 36% (2007) to 76% (2013), so the revenue helps.</p>
<div class="key">"A carbon tax is the closest thing to an ideal tax that can be imagined." It is the only tax that <b>raises efficiency</b>, because it shrinks a harmful activity. It has health co-benefits (less coal), can replace inefficient regulations, and is a possible compromise between fiscal conservatives and environmentalists.</div>`},
{t:"Ch 20: two economic truths & cap and trade", h:`
<ol><li>People and firms must face <b>incentives</b>: carbon fuels must get dearer, "an inconvenient economic truth".</li><li><b>Markets alone won't solve it.</b> There is no genuine "free-market solution". We need national and international <b>institutions</b>, legislated and enforced by governments.</li></ol>
<p><b>Cap and trade</b>: legislate a cap, issue allowances (the book's whimsical "United States of Pacifica" certificate for 1,000 t), then the "brilliant innovation" of <b>trade</b>.</p>
<div class="prob"><b>Why trade raises welfare</b>Firm A's obsolete plant gets only <b>$2</b>/t of value from its allowances. Firm B's new server farm would get <b>$202</b>/t. They trade at about $25. Allowances move to the higher-value use, so welfare rises by <b>$200/t</b>.</div>
<ul><li>Precedents: auctions for oil drilling rights, timber and radio spectrum. The <b>US SO₂ programme (1990)</b> worked so well it became the model for <b>Kyoto</b> and the <b>EU ETS</b>.</li>
<li>Because emissions are capped below the free-market level they become scarce like land, so the allowance price rises until demand fits the cap, like a high corn price rationing corn.</li>
<li><b>EU ETS</b> (Fig 35): phase 1 had more allowances than emissions, so the price fell to <b>zero in 2007</b>. Phase 2 started about €20 ($27) and fell to about €8 ($11) by 2012. It dropped almost 75% in a few months of 2008.</li></ul>`},
{t:"Tax vs cap: equivalence & differences", h:`
<p><b>Central equivalence</b>: uncontrolled US emissions are 5 bn t. Either auction a cap of 4 bn t, or levy a tax. If the last ton costs $25 to remove, the permit price becomes $25. A $25 tax produces the same 1 bn t cut. Firms pay <b>4 bn × $25 = $100 bn</b> either as tax or for permits, and the government gets $100 bn either way. "Cap and trade operates just like a tax on pollution": one is a quantity regulation, the other a price regulation.</p>

6.0,114.4 L296.0,114.4 L296.0,286.0"/><text x="50.0" y="118.4" text-anchor="end">high P</text><circle class="dot" cx="456.0" cy="154.0" r="3.5"/><circle class="dot" cx="240.6" cy="154.0" r="3.5"/><circle class="dot" cx="296.0" cy="206.8" r="3.5"/><circle class="dot" cx="296.0" cy="114.4" r="3.5"/><text x="536.0" y="119.6" text-anchor="end" class="a">MAC if abatement is cheap</text><text x="426.8" y="29.2" text-anchor="start" class="b">MAC (costly)</text><text x="536.0" y="148.0" text-anchor="end" class="">tax: price fixed</text><text x="302.0" y="254.3" text-anchor="start" class="">cap: quantity fixed</text></svg><figcaption>When the marginal abatement cost (MAC) is uncertain, a tax fixes the price and lets the size of the cut vary; a cap fixes the cut and lets the price vary.</figcaption></figure>
<div class="vs">
<div><h3>For a carbon tax (economists)</h3><ul><li>Tax systems are mature and universal</li><li>Raises <b>revenue</b> to tackle deficits</li><li><b>Stable</b> price; permit prices are volatile because permit supply and demand are price-insensitive</li><li>Free permits (SO₂ 1990, early EU ETS) waste fiscal resources. With <b>auctions</b>, the fiscal effects are equal</li></ul></div>
<div><h3>For cap and trade (negotiators)</h3><ul><li><b>Quantity certain</b>, so it can guarantee staying below "dangerous anthropogenic interference"</li><li>More <b>political appeal and durability</b>: free allowances are "political glue"</li><li>Taxes are "hard to introduce but easy to cut", so price volatility becomes political volatility</li><li>Environmental rules tend to be irreversible (SO₂ standards are unchanged since 1990)</li></ul></div>
</div>
<p><b>Nordhaus's verdict</b>: "either one!" What matters is raising the price. Forced to choose, he picks the <b>carbon tax</b> for revenue, stability, transparency and predictability. For a tax-averse US, <b>auctioned</b> cap-and-trade beats doing nothing.</p>`},
{t:"Hybrids & thorny details", h:`
<p><b>Hybrid</b>: a quantity cap plus a <b>price floor</b> (a minimum carbon tax) and a <b>safety valve</b> (extra permits sold at, say, a 50% premium) to contain costs and volatility.</p>
<ul><li>A narrower floor-to-valve gap behaves more like a <b>tax</b>. A wider gap behaves more like <b>cap and trade</b>.</li><li>Benefits: better public finance, less volatility, fewer incentives for corruption, less uncertainty.</li></ul>
<p><b>Thorny issues:</b></p>
<ul><li><b>Forests and soils</b>: crediting stored carbon and debiting felling is beyond current measurement ability.</li>
<li><b>Border adjustments</b>: US tax $50, Canada $20 → a $30/t border charge. But what about <b>embodied</b> CO₂? Fossil fuels only, steel, or all imports? It's manageable at low prices but matters a lot at $500–1,000/t.</li></ul>
<p>Real-world record (to 2012): taxes were sidelined in negotiations after 1997 in favour of quantity limits. India had a <b>$1/t coal tax</b> and China was considering one. No country had a high economy-wide carbon tax.</p>`},

/* ───────────────────────── 8. STERN (2022) ───────────────────────── */
M.push({t:"A time for change in economics (Stern 2022)", c:[
{t:"The argument in one breath", h:`
<p>Nicholas Stern, <i>The Economic Journal</i> (2022), originally his Royal Economic Society presidential address. Stern led the <b>Stern Review (2006)</b> and is at the LSE.</p>
<p>The case for action "with urgency and at scale" rests on three things:</p>
<ol><li>the <b>immense magnitude of climate risk</b>;</li><li>the <b>very rapid emissions cuts</b> needed;</li><li>a <b>real opportunity</b> for a new, attractive form of growth (sustainable, resilient, inclusive).</li></ol>
<p>So the economics must be <b>dynamic</b>, set in a world with many market imperfections, increasing returns, central risk and important distributional issues. Don't force "a huge and non-standard challenge into a narrow and standard framework" (the familiar "workhorses").</p>
<div class="key">"It is time for economics and economists to step up." The key issues are <b>risk and change</b>.</div>`},
{t:"The science and why 1.5°C", h:`
<ul>
<li>Already <b>1.1°C</b> above the late 19th century, at the edge of the <b>Holocene</b> temperatures (the stable 10–12,000 years in which agriculture and civilisation emerged).</li>
<li>2021: nearly <b>50°C</b> in northern California and western Canada, and record floods from Germany to China.</li>
<li>The current path is <b>above 3°C</b> (UNEP 2020). The world hasn't seen 3°C for about <b>3 million years</b>, when seas were 10–20 m higher. Deadly wet-bulb heat on the North China Plain and in north India could force hundreds of millions or billions to move.</li>
<li><b>Net-zero logic</b>: stable temperature needs stable concentrations, which needs net-zero flows. The <b>earlier</b> net zero arrives, the <b>lower</b> the temperature at which we stabilise. For 1.5°C, net-zero CO₂ is needed by <b>mid-century</b>.</li>
<li>Emissions hit a record <b>59.1 GtCO₂e</b> in 2019. Energy CO₂ was projected to rebound +4.8% in 2021.</li>
</ul>
${bars([["1.5°C",14],["2°C",37]],40,"%","")}
<p class="src">Share of world population exposed to severe heat at least once every 5 years (Dosio et al. 2018), more than double at 2°C. So damage is <b>not linear</b> in temperature.</p>`},
{t:"Guard-rails, not optimisation", h:`
<figure class="dia"><svg viewBox="0 0 560 120" role="img" aria-label="Stern's guard-rail approach: set a risk-based target first, then find the best path to it"><rect class="box" x="15.0" y="30" width="107.0" height="56" rx="8"/><text x="68.5" y="54.0" text-anchor="middle">Science: risks</text><text x="68.5" y="70.0" text-anchor="middle">of 1.5 vs 2°C</text><path class="arr" d="M125.0,58 L153.0,58"/><text x="139.0" y="22.0" text-anchor="middle" class="a"></text><rect class="boxa" x="156.0" y="30" width="107.0" height="56" rx="8"/><text x="209.5" y="54.0" text-anchor="middle">Set guard-rail</text><text x="209.5" y="70.0" text-anchor="middle">(1.5°C, net zero)</text><path class="arr" d="M266.0,58 L294.0,58"/><text x="280.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="297.0" y="30" width="107.0" height="56" rx="8"/><text x="350.5" y="54.0" text-anchor="middle">Find cheapest,</text><text x="350.5" y="70.0" text-anchor="middle">most attractive path</text><path class="arr" d="M407.0,58 L435.0,58"/><text x="421.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="438.0" y="30" width="107.0" height="56" rx="8"/><text x="491.5" y="54.0" text-anchor="middle">Many instruments</text><text x="491.5" y="70.0" text-anchor="middle">+ finance</text></svg><figcaption>Stern: set a risk-based target first, then find the best path to it.</figcaption></figure>
<figure class="dia"><svg viewBox="0 0 560 120" role="img" aria-label="Nordhaus's cost-benefit approach: damages plus abatement costs give an optimal temperature"><rect class="box" x="15.0" y="30" width="107.0" height="56" rx="8"/><text x="68.5" y="54.0" text-anchor="middle">Damage</text><text x="68.5" y="70.0" text-anchor="middle">function</text><path class="arr" d="M125.0,58 L153.0,58"/><text x="139.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="156.0" y="30" width="107.0" height="56" rx="8"/><text x="209.5" y="54.0" text-anchor="middle">Abatement</text><text x="209.5" y="70.0" text-anchor="middle">cost curve</text><path class="arr" d="M266.0,58 L294.0,58"/><text x="280.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="297.0" y="30" width="107.0" height="56" rx="8"/><text x="350.5" y="54.0" text-anchor="middle">Minimise</text><text x="350.5" y="70.0" text-anchor="middle">total cost</text><path class="arr" d="M407.0,58 L435.0,58"/><text x="421.0" y="22.0" text-anchor="middle" class="a"></text><rect class="boxa" x="438.0" y="30" width="107.0" height="56" rx="8"/><text x="491.5" y="54.0" text-anchor="middle">'Optimal'</text><text x="491.5" y="70.0" text-anchor="middle">temperature</text></svg><figcaption>Nordhaus (Ch 18): derive the target by minimising damages plus abatement cost.</figcaption></figure>
<ul>
<li>The 1.5°C target is a <b>guard-rail</b> against extreme risk. It is consequentialist, but not derived by maximising a standard expected-utility function.</li>
<li>Mass mortality, billions migrating, conflict and ecosystem collapse are hard to price. So first identify the <b>unacceptable</b> risks, then find feasible paths to avoid them.</li>
<li>Expected-utility models can be "rigged up" to give any answer: modest tweaks change the results.</li>
<li><b>Paris (COP21, Dec 2015)</b>: "well below 2°C", with best efforts toward 1.5°C. More than 190 countries agreed <b>without</b> agreeing on a utility function, damage function or discount rate. The net-zero-by-2050 focus came from <b>physical science</b>, not from IAMs.</li>
</ul>`},
{t:"Urgency and a new growth story", h:`
<p><b>Why this decade?</b> Infrastructure will roughly <b>double in 15–20 yrs</b>, the world economy in <b>20–25 yrs</b> and the urban population in <b>40 yrs</b>. Build them high-carbon and you are <b>locked in</b>.</p>
<p><b>Climate action as growth</b>: it is "the only sustainable story of growth", since a high-carbon path would create a world too hostile for growth.</p>
<ul><li>Short run: investment boosts demand when <b>planned saving exceeds planned investment</b> and real rates are low (secular stagnation).</li>
<li>Medium run: innovation, efficiency, cleaner cities and healthier ecosystems.</li></ul>
<p><b>Four forces making fast action possible now</b>: (1) low interest rates; (2) rapid technological change; (3) international agreement (Paris; 100+ countries covering 61% of emissions pledging net zero); (4) pressure from young people (Fridays for Future).</p>
<div class="eq">Y = C + I + G + NX &nbsp;&nbsp;→ more sustainable I raises demand now and capacity later</div>`},
{t:"Technology & 'cost or investment?'", h:`
<ul>
<li>Since 2010, costs have fallen: solar PV <b>−85%</b>, onshore wind −56%, CSP −68%, offshore wind −48% (IRENA). Battery packs went from about $1,160/kWh (2010) to $176 (2018). EV sticker-price parity was expected by 2024.</li>
<li>The <b>IEA consistently under-predicted</b> solar's cost decline after 2001.</li>
<li>In 2020, solar or wind was the cheapest new power in countries with <b>over 70% of world GDP</b>. Low-carbon options could be competitive in sectors covering 90% of emissions by 2030.</li>
<li>UK Climate Change Committee: the cost of net zero is about <b>0.5% of GDP in 2050</b>, down from a 1–2% estimate in 2019. The Stern Review (2006) estimated 1–2% of GDP a year for an 80% cut.</li>
<li>About <b>15%</b> of world deaths in 2018 were linked to fossil-fuel air pollution, a big co-benefit of cutting emissions.</li>
</ul>
<div class="key"><b>Increasing returns</b>: deployment itself cuts costs through learning, scale and supply chains. So the cost of net zero is <b>endogenous</b> to how fast we act. Standard IAMs assume <b>diminishing returns and rising marginal costs</b>, so they systematically <b>overstate</b> costs.</div>
<p>"Investment" is a better word than "cost": renewables have high upfront capital but low fuel costs, and they bring returns in productivity, health and cleaner air.</p>`},
{t:"Investment, policy, finance", h:`
<ul>
<li>Raise global investment by about <b>2–3 percentage points of GDP</b> compared with the previous decade. About 2pp for the G7, more for emerging and developing economies, and for <b>China</b> a change in the <b>composition</b> rather than the level.</li>
<li>Three routes to the same number: returning to investment levels of three decades ago; the infrastructure gap of 2–3% of world GDP; bottom-up estimates of sustainable investment needs.</li>
<li><b>Four wins from internationalism</b>: coordinated demand expansion (spillovers); resetting expectations together; shared technology direction (increasing returns); climate and biodiversity as <b>global public goods</b>.</li>
<li><b>Policy</b>: carbon pricing matters <b>but is not enough</b>. Add city design, regulation, standards and R&amp;D. Policy should be <b>"predictably flexible"</b> (as in monetary policy), because government-induced policy risk deters investment.</li>
<li><b>Finance</b>: private finance at scale, plus development and concessional finance for risky, low-revenue projects. Expand <b>multilateral development banks</b> and the IMF in a "grand bargain".</li>
</ul>`},
{t:"What's changed since the Stern Review", h:`
<p>The core finding of 2006, that <b>the costs of inaction far exceed the costs of action</b>, is now stronger:</p>
<ol>
<li><b>Science</b> is more worrying. Impacts are coming faster and harder (IPCC 2018 on 1.5°C; AR6 in 2021).</li>
<li><b>Clean technology</b> costs fell faster than expected.</li>
<li><b>Politics</b> have been mixed: forward (Paris, China's 2060 neutrality pledge, Biden, COP26, private sector) and backward (Trump, Bolsonaro; the 2008–10 financial crises reduced "bandwidth").</li>
<li><b>Analysis</b> now stresses the <b>dynamics of change</b> and new development paths.</li>
</ol>`},
{t:"How economics must change: IAMs", h:`
<p><b>Intellectual history</b>: Marshall (1890), private vs social cost → Pigou (1920), tax the gap → Coase (1960), property rights and trade in externalities → Meade (1955) → Pearce (1989), <i>Blueprint for a Green Economy</i>. Then <b>Nordhaus (1991) "To Slow or Not to Slow?"</b> and Cline (1992).</p>
<p>Nordhaus applied standard tools (a Pigouvian tax plus an exogenous growth model with "small perturbations"). Stern calls this "a sensible and valuable early contribution". But within 10–15 years it was clear <b>climate is not a marginal problem</b>.</p>
<p><b>IAM flaws</b> (optimised calibrated welfare function, exogenous growth, one-good aggregation):</p>
<ul>
<li>They can't handle (1) <b>immense risk</b> to life, or (2) <b>fundamental structural change</b>.</li>
<li><b>Damages implausibly low</b>: DICE (2017) has <b>8.5% of GDP lost at 6°C</b>, which Stern calls "profoundly implausible" for a world that may be existential for billions.</li>
<li><b>Costs implausibly high</b>: diminishing returns and slow technical progress.</li>
<li>With extreme (fat-tailed) risk, expected utility can go to <b>minus infinity</b> (Weitzman). Bounding it is arbitrary.</li>
</ul>
<p><b>Stern & Stiglitz (2022)</b> put the problems in three groups: (A) things IAMs <i>cannot</i> address: deep uncertainty, extreme risk, endogenous preferences; (B) partial progress: distribution and political economy, damage functions with tipping points; (C) possible only with great difficulty: assuming optimal redistribution, ignoring other market failures, marginal rather than systemic analysis, a simplistic view of technology.</p>
<p>IAMs can be <b>one model in a collection</b>, not the central method. Rodrik: "Unrealistic assumptions are ok; unrealistic <i>critical</i> assumptions are not ok."</p>`},
{t:"'Theory says carbon price' is wrong", h:`
<p>A carbon price belongs at centre stage, but the claim that theory says it's the most efficient tool is "a theoretical mistake of real practical significance". There are five mistakes:</p>
<ol>
<li>It ignores <b>other market failures and absent markets</b>.</li>
<li>Under a guard-rail, carbon prices are set to <b>achieve the target</b> with as much economic advantage as possible. They are not simply Pigou's marginal social cost.</li>
<li>With big risks, <b>increasing returns</b>, fixed costs and uncertainty, <b>standards and regulation</b> reduce uncertainty and costs (Weitzman 1974).</li>
<li>Many actors feel an <b>obligation</b> to act and aren't narrow self-interested optimisers.</li>
<li>Much of the challenge is <b>collaboration</b> and institutions.</li>
</ol>
<p><b>Stern–Stiglitz Commission (2017)</b>: <b>$50–100/t CO₂ by 2030</b>, prices that guide production toward Paris rather than measure marginal damage. Others: Kaufman et al. $77–124 in 2030; IMF $75 by 2030.</p>
<p><b>Regulation done right</b>: the UK bans new petrol/diesel car sales from <b>2030</b> (EU 2035). The <b>incandescent bulb ban</b> brought on cheap LEDs. Neither "picks winners"; both "regulate out the harmful".</p>`},
{t:"Six market failures (Table 1)", h:`
<table>
<tr><th>Failure</th><th>Policy options</th></tr>
<tr><td><b>GHG externality</b></td><td>Carbon tax, cap-and-trade, emissions standards</td></tr>
<tr><td><b>R, D &amp; D</b> (knowledge spillovers)</td><td>Tax breaks, demonstration support, public research</td></tr>
<tr><td><b>Risk / capital markets</b></td><td>Guarantees, long-term contracts, co-financing, phase-out dates for dirty tech</td></tr>
<tr><td><b>Networks</b> (coordination)</td><td>Grids, public transport, broadband, recycling, city planning</td></tr>
<tr><td><b>Information</b></td><td>Labelling, product standards, awareness</td></tr>
<tr><td><b>Co-benefits</b> (not priced)</td><td>Value ecosystems and health; reform farm subsidies</td></tr>
</table>
<ul><li><b>Absent markets</b>: you can't trade future carbon or undiscovered technologies. A competitive equilibrium with absent markets isn't Pareto efficient, so public strategy must shape <b>expectations</b>.</li>
<li><b>Government limits</b>: governments can't fully commit and have short horizons. Hence durable institutions: the UK <b>Climate Change Act (2008)</b> and its five-year carbon budgets; Germany's Constitutional Court (2021) ruling the Climate Act too weak and unfair to future generations; a Hague court ordering <b>Shell</b> to cut emissions 45% by 2030 against 2019.</li></ul>`},
{t:"Stern on discounting", h:`
<p>Economists "leap too quickly to 'discount rates'". The central concept is the <b>social discount factor λ</b>: the relative social value of an extra unit of consumption in the future compared with now. The social discount rate is how fast λ falls.</p>
<div class="eq">Ramsey: &nbsp; social discount rate = η·g + δ</div>
<ul><li><b>η</b> = elasticity of marginal utility (how fast extra consumption loses value as people get richer)</li><li><b>g</b> = growth rate of consumption</li><li><b>δ</b> = <b>pure-time</b> discount rate (counting people less simply because they live later)</li></ul>
<ul>
<li>Pure-time discounting is "<b>discrimination by date of birth</b>". "There is no serious ethical argument in favour of pure-time discounting", except for extinction risk.</li>
<li>The ηg term is legitimate <b>if</b> the future is richer. But that is <b>endogenous</b>: if we act recklessly, g could be negative and future generations poorer.</li>
<li>"The" discount rate is misleading because it depends on the good, the person, the time and the state of the world.</li>
<li><b>Capital markets</b> are the wrong place to find ethical values: they (i) don't reflect ethical social decisions, (ii) embed hard-to-identify risk views, and (iii) are imperfect. A footnote targets Nordhaus for seeming to look there.</li>
</ul>
<div class="tip">Comparing Nordhaus and Stern on discounting is a classic question. Nordhaus uses about <b>4%</b>, descriptive, opportunity cost. Stern uses about <b>1.4%</b> (Review), with δ ≈ 0, prescriptive. Mention Ramsey, the goods vs welfare distinction, and endogenous growth.</div>`},
{t:"New approaches & research agenda", h:`
<p>Good climate economics should (1) capture <b>extreme risk</b>; (2) recognise market failures, absent markets and limits of government; (3) model <b>rapid technical and systemic change with increasing returns</b>; (4) allow <b>endogenous beliefs and preferences</b>; (5) take account of <b>distribution</b>, including that of structural change.</p>
<ul>
<li><b>Systems</b>: electricity supply needs to roughly <b>quadruple</b> in 30 years and be zero-carbon by 2040. Cities will hold two-thirds of people by 2050 (55% in 2018). Fixing food and land systems could gain <b>$5.7 tn/yr by 2030</b> and $10.5 tn by 2050. "You would not sensibly attempt to redesign a city … via only a carbon price."</li>
<li><b>Just transition</b>: some jobs will vanish, so invest in people and places. This is both justice and political feasibility.</li>
<li><b>Whole-economy coordination</b> by prime ministers and finance ministries, not just line ministries.</li>
<li>Innovation (Schumpeter), the circular economy, finance and central banks, and <b>biodiversity</b> (the Dasgupta Review, 2021).</li>
<li>Political economy and behaviour, including Ostrom's polycentric governance.</li>
</ul>
<div class="kim">Stern's message is <b>not</b> anti-growth: he argues for <i>different</i> growth. Contrast with degrowth (Naudé Module 12) and Foster's Midas critique (Module 10).</div>`},

]}
