<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUL320 End-term</title>
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e4e2db;
  --accent:#1f6f5c; --accent-soft:#e3f0ec; --warn:#9a5b00; --warn-soft:#fbf0dc;
  --bad:#a33a2c; --bad-soft:#f8e4e0; --bar:#1f6f5c; --bar2:#c0703a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151614; --surface:#1e201d; --ink:#ecebe6; --muted:#a3a29b; --line:#33352f;
    --accent:#5fc2a6; --accent-soft:#1d3530; --warn:#e8b25c; --warn-soft:#3a2f1c;
    --bad:#ef8a7b; --bad-soft:#3b2421; --bar:#5fc2a6; --bar2:#e09a63;
  }
}
:root[data-theme="dark"]{
  --bg:#151614; --surface:#1e201d; --ink:#ecebe6; --muted:#a3a29b; --line:#33352f;
  --accent:#5fc2a6; --accent-soft:#1d3530; --warn:#e8b25c; --warn-soft:#3a2f1c;
  --bad:#ef8a7b; --bad-soft:#3b2421; --bar:#5fc2a6; --bar2:#e09a63;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface)}
nav h1{font-size:15px;margin:0 6px 4px;letter-spacing:.02em}
nav .sub{font-size:12.5px;color:var(--muted);margin:0 6px 16px}
nav button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:8px 8px;border-radius:8px;cursor:pointer;line-height:1.35}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:16px}
nav button.on .n{color:var(--accent)}
nav button .c{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.top .mod{font-size:13px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .count{flex-shrink:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.theme{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.progress{height:3px;background:var(--line)}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.stage{flex:1;padding:36px 28px 24px;display:flex;justify-content:center}
.card{width:100%;max-width:720px;min-width:0}
.card h2{font-size:28px;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em}
.card h3{font-size:17px;margin:20px 0 8px}
.card p{margin:0 0 14px}
.card ul,.card ol{margin:0 0 14px;padding-left:22px}
.card li{margin:4px 0}
.card li::marker{color:var(--muted)}
.card b{font-weight:650}
.key{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.key::before{content:"Remember";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.tip{background:var(--warn-soft);border-left:3px solid var(--warn);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.tip::before{content:"Exam tip";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:2px}
table{border-collapse:collapse;width:100%;margin:6px 0 16px;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.hl td{background:var(--accent-soft)}
.tw{overflow-x:auto}
.eq{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:10px 0 16px;overflow-x:auto;white-space:nowrap}
.bars{margin:8px 0 18px}
.bars .row{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bars .lab{color:var(--muted)}
.bars .track{height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.bars .fill{height:100%;background:var(--bar);border-radius:3px}
.bars .fill.b2{background:var(--bar2)}
.bars .val{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 16px}
.vs>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.vs h3{font-size:14px;margin:0 0 6px;color:var(--accent)}
.vs ul{margin:0;padding-left:18px;font-size:15.5px}
.vs p{font-size:15.5px;margin:0}
figure{margin:12px 0 18px}
figure img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.mcq{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.mcq .qq{font-weight:600;margin:0 0 10px}
.mcq .qq span{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font:inherit;font-size:15.5px;line-height:1.4;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.mcq.done .opts button{cursor:default}
.mcq.done .opts button:hover{border-color:var(--line)}
.opts button.right,.mcq.done .opts button.right:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opts button.wrong,.mcq.done .opts button.wrong:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{display:none;font-size:14.5px;color:var(--muted);margin:10px 0 0}
.mcq.done .why{display:block}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px dashed var(--line);border-radius:10px;font-size:15px;color:var(--muted)}
.score b{color:var(--ink)}
.score button{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.controls{display:flex;justify-content:space-between;gap:12px;padding:18px 28px 28px;max-width:776px;width:100%;margin:0 auto}
.controls button{font:inherit;font-size:15px;padding:11px 22px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.controls button.next{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.controls button:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--muted);text-align:center;padding-bottom:16px}
@media (max-width:860px){
  body{font-size:16px}
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;z-index:5;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  nav.open{transform:none}
  .menu{display:inline-block}
  .top{padding:12px 16px}
  .stage{padding:24px 16px 12px}
  .card h2{font-size:23px}
  .controls{padding:14px 16px 22px}
  .vs{grid-template-columns:1fr}
  .bars .row{grid-template-columns:96px 1fr 46px}
  .hint{display:none}
}

:root{--kim:#5b4bb7;--kim-soft:#ecebf9;--c2:#c0703a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--kim:#a99cf0;--kim-soft:#272440;--c2:#e09a63}}
:root[data-theme="dark"]{--kim:#a99cf0;--kim-soft:#272440;--c2:#e09a63}
.kim{background:var(--kim-soft);border-left:3px solid var(--kim);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.kim::before{content:"Keep in mind";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--kim);margin-bottom:2px}
.kim ul{margin:0;padding-left:20px}
.dia{margin:12px 0 18px}
.dia svg{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dia svg text{fill:var(--ink);font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.dia svg text.m{fill:var(--muted);font-size:11.5px}
.dia svg text.a{fill:var(--accent);font-weight:600}
.dia svg text.b{fill:var(--c2);font-weight:600}
.dia svg .ax{stroke:var(--ink);stroke-width:1.4;fill:none}
.dia svg .c1{stroke:var(--accent);stroke-width:2.4;fill:none}
.dia svg .c2{stroke:var(--c2);stroke-width:2.4;fill:none}
.dia svg .c3{stroke:var(--kim);stroke-width:2.4;fill:none}
.dia svg .ink{stroke:var(--ink);stroke-width:2;fill:none}
.dia svg .dash{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:4 4;fill:none}
.dia svg .f1{fill:var(--accent);opacity:.22;stroke:none}
.dia svg .f2{fill:var(--c2);opacity:.28;stroke:none}
.dia svg .f3{fill:var(--kim);opacity:.25;stroke:none}
.dia svg .box{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.dia svg .boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dia svg .dot{fill:var(--ink)}
.dia svg .arr{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#ah)}
.work{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
.work summary{cursor:pointer;font-weight:600;color:var(--accent)}
.work ol{margin:10px 0 4px}
.prob{border:1px solid var(--line);border-left:3px solid var(--c2);border-radius:0 10px 10px 0;padding:12px 16px;margin:12px 0;background:var(--surface)}
.prob>b:first-child{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c2);margin-bottom:4px}
.sa summary{font-weight:600}
.sa{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:8px 0}
.sa p:last-child{margin-bottom:0}
td.blk{background:var(--accent-soft)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
</style>

function bars(rows, max, unit, cls){
  unit = unit === undefined ? "" : unit; cls = cls || "";
  return '<div class="bars">' + rows.map(function(r){
    return '<div class="row"><span class="lab">'+r[0]+'</span><span class="track"><span class="fill '+cls+'" style="display:block;width:'+(Math.max(r[1],0)/max*100)+'%"></span></span><span class="val">'+r[1]+unit+'</span></div>';
  }).join("") + '</div>';
}

M.push({t:"Start here & foundations", c:[
{t:"How this site works", h:`
<p>This site assumes you know <b>no economics and no climate science</b>. It builds the ideas in order, so each page uses only things an earlier page explained.</p>
<ol>
<li><b>Module 0 (this one)</b> covers the exam, then the toolkit: demand and supply, surplus, efficiency, taxes, basic climate science and the acronyms.</li>
<li><b>Modules 1–2 (Goodwin)</b> use that toolkit on pollution and shared resources.</li>
<li><b>Modules 3–7 (Nordhaus)</b> apply it to climate change: damages, costs, discounting, the "optimal" target, carbon prices.</li>
<li><b>Modules 8–11</b> are the critics: Stern, Keen, Foster et al., Raworth.</li>
<li><b>Modules 12–17</b> cover growth, India, input–output analysis, adaptation and climate finance.</li>
<li><b>Modules 18–19</b> are exam practice and revision.</li>
</ol>
<p>Each module opens by saying <b>where it fits</b> in that story. A term in <b>bold</b> is being defined. Every letter on a diagram (E*, Q<sub>M</sub>, area K, …) is explained in the text next to it.</p>
<div class="tip">If you have little time, do Module 0, then Modules 1, 2, 5, 6, 7 and 18. They carry most of the Part 2 (numerical and graph) marks.</div>`},
{t:"The exam, exactly", h:`
<p>From the instructor's end-term announcement on Moodle (12 Nov 2026). The end-sem is worth <b>40%</b> of the course.</p>
<div class="vs">
<div><h3>Part 1 · Objective</h3><ul><li>Short or brief answers</li><li>Definitions, distinctions, "who said what", key numbers</li><li>Covers all readings evenly</li></ul></div>
<div><h3>Part 2 · Application</h3><ul><li>Solve a <b>numerical problem</b></li><li><b>Explain using a graph</b></li><li>Or a related applied question</li></ul></div>
</div>
<p><b>Slides disclaimer</b> (Moodle, 12 Aug): "the slides are only indicative of the material covered. There may also be inadvertent errors. Students are expected to learn from the prescribed reading material." So every module here is built from the readings, with the slides used to judge emphasis.</p>
<p><b>Mid-term (30 marks)</b>: MCQs with negative marking plus analytical questions, covering Ambirajan, the two "How bad / Pretty bad" posts, Goodwin 13–14, <i>Climate Casino</i>, Stern and Keen. All of those except Ambirajan and the blog posts are <b>repeated</b> in the end-term syllabus.</p>`},
{t:"The one story that links it all", h:`
<p>Read this once now and again at the end. Every term here is explained in a later module.</p>
<ol>
<li><b>The mainstream toolkit</b> (Goodwin, Nordhaus). Burning fossil fuels harms people who aren't part of the sale: an <b>externality</b>. Nobody owns the atmosphere, so everyone overuses it: a <b>commons</b>. The fix is to put a <b>price</b> on emissions, through a carbon tax or a cap on total emissions with tradable permits. To decide how far to go, weigh the cost of cutting emissions against the damage avoided (<b>cost–benefit analysis</b>), converting future amounts into today's money (<b>discounting</b>). Nordhaus's answer is an "optimal" warming of roughly 2.3–4°C.</li>
<li><b>The critics</b>
<ul><li><b>Stern</b>: climate change is a problem of <i>immense risk</i> and rapid structural change, not small marginal damage. Set a safe limit (1.5°C) first, then find the cheapest way to stay under it. Don't count future people less just because they live later.</li>
<li><b>Keen</b>: the damage numbers behind Nordhaus's answer are made up.</li>
<li><b>Foster, Clark &amp; York</b>: turning nature into money (the "Midas effect") is itself the problem.</li>
<li><b>Raworth</b>: define a safe and just space (the "doughnut") instead of an optimum.</li></ul></li>
<li><b>The growth question</b> (Naudé): can economies grow while emissions fall ("green growth"), or must rich countries shrink their material use ("degrowth")? Naudé calls both "fairy tales".</li>
<li><b>India in practice</b> (Pollin; Azad): invest 1.5% of GDP a year in clean energy, create jobs, and use a carbon tax whose revenue funds a <b>right to energy</b> for the poor. Their numbers come from <b>input–output analysis</b> (Mair &amp; Druckman).</li>
<li><b>Who pays?</b> (Skovgaard; OWID): how money from rich to poor countries for climate ("climate finance") is defined and counted, and whether climate aid is new money or relabelled aid.</li>
</ol>`},

start" class="b">producer surplus</text><text x="72.7" y="40.3" text-anchor="start" class="">Demand: what buyers will pay</text><text x="492.4" y="33.3" text-anchor="end" class="a">Supply: what it costs to make</text></svg><figcaption>Demand: P = 12 − Q. Supply: P = 2 + Q. They cross at E: 5 units at $7.</figcaption></figure>
<ul>
<li><b>Demand curve</b>: for each quantity, the most someone is willing to pay for <i>one more unit</i>. That is their <b>willingness to pay (WTP)</b>, also called the <b>marginal benefit (MB)</b> of that unit. It slopes down because the first units go to the people who value them most.</li>
<li><b>Supply curve</b>: for each quantity, the extra cost of producing <i>one more unit</i>, the <b>marginal cost (MC)</b>. It slopes up because producers use their cheapest resources first.</li>
<li><b>"Marginal"</b> always means "of one more unit", not the average or the total.</li>
<li><b>Equilibrium E</b>: the price at which quantity demanded equals quantity supplied. Here, 12 − Q = 2 + Q gives <b>Q = 5</b> and <b>P = $7</b>.</li>
</ul>
<div class="key">To find an equilibrium from two straight lines, set the two price equations equal and solve for Q, then put Q back into either equation to get P.</div>`},
{t:"Foundations 2: surplus, efficiency, deadweight loss", h:`
<p><b>Consumer surplus (CS)</b>: what buyers would have paid minus what they actually pay, added over all units bought. On the graph above it is the green triangle above the price and below demand. Here it is ½ × 5 × (12 − 7) = <b>$12.50</b>.</p>
<p><b>Producer surplus (PS)</b>: the price received minus the cost of making each unit, added up. It is the orange triangle below the price and above supply: ½ × 5 × (7 − 2) = <b>$12.50</b>.</p>
<p><b>Total (social) surplus</b> = CS + PS. A quantity is <b>efficient</b> when it makes total surplus as large as possible. That happens where <b>MB = MC</b>: every unit worth more than it costs gets made, and no unit that costs more than it's worth does.</p>

="212.8" text-anchor="start" class="">MB of unit 8 = $4</text><text x="357.1" y="147.8" text-anchor="middle" class="b">DWL</text><text x="72.7" y="40.3" text-anchor="start" class="">MB (demand)</text><text x="492.4" y="33.3" text-anchor="end" class="a">MC (supply)</text></svg><figcaption>Making 8 units instead of the efficient 5. Units 6, 7 and 8 each cost more (MC, on the supply line) than they are worth (MB, on the demand line).</figcaption></figure>
<ul>
<li><b>Deadweight loss (DWL)</b>: the surplus lost by producing the wrong quantity. It is always a triangle between MB and MC, pointing at the efficient point.</li>
<li>Here DWL = ½ × (8 − 5) × ($10 − $4) = <b>$9</b>.</li>
<li>Producing too <i>little</i> also creates a DWL triangle, on the other side of the efficient quantity.</li>
</ul>
<div class="key">With no side effects, a competitive market lands on MB = MC by itself, so it is efficient. Most of this course is about cases where that fails.</div>`},
{t:"Foundations 3: market failure, taxes, who pays", h:`
<p><b>Market failure</b>: any situation where the market quantity is <i>not</i> the efficient one, so there is a deadweight loss. The two kinds that matter here:</p>
<ul>
<li><b>Externality</b>: a cost or benefit that falls on people outside the sale. A factory's smoke harms neighbours who neither buy nor sell. (Module 1.)</li>
<li><b>Public goods and commons</b>: things nobody can be stopped from using, like the atmosphere. Nobody has a reason to pay for them or protect them. (Module 2.)</li>
</ul>
<p><b>Per-unit tax</b>: the government takes $t on every unit sold. Sellers now need $t more for each unit, so the supply curve shifts <b>up by t</b>. The new equilibrium has a higher buyer price, a lower seller price and a lower quantity.</p>
<ul>
<li><b>Tax incidence</b>: who actually bears the tax. The buyer price usually rises by <i>less</i> than t; sellers absorb the rest through a lower net price. The steeper (less responsive) side bears more.</li>
<li><b>Tax revenue</b> = t × quantity sold after the tax.</li>
<li><b>Regressive</b>: takes a larger share of a poor household's income than a rich one's. <b>Progressive</b>: the opposite. Taxes on energy and basic goods tend to be regressive because the poor spend more of their income on them.</li>
<li><b>Revenue-neutral</b>: the money raised by a new tax is fully given back, through rebates or cuts to other taxes.</li>
<li><b>Subsidy</b>: a negative tax. The government pays $s per unit, which shifts supply <b>down</b> by s.</li>
</ul>
<p>Two more words you'll see: <b>Pareto improvement</b> (someone gains and nobody loses) and <b>cost-effective</b> (reaching a given goal at the lowest total cost).</p>`},
{t:"Foundations 4: climate science on one page", h:`
<ul>
<li><b>Greenhouse effect</b>: gases such as carbon dioxide (CO₂) and methane let sunlight in but trap some outgoing heat, warming the planet.</li>
<li><b>ppm</b> (parts per million): how CO₂ concentration is measured. About <b>280 ppm</b> before industrialisation, 387 ppm in 2009, about 428 ppm in 2026.</li>
<li><b>CO₂e</b> ("CO₂-equivalent"): other greenhouse gases converted to the amount of CO₂ that would warm as much. <b>GtCO₂</b> = a billion tonnes of CO₂.</li>
<li><b>Warming</b> is measured in °C above <b>pre-industrial</b> times (the late 1800s). The world is about <b>1.1–1.2°C</b> warmer already. The <b>Paris Agreement</b> (2015) aims for "well below 2°C", ideally 1.5°C.</li>
<li><b>Stock vs flow</b> (the "bathtub"): CO₂ stays in the air for centuries. Yearly emissions are the tap; concentration is the water level. Cutting emissions only slows the rise. Temperature stops rising only when net emissions reach zero (<b>net zero</b>).</li>
<li><b>Tipping point</b>: a threshold past which change becomes abrupt and self-reinforcing, e.g. ice sheets collapsing or permafrost releasing methane.</li>
<li><b>RCP</b> (Representative Concentration Pathway): IPCC scenarios for future concentrations. <b>RCP4.5</b> is a middle path; <b>RCP8.5</b> is high emissions with little policy.</li>
<li><b>Mitigation</b> = cutting emissions to limit warming. <b>Abatement</b> is the economists' word for the same thing. <b>Adaptation</b> = adjusting to the warming that happens (sea walls, drought-resistant crops).</li>
</ul>
<p><b>Institutions</b>: the <b>IPCC</b> (Intergovernmental Panel on Climate Change) summarises the science in big reports (AR5 2014, AR6 2021–23). The <b>UNFCCC</b> (UN Framework Convention on Climate Change, 1992) is the treaty; its yearly meetings are <b>COPs</b> (Conference of the Parties). <b>Kyoto</b> (1997) set binding targets for rich countries only; <b>Paris</b> (2015) has every country set its own pledge.</p>`},
{t:"Foundations 5: money over time", h:`
<p>Climate policy costs money now, while its benefits arrive decades later. To compare the two we need <b>discounting</b>.</p>
<ul>
<li><b>Interest rate r</b>: $100 invested today at r = 5% becomes $105 in a year, and $100 × 1.05<sup>n</sup> after n years.</li>
<li><b>Present value (PV)</b>: the reverse. The amount you'd need today to have X in n years:</li>
</ul>
<div class="eq">PV = X / (1 + r)<sup>n</sup></div>
<ul>
<li>Example: $100 in 50 years at r = 4% is worth 100 / 1.04<sup>50</sup> = 100 / 7.107 = <b>$14.10</b> today. At r = 1% it's worth $60.80.</li>
<li>The higher r, or the further away the benefit, the smaller its PV. So the choice of <b>discount rate</b> decides how much the future counts.</li>
<li><b>Nominal</b> rates include inflation; <b>real</b> rates don't. Real ≈ nominal − inflation.</li>
<li><b>GDP</b> (gross domestic product) = the value of everything a country produces in a year. Costs and damages are usually stated as a <b>% of GDP</b> (or "% of income", which means the same here).</li>
</ul>
<div class="tip">Keep 1.04<sup>50</sup> ≈ 7.1 and 1.05<sup>25</sup> ≈ 3.39 in your head. Both come up in the readings' worked examples.</div>`},

["Demand is P = 12 − Q and supply is P = 2 + Q. What are the equilibrium price and quantity?",

 "Set 12 − Q = 2 + Q, so Q = 5. Then P = 12 − 5 = $7."],
["What does a point on the supply curve tell you?",
 ["The average cost of every unit produced up to that point","The extra cost of producing one more unit at that quantity","The total profit firms make at that quantity","The price buyers are willing to pay for that unit"],1,
 "Supply = marginal cost. The demand curve is the one that shows willingness to pay."],
["In the same market, firms are made to produce 8 units. MC of the 8th unit is $10 and its MB is $4. What is the deadweight loss?",
 ["$6","$9","$18","$12.50"],1,
 "DWL = ½ × (8 − 5) × (10 − 4) = $9. $12.50 is the consumer surplus at the efficient point."],
["A $1 per-unit tax on a good makes its buyer price rise by $0.70. What follows?",
 ["Buyers bear $0.70 of the tax and sellers bear $0.30","Buyers bear the whole $1 because they pay at the till","Sellers bear $0.70 because they hand the tax over","Nobody bears it because the government spends the revenue"],0,
 "Incidence depends on how prices move, not on who writes the cheque. Sellers' net price falls by $0.30."],
["What does CO₂ being a 'stock' pollutant imply for policy?",
 ["Concentrations fall as soon as yearly emissions start to fall","Concentrations keep rising until net emissions reach zero","Only the emissions of the current year affect temperature","The stock is fixed, so emissions no longer matter for warming"],1,
 "Bathtub logic: cutting the inflow only slows the rise. That's why net zero is the target."],
["What is the present value of $100 received in 50 years at a 4% discount rate?",

{t:"How to score in Part 2", h:`
<ul>
<li><b>Label everything.</b> Axes with units, every curve named (D = MB, S = private MC, SMC), equilibrium points (E<sub>M</sub>, E*) and their values on the axes.</li>
<li><b>Shade and name areas</b>: externality damage, tax revenue, deadweight loss. Then state each area as a number.</li>
<li><b>Write the rule you're using</b>, e.g. "efficient where MB = social MC" or "public good: add MB vertically". That line earns marks even if your arithmetic slips.</li>
<li><b>Show the formula before plugging in</b>: PV = X/(1+r)<sup>n</sup>; x = (I − A)<sup>−1</sup>y.</li>
<li><b>Finish with one interpretation sentence</b>: "At 5% the project fails CBA, at 2% it passes, so the discount rate decides."</li>
</ul>

M.push({t:"Externalities, valuation & policy (Goodwin 13)", c:[
{t:"What an externality is", h:`
<p><b>Where this fits.</b> Module 0 showed that a market with no side effects ends up at MB = MC, the efficient quantity. Goodwin Ch 13 (from <i>Principles of Economics in Context</i>) asks what goes wrong when production has side effects, and what government can do about it.</p>
<p><b>Externality</b>: a side effect of a transaction, positive or negative, that falls on people <b>outside</b> the transaction.</p>
<div class="vs">
<div><h3>Negative</h3><ul><li>Pollution from making t-shirts: pesticides on cotton, dyes, transport fuel</li><li>CO₂ from burning fossil fuels</li></ul></div>
<div><h3>Positive</h3><ul><li>Rooftop solar cuts the need for fossil electricity</li><li>Vaccines, education, cycling</li></ul></div>
</div>
<p>Standard welfare analysis counts only buyers and sellers and leaves out "the rest of society". A full analysis has to include everyone affected.</p>
<ul>
<li><b>Demand curve</b> = marginal benefit (MB) = willingness to pay (WTP).</li>
<li><b>Supply curve</b> = <b>private</b> marginal cost.</li>
<li><b>Social marginal cost (SMC)</b> = private MC + external damage per unit. This is the cost of one more unit to <i>everyone</i>, not just to the producer.</li>
</ul>
<p>The efficient quantity is now where <b>MB = social MC</b>. The market still stops where MB = private MC, so it produces too much.</p>
<div class="key">A negative externality is an extra <b>cost</b>, so you add it to the <b>supply</b> curve. A positive externality is an extra <b>benefit</b>, so you add it to the <b>demand</b> curve.</div>`},
{t:"The t-shirt example (Fig 13.1)", h:`

.8,185.8 L165.1,185.0 L168.3,184.2 L171.6,183.4 L174.8,182.6 L178.1,181.9 L181.3,181.1 L184.5,180.3 L187.8,179.5 L191.0,178.7 L194.3,177.9 L197.5,177.1 L200.8,176.4 L204.0,175.6 L207.3,174.8 L210.5,174.0 L213.7,173.2 L217.0,172.4 L220.2,171.6 L223.5,170.8 L226.7,170.1 L230.0,169.3 L233.2,168.5 L236.4,167.7 L239.7,166.9 L242.9,166.1 L246.2,165.3 L249.4,164.6 L252.7,163.8 L255.9,163.0 L259.1,162.2 L262.4,161.4 L265.6,160.6 L268.9,159.8 L272.1,159.1 L275.4,158.3 L278.6,157.5 L281.9,156.7 L285.1,155.9 L288.3,155.1 L291.6,154.3 L294.8,153.5 L298.1,152.8 L301.3,152.0 L304.6,151.2 L307.8,150.4 L311.0,149.6 L314.3,148.8 L317.5,148.0 L320.8,147.3 L324.0,146.5 L327.3,145.7 L330.5,144.9 L333.8,144.1 L337.0,143.3 L340.2,142.5 L343.5,141.7 L346.7,141.0 L350.0,140.2 L353.2,139.4 L356.5,138.6 L359.7,137.8 L362.9,137.0 L366.2,136.2 L369.4,135.5 L372.7,134.7 L375.9,133.9 L379.2,133.1 L382.4,132.3 L385.6,131.5 L388.9,130.7 L392.1,130.0 L395.4,129.2 L398.6,128.4 L401.9,127.6 L405.1,126.8 L408.4,126.0 L411.6,125.2 L414.8,124.4 L418.1,123.7 L421.3,122.9 L424.6,122.1 L427.8,121.3 L431.1,120.5 L434.3,119.7 L437.5,118.9 L440.8,118.2 L444.0,117.4 L447.3,116.6 L450.5,115.8 L453.8,115.0 L457.0,114.2 L460.2,113.4 L463.5,112.6 L466.7,111.9 L470.0,111.1 L473.2,110.3"/><path class="dash" d="M84.0,174.2 L397.9,174.2 L397.9,296.0"/><text x="397.9" y="312.0" text-anchor="middle">Q<tspan dy='3' font-size='9'>M</tspan><tspan dy='-3'>&#8203;</tspan> = 25</text><text x="78.0" y="178.2" text-anchor="end">P<tspan dy='3' font-size='9'>M</tspan><tspan dy='-3'>&#8203;</tspan> = $8</text><path class="dash" d="M84.0,143.8 L335.1,143.8 L335.1,296.0"/><text x="335.1" y="312.0" text-anchor="middle">Q* = 20</text><text x="78.0" y="147.8" text-anchor="end">P* = $10</text><circle class="dot" cx="397.9" cy="174.2" r="3.5"/><circle class="dot" cx="335.1" cy="143.8" r="3.5"/><text x="102.6" y="32.1" text-anchor="start" class="">Demand = marginal benefit (MB)</text><text x="510.9" y="162.8" text-anchor="end" class="a">Supply = private MC</text><text x="473.2" y="102.3" text-anchor="end" class="b">Social MC = private MC + $3</text><text x="404.9" y="188.2" text-anchor="start" class="">E<tspan dy='3' font-size='9'>M</tspan><tspan dy='-3'>&#8203;</tspan></text><text x="329.1" y="136.8" text-anchor="end" class="">E*</text><text x="380.3" y="147.6" text-anchor="middle" class="b">K</text><text x="96.6" y="276.2" text-anchor="start" class="m">green band = $3 damage × 25k shirts = $75k</text></svg><figcaption>Straight lines fitted to the book's numbers: demand P = 18 − 0.4Q, supply P = 3 + 0.2Q, social MC P = 6 + 0.2Q (Q in thousands).</figcaption></figure>
<p><b>Reading the labels</b>:</p>
<ul>
<li><b>E<sub>M</sub></b> = the <b>m</b>arket equilibrium, where demand meets private supply: <b>P<sub>M</sub> = $8, Q<sub>M</sub> = 25,000</b> shirts.</li>
<li><b>E*</b> = the efficient point, where demand meets social MC: <b>P* = $10, Q* = 20,000</b>. (The star always marks "efficient" or "optimal".)</li>
<li><b>Green band</b> = the external damage: $3 a shirt on every shirt sold, so $3 × 25,000 = <b>$75,000</b>.</li>
<li><b>Triangle K</b> = the deadweight loss. Between 20,000 and 25,000 shirts, social MC (orange line) is above MB (demand), so each of those shirts costs society more than it's worth. K = ½ × 5,000 × $3 = <b>$7,500</b>.</li>
</ul>
<p>Up to 20,000 shirts, MB ≥ social MC, so those shirts are worth making even counting the damage. The market <b>over-produces</b> by 5,000 because producers don't pay the $3.</p>
<div class="tip">"Is the market outcome efficient?" No. Q<sub>M</sub> &gt; Q* because producers don't pay the external cost. Triangle K is the welfare lost.</div>`},
{t:"Fixing it: the Pigouvian tax (Fig 13.2)", h:`
<p>The problem on the last page is that producers don't pay the $3 of damage, so the market follows the wrong cost curve. The fix is to make them pay it.</p>
<p><b>Pigouvian tax</b> (after the British economist Arthur Pigou, 1920s): a per-unit tax set <b>equal to the external damage</b>. As Module 0 showed, a per-unit tax shifts supply up by the tax. A $3 tax therefore moves the supply curve exactly onto the social MC curve, and the market now lands where demand = social MC, the efficient point. Making the polluter pay the external cost is called <b>internalising</b> the externality.</p>

<p><b>Reading the labels</b>: <b>E<sub>Tax</sub></b> is the new equilibrium with the tax, the same point as E* before. <b>P<sub>Tax</sub> = $10</b> is what buyers now pay. <b>P<sub>0</sub> = $7</b> is what sellers keep after handing $3 to the government (read it off the original supply line at Q = 20). <b>P<sub>M</sub> = $8</b> is the old market price.</p>
<ul>
<li>Price rises from $8 to <b>$10</b>, so buyers bear <b>$2</b> of the $3 tax. Producers bear $1, because their net price falls from $8 to $7.</li>
<li>Damage is still $3 per shirt on 20,000 shirts = <b>$60,000</b>.</li>
<li>Tax revenue = $3 × 20,000 = <b>$60,000</b>. <b>Revenue exactly equals the remaining damage</b>, so the government could in principle compensate society in full.</li>
</ul>
<div class="kim"><ul><li>A Pigouvian tax does <b>not</b> drive pollution to zero. The efficient level of pollution is positive.</li><li>The tax itself has <b>no built-in compensation mechanism</b> and doesn't say how revenue should be used. Options: cut other taxes, compensate victims, fund environmental repair.</li><li>It can be <b>regressive</b>: t-shirts are a bigger share of a poor person's budget, so rebates to low-income households make sense.</li><li>If damage per unit rises (more people develop allergies to the dye), raise the tax.</li></ul></div>`},
{t:"Proof the tax raises welfare (appendix, Figs 13.7–13.8)", h:`

<p><b>What each area is</b> (in $ thousands, from the straight lines):</p>
<div class="tw"><table>
<tr><th>Area</th><th>Where it is</th><th class="r">Size</th></tr>
<tr><td>A</td><td>under demand, above $10</td><td class="r">80</td></tr>
<tr><td>B</td><td>between $8 and $10, left of the social MC line</td><td class="r">30</td></tr>
<tr><td>E</td><td>between $8 and $10, from social MC to Q<sub>Tax</sub></td><td class="r">10</td></tr>
<tr><td>C</td><td>between $7 and $8, left of social MC</td><td class="r">7.5</td></tr>
<tr><td>F</td><td>between $7 and $8, from social MC to Q<sub>Tax</sub></td><td class="r">12.5</td></tr>
<tr><td>D</td><td>small triangle below $7, above social MC</td><td class="r">2.5</td></tr>
<tr><td>G</td><td>inside the band, below $7, up to Q<sub>Tax</sub></td><td class="r">37.5</td></tr>
<tr><td>H</td><td>Q<sub>Tax</sub> to Q<sub>M</sub>, between $8 and demand</td><td class="r">5</td></tr>
<tr><td>I</td><td>Q<sub>Tax</sub> to Q<sub>M</sub>, between supply and $8</td><td class="r">2.5</td></tr>
<tr><td>K</td><td>Q<sub>Tax</sub> to Q<sub>M</sub>, above demand, below social MC</td><td class="r">7.5</td></tr>
<tr><td>J</td><td>under supply up to Q<sub>Tax</sub> (production cost)</td><td class="r">100</td></tr>
</table></div>
<p>Social welfare = consumer surplus + producer surplus + tax revenue − external damage.</p>
<table>
<tr><th></th><th>No tax (E<sub>M</sub>)</th><th>Pigouvian tax (E<sub>Tax</sub>)</th></tr>
<tr><td>Consumer surplus (above price, below demand)</td><td>A+B+E+H = 125</td><td>A = 80</td></tr>
<tr><td>Producer surplus (below net price, above supply)</td><td>C+D+F+G+I = 62.5</td><td>B+C+D = 40</td></tr>
<tr><td>Tax revenue</td><td>none</td><td>E+F+G = 60</td></tr>
<tr><td>External damage</td><td>−(E+F+G+H+I+K) = −75</td><td>−(E+F+G) = −60</td></tr>
<tr class="hl"><td><b>Net benefit</b></td><td><b>A+B+C+D − K = 112.5</b></td><td><b>A+B+C+D = 120</b></td></tr>
</table>
<p>Both consumer and producer surplus <b>fall</b>, yet society gains area <b>K</b> ($7,500): the "too much production" where costs including damage exceeded benefits.</p>
<div class="kim">Why is producer surplus B+C+D with the tax? Sellers' revenue is P<sub>Tax</sub> × Q<sub>Tax</sub> = B+C+D+E+F+G+J. Subtract production cost J and the tax E+F+G, and B+C+D is left. Goodwin draws tax revenue as the band E+F+G rather than the rectangle between $7 and $10; the two have the same area ($60k), and drawing it as the band shows it equals the remaining damage.</div>
<div class="key">An ordinary tax creates deadweight loss (Goodwin Ch 12). A Pigouvian tax <b>removes</b> deadweight loss. With an externality, intervention <b>increases</b> efficiency.</div>`},

 subsidy</text></svg><figcaption>Here the external benefit is drawn as $4 per panel, and the subsidy is also $4.</figcaption></figure>
<p><b>Reading the labels</b>:</p>
<ul>
<li><b>Demand = private MB</b>: what buyers themselves gain. <b>Social MB</b> sits above it by the external benefit.</li>
<li><b>E<sub>M</sub></b> (at Q<sub>M</sub>, P<sub>M</sub>): the market outcome, where private MB = supply. The market produces <b>too little</b>, because buyers ignore the benefit to others.</li>
<li><b>E*</b> (at Q*): the efficient point, where social MB = supply.</li>
<li><b>Subsidy</b> (grey arrow): a per-unit payment that shifts supply <b>down</b> by the external benefit. The subsidised supply line meets demand at <b>E<sub>S</sub></b>, directly below E*, so buyers now choose Q*.</li>
<li>Goodwin: a formal welfare analysis shows the subsidy raises social welfare. The book doesn't work through the details.</li>
</ul>
<div class="kim">Negative externality → over-production → <b>tax</b>. Positive externality → under-production → <b>subsidy</b>. Both are market failures, and both justify intervention.</div>`},
{t:"Should we tax everything?", h:`
<p>The t-shirt example suggests a rule: find each product's external damage and tax it. But almost every product pollutes a little, and few economists want a separate Pigouvian tax on each one. There are two reasons:</p>
<ol><li><b>Administrative cost</b>: collecting thousands of small taxes is expensive.</li><li><b>Estimation cost</b>: working out a dollar value for every product's damage costs more than it's worth.</li></ol>
<p><b>The fix: an upstream tax.</b> Tax the raw material as close as possible to where it is <b>extracted</b>, e.g. per ton of coal at the mine. The higher coal price then flows through to electricity, steel and everything else made with coal, in proportion to how much coal each uses. One tax point does the work of thousands.</p>
<p><b>What to do with the money: a revenue-neutral tax</b> (Module 0). Pigouvian taxes on energy hit poor households hardest (they are regressive), so Goodwin suggests using the revenue to cut another regressive tax. His example is <b>social insurance taxes</b>: US payroll taxes for pensions, charged at a flat rate on wages only, so they take a bigger share of low incomes. The average household's total tax bill stays the same; the tax system just shifts from taxing work to taxing pollution.</p>
<p><b>How far countries have actually gone</b>:</p>
<ul>
<li>Few countries raise more than <b>10%</b> of tax revenue from environmental taxes. Among developed countries the <b>US is lowest</b> (Fig 13.4).</li>
<li>Many governments do the opposite of a Pigouvian tax: they pay <b>perverse subsidies</b> that make pollution cheaper (Box 13.1). Fossil-fuel subsidies were about <b>$550 bn</b> in 2009, about <b>12×</b> the $43–46 bn spent on renewables. The G20 agreed to phase them out "over the medium term", with no date.</li>
</ul>`},
{t:"Valuing the environment", h:`
<p>Every Pigouvian tax so far started from a known damage figure: $3 a shirt. In reality someone has to work out that number, and most environmental harm (dirty air, lost species) is never bought or sold, so there is no market price to read off. This card is about what "value" means; the next is about how to measure it.</p>
<p><b>The economist's definition</b>: something's economic value = the most people are willing to pay for it (their WTP, Module 0). The value to society = the <b>sum</b> of everyone's WTP.</p>
<ul>
<li>Rich people can pay more, so their preferences count for more. WTP is <b>"one dollar, one vote"</b>, not one person, one vote.</li>
<li>If nobody will pay to save a remote insect, its economic value is <b>zero</b>, however important it is ecologically.</li>
<li>Some people reject this. <b>Intrinsic value</b> means nature has value in itself, whether or not anyone pays: a right to exist. That view belongs to <b>ecological economics</b>. <b>Traditional environmental economics</b> counts only WTP-backed values. (Foster et al., Module 10, take this objection much further.)</li>
</ul>
<p><b>Total economic value (TEV)</b> adds up every reason people would pay for, say, a forest:</p>
<ol>
<li><b>Profit-making uses</b>: timber, fishing, grazing, farming.</li>
<li><b>Recreation</b>: camping, hiking, wildlife viewing.</li>
<li><b>Ecosystem services</b>: free, tangible benefits nature provides, such as nutrient recycling, wetland flood control, carbon storage, water purification and pollination.</li>
<li><b>Nonuse benefits</b>: value with no physical use at all. <b>Existence value</b> is being glad a place exists even if you'll never visit; <b>bequest value</b> is wanting it there for future generations.</li>
</ol>
<div class="kim">TEV gives <b>no priority</b> to any one use. When uses clash (clear-cut the forest or preserve it), cost–benefit analysis picks whichever option has the higher total value.</div>`},
{t:"Four nonmarket valuation methods", h:`
<p>"Nonmarket" means the thing isn't sold, so there is no price to observe. Economists use four indirect methods to estimate WTP. Each has a catch, and the catches are what exams ask about.</p>
<table>
<tr><th>Method</th><th>How it works</th><th>Example and catch</th></tr>
<tr><td><b>Cost of illness</b></td><td>Add up what pollution-related illness costs: direct costs (medical bills, lost wages) plus indirect costs (lost schooling, lost productivity).</td><td>US asthma cost $56 bn in 2007, about $3,500 per affected worker. It misses pain and suffering, so it is only a <b>lower bound</b>: true WTP to avoid the illness is at least this.</td></tr>
<tr><td><b>Replacement cost</b></td><td>The cost of a human-made substitute for a lost natural service.</td><td>A $50 m water plant to replace a forest's purification. It's a cost, <b>not a WTP</b>; it only tells you the forest's value if the community would actually pay for the plant.</td></tr>
<tr><td><b>Revealed preference</b></td><td>Infer value from what people actually spend in a related market. <i>Travel cost</i>: visitors from further away pay more (fuel, time) to reach a park, and how visits fall with distance traces out a demand curve. <i>Defensive expenditure</i>: what people spend to protect themselves, e.g. water filters.</td><td>Murray River (Australia): consumer surplus about US$155 per visitor-day. Brazilian households spend $16–19/month guarding against bad water. Economists see this as the <b>most valid</b> method because it uses real choices, but it can't reach ecosystem services or nonuse values, which involve no spending.</td></tr>
<tr><td><b>Stated preference</b></td><td>Ask people. <i>Contingent valuation</i>: a survey asks your WTP for a hypothetical change. <i>Contingent ranking</i>: rank several scenarios.</td><td>Spain: $22/yr for less road noise and air pollution. Azores marine biodiversity: $121–837 one-off. The <b>only</b> way to measure nonuse values, but the <b>most controversial</b>: people overstate WTP when no money actually changes hands, and ignore their budgets.</td></tr>
</table>
<p><b>The court test, Exxon Valdez (1989)</b>: after this oil tanker spill in Alaska, damages to nonuse values were at stake, so contingent valuation was reviewed by a NOAA panel including two Nobel laureates. It said the method can be "the starting point of a judicial process" but has a "likely tendency to exaggerate willingness to pay".</p>
<div class="kim">Defensive expenditure is biased toward the rich. Poor families with bad water may not be able to afford filters or bottled water, so their WTP looks like zero.</div>`},
{t:"Cost–benefit analysis & discounting", h:`
<p>Valuation gives money figures for environmental effects. <b>Cost–benefit analysis (CBA)</b> puts them together with ordinary costs to decide whether a policy is worth doing. Convert every cost and benefit into money and add them up to get one "bottom line".</p>
<ol><li>List the costs and benefits of each option.</li><li>Convert them to money, using the nonmarket methods where needed.</li><li>Add them up: net benefit = benefits − costs (sometimes shown as a benefit/cost ratio).</li><li>Pick the option with the highest net benefit.</li></ol>
<p>Its appeal is that it <i>looks</i> objective. In practice it is often incomplete and depends heavily on assumptions, and the biggest assumption is the discount rate.</p>
<p><b>Why discounting comes in</b>: a policy's costs usually come now and its benefits later. As in Module 0, a benefit X arriving in n years is worth today:</p>
<div class="eq">PV = X / (1 + r)<sup>n</sup></div>
<div class="prob"><b>Worked example (Goodwin)</b>An air-quality law costs $10 m now. Benefits of $20 m arrive in 25 years.
<ul><li>r = 5%: PV = 20/(1.05)<sup>25</sup> = 20/3.386 = <b>$5.91 m</b> &lt; $10 m → <b>reject</b></li>
<li>r = 2%: PV = 20/(1.02)<sup>25</sup> = 20/1.641 = <b>$12.19 m</b> &gt; $10 m → <b>accept</b> (net +$2.19 m)</li></ul>
Same law, same costs and benefits. The discount rate alone flips the decision.</div>
<p><b>So which rate?</b> Goodwin gives two approaches (Nordhaus and Stern fight over exactly this in Modules 5 and 8):</p>
<ul><li><b>Market approach</b>: use the return on safe investments such as government bonds (the 30-year US Treasury paid 3% nominal in early 2013). The logic is opportunity cost: money spent on the policy could have earned that return instead. The catch is that market rates jump around.</li>
<li><b>Ethical approach</b>: any positive r means future generations' welfare counts for less than ours. Economists who weigh long-run damage heavily prefer <b>lower</b> rates. At r = 0, an impact in 100 years counts exactly as much as one today.</li></ul>`},
{t:"Valuing lives & other CBA problems", h:`
<p>Many environmental rules save lives, so CBA needs a money value for a life. Economists don't price a particular person's life. They value small reductions in <b>risk</b> spread over many people.</p>
<p><b>Value of a statistical life (VSL)</b>: if a million people would each pay $10 to cut their risk of death by 1 in a million, together they pay $10 m to prevent one expected death. That $10 m is the VSL. Nobody knows whose death is avoided, which is why the life is "statistical".</p>
<div class="eq">VSL = (WTP per household × number of households) / lives saved</div>
<div class="prob"><b>Worked example</b>Households will pay $10/yr for a policy that saves 50 lives a year. There are 100 m households.<br>Total WTP = $10 × 100 m = $1 bn → VSL = $1 bn / 50 = <b>$20 m</b>.<br>A policy costing $500 m that saves 50 lives costs $10 m per life saved. That is below the VSL, so it passes CBA.</div>
<ul>
<li>US agencies' VSL rose from about <b>$2 m</b> (1980s) to nearly <b>$10 m</b>. The EPA used $9.1 m in 2010, up from as low as $6.8 m under the Bush administration (Box 13.2). A higher VSL makes more safety rules pass CBA.</li>
</ul>
<p><b>Three general problems with CBA</b>:</p>
<ol>
<li><b>Uncertainty</b>: we often don't know the size or likelihood of future effects.</li>
<li><b>Missing values</b>: some effects can't be credibly priced at all.</li>
<li><b>Sensitivity to assumptions</b>: as the discount-rate example showed, small changes in inputs can flip the answer.</li>
</ol>
<p>One response to uncertainty is the <b>precautionary principle</b>: when an action carries even a small chance of catastrophe, err on the side of caution rather than waiting for proof.</p>
<div class="kim">If different reasonable assumptions give different answers, someone still has to make a subjective choice. That is why Goodwin says CBA is "often not as objective as it may seem".</div>`},
{t:"Four policy tools", h:`
<p>Back to policy. Once a government decides pollution should be cut, the Pigouvian tax is only one of four tools it can use.</p>
<table>
<tr><th>Tool</th><th>What it does</th><th>Plus</th><th>Minus</th></tr>
<tr><td><b>Pollution standards</b></td><td>Set a legal limit on each source (tailpipe limits, or a ban as with the pesticide DDT).</td><td>Definite result. Good for clear health hazards.</td><td>Not cost-effective: every firm must cut the same amount whatever its cost. No reward for going beyond the limit.</td></tr>
<tr><td><b>Technology-based approach</b></td><td>Require a specific technology (catalytic converters on US cars from 1975).</td><td>Easy to monitor and enforce. Mass adoption can lower the technology's cost.</td><td>Not cost-effective. No flexibility to find cheaper ways.</td></tr>
<tr><td><b>Pollution tax</b></td><td>Charge per unit of pollution (the Pigouvian tax).</td><td>Firms choose how much to cut, so total cost is lowest. Firms know the price.</td><td>Nobody knows in advance how much pollution will fall. Politically unpopular.</td></tr>
<tr><td><b>Tradable permits</b></td><td>Issue a fixed number of permits to pollute (the cap); firms can buy and sell them.</td><td>Same lowest cost as a tax. Total pollution is known. Green groups can buy permits and retire them.</td><td>Permit prices can swing wildly. Firms lobby to get permits free.</td></tr>
</table>
<div class="key">The first two are <b>command-and-control</b>: the government tells each firm what to do. The last two are <b>market-based</b>: they put a price on pollution and let each firm decide how much to cut. The next card shows why that matters.</div>`},
{t:"How a firm responds to a pollution tax (Fig 13.5)", h:`
<p>Why are market-based tools cheaper? Start with one firm facing a tax of T per unit of pollution.</p>
<p><b>Reading the diagram</b>: the horizontal axis is the firm's pollution level. With no regulation it emits <b>Q<sub>max</sub></b>; cleaning up means moving <i>left</i>. <b>MCR</b> (marginal cost of reduction) is the cost of cutting one more unit. It is low for the first cuts (easy fixes) and rises steeply as pollution gets close to zero, so the curve climbs toward the left. The orange line is the tax <b>T</b>.</p>

<ul>
<li>Each unit the firm cleans up costs MCR but saves it T in tax. So it keeps cutting while <b>MCR &lt; T</b>, and stops at <b>Q<sub>Tax</sub></b>, where MCR = T.</li>
<li>Cutting from Q<sub>max</sub> to Q<sub>Tax</sub> costs area <b>B</b> (the area under MCR). Had it not cut, it would have paid tax B + C on those units. So cleaning up <b>saves C</b>.</li>
<li>It still pays tax <b>A</b> on the pollution that remains. Total cost = A + B, less than the A + B + C it would pay by doing nothing.</li>
</ul>
<p><b>Now two firms.</b> The next diagram puts the amount <i>reduced</i> on the horizontal axis (so it reads left to right), with each firm's own MCR curve.</p>

aption>One tax T, two firms. Each cuts until its own MCR = T. Firm 1, the cheap reducer, cuts 6.7 units; Firm 2 cuts only 2.5.</figcaption></figure>
<div class="key">Every firm ends up with the same marginal cost of reduction (= T). If one firm's last unit cost more than another's, shifting a unit of cleanup from the dear firm to the cheap one would cut the same pollution for less. Equal marginal costs mean no such saving is left, so a tax (or a permit market) reaches a given total cut at the <b>lowest total cost</b>. A uniform standard makes the high-cost firm cut as much as the low-cost one, which wastes money.</div>`},
{t:"Tax vs permits, and the evidence", h:`
<p><b>How tradable permits work</b>: the government decides total allowed pollution (the <b>cap</b>) and issues that many permits, free or by auction. Each firm must hold a permit for every unit it emits. A firm that can cut cheaply cuts more and sells its spare permits; a firm with high costs buys permits instead of cutting. Trading continues until every firm's MCR equals the permit price, the same equal-marginal-cost result as a tax. This is also called <b>cap-and-trade</b>.</p>
<div class="vs">
<div><h3>Tax</h3><ul><li><b>Price</b> certain → easier to plan long-term investment</li><li><b>Quantity</b> uncertain: it depends on firms' MCR curves, which the regulator doesn't know</li><li>May need politically painful increases to hit a target</li></ul></div>
<div><h3>Tradable permits</h3><ul><li><b>Quantity</b> certain (= permits issued)</li><li><b>Price</b> uncertain and can swing wildly</li><li>Issue fewer permits each period → tighter cap</li></ul></div>
</div>
<p><b>Evidence</b>:</p>
<ul>
<li><b>EU ETS</b> (the EU's Emissions Trading System for CO₂, the biggest permit market): price about €30/t in 2006 → €0.10 in 2007 (too many permits issued) → over €20 in 2008 → under €3 in 2013. That is the price uncertainty in action.</li>
<li><b>US SO₂ trading</b> (1990 Clean Air Act Amendments, Box 13.3): a permit market for sulphur dioxide, which causes acid rain. The target was 50% of 1980 levels by 2010; emissions actually fell <b>83%</b>, at about <b>50%</b> lower cost than a uniform standard. It covers 2,000+ power plants, mostly with free permits; about 3% are auctioned.</li>
<li><b>US Clean Air Act (1970)</b>, mostly standards: the six major air pollutants fell <b>68%</b> from 1970 to 2011, and lead fell 97%. In 2010 compliance cost $53 bn against benefits of $160 bn–$3.8 tn, so <b>$3–$72 of benefit per $1</b>. The Act explicitly <b>rules out CBA</b> when setting health standards.</li>
<li><b>Jobs vs environment</b>: Goodwin calls the trade-off "a myth". Environmental rules create some jobs and destroy others, and the net effect was positive in a 2008 US study. A 2007 UK study found no significant job loss. Federal environmental rules from 2000–10 cost $24–29 bn and brought $82–550 bn in benefits.</li>
</ul>
<div class="kim">The two instruments reach the same reduction at the same cost. The difference is <b>where the uncertainty lies</b>: in the price under permits, in the quantity under a tax. Nordhaus returns to this choice for carbon in Module 7.</div>`},

/* ───────────────────────── 2. GOODWIN CH 14 ───────────────────────── */
M.push({t:"Public goods & the commons (Goodwin 14)", c:[
{t:"When there is no market at all", h:`
<p><b>Where this fits.</b> Module 1 started from a working market with a side effect and fixed it with a price. Goodwin Ch 14 asks what happens when <b>ownership is unclear</b>, so there may be no market at all. This is the case of the atmosphere, which is why the chapter ends with climate change.</p>
<p>Examples of things nobody clearly owns:</p>
<ul><li>Oceans, apart from coastal zones</li><li>Unowned forests and wetlands with no clear management rules</li><li><b>The atmosphere</b>: "crucial to all of us but owned by nobody"</li><li>Public parks, beaches, river fisheries; public airwaves</li></ul>
<p>Two properties sort all goods:</p>
<ul><li><b>Excludable</b>: the owner can stop others from using it.</li><li><b>Rival</b>: one person's use leaves less for others.</li></ul>`},
{t:"The four types of goods (Table 14.1)", h:`
<p>Apply the two tests from the last page to any good:</p>
<ul>
<li>A t-shirt is <b>excludable</b> (the shop won't give it to you unless you pay) and <b>rival</b> (if I wear it, you can't).</li>
<li>A national park is hard to exclude people from, and my visit barely reduces yours, so it is <b>nonexcludable</b> and <b>nonrival</b>.</li>
</ul>
<p>Two yes/no tests give four boxes:</p>
<div class="tw"><table>
<tr><th></th><th>Rival</th><th>Nonrival</th></tr>
<tr><th>Excludable</th><td><b>Private goods</b><br>t-shirts, groceries, cars, haircuts</td><td><b>Artificially scarce (club) goods</b><br>cable TV, health clubs, toll roads</td></tr>
<tr><th>Nonexcludable</th><td><b>Common property resources (CPRs)</b><br>ocean fisheries, groundwater, a community basketball court</td><td><b>Public goods</b><br>national defence, free radio, public education, national parks</td></tr>
</table></div>
<ul>
<li>If a good is <b>nonrival</b>, serving one more user costs nothing: its marginal cost is <b>zero</b>. That matters for the club-good diagram next.</li>
<li><b>Congestion</b>: a nonrival good can turn rival once enough people use it. A crowded park or gym starts to behave like a CPR.</li>
<li>"Public good" doesn't mean "government-owned". An NGO's nature reserve can be a public good, and public grazing land leased to one rancher is a private good. The tests are about the good, not the owner.</li>
</ul>
<div class="key">Markets work well only for private goods. For the other three types they <b>almost always fail</b>, which alone justifies intervention on efficiency grounds. The next pages take each type in turn.</div>
<div class="tip">Classic short question: classify movie seats (private, or club up to capacity), traffic lights (public), a lake on private land (club or private), a lake on public land (CPR or public), rental cars (private), a pure river used for drinking and dumping (CPR), a free hospital for the poor (publicly provided private good). Always say why: is it excludable? Is it rival?</div>`},
{t:"Artificially scarce goods (Fig 14.1)", h:`
<p>An <b>artificially scarce good</b> is nonrival (one more user costs nothing) but excludable (the seller can lock out non-payers). Goodwin's example is cable TV: sending the signal to one more home costs the company essentially nothing.</p>
<figure class="dia"><svg viewBox="0 0 560 330" role="img" aria-label="Cable TV at $30: 80,000 subscribe though 120,000 value it; marginal cost is zero, so the triangle from 80,000 to 120,000 is lost welfare"><path class="ax" d="M56.0,22.0 L56.0,286.0 L536.0,286.0"/><text x="536.0" y="318.0" text-anchor="end" class="m">Households (thousands)</text><text x="8.0" y="14.0" class="m">$ per month</text><path class="f1" d="M56.0,38.5 L340.4,203.5 L56.0,203.5Z"/><path class="f3" d="M56.0,203.5 L340.4,203.5 L340.4,286.0 L56.0,286.0Z"/><path class="f2" d="M340.4,286.0 L340.4,203.5 L482.7,286.0Z"/><path class="ink" d="M56.0,38.5 L59.6,40.6 L63.1,42.6 L66.7,44.7 L70.2,46.8 L73.8,48.8 L77.3,50.9 L80.9,52.9 L84.4,55.0 L88.0,57.1 L91.6,59.1 L95.1,61.2 L98.7,63.2 L102.2,65.3 L105.8,67.4 L109.3,69.4 L112.9,71.5 L116.4,73.6 L120.0,75.6 L123.6,77.7 L127.1,79.8 L130.7,81.8 L134.2,83.9 L137.8,85.9 L141.3,88.0 L144.9,90.1 L148.4,92.1 L152.0,94.2 L155.6,96.2 L159.1,98.3 L162.7,100.4 L166.2,102.4 L169.8,104.5 L173.3,106.6 L176.9,108.6 L180.4,110.7 L184.0,112.8 L187.6,114.8 L191.1,116.9 L194.7,118.9 L198.2,121.0 L201.8,123.1 L205.3,125.1 L208.9,127.2 L212.4,129.2 L216.0,131.3 L219.6,133.4 L223.1,135.4 L226.7,137.5 L230.2,139.6 L233.8,141.6 L237.3,143.7 L240.9,145.8 L244.4,147.8 L248.0,149.9 L251.6,151.9 L255.1,154.0 L258.7,156.1 L262.2,158.1 L265.8,160.2 L269.3,162.2 L272.9,164.3 L276.4,166.4 L280.0,168.4 L283.6,170.5 L287.1,172.6 L290.7,174.6 L294.2,176.7 L297.8,178.8 L301.3,180.8 L304.9,182.9 L308.4,184.9 L312.0,187.0 L315.6,189.1 L319.1,191.1 L322.7,193.2 L326.2,195.2 L329.8,197.3 L333.3,199.4 L336.9,201.4 L340.4,203.5 L344.0,205.6 L347.6,207.6 L351.1,209.7 L354.7,211.8 L358.2,213.8 L361.8,215.9 L365.3,217.9 L368.9,220.0 L372.4,222.1 L376.0,224.1 L379.6,226.2 L383.1,228.2 L386.7,230.3 L390.2,232.4 L393.8,234.4 L397.3,236.5 L400.9,238.6 L404.4,240.6 L408.0,242.7 L411.6,244.8 L415.1,246.8 L418.7,248.9 L422.2,250.9 L425.8,253.0 L429.3,255.1 L432.9,257.1 L436.4,259.2 L440.0,261.2 L443.6,263. <ul>
<li><b>Purple rectangle</b>: at $30/month, <b>80,000</b> households subscribe and revenue = $30 × 80,000 = <b>$2.4 m/month</b>.</li>
<li><b>Green triangle</b>: consumer surplus of those 80,000 subscribers, ½ × 80,000 × ($90 − $30) = $2.4 m.</li>
<li>The efficient rule is MB = MC. With MC = 0, that means serving <b>all 120,000</b> households who value it at all.</li>
<li><b>Orange triangle</b>: the 40,000 households who value cable at less than $30 but more than $0. Serving them free would add ½ × 40,000 × $30 = <b>$0.6 m</b> of welfare, but no profit-maker will do it.</li>
<li><b>Price discrimination</b> (charging by WTP) could reach some of them, but it's often illegal or impractical. College financial aid is one exception, though it's driven by ethics, not zero MC.</li>
<li>Club goods are often supplied by <b>monopolies</b>, so regulation may cap prices or require cheaper rates for poor households.</li>
</ul>`},
{t:"Common property: the fishery model (Fig 14.2)", h:`
<p>A <b>common property resource</b> is open to anyone (nonexcludable) but gets used up (rival). The problem is overuse. Goodwin's model is a fishery.</p>
<p><b>The story</b>: each fishing trip costs a boat $15,000 to run (labour, fuel, boat payments). While there are few boats, each trip catches $25,000 of fish. Past a certain number of trips, boats start competing for the same fish, and every trip catches less, not just the newest one.</p>

lass="dot" cx="347.0" cy="106.8" r="3.5"/><circle class="dot" cx="456.6" cy="162.2" r="3.5"/><text x="516.8" y="223.5" text-anchor="end" class="">RT (revenue per trip)</text><text x="62.0" y="178.2" text-anchor="start" class="a">PC = $15k (private cost)</text><text x="460.0" y="72.3" text-anchor="end" class="b">SC (social cost)</text></svg><figcaption>Horizontal axis: number of fishing trips. Vertical axis: thousands of dollars per trip.</figcaption></figure>
<p><b>Reading the labels</b>:</p>
<ul>
<li><b>PC</b> = private cost per trip, a flat <b>$15,000</b>.</li>
<li><b>RT</b> = revenue per trip: $25,000 up to <b>T<sub>0</sub></b> trips (a $10,000 profit), then <b>falling</b> as the fishery gets crowded.</li>
<li><b>SC</b> = social cost of a trip. Beyond T<sub>0</sub>, each new trip lowers <i>everyone else's</i> catch. That lost profit is an external cost, so SC = PC + the losses imposed on others, and it rises above PC.</li>
<li><b>T*</b> = the efficient number of trips, where RT = SC: the last trip's revenue just covers its private cost plus the harm it does to others. (Star = efficient, as in Module 1.)</li>
<li><b>T<sub>e</sub></b> = what happens with open access. Each new boat compares only its own revenue with its own cost, so boats keep entering while RT &gt; PC, until profit per trip falls to zero at RT = PC. The fish stock may then collapse.</li>
</ul>
<div class="key">This is a negative externality <b>among the users themselves</b>: each fisher harms the other fishers. It is the same logic as the t-shirt diagram, with SC playing the part of social MC. The unregulated outcome T<sub>e</sub> &gt; T* is inefficient and can be ecologically unsustainable.</div>
<div class="kim">The book's text has a slip. It says SC is "out-of-pocket costs of $10,000 plus the external cost", but the private cost per trip is <b>$15,000</b> (the $10,000 is the initial profit). In an exam, use PC = $15,000.</div>`},
{t:"Policies for the commons", h:`
<p>The fishery's problem is the same as the t-shirts': users don't pay for the harm they cause. So the two fixes mirror Module 1's tax and tradable permits.</p>
<ol>
<li><b>Per-trip fee</b> = the external cost each trip imposes. It is a Pigouvian tax on access: a fisher now weighs RT against PC + fee = SC. Adjust the fee until trips fall to T*.</li>
<li><b>Individual transferable quotas (ITQs)</b>: a manager sets a total allowable catch low enough to protect the fish, then divides it into quota rights that can be bought and sold. The rights can be <b>given free or auctioned</b>; auction money can fund management or compensate fishers forced out. The quota <b>price</b> is set by supply and demand, not by the government. ITQs are used in Australia, Canada, Iceland and the US.</li>
</ol>
<p><b>Example, Box 14.1 · Long Island clams</b>: 22 permits with a total cap of 300,000 bushels a year (about 13,600 each), each worth about $135,000 in gross revenue (2011). The old rule of one permit per boat stopped fishers saving costs. In 2011 "cooperative harvesting" let one boat use several permits: the same total catch, fewer boat trips, lower cost.</p>
<div class="tip">ITQs are to fisheries what tradable permits are to pollution. If asked for "two policies for a CPR", give the fee and ITQs and say how each brings trips down to T*.</div>`},
{t:"Tragedy of the commons, and Ostrom", h:`
<p><b>Garrett Hardin (1968)</b>, an ecologist: picture a pasture open to all. Adding one more cow gives the herder about <b>+1</b> in gain, while the overgrazing cost is shared among all herders, so the herder bears only a <b>fraction</b> of it. Every rational herder keeps adding: "Freedom in a commons brings ruin to all."</p>
<p><b>Elinor Ostrom</b> (Nobel, 2009) pushed back: commons can be managed successfully <b>by the people who use them</b>, through social norms, customs and local institutions, rather than by governments or private firms. Many such systems have lasted for generations.</p>
<div class="vs">
<div><h3>Common property</h3><p>Shared, but use may be regulated by custom and rules.</p></div>
<div><h3>Open access</h3><p>Anyone, unlimited, no rules. This is where Hardin's tragedy actually happens.</p></div>
</div>
<div class="kim">Goodwin notes that degradation often follows when <b>market institutions encroach</b> on community-managed commons. If an exam asks about limitations of the tragedy argument, cite Ostrom, the common-property vs open-access distinction, and that community rules can work.</div>`},
{t:"Public goods & free riders (Fig 14.3)", h:`
<p>Nonexcludable + nonrival → nobody needs to pay to benefit. Private markets usually supply <b>zero</b>. Donations (public radio, conservation NGOs) help but fall short because of <b>free riders</b>, people who benefit without paying.</p>
<p>Goodwin's example: Doug and Sasha both value a preserved forest. Each acre preserved benefits both of them at once.</p>

orizontally as with private goods. Past 18 acres Sasha's MB is zero, so the social MB line runs along Doug's.</figcaption></figure>
<ul>
<li>At 10 acres, Doug's MB is $5 and Sasha's is $2, so social MB = <b>$7</b>.</li>
<li>Preservation costs $7/acre, so the optimum is <b>10 acres</b>, where social MB = MC.</li>
<li>Cost = $70 → tax each $35. Doug gets at least $50 of benefit and accepts. Sasha may object.</li>
<li>Scaled to about 115 m US households: $35 × 115 m ≈ <b>$4 bn</b>.</li>
<li>For a public good, <b>WTP &lt; MB</b>: Doug gains $5 but may say he'll pay $3 or nothing (free riding). Surveys are unreliable, so provision becomes a <b>political</b> decision funded by taxes.</li>
</ul>
<div class="key">Private good: add demand curves <b>horizontally</b> (quantities). Public good: add MB curves <b>vertically</b> (prices).</div>`},
{t:"Climate change as a commons & public good", h:`
<p>Goodwin's chapter ends by putting climate change into these boxes. The atmosphere as a dumping ground for CO₂ is a <b>commons</b>: anyone can emit, and everyone's emissions use up the limited room. A stable climate is a <b>global public good</b>: nobody can be excluded from it, and my enjoying it doesn't reduce yours. So cutting emissions creates a positive externality, and every country is tempted to <b>free-ride</b> on others' cuts.</p>
<ul>
<li>The Stern Review (2006, Module 8) called climate change "the greatest and widest-ranging <b>market failure</b> ever seen". Christine Lagarde (head of the IMF, 2013): "the greatest economic challenge of the twenty-first century".</li>
<li><b>Who emits</b> (CO₂ per person, Goodwin's data): US about 18 t, Germany 9, China 7, <b>India 1.4</b>, Kenya 0.3. Equal % cuts for every country would lock that inequality in.</li>
<li><b>Bathtub</b> (Module 0): CO₂ stays in the air for decades to centuries, so even a 50% cut in emissions still lets concentrations rise. The IPCC says global CO₂ must fall <b>50–80% by 2050</b>.</li>
</ul>
<p><b>Why CBA struggles here</b>: the damage is uncertain, and the time horizon is long (costs now, benefits over a century), so the <b>discount rate</b> from Module 1 drives the answer.</p>
<ul>
<li>Earlier economic studies suggested a modest carbon tax of $20–40 per ton of carbon.</li>
<li>The <b>Stern Review</b> said business-as-usual (BAU, i.e. no new policy) damage is at least <b>5%</b> and up to <b>20%</b> of GDP, justifying a tax above <b>$300 per ton of carbon</b>. Goodwin says the main reason for the gap is Stern's low <b>1.4%</b> discount rate against the 4–5% used elsewhere, plus weight on the precautionary principle.</li>
<li>Units: these are per ton of <i>carbon</i>. One ton of carbon makes about 3.67 tons of CO₂, so $300/t C ≈ $82/t CO₂. Nordhaus (Module 7) quotes prices per ton of CO₂.</li>
</ul>
<p>Because no single country can fix a global public good, climate policy needs <b>international agreement</b>: the subject of the next page.</p>`},
{t:"Kyoto & the Earth Atmospheric Trust", h:`
<p><b>Kyoto Protocol (1997)</b>: industrialised countries took targets for 2012 relative to 1990 (US −7%, France −8%, Japan −6%). Developing countries like China and India had no binding targets.</p>
<ul><li>191 countries ratified. The <b>US signed but never ratified</b> and Bush rejected it in 2001. It entered into force in 2005 after Russia ratified in Nov 2004.</li>
<li>The overall −5% target was roughly met, but mostly through <b>Russia's post-1991 economic collapse</b>, not policy.</li>
<li>The sticking point remains whether developing countries should face mandatory cuts.</li></ul>
<p><b>Earth Atmospheric Trust</b> (Barnes, Costanza, Ostrom and others, 2008): treat the atmosphere as a commons that everyone owns equally.</p>
<ul><li>A <b>global cap-and-trade</b> scheme with all permits <b>auctioned</b>, raising about <b>$1–4 trillion</b> a year.</li><li>Part goes to low-carbon tech, adaptation and repair. Half or more is paid out as an <b>equal per-capita dividend</b>, about <b>$300/person/yr</b>.</li><li>That partly offsets higher prices in rich countries and is a big income boost in poor ones, so it cuts poverty too.</li></ul>
<div class="kim">Kyoto is a free-rider story, and the Trust applies CPR logic (equal ownership, auctioned rights, dividends). Compare it with Azad's right to energy, where carbon-tax revenue also comes back to the poor.</div>`},

/* ───────────────────────── 3. CLIMATE CASINO CH 12 ───────────────────────── */
M.push({t:"Adding up the damages (Nordhaus 12)", c:[
{t:"Nordhaus and the Climate Casino", h:`
<p><b>Where this fits.</b> Goodwin gave us the tools: externality, Pigouvian tax, CBA, discounting, commons. William Nordhaus applies exactly those tools to climate change. He won the 2018 Nobel Prize in economics for this work, and he is the "mainstream" view that the critics in Modules 8–11 attack.</p>
<p><i>The Climate Casino</i> (2013) follows the cost–benefit logic of Module 1, step by step:</p>
<table>
<tr><th>Step</th><th>Question</th><th>Chapter (module)</th></tr>
<tr><td>Benefits of acting</td><td>How much damage does warming do?</td><td>Ch 12 (Module 3)</td></tr>
<tr><td>Costs of acting</td><td>How much does cutting emissions cost?</td><td>Ch 15 (Module 4)</td></tr>
<tr><td>Comparing over time</td><td>How do we weigh future damage against today's cost?</td><td>Ch 16 (Module 5)</td></tr>
<tr><td>The verdict</td><td>Which temperature target balances the two?</td><td>Ch 18 (Module 6)</td></tr>
<tr><td>The tool</td><td>How do we get there? (a carbon price)</td><td>Ch 19–20 (Module 7)</td></tr>
</table>
<p>The title's metaphor: by emitting greenhouse gases we are "rolling the climatic dice" in a casino whose odds we don't fully know.</p>`},
{t:"Five themes from the impact chapters", h:`
<p>Before Ch 12, Nordhaus goes "house to house" through each kind of impact: farming, health, oceans, hurricanes, species. Ch 12 adds them up. First he draws five general lessons from that tour:</p>
<ol>
<li><b>Damages are a side effect of growth.</b> Emissions come from economic activity, so climate damage is an <i>externality of rapid economic growth</i> (Module 1's idea on a world scale). Zero growth would greatly reduce the threat, but nobody seriously proposes it.</li>
<li><b>Managed vs unmanaged systems.</b> A <i>managed</i> system is one people control and can adjust, such as a factory, a farm with irrigation or a city with air conditioning. An <i>unmanaged</i> system is one we can't steer, such as <b>ocean acidification</b> (CO₂ dissolving in seawater makes it more acidic, which harms coral and shellfish) or species loss. Worry most about the unmanaged ones.</li>
<li><b>Rich economies are increasingly insulated.</b> Agriculture, the most weather-exposed sector, is a shrinking share of rich economies, and even farming depends less on raw nature than it used to. (The next page has the numbers.)</li>
<li><b>Forecasting is hard.</b> Predicting economies a century ahead is like looking through a <b>"fuzzy telescope"</b>.</li>
<li><b>The worst impacts are hardest to price.</b> The most troubling ones are <b>far from the market</b>: ecosystems, species, acidification, cultural treasures. "Economics can contribute least in areas where we need it most." (Recall Module 1: nonmarket values are the hardest to measure.)</li>
</ol>`},
{t:"Vulnerability by sector (Table 5)", h:`
<p><b>Why this table matters</b>: if climate mostly harms outdoor, weather-exposed activities, then the share of the economy in those activities tells you how much of GDP is at risk. Nordhaus sorts US industries by how exposed they are and tracks each group's share of national income:</p>
<table>
<tr><th>Group</th><th>Examples</th><th class="r">1948</th><th class="r">2011</th></tr>
<tr><td>Heavily impacted</td><td>farming, forestry, fishing</td><td class="r">9.1%</td><td class="r"><b>1.2%</b></td></tr>
<tr><td>Moderately impacted</td><td>coastal real estate, transport, construction, utilities</td><td class="r">11.6%</td><td class="r">9.0%</td></tr>
<tr><td>Lightly / negligibly</td><td>manufacturing, finance, health, government, mining…</td><td class="r">79.3%</td><td class="r"><b>89.8%</b></td></tr>
</table>
<ul>
<li>His example of a sector climate barely touches is <b>neurosurgery</b>, which happens in "highly controlled environments".</li>
<li>Services grew from 25% of the US economy (1929) to 52%. Farming is about 1% of the US workforce (2012).</li>
<li>The same shift is happening in poorer countries: agriculture's share of GDP in low and middle-income countries fell from 25% (1970) to 10% (2010). Of 166 countries, only <b>4</b> show a rising share: DR Congo, Sierra Leone, Central African Republic, Zambia.</li>
</ul>
<p>Nordhaus calls this shift away from climate-exposed sectors "one of the central findings of the economics of climate change". It is a big reason his damage estimates (next page) come out small.</p>
<div class="kim">This is exactly what <b>Keen</b> attacks (Module 9). He says it treats about 87–90% of GDP as unaffected because it happens "indoors", which confuses <i>weather</i> (what happens outside today) with <i>climate</i> (the whole Earth system that factories, supply chains and cities depend on).</div>`},
{t:"The aggregate damage estimates", h:`
<p>Nordhaus's Fig 22 puts every published estimate of total damage on one graph. The vertical axis is damage as a % of world output (GDP); a negative number means warming is a net <i>gain</i>.</p>
