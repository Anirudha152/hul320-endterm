{t:"Big comparisons (essay skeletons)", h:`
<details class="sa"><summary>Nordhaus vs Stern on climate economics</summary>
<ul><li><b>Target</b>: CBA optimum (2.3–4°C) vs risk-based guard-rail (1.5°C).</li>
<li><b>Damages</b>: small and convex (1–5% at 3°C) vs immense, nonlinear, existential. Stern calls 8.5% at 6°C implausible.</li>
<li><b>Costs</b>: rising marginal cost vs increasing returns and falling technology costs.</li>
<li><b>Discounting</b>: descriptive ~4% vs no pure-time discounting, with the social discount factor endogenous.</li>
<li><b>Instruments</b>: the carbon price is central vs a carbon price plus six market failures plus regulation (bulbs, combustion-engine bans).</li>
<li><b>Common ground</b>: both want carbon pricing and both stress participation and cooperation.</li></ul></details>
<details class="sa"><summary>Three critiques of mainstream climate economics: Stern, Keen, Foster</summary>
<ul><li><b>Stern</b> (reform from within): the tools are too narrow for risk and transformation. Use many models and guard-rails.</li>
<li><b>Keen</b> (empirical demolition): the damage numbers are fabricated (indoors, cross-section, surveys, Lenton). GIGO.</li>
<li><b>Foster et al.</b> (systemic): monetising nature is the error (Midas). Capitalism's growth imperative is the cause, so ecological revolution is the answer.</li>
<li>Escalating depth: method → data → system.</li></ul></details>
<details class="sa"><summary>Carbon tax vs cap-and-trade</summary>
<ul><li>Equivalent under certainty ($100 bn example).</li><li>Tax: price certainty, revenue, stability, transparency. Cap: quantity certainty, political durability, free allowances as "political glue".</li><li>Evidence: EU ETS volatility, SO₂ success.</li><li>Hybrid: price floor plus safety valve.</li><li>Equity: regressivity, so use rebates (Goodwin), dividends (Hansen) or in-kind energy (Azad).</li></ul></details>
<details class="sa"><summary>Should climate finance count development aid?</summary>
<ul><li>CBDR and "new and additional" (1992).</li><li>The onion: ODA is the most contested layer (over-coding).</li><li>OWID: 34% falls to 13% if counting only principal objectives; displacement vs relabelling.</li><li>Equity view: entitlement, grants, recipients decide. Efficiency view: synergies with aid, private leverage, donors decide.</li></ul></details>
<details class="sa"><summary>Can India grow green and fairly?</summary>
<ul><li>Pollin: 1.5% of GDP, 53% CO₂ cut, ~2× jobs, IO evidence.</li><li>Azad: a carbon tax funds it, and the Right to Energy makes it progressive (CIQ, bottom 70% gain).</li><li>Naudé: green growth suits low emitters, while degrowth targets the North.</li><li>Raworth: lift the floor with few resources.</li><li>Caveats: job quality (bioenergy), large hydro, domestic content.</li></ul></details>`},
{t:"Things to keep in mind on exam day", h:`
<div class="kim"><ul>
<li><b>Dates matter</b>: Stern 2007 (550 ppm, the target of Foster's critique) ≠ Stern 2022 (1.5°C). The Nordhaus 1993 JEP paper (on the slides) ≠ <i>Climate Casino</i> (2013) ≠ <i>Spirit of Green</i> (2021).</li>
<li><b>"Weak sustainability"</b> means different things: Foster (substitutability) vs Jacobs in Nordhaus (avoiding catastrophe).</li>
<li><b>Discounting answers differ by context</b>: for a single project the rate is "the single most important factor" (Ch 16). For target-setting, participation matters more (Ch 18).</li>
<li><b>Relative ≠ absolute</b> decoupling. A falling carbon intensity of GDP is only relative.</li>
<li><b>Public good</b>: add vertically. <b>Private good</b>: add horizontally.</li>
<li><b>a<sub>ij</sub> divides by the buyer's output x<sub>j</sub></b> (the column total), not the seller's.</li>
<li><b>Incidence</b>: a tax raises the buyer price by less than the tax unless supply is perfectly elastic.</li>
<li>The <b>IPCC 0.2–2%</b> is a fall in the <b>level</b> of GDP, not the growth rate (Keen's point).</li>
<li>Name <b>both sides</b> in critiques: the Ostrom vs Hardin, Nordhaus vs Keen, and North vs South debates.</li>
<li>For every "explain with a graph" answer: label it, put numbers on it, and write a one-line conclusion.</li>
</ul></div>`},

// flatten
var flat = [];
M.forEach(function(m, mi){ m.c.forEach(function(c, ci){ flat.push({mi:mi, ci:ci}); }); });
var cur = 0;
try { var s = parseInt(location.hash.slice(1) || localStorage.getItem("hul320e-pos"), 10); if (s >= 0 && s < flat.length) cur = s; } catch(e){}

var $ = function(id){ return document.getElementById(id); };
var nav = $("nav"), list = $("navlist"), card = $("card");

function shuffle(a){
  for (var k = a.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)), t = a[k]; a[k] = a[r]; a[r] = t; }
  return a;
}

// options are shuffled on every render so the answer position can't be memorised
function quiz(q){
  return q.map(function(x, i){
    var order = shuffle(x[1].map(function(_, j){ return j; }));
    return '<div class="mcq" data-a="'+order.indexOf(x[2])+'"><p class="qq"><span>'+(i+1)+'.</span>'+x[0]+'</p><div class="opts">'+
      order.map(function(o, j){ return '<button data-j="'+j+'">'+"ABCD"[j]+'. '+x[1][o]+'</button>'; }).join("")+
      '</div><p class="why">'+x[3]+'</p></div>';
  }).join("") + '<div class="score" id="score"></div>';
}

function score(){
  var el = $("score"); if (!el) return;
  var n = card.querySelectorAll(".mcq").length, d = card.querySelectorAll(".mcq.done").length, ok = card.querySelectorAll(".mcq.ok").length;
  el.innerHTML = '<span>Answered <b>'+d+' / '+n+'</b> · Correct <b>'+ok+'</b></span>' + (d ? '<button id="retry">Retry</button>' : '');
}

card.addEventListener("click", function(e){
  if (e.target.id === "retry") { go(cur); return; }
  var b = e.target.closest(".opts button"); if (!b) return;
  var m = b.closest(".mcq"); if (m.classList.contains("done")) return;
  var a = +m.dataset.a, j = +b.dataset.j;
  m.classList.add("done");
  m.querySelectorAll(".opts button")[a].classList.add("right");
  if (j === a) m.classList.add("ok"); else b.classList.add("wrong");
  score();
});

function buildNav(){
  var start = 0, html = "";
  M.forEach(function(m, mi){
    html += '<button data-i="'+start+'" data-m="'+mi+'"><span class="n">'+mi+'</span><span>'+m.t+'</span><span class="c">'+m.c.length+'</span></button>';
    start += m.c.length;
  });
  list.innerHTML = html;
  list.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ go(+b.dataset.i); nav.classList.remove("open"); };
  });
}

function go(i){
  cur = Math.max(0, Math.min(flat.length - 1, i));
  var f = flat[cur], m = M[f.mi], c = m.c[f.ci];
  card.innerHTML = "<h2>" + c.t + "</h2>" + (c.h || "") + (c.q ? quiz(c.mix ? shuffle(c.q.slice()) : c.q) : "");
  score();
  $("mod").textContent = m.t;
  $("count").textContent = (f.ci + 1) + " / " + m.c.length;
  $("bar").style.width = ((cur + 1) / flat.length * 100) + "%";
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === flat.length - 1;
  list.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", +b.dataset.m === f.mi); });
  try { localStorage.setItem("hul320e-pos", cur); } catch(e){}
  history.replaceState(null, "", "#" + cur);
  window.scrollTo(0, 0);
}

$("prev").onclick = function(){ go(cur - 1); };
$("next").onclick = function(){ go(cur + 1); };
$("menu").onclick = function(){ nav.classList.toggle("open"); };
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "Escape") nav.classList.remove("open");
});
$("theme").onclick = function(){
  var r = document.documentElement, t = r.getAttribute("data-theme");
  var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("hul320e-theme", r.getAttribute("data-theme")); } catch(e){}
};
try { var th = localStorage.getItem("hul320e-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch(e){}

buildNav();
go(cur);
</script>
