["According to Keen, how did Nordhaus misuse Lenton et al. (2008)?",
 ["He cited it for tipping points above 6°C, though Lenton's survey studied only 2°C","He said it supports smooth damages; Lenton warns against them","He used its economic estimates without crediting Lenton's team","He ignored its finding that the Amazon is the greatest threat"],1,

["When he began, what did Keen expect the main source of Nordhaus's low damage estimates to be, and what did he find instead?",

/* ───────────────────────── 10. FOSTER, CLARK & YORK (2009) ───────────────────────── */
M.push({t:"The Midas Effect (Foster, Clark & York 2009)", c:[
{t:"The claim", h:`
<p><b>Where this fits.</b> Stern (Module 8) wants better economics; Keen (Module 9) wants honest data. Foster et al. go furthest: they say the whole project of putting a money value on nature, which Goodwin's valuation methods (Module 1) and Nordhaus's CBA (Module 6) depend on, is the mistake.</p>
<p>John Bellamy Foster, Brett Clark &amp; Richard York, <i>Development and Change</i> (2009). It is a <b>Marxist ecological critique</b>: it locates the cause of environmental damage in capitalism itself, an economy driven by firms competing to accumulate profit.</p>
<ul>
<li>Mainstream climate economics fails to address the <b>root cause, the capitalist global economy</b>.</li>
<li>It falls for <b>"the Midas Effect"</b>: the belief that <b>ecological values can be converted into economic values</b>.</li>
<li>CO₂ must come down to <b>350 ppm</b> (parts per million, Module 0).</li>
<li>The cure is an <b>ecological revolution</b>: replace capitalism with a system aimed at meeting human needs sustainably, not at capital accumulation.</li>
</ul>
<div class="key">Where Stern says <i>change economics</i> and Keen says <i>fix the data</i>, Foster et al. say <i>change the system</i>.</div>`},
{t:"The 350 imperative", h:`
<ul>
<li>Global carbon emissions grew <b>0.9%/yr in the 1990s</b> and <b>3.5%/yr after 2000</b>, beyond the range the IPCC projected in its 2007 report.</li>
<li>CO₂ rose from <b>280 ppm</b> (pre-industrial) to <b>387 ppm</b> at the time of writing (2009), adding about 2 ppm a year. The 2026 slides update this to <b>428 ppm in 2026</b>.</li>
<li><b>450 ppm</b> used to be called the danger line, but it is now seen as too high because models missed <b>slow feedbacks</b>: processes that take decades to kick in but then amplify warming (melting ice sheets, soils releasing carbon, thawing tundra releasing methane).</li>
<li><b>James Hansen</b> (NASA): CO₂ must be "at most <b>350 ppm</b>" to keep a planet like the one civilisation grew up on. We are already past it, so this is a "planetary emergency".</li>
<li>Feedbacks under way include tundra methane, Amazon die-back and melting ice exposing darker land and sea, which absorb more sunlight than white ice and so warm faster.</li>
</ul>
<p><b>Why capitalism?</b> Competition forces every firm to grow and reinvest. Capital is "self-expanding value" and doesn't recognise the notion of <b>enough</b>. Schumpeter: "stationary capitalism would be a <i>contradictio in adjecto</i>" (a contradiction in terms).</p>`},
{t:"Stern and Nordhaus as the 'limits of variance'", h:`
<div class="vs">
<div><h3>Stern (2007)</h3><ul><li>Stabilise at <b>550 ppm CO₂e</b> (all greenhouse gases as CO₂-equivalent; about 480 ppm of CO₂ alone), giving <b>3–4°C</b></li><li>Lower targets are "unlikely to be economically viable"</li><li>"Difficult to secure emission cuts faster than about <b>1% a year</b> except in instances of recession"</li></ul></div>
<div><h3>Nordhaus (2008)</h3><ul><li>A <b>"climate-policy ramp"</b>: modest cuts now, more later</li><li>"Optimal path" peaking at about <b>700 ppm by 2175</b></li><li>Nearly <b>6°C</b> of warming</li></ul></div>
</div>
<p>Both are seen as pro-environment, and both lead to targets scientists consider catastrophic. The carbon level is set "<b>not by ecological considerations</b> … but by what the present economic system will permit".</p>
<div class="tip">Note the dates. This critique targets the <b>2007 Stern Review</b>. By 2022 Stern backs 1.5°C (Module 8), so if you're asked to compare the two Sterns, point that out.</div>`},
{t:"The myth: Midas and the three transmutations", h:`
<p>In Ovid's <i>Metamorphoses</i>, Bacchus grants King <b>Midas</b> of Phrygia his wish that everything he touches turns to gold (a reward for helping the satyr Silenus). Twigs, stones, earth and wheat all become gold, and so do his food and drink. In one version his <b>daughter</b> too. He begs to be freed and afterwards worships <b>Pan</b>, god of nature.</p>
<p>Mainstream economists think environmental limits can be overcome by <b>three transmutations</b>:</p>
<ol>
<li><b>Universal substitutability</b>: nothing in nature is irreplaceable or irreversible. Solow: "the world can, in effect, get along without natural resources, so exhaustion is just an event, not a catastrophe." Julian Simon: "copper and oil come out of our minds". This is the <b>weak sustainability</b> hypothesis: sustainability only requires that total capital (human-made plus natural) doesn't fall, because one can replace the other.</li>
<li><b>Dematerialisation</b>: decoupling GDP from resource use, a "weightless economy". So far illusory, because efficiency gains expand the scale of production. This is the <b>Jevons paradox</b>: making a resource more efficient to use makes it cheaper, so total use goes <i>up</i>. (Naudé uses it too, Module 12.)</li>
<li><b>Natural capital</b>: put a price on all of nature (Hawken &amp; Lovins). Treating forests as board-feet of timber hasn't saved forests. Price tags subsume nature to profit.</li>
</ol>
<p>David Pearce defined sustainable development as "continuously rising, or at least non-declining consumption per capita, or GNP". So "nature simply disappears. Only money matters."</p>
<div class="key">The Midas Effect is the inability to recognise <b>intrinsic values and critical thresholds</b> in nature. Altvater: the commodity economy "is narcissistic: it sees only itself reflected in gold".</div>`},
{t:"A revolution for 'enough'", h:`
<p>Epicurus: "Nothing is enough to someone for whom enough is little." Marx: the goal should be sustainable human development for "successive generations". Speth: "Capitalism as we know it today is incapable of sustaining the environment." Sweezy: we need "a reversal, not merely a slowing down".</p>
<p><b>Elementary triangle of ecology</b> (echoing Chávez's "elementary triangle of socialism"):</p>
<ol><li><b>Social use, not ownership,</b> of nature</li><li><b>Rational regulation</b> of the "metabolism between humans and nature" (Marx's phrase for the flows of materials and energy between society and the Earth) by the "associated producers", i.e. by workers and communities collectively rather than by capital</li><li><b>Meeting communal needs</b> of present and future generations</li></ol>
<p>That calls for a "green cultural revolution" redefining needs around community, equality and sustainability.</p>`},
{t:"Transition strategies they accept & reject", h:`
<div class="vs">
<div><h3>Rejected (they fit the Midas Effect)</h3><ul><li><b>Cap and trade</b>: "accomplished little", with buy-outs that record cuts while emissions rise</li><li><b>Techno-fixes</b> as a <i>deus ex machina</i>: Thomas Friedman's "cheap electrons", Easterbrook's terraforming Mars</li></ul></div>
<div><h3>Supported</h3><ul><li><b>Hansen's carbon tax</b> at the well-head and point of entry, with <b>100% of revenue returned as monthly per-capita dividends</b> (children get half shares). It bypasses market and state and redistributes toward small footprints</li><li><b>Moratorium on new coal plants</b> ("death factories"), and closing existing ones</li><li><b>Contraction &amp; convergence</b></li></ul></div>
</div>
<p><b>Contraction &amp; convergence</b>: Agarwal &amp; Narain (1991) proposed <b>equal per-capita</b> emissions rights against "carbon imperialism". Athanasiou &amp; Baer (2002): the North <b>contracts</b>, while the South may grow emissions only up to a fair per-capita level, converging on "equal and low" allotments consistent with 350 ppm. The North pays its <b>ecological debt</b> (what it owes for having used far more than its share of the atmosphere), cutting close to 100% and funding mitigation and adaptation in the South.</p>
<p>Finally: reaching 350 ppm needs a social transformation as large as history's great revolutions, changing productive <b>relations</b> (who owns and controls production) as well as productive forces (technology). Mumford's "organic person", Daly &amp; Cobb's community, Babeuf's "society of equals", Leopold's "land ethic". In their words, "the fall of Midas".</p>
<div class="kim">Compare the dividend designs. <b>Hansen</b>: cash per head. <b>Earth Atmospheric Trust</b> (Goodwin): global auction with per-head dividend. <b>Azad &amp; Chakraborty</b> (Module 15): revenue funds clean investment plus free energy in kind.</div>`},
{t:"Quiz: Midas Effect", q:[
["What do Foster, Clark & York mean by the 'Midas Effect'?",
 ["Rising fossil-fuel profits that crowd out investment in renewables","Belief that ecological values can become economic values","Rich countries hoarding gold reserves instead of funding adaptation abroad","The tendency of carbon prices to rise faster than inflation"],1,
 "A set of 'transmutation myths' or ecological alchemy: substitutability, dematerialisation, natural capital."],
["Which is not one of the three transmutations the authors attribute to mainstream economics?",
 ["Universal substitutability of natural resources","Dematerialisation, or decoupling output from resource use","Converting nature into priced natural capital","Contraction and convergence of national emissions"],3,
 "Contraction and convergence is a strategy the authors support, not a transmutation they criticise."],
["The authors say dematerialisation has so far proven illusory mainly because of",
 ["the Jevons paradox (rebound into more output)","the slow diffusion of digital, 'weightless' technologies across developing countries","the high cost of renewable energy compared with coal","the failure of governments to measure material flows"],0,
 "Under capitalism, efficiency savings are used to expand the system, outweighing any dematerialising tendency."],
["According to the article, the Stern Review (2007) proposed stabilising greenhouse gases at about",
 ["350 ppm CO₂, in line with Hansen","450 ppm CO₂e, consistent with about 2°C","550 ppm CO₂e, implying roughly 3–4°C","700 ppm CO₂, peaking around 2175"],2,
 "550 ppm CO₂e. The 700 ppm by 2175 path is Nordhaus's 'optimal' ramp."],
["Why do the authors favour Hansen's carbon tax over cap and trade?",
 ["It is set by markets, so it adjusts automatically to new information","It returns all revenue as per-head dividends","It exempts developing countries, so it is fairer than permits","It guarantees a fixed quantity of emissions each year"],1,
 "100% of revenue goes back as monthly dividends, building a popular constituency and bypassing loopholes in carbon markets."],
["Under 'contraction and convergence', which countries may still increase emissions?",
 ["All countries, as long as they stay within the 450 ppm budget","Countries whose per-capita emissions are below the fair level","Only countries that have paid off their ecological debt","Countries that join a global carbon market by 2030"],1,
 "The South may grow up to the 'equal and low' per-capita allotment, while the North contracts toward zero."]
]}
]});

/* ───────────────────────── 11. SPIRIT OF GREEN CH 8 + RAWORTH ───────────────────────── */
M.push({t:"Sustainability & the doughnut (Nordhaus SoG 8; Raworth)", c:[
{t:"Green economics vs mainstream (Nordhaus, Spirit of Green Ch 8)", h:`
<p><b>Where this fits.</b> The critics so far attacked how Nordhaus values damage. This module steps back to the goal itself: what does it mean for an economy to be <b>sustainable</b>? First Nordhaus's own answer (from his 2021 book <i>The Spirit of Green</i>), then Raworth's alternative, the doughnut.</p>
<p><b>Green economics</b>, in the broad sense, is the economics of environment, pollution, climate and externalities, rooted in <b>Pigou</b>. A narrower school that calls itself "Green economics" (e.g. Michael Jacobs, <i>The Green Economy</i>) stresses market <i>and policy</i> failures and is sceptical that markets can deliver.</p>
<p><b>Mainstream view</b> (Nordhaus's own): environmental goods are normal goods with <b>market failures</b>. Price SO₂ properly and the economy then works fine.</p>
<p><b>Four shortcomings</b> Green economists find in the mainstream:</p>
<ol>
<li><b>Preferences ignore future generations</b>: they can't vote today's politicians out.</li>
<li><b>Discount rates are too high</b>, a "defective telescope" that makes the future look too small.</li>
<li><b>Public goods are underpriced</b>: the price of CO₂ is zero in most places. Nordhaus says this is a mainstream tenet too.</li>
<li><b>Sustainability is downplayed</b>.</li>
</ol>`},
{t:"Three ideas of sustainability", h:`
<table>
<tr><th>Version</th><th>What we owe the future</th></tr>
<tr><td><b>Weak</b> (Jacobs)</td><td>Guarantee the <b>avoidance of environmental catastrophe</b></td></tr>
<tr><td><b>Strong / maximal</b> (Jacobs)</td><td>Leave the opportunity for <b>environmental consumption at least equal</b> to ours</td></tr>
<tr class="hl"><td><b>Mainstream</b> (Solow, Nordhaus)</td><td>An <b>overall standard of living</b> at least as good as ours</td></tr>
</table>
<p>Nordhaus: the weak version is uncontroversial (but why only <i>environmental</i> catastrophe, and not wars or pandemics?). The maximal version privileges environmental over other consumption.</p>
<p><b>Origins</b>: forestry's <b>maximum sustainable yield</b> (the largest harvest sustainable indefinitely), later extended to minerals, soils, fisheries, aquifers, air, water and climate.</p>
<p><b>Brundtland Commission (1987)</b>: sustainable development is "development that meets the needs of the present without compromising the ability of future generations to meet their own needs."</p>
<p><b>Solow</b>: sustainability is <b>intergenerational egalitarianism</b>. Each generation must have "the option of being as well off as its predecessors". We owe posterity "not any particular thing", only the capacity for a good life. "We are not to consume humanity's capital, in the broadest sense."</p>
<div class="kim">Terminology clash: Foster et al. call Solow's substitutability view <b>"weak sustainability"</b>. Jacobs (in Nordhaus) uses "weak" to mean avoiding catastrophe. Say which sense you mean.</div>`},
{t:"Are we on a sustainable path? Substitution & red lines", h:`
<p><b>Solow's three questions</b>, with Nordhaus's answers:</p>
<ol>
<li><i>What is a living standard?</i> Broad, individual consumption, including leisure, culture and nature hikes.</li>
<li><i>Will the future be richer?</i> World per-capita output has grown about <b>2.2%/yr since 1900</b>. Christensen et al. (statistical model plus expert survey) project slightly above <b>2%/yr</b> to 2100.</li>
<li><i>Chance of decline?</i> Experts put about a <b>5%</b> probability on people in 2100 being worse off than in 2010. On threats, 4 experts named wars, 1 named catastrophic climate change, and <b>none named pandemics</b>.</li>
</ol>
<p><b>Substitution</b>: Solow says unique assets like Yosemite should be kept, but we can't "leave the world as we found it" in every particular. Resources are valued "<b>for what they do, not for what they are</b>". Trains replaced stagecoaches, toilets replaced outhouses, email replaced letters.</p>
<ul><li><b>Pure economic goods</b> (outhouses, kerosene lamps) carry no duty to preserve.</li><li><b>Inviolables</b>: Yosemite, sacred temples, free speech, voting, no slavery. Nobody but a market fundamentalist would sell Central Park "for a city of Trump Towers".</li></ul>
<p>Green economics treats some environmental assets as inviolable (species, pristine forests). Nordhaus is <b>cautious about red lines</b>: even for species and climate "societies cannot escape from weighing costs and benefits". He ends with <b>Jeffrey Sachs</b>: end poverty, social inclusion and environmental safety need "a shared moral impulse".</p>`},
{t:"Raworth: the doughnut", h:`
<p>Kate Raworth, <b>Oxfam Discussion Paper (Feb 2012)</b>, written for <b>Rio+20</b>. It combines two ideas:</p>
<ul>
<li><b>Planetary boundaries</b> (Rockström et al. 2009, Stockholm Resilience Centre: 29 scientists). For 9 Earth-system processes, such as climate, biodiversity and the nitrogen cycle, the scientists proposed a limit beyond which we risk abrupt, damaging change. Together they define a safe operating space for humanity.</li>
<li><b>Social boundaries</b>: Raworth's addition. A minimum of the things every person needs, below which people are deprived.</li>
</ul>
<p>Put the social floor inside the environmental ceiling and you get a ring: the doughnut.</p>
<figure class="dia"><svg viewBox="0 0 560 465" role="img" aria-label="Raworth doughnut: 11 social dimensions inside, 9 planetary boundaries outside, three already overshot"><circle cx="280" cy="230" r="150" class="f1"/><circle cx="280" cy="230" r="104" style="fill:var(--surface)"/><circle cx="280" cy="230" r="104" class="ink"/><circle cx="280" cy="230" r="150" class="ink"/><path class="f2" d="M238.1,42.6 A192,192 0 0 1 321.9,42.6 L312.7,83.6 A150,150 0 0 0 247.3,83.6Z"/><text x="280.0" y="24.0" text-anchor="middle" class="b">Climate change</text><path class="f2" d="M367.4,61.3 A190,190 0 0 1 430.9,114.6 L399.2,138.9 A150,150 0 0 0 349.0,96.8Z"/><text x="413.7" y="74.7" text-anchor="start" class="b">Nitrogen & phosphorus</text><text x="445.4" y="204.8" text-anchor="start" class="">Ocean acidification</text><text x="425.5" y="318.0" text-anchor="start" class="">Chemical pollution</text><text x="337.5" y="391.9" text-anchor="start" class="">Freshwater use</text><text x="222.5" y="391.9" text-anchor="end" class="">Land-use change</text><text x="134.5" y="318.0" text-anchor="end" class="">Aerosol loading</text><text x="114.6" y="204.8" text-anchor="end" class="">Ozone depletion</text><path class="f2" d="M122.7,109.8 A198,198 0 0 1 188.9,54.2 L211.0,96.8 A150,150 0 0 0 160.8,138.9Z"/><text x="141.2" y="68.5" text-anchor="end" class="b">Biodiversity loss</text><text x="280.0" y="156.0" text-anchor="middle" class="m" style="font-size:10.5px">Food</text><text x="322.2" y="168.4" text-anchor="middle" class="m" style="font-size:10.5px">Water</text><text x="351.0" y="201.6" text-anchor="middle" class="m" style="font-size:10.5px">Health</text><text x="357.2" y="245.1" text-anchor="middle" class="m" style="font-size:10.5px">Income</text><text x="338.9" y="285.1" text-anchor="middle" class="m" style="font-size:10.5px">Education</text><text x="302.0" y="308.8" text-anchor="middle" class="m" style="font-size:10.5px">Resilience</text><text x="258.0" y="308.8" text-anchor="middle" class="m" style="font-size:10.5px">Voice</text><text x="221.1" y="285.1" text-anchor="middle" class="m" style="font-size:10.5px">Jobs</text><text x="202.8" y="245.1" text-anchor="middle" class="m" style="font-size:10.5px">Energy</text><text x="209.0" y="201.6" text-anchor="middle" class="m" style="font-size:10.5px">Gender</text><text x="237.8" y="168.4" text-anchor="middle" class="m" style="font-size:10.5px">Equity</text><text x="280" y="234" text-anchor="middle" class="m">shortfall</text><text x="280" y="110" text-anchor="middle" class="a">safe &amp; just space</text><text x="280" y="455" text-anchor="middle" class="m">social foundation (inner ring) · ecological ceiling (outer ring) · orange = overshoot</text></svg><figcaption>Inner ring = social foundation, with its 11 dimensions written inside it; falling inside the ring means people lack them (shortfall). Outer ring = ecological ceiling, with the 9 planetary boundaries around it. Orange wedges = the three boundaries already overshot. The green ring between is the safe and just space.</figcaption></figure>
<ul>
<li><b>Social foundation</b>: 11 dimensions taken from governments' Rio+20 submissions (those mentioned by at least half of 80), grouped as <b>Well</b> (food, income, water and sanitation, health), <b>Productive</b> (education, jobs, energy, resilience) and <b>Empowered</b> (gender equality, social equity, voice). These are based on human rights (the UN's Universal Declaration of Human Rights, 1948).</li>
<li><b>Environmental ceiling</b>: 9 planetary boundaries. <b>At least three are already crossed: climate change, biodiversity loss, nitrogen.</b> Freshwater and land use are approaching their limits, and phosphorus may be crossed.</li>
<li>Both boundaries are <b>normative</b>: they involve value judgements (how much risk is acceptable, what counts as a decent minimum), not just scientific facts and matter from global to local scale. One difference: the Earth was once in the safe space (we must <i>return</i>), but humanity has never all been above the social foundation (we must <i>reach</i> it).</li>
</ul>`},
{t:"The numbers inside the doughnut", h:`
<div class="vs">
<div><h3>Below the social foundation</h3><ul><li>Undernourished <b>13%</b> (about 850 m; "nearly 900 m")</li><li>Below $1.25/day <b>21%</b> (1.4 bn)</li><li>No electricity <b>19%</b> (1.3 bn)</li><li>No clean cooking <b>39%</b> (2.7 bn)</li><li>No improved sanitation 39%; no essential medicines 30%</li><li>Parliament gender gap 77%</li></ul></div>
<div><h3>Beyond the ceiling (Table 2)</h3><ul><li>CO₂: boundary <b>350</b>, current <b>387</b>, pre-industrial 280 ppm</li><li>Extinctions: boundary 10, current <b>&gt;100</b> per million species per year</li><li>Nitrogen use: boundary 35, current <b>121</b> Mt/yr</li><li>Freshwater: boundary 4,000, current 2,600 km³</li><li>Cropland: boundary 15%, current 11.7%</li></ul></div>
</div>
<p><b>Ending poverty barely strains the planet:</b></p>
${bars([["Food for hungry",1],["Electricity for all",1],["End $1.25 poverty",0.2]],1.2,"%","")}
<p class="src">Share of global food supply / global CO₂ emissions / global income needed.</p>
<p><b>The rich do strain it:</b> <b>11%</b> of people emit about <b>50%</b> of carbon (while the poorest 50% emit 11%). The richest 10% hold <b>57%</b> of income and the poorest 20% hold 2%. The EU (7% of people) uses <b>33%</b> of the safe nitrogen budget, mostly for animal feed. High-income countries (16% of people) account for 64% of consumer spending.</p>`},
{t:"Interactions between the boundaries", h:`
<ol>
<li><b>Environmental stress worsens poverty</b>: climate impacts on food, water and health, worst for the poor and for women.</li>
<li><b>Poverty worsens environmental stress</b>: 2.7 bn people cook with biomass, causing about 1.5 m premature deaths a year, soot, CO₂ and deforestation.</li>
<li><b>Badly designed green policies worsen poverty</b>: <b>carbon-offset tree plantations</b> driving land and water grabs; <b>biofuels</b> (US, Canada, EU) pushing up food prices in 2007–09 and causing land grabs.</li>
<li><b>Badly designed anti-poverty policies worsen stress</b>: Chinese farmers using up to <b>3×</b> the nitrogen needed, with 20–50% leaking away.</li>
<li><b>Win–wins</b>: reproductive rights (11% of women have an unmet need for family planning), insulating homes against fuel poverty (UK), cutting the <b>one-third (1.3 bn t)</b> of food that is lost or wasted.</li>
</ol>
<p><b>Pressure ahead</b>: the middle class grows from under 2 bn to nearly 5 bn by 2030. Demand rises for water (+30%), food and energy (+50%). Inefficiency adds to it: Western consumers waste 222 m t of food, nearly sub-Saharan Africa's entire net production of 230 m t, and irrigation efficiency in India is only 25–40%. <b>Rebound effect</b>: efficiency alone isn't enough.</p>`},
{t:"What the doughnut changes", h:`
<ul>
<li><b>Integrated vision</b>: the social, environmental and economic dimensions are linked.</li>
<li><b>Refocused economics</b>: social and environmental stresses are <b>no longer "externalities"</b>. The boundaries are the <b>starting point</b>. The economy's aim is not growth for its own sake but bringing humanity into the doughnut.</li>
<li><b>Metrics beyond GDP</b>: natural (tonnes of carbon) and social (number of people hungry). The Stiglitz–Sen–Fitoussi Commission (2009, set up by France to look beyond GDP): policymakers are like "a pilot trying to steer without a reliable compass".</li>
<li>The doughnut sets <b>no limit on human well-being</b>.</li>
<li>Key open question: can GDP growth be harnessed to move into the doughnut, or is a different approach needed?</li>
</ul>
<p>Moving in requires <b>far greater equity</b> (the biggest cuts by the richest consumers) and <b>far greater efficiency</b> in turning resources into human needs.</p>
<div class="kim">The doughnut vs Nordhaus: <b>Nordhaus</b> balances costs and benefits to find an optimum. <b>Raworth</b> draws boundaries first, like Stern's guard-rail, and adds a social floor. Externality-based economics treats harm as a side effect; the doughnut treats it as the frame.</div>`},
{t:"Optional: Raworth's 'seven ways' (slides only)", h:`
<p><b>Optional.</b> The syllabus reading is the 2012 Oxfam paper. These two slides come from Raworth's later book, <i>Doughnut Economics</i>, so they're useful context but aren't quizzed.</p>
<p><b>Change the goal: from GDP to doughnut.</b> Set GDP growth aside and ask "what enables human beings to thrive?" The answer is a world where everyone lives with dignity, opportunity and community, within the planet's means. The slide notes that the GDP fixation has been used to justify extreme inequality and environmental destruction, so the 21st century needs a bigger goal: the doughnut.</p>
<table>
<tr><th>Seven ways to think like a 21st-century economist</th><th>From (20th century)</th><th>To (21st century)</th></tr>
<tr><td>1. Change the goal</td><td>GDP</td><td>The doughnut</td></tr>
<tr><td>2. See the big picture</td><td>Self-contained market</td><td>Embedded economy</td></tr>
<tr><td>3. Nurture human nature</td><td>Rational economic man</td><td>Social adaptable humans</td></tr>
<tr><td>4. Get savvy with systems</td><td>Mechanical equilibrium</td><td>Dynamic complexity</td></tr>
<tr><td>5. Design to distribute</td><td>"Growth will even it up again"</td><td>Distributive by design</td></tr>
<tr><td>6. Create to regenerate</td><td>"Growth will clean it up again"</td><td>Regenerative by design</td></tr>
<tr><td>7. Be agnostic about growth</td><td>Growth addicted</td><td>Growth agnostic</td></tr>
</table>
<div class="kim">Points 5 and 6 reject the <b>Kuznets</b> stories (inequality and pollution falling automatically as countries grow). Point 7 is why Raworth isn't simply "degrowth": she is agnostic about growth, not against it.</div>`},
{t:"Quiz: Sustainability & doughnut", q:[
["Solow's definition of sustainability requires that we leave future generations",
 ["at least the same physical stock of each natural resource we inherited","the capacity to live at least as well as we do","enough environmental services to avoid any catastrophe","a stable climate within 1.5°C of pre-industrial levels"],1,
 "It is intergenerational egalitarianism. We owe 'not any particular thing', which allows substitution between resources."],
["In Michael Jacobs's terms (as reported by Nordhaus), 'strong' or 'maximal' sustainability means",
 ["future generations are guaranteed to avoid any form of environmental catastrophe","at least our level of environmental consumption","total wealth including produced capital does not decline","all species existing today are preserved for future generations"],1,
 "Weak means avoiding catastrophe. Maximal means equal environmental consumption. The mainstream view is about overall living standards."],
["What did the Christensen et al. expert survey say about the biggest threat to future growth?",
 ["Most experts named pandemics, then climate change","Most named wars, one named climate, none named pandemics","Most named climate change, then financial crises","They agreed that no single threat could push growth below 2% a year"],1,
 "Four named wars and one climate catastrophe. Strikingly, none named pandemics, just before COVID."],
["Which three planetary boundaries does Raworth report as already crossed?",
 ["Climate change, ocean acidification and freshwater use","Climate change, biodiversity loss and nitrogen use","Biodiversity loss, ozone depletion and land-use change","Nitrogen use, phosphorus use and chemical pollution"],1,
 "Freshwater and land use are approaching their boundaries. Phosphorus may be crossed according to newer research."],
["According to Raworth, ending income poverty below $1.25 a day for 21% of people would require about",
 ["0.2% of global income","2% of global income","1% of the global food supply","a 1% rise in global CO₂"],0,
 "0.2% of income. The 1% figures refer to food for the hungry and electricity for all."],
["How do Raworth's social foundation and environmental ceiling differ?",
 ["The foundation is scientific while the ceiling is normative","Earth was once inside the ceiling; humanity never all above the floor","The ceiling applies locally, while the foundation is global","The foundation has nine dimensions while the environmental ceiling has eleven"],1,
 "Both are normative. The aim is to move back inside the ceiling and to reach the foundation for the first time."],
["Raworth's example of a green policy that pushed people below the social foundation is",
 ["fuel taxes in Europe raising commuting costs for poor rural households","carbon offsets and biofuels causing land grabs","solar subsidies benefiting mainly wealthy homeowners","nuclear phase-out raising electricity tariffs"],1,
 "Offsets and biofuels have displaced poor farmers, especially women, and contributed to the 2007–09 food crisis."]
]}

/* ───────────────────────── 12. NAUDÉ CH 4–5 ───────────────────────── */
M.push({t:"Green growth vs degrowth (Naudé 4–5)", c:[
{t:"Two camps", h:`
<p><b>Where this fits.</b> Modules 8–11 argued about how to value climate damage and what sustainability means. They all leave one question open, which Raworth stated outright: can the economy keep growing while its environmental impact shrinks? Naudé examines the two answers.</p>
<p>Wim Naudé (2023), <i>Economic Growth and Societal Collapse: Beyond Green Growth and Degrowth Fairy Tales</i>. Ch 4 is green growth, Ch 5 is degrowth.</p>
<div class="vs">
<div><h3>Cornucopians</h3><ul><li>Tech optimists</li><li><b>Reject</b> the Malthusian idea of limits to growth (after Thomas Malthus, who argued in 1798 that population would outrun food)</li><li>Argue for <b>green growth</b></li></ul></div>
<div><h3>Degrowthers</h3><ul><li>Take limits seriously</li><li>Want a planned cut in resource and energy use</li></ul></div>
</div>
<p>The book's title calls <b>both</b> "fairy tales". Naudé argues <b>neither</b> is a real solution.</p>`},
{t:"What is green growth?", h:`
<p><b>World Bank definition:</b> growth that is</p>
<ul>
<li><b>efficient</b> in its use of natural resources,</li>
<li><b>clean</b>: it minimises pollution and environmental impact,</li>
<li><b>resilient</b>: it accounts for natural hazards and the role of nature in preventing disasters.</li>
</ul>
<p><b>Policies:</b> decarbonise (switch away from fossil fuels); decouple growth from resources and carbon (explained two pages on); <b>circular production</b> (reuse and recycle materials instead of make-use-throw away); protect biodiversity; ban pollution.</p>
<p><b>Key tools:</b> steer technology towards <b>eco-innovation</b> (new products and processes that cut environmental harm), and "<b>get the prices right</b>": make polluting activities pay through carbon taxes and similar, i.e. the Pigouvian logic of Modules 1 and 7.</p>
<div class="kim">Green growth is close to what Nordhaus (Modules 3–7) and Stern (Module 8) recommend: keep growing, price carbon, innovate.</div>`},
{t:"Why green growth is politically attractive", h:`
<ul>
<li>It frames climate action positively, to overcome the <b>collective action problem</b> (everyone waits for others to act).</li>
<li>Countries can "<b>have their cake and eat it</b>": grow <b>and</b> shrink their footprint.</li>
<li>It promises jobs and growth, and says the shift "<b>pays for itself</b>".</li>
<li>Many "green finance" and "green industrialisation" plans have appeared.</li>
</ul>
<p><b>Risk:</b> <b>greenwashing</b>, which means business-as-usual dressed up as green.</p>`},
{t:"Eco-innovation and decoupling", h:`
<p>The bet: the right technology plus the right prices will let growth <b>decouple</b> from damage.</p>
<ul><li>Digitalisation is said to "dematerialise" the economy.</li><li>Green New Deal plans assume fossil fuels can be <b>fully replaced</b> by renewables.</li></ul>
<div class="vs">
<div><h3>Relative decoupling</h3><ul><li>Emissions grow, but <b>slower</b> than GDP</li><li>Less pollution <b>per dollar</b></li><li>Total pollution still rises</li></ul></div>
<div><h3>Absolute decoupling</h3><ul><li>Emissions and materials <b>fall</b> while GDP grows</li><li>What we actually need</li></ul></div>
</div>

<div class="key">Relative = slower rise. Absolute = actual fall. Green growth needs <b>absolute</b> decoupling.</div>`},
{t:"Evidence 1: energy", h:`
<p><b>Energy intensity</b> (energy used per $ of GDP) has fallen steadily since the 1970s. Green growth fans point to this as proof of decoupling.</p>

<p><b>But</b>: as GDP keeps growing, total energy use <b>keeps rising</b>. Efficiency per dollar improves, but there are more dollars.</p>

<p>Also, the economy overshoots Earth's limits in many <b>other resources</b> too, not just energy. So ecologists look at total <b>material throughput</b>.</p>`},
{t:"Evidence 2: materials (DMC)", h:`
<p><b>Domestic Material Consumption (DMC)</b> = raw materials extracted at home + physical imports − physical exports.</p>
<p>Energy is only one resource. Ecologists also track the total tonnage of materials the economy uses (metals, minerals, fossil fuels, biomass).</p>
<p><b>DMC/GDP</b> = kg of material used per $ of real GDP (GDP adjusted for inflation). A falling DMC/GDP means each $ of output uses less material: an efficiency gain, i.e. relative decoupling.</p>
<ul>
<li>Globally: 1.7 kg (1970) → 1.2 (2000) → 1.3 (2013) → 1.1 (2019). Mostly <b>stagnant</b> since 2000.</li>
</ul>

<ul>
<li>Some rich Western countries did better. <b>Netherlands:</b> 0.7 kg (1970) → 0.3 kg (2019).</li>
</ul>
<p><b>Problem with DMC:</b> it ignores <b>upstream "hidden" flows</b>. If you import a finished phone, DMC counts only the phone's weight, not the mining done abroad to make it.</p>`},
{t:"Evidence 3: material footprint", h:`
<p><b>Material Footprint (MF)</b> fixes this. It assigns all raw material extracted <b>anywhere in the world</b> to the country whose <b>final demand</b> caused it.</p>
<p><b>Netherlands:</b> DMC stayed flat, but MF rose with GDP until ~2008. Its "decoupling" was partly just moving extraction abroad.</p>
`},
{t:"Evidence 4: the world", h:`
<p>World material footprint rises with GDP. No absolute decoupling.</p>

<p>World CO₂ also rises with GDP.</p>

<p>The lines get a little flatter over time. That is <b>relative</b> decoupling only.</p>
<div class="key">There is only <b>limited evidence</b> of green growth (absolute decoupling) at the global level.</div>`},
{t:"Five criticisms of green growth", h:`
<ol>
<li><b>Not enough decoupling.</b> Little evidence of absolute decoupling, and the speed needed for climate targets seems impossible.</li>
<li><b>Costly</b>, with trade-offs against poverty reduction.</li>
<li><b>Jevons paradox.</b> Efficiency → lower prices → more demand → <b>more</b> total resource use. (E.g. efficient cars make driving cheaper, so people drive more.)</li>
<li><b>Can we replace fossil fuels?</b> Building renewables itself needs fossil fuels.</li>
<li><b>Can't last forever.</b> Using so much energy creates huge <b>waste heat</b>, whatever the technology: every use of energy ends up as heat, so endlessly growing energy use would eventually warm the planet even with zero carbon.</li>
</ol>
<div class="tip">Jevons paradox is a favourite exam point. Know the chain: efficiency → cheaper → more use. Jevons (1866) saw that more efficient coal engines <b>raised</b> coal demand. It's also called the <b>rebound effect</b>.</div>`},
{t:"Naudé's verdict on green growth", h:`
<ul>
<li>Green growth <b>cannot</b> stop the economy from overshooting planetary limits.</li>
<li>Relative decoupling is possible. It buys some time and cuts emissions a little.</li>
<li>But rebound (Jevons) effects can wipe out even those gains.</li>
<li>Some call green growth an <b>oxymoron</b> (a contradiction in terms).</li>
</ul>
<p>Why does the idea survive? Because growth suits powerful interests: profit-seeking corporations and accumulated wealth.</p>
<div class="key">We should "plan for a <b>post-growth</b> world". Degrowth is one proposal for that, examined next.</div>`},
{t:"What does degrowth mean?", h:`
<p>Degrowth, as defined on the slides and in Naudé Ch 5, is:</p>
<ul>
<li>A <b>planned</b> reduction in <b>energy and resource throughput</b></li>
<li>To bring the economy back into balance with the living world</li>
<li>While <b>reducing inequality</b></li>
<li>And <b>improving human well-being</b></li>
</ul>
<div class="key">Degrowth is <b>not primarily about reducing GDP</b>. It targets material and energy use.</div>
<p>But cutting throughput will likely slow GDP, or even shrink it. That must be managed <b>safely and justly</b>. Ecological impact matters more than GDP.</p>`},
{t:"Why use the word \"degrowth\"?", h:`
<ul>
<li>It sounds negative, on purpose. It is <b>provocative</b> and makes people question things.</li>
<li>It separates it clearly from green growth.</li>
<li>It challenges the idea that growth can go on forever.</li>
<li>It puts ecological limits at the centre of policy.</li>
</ul>
<p><b>What "growth" hides:</b></p>
<ul>
<li>Rising material and energy use</li>
<li>Elite accumulation and <b>commodification</b> (turning things into things you must buy) dressed up as neutral "growth". Who would oppose growth?</li>
<li>Appropriation of labour and nature</li>
</ul>
<p>Degrowth calls for <b>disaccumulation</b> (less piling up of wealth) and <b>decommodification</b> (more things provided free, outside the market).</p>`},
{t:"Degrowth is NOT a recession", h:`
<div class="tw"><table>
<tr><th>Degrowth</th><th>Recession</th></tr>
<tr><td><b>Planned</b></td><td>Unplanned</td></tr>
<tr><td>Targets ecological impact and well-being</td><td>Just GDP falling</td></tr>
<tr><td><b>Selectively</b> cuts destructive production</td><td>Hits everything randomly</td></tr>
<tr><td>Healthcare, education, care can <b>expand</b></td><td>Can destroy important sectors</td></tr>
<tr><td>Expands public goods</td><td>Often comes with <b>austerity</b> (government spending cuts)</td></tr>
</table></div>`},
{t:"Degrowth policies", h:`
<p><b>Employment and inequality</b></p>
<ul>
<li>Shorter working week</li>
<li>Job guarantees and living wages</li>
<li>Retraining for workers leaving declining sectors</li>
<li>Progressive taxes and redistribution</li>
<li>Keep livelihoods safe even with less economic activity</li>
</ul>
<p><b>Public provision</b></p>
<ul>
<li>Expand universal public goods: healthcare, education, transport, housing</li>
<li>Less dependence on basic goods you must buy</li>
</ul>`},
{t:"Degrowth and the Global South", h:`
<ul>
<li>Degrowth is aimed mainly at <b>high-income countries</b> (the "Global North"), which emit far more than the poorer "Global South" of Asia, Africa and Latin America.</li>
<li><b>Poor countries may need more</b> energy and resources to develop.</li>
<li>Ecological damage hits the Global South hardest.</li>
<li>Northern consumption depends on Southern resources.</li>
</ul>
<p><b>Degrowth in the North = decolonisation</b>:</p>
<ul>
<li>Fair prices for Southern labour and resources</li>
<li>Less pressure to supply cheap labour and raw materials</li>
<li>More economic sovereignty and room for development policies in the South</li>
<li>Well-being, not GDP, as the goal</li>
</ul>`},
{t:"Criticism 1: degrowth may not work", h:`
<p><b>63%</b> of carbon emissions now come from <b>developing</b> countries, and that share will keep rising. Shrinking rich economies alone won't avoid overshoot.</p>
<p>Use the <b>IPAT identity</b>:</p>
<div class="eq">Impact = Population × Affluence × Technology</div>
<ul>
<li><b>I</b> = environmental impact (e.g. emissions), <b>P</b> = population, <b>A</b> = affluence (GDP per person), <b>T</b> = technology (impact per $ of GDP). Multiply them out and P and GDP per person give total GDP, and GDP × impact per $ gives total impact.</li>
<li>Degrowth cuts <b>A</b> (affluence, i.e. GDP), which lowers Impact.</li>
<li>But if <b>P</b> (population) keeps growing,</li>
<li>and <b>T</b> (technological innovation) slows down,</li>
<li>then the gain is <b>cancelled out</b>.</li>
</ul>`},
{t:"Criticism 2 and 3: dirty, and bad for the South", h:`
<p><b>Degrowth may be dirty:</b></p>
<ul>
<li>Less money to invest in mitigation and adaptation</li>
<li>Firms switch to <b>cheaper, dirtier</b> technology</li>
<li>Poorer households may turn to dirty fuels and deforestation</li>
</ul>
<p><b>Degrowth may hurt the poorest:</b></p>
<ul>
<li>If the North shrinks, who pays <b>climate reparations</b> and finance to the South?</li>
<li>Global South economies may <b>suffer through trade</b> as Northern demand falls.</li>
</ul>`},
{t:"Side by side", h:`
<div class="tw"><table>
<tr><th></th><th>Green growth</th><th>Degrowth</th></tr>
<tr><td>Core belief</td><td>Technology + right prices can decouple growth from harm</td><td>Infinite growth on a finite planet is impossible</td></tr>
<tr><td>Target</td><td>Keep GDP growing, cut emissions</td><td>Cut throughput; GDP may fall</td></tr>
<tr><td>Tools</td><td>Carbon tax, eco-innovation, renewables, green finance</td><td>Shorter work week, job guarantee, public goods, redistribution</td></tr>
<tr><td>Main criticism</td><td>No evidence of absolute decoupling; Jevons paradox</td><td>63% of emissions from South; can be "dirty"; hurts South via trade</td></tr>
</table></div>`},
{t:"Quick check", h:`
<details><summary>Relative vs absolute decoupling?</summary>Relative: emissions grow slower than GDP. Absolute: emissions fall while GDP grows. Green growth needs absolute; evidence shows mostly relative.</details>
<details><summary>Why is material footprint better than DMC?</summary>DMC ignores hidden upstream flows from imports. MF counts all extraction worldwide caused by a country's final demand. The Netherlands looks decoupled on DMC but not on MF.</details>
<details><summary>Explain the Jevons paradox.</summary>Efficiency makes a resource cheaper to use, so people use more of it. Total resource use can rise.</details>
<details><summary>How is degrowth different from a recession?</summary>Degrowth is planned, selective, and protects well-being and public services. A recession is unplanned, random, and often brings austerity.</details>`},
{t:"Exam angles on green growth vs degrowth", h:`
<ul>
<li><b>Link to Foster</b>: dematerialisation is one of the Midas "transmutations", and the Jevons paradox is their reason it fails. Naudé reaches a similar empirical verdict (mostly relative decoupling) without the anti-capitalist conclusion.</li>
<li><b>Link to Stern</b>: Stern is a green-growth optimist. He points to falling solar and battery costs and increasing returns, and says climate action is "the only sustainable story of growth".</li>
<li><b>Link to Raworth</b>: the doughnut is agnostic about growth. She asks whether GDP growth can be "harnessed" to move into the safe space.</li>
<li><b>Link to Pollin</b>: Pollin's India plan <i>is</i> green growth (6% GDP growth with 53% less CO₂), but for a low-emitting country. Degrowth targets high-income countries.</li>
<li><b>IPAT</b>: I = P × A × T. Green growth bets on T, degrowth on A. Naudé's critique of degrowth: P keeps rising and slower growth may slow T.</li>
</ul>
<div class="kim">Naudé's title calls <b>both</b> "fairy tales". Don't write that Naudé supports degrowth. He says we must plan for a post-growth world and that degrowth is one proposal, but he criticises it too.</div>`},
{t:"Quiz: Green growth vs degrowth", q:[
["A country's GDP grows 3% a year while its CO₂ emissions grow 1% a year. This is",

]}

/* ───────────────────────── 13. INPUT–OUTPUT (MAIR & DRUCKMAN) ───────────────────────── */
M.push({t:"Input–output analysis (Mair & Druckman)", c:[
{t:"What is it?", h:`
<p><b>Where this fits.</b> The next two modules make claims like "clean energy creates 290 jobs per $1 million" (Pollin) and "fuel and electricity carry 0.0135 t of CO₂ per $" (Azad). Both numbers come from input–output analysis, so learn the tool first. It needs a little matrix algebra; the next page covers all of it.</p>
<ul>
<li>Developed by <b>Wassily Leontief</b> (1936, 1966).</li>
<li>A tool to study how the <b>sectors</b> of an economy depend on each other.</li>
<li>At its core: a set of <b>linear equations</b>.</li>
<li>An <b>IO table</b> records the transactions between industries, for one region and one time period.</li>
</ul>
<p>Simple idea: to make a car, you need steel, which needs coal, which needs trucks... IO traces all these chains.</p>
<div class="key">IO is how Pollin counted <b>jobs</b> and Azad counted <b>carbon content</b>.</div>`},
{t:"The matrix algebra you need", h:`
<ul>
<li>A <b>matrix</b> is a grid of numbers. A 2×2 matrix has 2 rows and 2 columns, e.g. A = [0.2 0.2; 0.3 0.1], where the semicolon separates the rows.</li>
<li>A <b>vector</b> is a single column of numbers, e.g. the outputs of each sector x = (x<sub>1</sub>, x<sub>2</sub>).</li>
<li><b>Multiplying a matrix by a vector</b>: each row of the matrix times the vector, added up. [0.2 0.2; 0.3 0.1] × (100, 200) = (0.2·100 + 0.2·200, 0.3·100 + 0.1·200) = (60, 50).</li>
<li><b>Identity matrix I</b>: 1s on the diagonal, 0s elsewhere, [1 0; 0 1]. It is the matrix version of the number 1: I × x = x.</li>
<li><b>Inverse</b> M<sup>−1</sup>: the matrix that "undoes" M, so M<sup>−1</sup>M = I. It is the matrix version of dividing. For 2×2: [a b; c d]<sup>−1</sup> = (1/(ad − bc)) × [d −b; −c a].</li>
<li><b>Transpose</b> (the prime ′): u′ turns a column vector u into a row. u′x then means u<sub>1</sub>x<sub>1</sub> + u<sub>2</sub>x<sub>2</sub> + …, a single number.</li>
</ul>
<div class="tip">In the exam you'll only ever need a 2×2 inverse. Always check it by multiplying back.</div>`},
{t:"Reading an IO table", h:`
<p>A made-up 3-sector economy ($):</p>
<div class="tw"><table>
<tr><th></th><th class="r">Agri</th><th class="r">Manuf</th><th class="r">Services</th><th class="r">Final demand</th><th class="r">Total output</th></tr>
<tr><td><b>Agriculture</b></td><td class="r blk">60</td><td class="r blk">40</td><td class="r blk">100</td><td class="r">20</td><td class="r"><b>220</b></td></tr>
<tr><td><b>Manufacturing</b></td><td class="r blk">80</td><td class="r blk">30</td><td class="r blk">150</td><td class="r">30</td><td class="r"><b>300</b></td></tr>
<tr><td><b>Services</b></td><td class="r blk">50</td><td class="r blk">180</td><td class="r blk">40</td><td class="r">15</td><td class="r"><b>295</b></td></tr>
<tr><td>Value added</td><td class="r">30</td><td class="r">50</td><td class="r">5</td><td></td><td></td></tr>
<tr><td><b>Total inputs</b></td><td class="r"><b>220</b></td><td class="r"><b>300</b></td><td class="r"><b>295</b></td><td></td><td></td></tr>
</table></div>
<ul>
<li><b>Row</b> = what a sector <b>sells</b> (its outputs). Agriculture sells 40 to manufacturing.</li>
<li><b>Column</b> = what a sector <b>buys</b> (its inputs). Manufacturing buys 40 from agriculture.</li>
</ul>
<p>Example: to make a <b>wool jumper</b>, a clothing maker buys wool (agriculture), knitting machines (manufacturing), and banking and insurance (services).</p>
<div class="kim"><b>A typo in the source.</b> Mair &amp; Druckman's Table 1 is reproduced exactly. The agriculture row adds up (60 + 40 + 100 + 20 = 220), and all three columns add up. But the manufacturing row sums to 290, not 300, and services to 285, not 295. The technical coefficients (two pages on) divide by the column totals, so they're unaffected. If you're asked for final demand, use y<sub>i</sub> = x<sub>i</sub> − (sum of row i's intermediate sales).</div>`},
{t:"Parts of the table", h:`
<p><b>Total inputs = total output</b> for every sector. Why? It is an <b>accounting identity</b>. If farming output is worth 220, that 220 must show up somewhere as spending on inputs or value added.</p>
<p>Inputs come in two kinds:</p>
<ul>
<li><b>Intermediate inputs</b>: bought from other sectors and used up in production (the shaded 3×3 block in the table).</li>
<li><b>Factors of production</b>: inputs <b>not</b> from other sectors. Shown as <b>gross value added</b>.</li>
</ul>
<p><b>Value added</b> is a <b>residual</b>: total output minus intermediate inputs. It equals payments to labour (wages), capital (profits), government (taxes) and imports.</p>
<p><b>Final demand</b>: buyers <b>outside</b> the production cycle who buy for their own use, not to make something else. Household consumption, investment, government purchases, net exports.</p>`},
{t:"Writing it as equations", h:`
<ul>
<li><b>z<sub>ij</sub></b> = sales from sector i to sector j. E.g. z<sub>12</sub> = agriculture → manufacturing.</li>
<li><b>y<sub>i</sub></b> = final demand for sector i's goods</li>
<li><b>x<sub>i</sub></b> = total output of sector i</li>
</ul>
<p>Output = sum across the row:</p>
<div class="eq">x<sub>1</sub> = z<sub>11</sub> + z<sub>12</sub> + z<sub>13</sub> + y<sub>1</sub><br>x<sub>2</sub> = z<sub>21</sub> + z<sub>22</sub> + z<sub>23</sub> + y<sub>2</sub><br>x<sub>3</sub> = z<sub>31</sub> + z<sub>32</sub> + z<sub>33</sub> + y<sub>3</sub></div>
<p>In matrix form:</p>
<div class="eq">x = Zi + y</div>
<p><b>Z</b> = the 3×3 block of z<sub>ij</sub> values, <b>x</b> and <b>y</b> = the columns of outputs and final demands, and <b>i</b> = a column of 1s. Multiplying Z by i just adds up each row.</p>`},
{t:"Leontief production function: 3 assumptions", h:`
<p>A production function links inputs to the maximum output. To unlock IO, we assume:</p>
<ol>
<li><b>Fixed proportions</b>: inputs are used in a fixed recipe. No swapping one input for another. No efficiency change (constant technology).</li>
<li><b>Linear</b>: double the output → double the inputs. <b>No economies of scale</b>. (This is a limitation.)</li>
<li><b>One homogeneous good per sector</b>: each sector makes one "average" product, sold to everyone.</li>
</ol>
<p>These often don't hold exactly. But they give a good <b>approximate</b> picture of average links between sectors.</p>`},
{t:"Technical coefficients", h:`
<p>Divide each input by the <b>output of the sector that buys it</b>:</p>
<div class="eq">a<sub>ij</sub> = z<sub>ij</sub> / x<sub>j</sub></div>
<p>Meaning: <b>how much input from sector i is needed to make $1 of output in sector j</b>.</p>
<p>Example, agriculture's column (x<sub>1</sub> = 220):</p>
<div class="eq">a<sub>11</sub> = 60/220 = 0.27<br>a<sub>21</sub> = 80/220 = 0.36<br>a<sub>31</sub> = 50/220 = 0.23</div>
<p>So $1 of farm output needs $0.27 of farm inputs, $0.36 of manufacturing, $0.23 of services.</p>
<div class="tw"><table>
<tr><th></th><th class="r">Agri</th><th class="r">Manuf</th><th class="r">Services</th></tr>
<tr><td>Agriculture</td><td class="r">0.27</td><td class="r">0.13</td><td class="r">0.34</td></tr>
<tr><td>Manufacturing</td><td class="r">0.36</td><td class="r">0.10</td><td class="r">0.51</td></tr>
<tr><td>Services</td><td class="r">0.23</td><td class="r">0.60</td><td class="r">0.14</td></tr>
</table></div>`},
{t:"Getting to the Leontief inverse", h:`
<p>Since z<sub>ij</sub> = a<sub>ij</sub>·x<sub>j</sub>, rewrite the equations:</p>
<div class="eq">x<sub>1</sub> = a<sub>11</sub>x<sub>1</sub> + a<sub>12</sub>x<sub>2</sub> + a<sub>13</sub>x<sub>3</sub> + y<sub>1</sub> &nbsp;(and same for x<sub>2</sub>, x<sub>3</sub>)</div>
<p>In matrix form, with <b>A</b> = matrix of technical coefficients and <b>I</b> = identity matrix:</p>
<div class="eq">x = Ax + y<br>y = (I − A)x<br><b>x = (I − A)<sup>−1</sup>y</b></div>
<p><b>(I − A)<sup>−1</sup></b> is the <b>Leontief inverse</b>.</p>
<div class="key">The Leontief inverse gives the <b>total output needed</b> (direct + indirect, along all supply chains) to meet a given final demand.</div>
<p>Change final demand y → see how much each sector's output must change.</p>`},
{t:"Extended IO: adding carbon", h:`
<p>Add a <b>satellite account</b>: an extra row under the table, in <b>physical units</b> (tonnes of carbon, hours worked). Governments usually don't compile these.</p>
<div class="tw"><table>
<tr><th></th><th class="r">Agri</th><th class="r">Manuf</th><th class="r">Services</th></tr>
<tr><td>Total output ($)</td><td class="r">220</td><td class="r">300</td><td class="r">295</td></tr>
<tr class="hl"><td>Carbon (tonnes)</td><td class="r">10</td><td class="r">20</td><td class="r">5</td></tr>
</table></div>
<p>Treat it like a factor of production. Carbon isn't really an "input", but it's a useful way to think: farming <b>could not</b> have produced its output without emitting this carbon.</p>
<p>Carbon per $ of output:</p>
<div class="eq">u<sub>j</sub> = e<sub>j</sub> / x<sub>j</sub> &nbsp;→&nbsp; u<sub>1</sub> = 10/220 ≈ 0.045, u<sub>2</sub> = 20/300 ≈ 0.067, u<sub>3</sub> = 5/295 ≈ 0.017</div>
<p><b>e<sub>j</sub></b> = sector j's emissions (the carbon row), <b>x<sub>j</sub></b> = its output, <b>u<sub>j</sub></b> = its emissions per $ of output (its <b>direct carbon intensity</b>).</p>`},
{t:"Total emissions from final demand", h:`
<div class="eq">c = u<sub>1</sub>x<sub>1</sub> + u<sub>2</sub>x<sub>2</sub> + u<sub>3</sub>x<sub>3</sub> = u′x</div>
<p>Plug in x = (I − A)<sup>−1</sup>y:</p>
<div class="eq"><b>c = u′(I − A)<sup>−1</sup>y</b></div>
<ul>
<li><b>y</b>: final demand for each sector</li>
<li><b>(I − A)<sup>−1</sup></b>: Leontief inverse, all the supply chains</li>
<li><b>u′</b>: emissions per unit of output, written as a row (the prime means transpose) so that u′x = u<sub>1</sub>x<sub>1</sub> + u<sub>2</sub>x<sub>2</sub> + u<sub>3</sub>x<sub>3</sub></li>
<li><b>c</b>: total emissions to satisfy that final demand</li>
</ul>
<div class="key">In words: final demand needs production across many sectors, which creates <b>direct and indirect</b> emissions. This is the standard environmentally extended IO model.</div>`},
{t:"Multipliers", h:`
<p>A <b>multiplier</b> = total impact per <b>$1 of final demand</b>.</p>
<p>Divide c by y:</p>
<div class="eq">m = u′(I − A)<sup>−1</sup></div>
<p>Each element of <b>m</b> tells you: spend $1 more on this sector → how much carbon is emitted across the whole economy.</p>
<p>Same trick for <b>jobs</b>. Let l′ = direct jobs per unit of output in each sector (jobs in the sector ÷ its output, written as a row):</p>
<div class="eq">m<sub>L</sub> = l′(I − A)<sup>−1</sup></div>
<ul>
<li><b>Direct</b> jobs: in the sector that gets the spending</li>
<li><b>Indirect</b> jobs: in its supply chain</li>
</ul>`},
{t:"Worked example: jobs", h:`
<div class="tw"><table>
<tr><th>Sector</th><th class="r">Direct</th><th class="r">Indirect</th><th class="r">Total per ₹1 crore</th></tr>
<tr><td>Agriculture</td><td class="r">20</td><td class="r">5</td><td class="r">25</td></tr>
<tr><td>Manufacturing</td><td class="r">10</td><td class="r">8</td><td class="r">18</td></tr>
<tr><td>Construction</td><td class="r">25</td><td class="r">10</td><td class="r">35</td></tr>
</table></div>
<p>Invest ₹100 crore in construction → 100 × 35 = <b>3,500 jobs</b>.</p>
<p>Split ₹100 crore across sectors:</p>
<div class="tw"><table>
<tr><th>Sector</th><th class="r">Investment</th><th class="r">× multiplier</th><th class="r">Jobs</th></tr>
<tr><td>Agriculture</td><td class="r">₹20 cr</td><td class="r">25</td><td class="r">500</td></tr>
<tr><td>Manufacturing</td><td class="r">₹30 cr</td><td class="r">18</td><td class="r">540</td></tr>
<tr><td>Construction</td><td class="r">₹50 cr</td><td class="r">35</td><td class="r">1,750</td></tr>
<tr class="hl"><td><b>Total</b></td><td class="r">₹100 cr</td><td class="r"></td><td class="r"><b>2,790</b></td></tr>
</table></div>
<div class="eq">ΔL = l′(I − A)<sup>−1</sup>Δy</div>
<p>Δ ("delta") means "change in": a change in final demand Δy causes a change in total jobs ΔL.</p>
<p>This is exactly how Pollin got "290 jobs per $1 million" for renewables.</p>`},
{t:"Quick check", h:`
<details><summary>What do rows and columns of an IO table show?</summary>Rows = a sector's sales (outputs). Columns = a sector's purchases (inputs).</details>
<details><summary>Why do total inputs equal total output?</summary>Accounting identity: every rupee of output value must be accounted for as intermediate inputs or value added (value added is the residual).</details>
<details><summary>What are the three Leontief assumptions?</summary>Fixed input proportions (constant technology), linear inputs–outputs (no economies of scale), one homogeneous good per sector.</details>
<details><summary>Calculate a<sub>21</sub> from the example.</summary>a<sub>21</sub> = z<sub>21</sub>/x<sub>1</sub> = 80/220 = 0.36.</details>
<details><summary>What does c = u′(I − A)<sup>−1</sup>y give you?</summary>Total (direct + indirect) emissions caused across all supply chains by a given final demand.</details>
<details><summary>₹40 cr in agriculture and ₹60 cr in construction: how many jobs?</summary>40×25 + 60×35 = 1,000 + 2,100 = 3,100 jobs.</details>`},
{t:"Practice: a 2-sector Leontief problem", h:`
<div class="prob"><b>Exam-style numerical</b>Two sectors, Energy (1) and Goods (2). Total outputs are x<sub>1</sub> = 100 and x<sub>2</sub> = 200. Inter-industry sales: z<sub>11</sub> = 20, z<sub>12</sub> = 40, z<sub>21</sub> = 30, z<sub>22</sub> = 20. Emissions: Energy 10 t, Goods 40 t.<br>(a) Find final demand. (b) Find A. (c) Find the Leontief inverse. (d) Find the carbon multipliers. (e) If final demand for Goods rises by 10, how do outputs and emissions change?</div>
<details class="work"><summary>Show worked solution</summary>
<ol>
<li><b>Final demand</b>: y<sub>1</sub> = 100 − 20 − 40 = <b>40</b>. y<sub>2</sub> = 200 − 30 − 20 = <b>150</b>.</li>
<li><b>A</b> (divide each column by that sector's output): a<sub>11</sub> = 20/100 = 0.2, a<sub>21</sub> = 30/100 = 0.3, a<sub>12</sub> = 40/200 = 0.2, a<sub>22</sub> = 20/200 = 0.1.
<div class="eq">A = [0.2 0.2; 0.3 0.1] &nbsp;&nbsp; I − A = [0.8 −0.2; −0.3 0.9]</div></li>
<li><b>Inverse</b>: det = 0.8×0.9 − (−0.2)(−0.3) = 0.72 − 0.06 = 0.66. Swap the diagonal, flip the signs of the off-diagonal, divide by det:
<div class="eq">(I − A)<sup>−1</sup> = (1/0.66)[0.9 0.2; 0.3 0.8] = [1.364 0.303; 0.455 1.212]</div>
Check: 1.364×40 + 0.303×150 = 100 ✓ and 0.455×40 + 1.212×150 = 200 ✓.</li>
<li><b>Carbon intensities</b>: u = (10/100, 40/200) = (0.1, 0.2). Multipliers m = u′(I − A)<sup>−1</sup>:
<div class="eq">m<sub>1</sub> = 0.1×1.364 + 0.2×0.455 = 0.227 &nbsp;&nbsp; m<sub>2</sub> = 0.1×0.303 + 0.2×1.212 = 0.273</div>
Check: 0.227×40 + 0.273×150 = 9.1 + 40.9 = 50 t = 10 + 40 ✓.</li>
<li><b>Δy<sub>2</sub> = 10</b>: Δx = (I − A)<sup>−1</sup>Δy = (0.303×10, 1.212×10) = (<b>3.03, 12.12</b>). Δc = m<sub>2</sub> × 10 = <b>2.73 t</b>. Energy output rises even though only Goods demand changed: that's the indirect effect.</li>
</ol></details>
<div class="tip">For a 2×2 inverse: [a b; c d]<sup>−1</sup> = (1/(ad − bc))·[d −b; −c a]. Always check your answer by multiplying back to get x.</div>`},
{t:"Quiz: Input–output", q:[
["In an input–output table, reading along a row tells you",
 ["what a sector buys from every other sector, including imports","what a sector sells","the value added generated by each sector","the emissions produced by each sector"],1,
 "Rows show sales (outputs). Columns show purchases (inputs)."],
["Sector 1 has total output 220 and buys 80 from sector 2. The technical coefficient a₂₁ is",
 ["0.36","0.27","2.75","0.80"],0,
 "a_ij = z_ij / x_j, so 80/220 ≈ 0.36: $0.36 of sector 2 input per $1 of sector 1 output."],
["Which is not one of the three Leontief production-function assumptions?",
 ["Inputs are used in fixed proportions","Output and inputs scale linearly with no economies of scale","Each sector produces a single homogeneous good","Firms substitute inputs when relative prices change"],3,
 "Leontief rules out substitution, which is the limitation flagged in the notes."],
["What does the Leontief inverse (I − A)⁻¹ show?",
 ["Only the direct inputs each sector buys from the other sectors","Total (direct + indirect) output needed per unit of final demand","The share of value added in each sector's output","The emissions per dollar of each sector's output"],1,
 "x = (I − A)⁻¹y traces every supply-chain round. Emissions come from adding u′."],
["Why is value added described as a 'residual' in an IO table?",
 ["It is estimated after removing imports from final demand","It is output minus intermediate inputs, so inputs equal output","It is whatever emissions remain after abatement","It is the part of final demand not met by domestic production"],1,
 "The accounting identity: total inputs (intermediate plus value added) equal total output."],
["Total emissions caused by final demand y are given by",
 ["c = u′y","c = u′(I − A)⁻¹y","c = (I − A)y","c = u′A(I − A)⁻¹y"],1,
 "u′ alone captures only direct emissions. The Leontief inverse adds the supply chain."],
["Jobs multipliers are 25 (agriculture) and 35 (construction) per ₹1 crore. Investing ₹40 cr in agriculture and ₹60 cr in construction creates",
 ["3,100 jobs","3,000 jobs","2,790 jobs","6,000 jobs"],0,
 "40×25 + 60×35 = 1,000 + 2,100 = 3,100."]
]}
]});

/* ───────────────────────── 14. POLLIN & CHAKRABORTY (2015) ───────────────────────── */
M.push({t:"Egalitarian green growth for India (Pollin)", c:[
{t:"The question", h:`
<p><b>Where this fits.</b> Naudé (Module 12) asked whether green growth is possible in general. Pollin &amp; Chakraborty ask it for one country, India, which emits little per person but is huge and growing fast. Their job numbers come from the input–output method of Module 13.</p>
<p>Robert Pollin &amp; Shouvik Chakraborty, <i>Economic &amp; Political Weekly</i> (EPW, 2015).</p>
<p>About <b>75%</b> of global GHG emissions are CO₂ from burning oil, coal and gas for energy. Replacing them raises a fear: what happens to growth and jobs?</p>
<p><b>Their question:</b> can India grow at a healthy rate, create <b>more jobs</b>, <b>and</b> cut CO₂ emissions dramatically, all at the same time?</p>
<p>If <b>no</b>, we must either (1) manage a trade-off between growth and climate, or (2) follow degrowth.</p>
<div class="key">Their answer: <b>yes</b>. A green growth path can create jobs and cut emissions.</div>`},
{t:"How urgent is it?", h:`
<ul>
<li><b>IPCC:</b> global GHG must fall <b>40% within 20 years</b> and <b>80% by 2050</b>.</li>
<li>Target: total emissions down to about <b>20 billion tonnes by 2035</b>.</li>
</ul>
<p>Projections for 2035 from the <b>IEA</b> (International Energy Agency):</p>
<div class="tw"><table>
<tr><th>Scenario</th><th class="r">Billion tonnes CO₂</th></tr>
<tr><td>Current policies</td><td class="r">43.4</td></tr>
<tr><td>New policies</td><td class="r">37.2</td></tr>
<tr><td>Low-carbon case (50% chance of meeting target)</td><td class="r">22.4</td></tr>
</table></div>`},
{t:"India in global perspective", h:`
<p>Energy and CO₂, 2012:</p>
<div class="tw"><table>
<tr><th></th><th class="r">Total CO₂ (bn t)</th><th class="r">CO₂ per person (t)</th></tr>
<tr><td>World</td><td class="r">31.6</td><td class="r">4.5</td></tr>
<tr><td>China</td><td class="r">8.2</td><td class="r">6.0</td></tr>
<tr><td>United States</td><td class="r">5.0</td><td class="r">16.1</td></tr>
<tr class="hl"><td>India</td><td class="r">2.0</td><td class="r"><b>1.6</b></td></tr>
</table></div>
<ul>
<li>13 countries emit over 10 t per person (average GDP per person $33,700). <b>They bear the main responsibility.</b></li>
<li>But India has a <b>huge population</b>. If it grows using fossil fuels, the world's chance of meeting the IPCC target is <b>close to zero</b>.</li>
<li>Global target ≈ <b>2.3 tonnes per person</b>.</li>
</ul>`},
{t:"Two options to cut emissions", h:`
<p>Most emissions come from burning fossil fuels for energy. To cut them while the economy keeps growing, India can either use less energy per unit of output, or get its energy from sources that don't emit. Pollin &amp; Chakraborty back both:</p>
<ol><li>Invest in <b>energy efficiency</b></li><li>Invest in <b>clean renewable energy</b></li></ol>
<p><b>Rejected options:</b></p>
<ul>
<li><b>Nuclear</b>: big environmental and safety concerns.</li>
<li><b>Carbon capture and storage (CCS)</b>: capture, transport and store CO₂. Not proven at commercial scale.</li>
</ul>
<p><b>India facts:</b></p>
<ul>
<li>2012: 75% of energy from non-renewables; only 1% from nuclear.</li>
<li>India imports most of its oil and gas. So renewables <b>cut emissions and imports</b>.</li>
<li>India has the 5th largest coal reserves and is the 3rd largest producer, yet still <b>imports</b> coal for steel and electricity.</li>
</ul>`},
{t:"Renewables: hopes and concerns", h:`
<p><b>Optimistic:</b> renewable costs are falling to parity with fossil fuels. India has good prospects for solar, wind and small hydro. Renewables plus efficiency could meet India's future electricity demand.</p>
<p><b>Concerns:</b></p>
<ul>
<li><b>Traditional biomass / wood burning</b> may be no better than fossil fuels.</li>
<li><b>Bioenergy</b> (bioethanol, biodiesel, biogas) can compete with food crops and push up food prices.</li>
<li><b>Large hydro dams</b> displace communities and disrupt irrigation, fisheries, livelihoods.</li>
<li><b>Small hydro</b> is better, but local ecological effects still need care.</li>
</ul>`},
{t:"Energy efficiency, industry, finance", h:`
<p><b>Efficiency, the low-hanging fruit:</b></p>
<ul>
<li><b>Household cooking</b> uses almost <b>one-third</b> of India's energy. Efficient stoves help a lot.</li>
<li>Building design, lighting, appliances</li>
<li>Rail freight, waterways, mass transit, fuel-efficient vehicles</li>
<li>Challenge: <b>high upfront costs</b></li>
</ul>
<p><b>Industrial policy:</b> India must build renewables equipment at home, not just import. It must also manage job losses in coal and oil.</p>
<p><b>Finance:</b> public and private investment, and <b>development banks</b> giving long-term loans on inclusive terms, not just for high returns.</p>`},
{t:"The programme", h:`
<div class="key">Invest an extra <b>1.5% of GDP every year for 20 years</b> in clean energy.</div>
<ul>
<li><b>1% of GDP</b> → clean renewable energy</li>
<li><b>0.5% of GDP</b> → energy efficiency</li>
<li>Assumes GDP grows <b>6% per year</b></li>
<li>3-year start-up delay before results show</li>
</ul>
<p>Total cost over 17 years: <b>$680 bn</b> (renewables) + <b>$340 bn</b> (efficiency) = <b>$1.02 trillion</b>.</p>
<p>Context: India's energy use rose from 12.6 to 31.2 quadrillion BTU (1990–2012), but slower than GDP. (A <b>BTU</b>, British thermal unit, is a unit of energy; <b>Q-BTU</b> = a quadrillion, 10<sup>15</sup>, of them.) <b>24.7%</b> of Indians had no electricity. The July 2012 blackout hit ~700 million people.</p>`},
{t:"Results vs business as usual (2035)", h:`
<div class="tw"><table>
<tr><th></th><th class="r">IEA current policies</th><th class="r">Clean energy plan</th></tr>
<tr><td>Total energy use (Q-BTU)</td><td class="r">67.7</td><td class="r">36.8</td></tr>
<tr><td>Clean renewables (Q-BTU)</td><td class="r">1.7</td><td class="r">5.1</td></tr>
<tr><td>Total CO₂ (bn tonnes)</td><td class="r">4.7</td><td class="r"><b>2.2</b></td></tr>
<tr class="hl"><td>CO₂ per person (tonnes)</td><td class="r">3.1</td><td class="r"><b>1.5</b></td></tr>
</table></div>
<ul>
<li><b>53% cut</b> in CO₂ vs current policies</li>
<li>1.5 t per person is <b>below the 2.3 t global target</b></li>
<li>Even with population rising 1.2 → 1.5 billion and 6% GDP growth</li>
<li>Comes from 30.9 Q-BTU of energy savings + 3.4 Q-BTU of new renewables</li>
</ul>`},
{t:"Jobs: how they counted", h:`
<p>They used <b>input–output (IO) tables</b> for India (Module 13) to count:</p>
<ul>
<li><b>Direct jobs</b>: in the sector that gets the money (e.g. installing solar panels)</li>
<li><b>Indirect jobs</b>: in the supply chain (e.g. making the glass and steel for the panels)</li>
</ul>
<p>Example: a firm spends $1 million on an energy project. IO tells us how much goes to wages, other inputs and profits, and so how many workers get hired.</p>
<p>They modelled: bioenergy, hydro, wind, solar, geothermal, building retrofits, industrial efficiency, grid upgrades. They compared these with coal and oil/gas.</p>`},
{t:"Jobs per $1 million spent", h:`
${bars([["Renewables",290],["Efficiency",230],["Fossil fuels",129]],300,"")}
<ul>
<li>Clean energy creates about <b>twice</b> as many jobs as fossil fuels (+109.8%).</li>
<li><b>Bioenergy</b> is the biggest job creator: ~624 jobs per $1m, mainly in agriculture.</li>
<li><b>Building retrofits</b> also create many jobs (~280), through construction.</li>
</ul>
<p>Two scenarios were run: domestic content stays stable, or imports rise 20%. Jobs are only <b>slightly lower</b> with more imports.</p>
<div class="key">Renewables ~290, efficiency ~230, fossil ~129 jobs per $1 million.</div>`},
{t:"Total jobs created", h:`
<p><b>At the start</b> (1.5% of GDP):</p>
<ul>
<li>Clean energy programme: <b>12 million</b> jobs (direct + indirect)</li>
<li>Same money on fossil fuels: <b>5.7 million</b></li>
<li><b>Net gain: 6.3 million jobs</b> (1.3% of India's 2010 workforce)</li>
</ul>
<p><b>After 20 years</b>, the answer depends on <b>labour productivity growth</b>: how fast output per worker rises. If each worker produces 5% more each year, the same spending needs fewer workers, so fewer jobs are created than if productivity grows 2.5% a year.</p>
<div class="tw"><table>
<tr><th>Productivity growth</th><th class="r">Jobs in Year 20</th><th class="r">% of labour force</th></tr>
<tr><td>2.5% a year</td><td class="r">23.9 m</td><td class="r">4.1%</td></tr>
<tr><td>5% a year</td><td class="r">14.7 m</td><td class="r">2.5%</td></tr>
<tr class="hl"><td>Midpoint</td><td class="r"><b>19.3 m</b></td><td class="r"><b>3.3%</b></td></tr>
</table></div>
<p>Rounded message: ~6 million extra jobs early, ~20 million by Year 20.</p>`},
{t:"Job quality, and why \"egalitarian\"", h:`
<p>Number of jobs is not everything. They also look at wages, working conditions, gender, formal vs informal work, education levels.</p>
<ul>
<li><b>Bioenergy</b> jobs are many, but mostly <b>low pay and poor conditions</b> in agriculture. New investment could raise productivity there.</li>
<li>Women's job chances depend on wider social inequalities.</li>
</ul>
<p><b>Why "egalitarian"?</b> The programme aims for:</p>
<ul><li>big CO₂ cuts <b>plus</b> more jobs</li><li>domestic industry to maximise jobs</li><li>affordable clean energy, inclusive finance, wider electricity access</li></ul>`},
{t:"Quick check", h:`
<details><summary>What is the core proposal?</summary>Invest an extra 1.5% of GDP a year for 20 years (1% renewables, 0.5% efficiency), with 6% GDP growth.</details>
<details><summary>What happens to emissions?</summary>53% below IEA current policies: 2.2 bn tonnes, 1.5 t per person, below the 2.3 t global target.</details>
<details><summary>Why does clean energy create more jobs?</summary>Per $1m, renewables create ~290 jobs and efficiency ~230, vs ~129 for fossil fuels. It's more labour-intensive. Net gain ≈ 6.3 m jobs at start, ~19.3 m by Year 20.</details>
<details><summary>Why are nuclear and CCS rejected?</summary>Nuclear has big safety and environmental risks. CCS is not proven at commercial scale.</details>`},
{t:"Slide extras: costs, sector jobs, open questions", h:`
<p><b>Renewables optimism</b> (slides): renewables could supply about 30% of global energy within 20 years ("we have reached that!"), with cost parity with non-renewables in 5–10 years. IRENA: onshore wind, hydro, geothermal and most biomass are already cost-comparable with fossil fuels in OECD countries.</p>
<p><b>Levelised cost of electricity (LCOE)</b>: the average cost per kWh over a plant's whole life, including building it, fuel and upkeep. It lets you compare a solar farm with a coal plant on one number.</p>
<table>
<tr><th>Levelised cost of electricity (US ¢/kWh, Table 3)</th><th class="r">India avg (range)</th><th class="r">US avg (range)</th></tr>
<tr><td>Large-scale hydro</td><td class="r">8 (3–12)</td><td class="r">9 (6–15)</td></tr>
<tr><td>Small-scale hydro</td><td class="r">5 (2–13)</td><td class="r">NA</td></tr>
<tr><td>Onshore wind</td><td class="r">8 (3–12)</td><td class="r">10 (6–9)</td></tr>
<tr><td>Bioenergy</td><td class="r">5 (1–20)</td><td class="r">12 (10–14)</td></tr>
<tr><td>Solar PV</td><td class="r">23 (8–37)</td><td class="r">15 (9–22)</td></tr>
</table>
<p>Renewables are mostly <b>cheaper in India</b> than in the US. Solar PV was the exception at the time.</p>
<table>
<tr><th>Jobs per $1 m, direct + indirect (Table 10, stable domestic content)</th><th class="r">Total</th></tr>
<tr><td>Bioenergy</td><td class="r"><b>623.8</b></td></tr>
<tr><td>Geothermal / hydro / solar / wind</td><td class="r">225.0 / 220.9 / 196.0 / 193.0</td></tr>
<tr><td>Weighted average, renewables</td><td class="r">291.7</td></tr>
<tr><td>Building retrofits / industrial efficiency / grid upgrades</td><td class="r">280.2 / 193.6 / 173.9</td></tr>
<tr><td>Weighted average, efficiency</td><td class="r">232.0</td></tr>
<tr><td>Coal / oil and natural gas</td><td class="r">137.2 / 121.1</td></tr>
<tr><td>Weighted average, fossil fuels</td><td class="r">129.1</td></tr>
</table>
<p>Summary (Table 11, domestic content declining): renewables 290, efficiency 230, clean energy total <b>270.9</b> (67% renewables, 33% efficiency), fossil 129.1, so clean energy is <b>+109.8%</b> relative to fossil fuels.</p>
<p><b>India in context</b> (Table 1, 2012): primary energy per person is 25 million BTU in India against 269.8 in the US, 85.4 in China and 74 for the world. Table 2 (2010): 60 countries emit ≤2.3 t CO₂ per head (average GDP per head $1,768), 74 emit ≤4.5 t ($3,058), and <b>13 emit over 10 t ($33,700)</b>.</p>
<p><b>Open questions raised in class</b>: what to do with existing coal mines, and whether to open new ones? LPG schemes and biofuels, given recent LPG price swings? Clean-energy "taxonomy" and a return to development banking?</p>`},
{t:"Exam angles on Pollin", h:`
<ul>
<li>A likely numerical: <b>jobs = spending × jobs per $1 m</b>. For example, $10 bn on renewables × 290 = 2.9 m jobs, against 1.29 m if the money went to fossil fuels.</li>
<li>Net jobs = clean-energy jobs − jobs lost from the fossil spending that is displaced. Their headline: 12 m − 5.7 m = <b>6.3 m</b>.</li>
<li>The emission result comes from <b>efficiency (30.9 Q-BTU saved)</b> far more than from new renewables (3.4 Q-BTU).</li>
<li>Why "egalitarian": jobs, domestic production, affordable clean energy, inclusive finance, wider electricity access.</li>
</ul>
<div class="kim">Pollin's 1.5% of GDP is the same scale Stern asks for (2–3 percentage points of GDP globally, Module 8). Azad &amp; Chakraborty (next module) ask how to pay for it fairly.</div>`},

]}
