<p><b>Reading the diagram</b>:</p>
<ul>
<li><b>Circles</b>: individual studies, compiled by <b>Richard Tol</b>. Most were done for 2.5°C, so they stack up at that temperature.</li>
<li><b>Orange line</b>: the <b>damage function</b> Nordhaus uses in his DICE model (next page). It runs through the middle of the studies.</li>
<li><b>Arrow at about 4°C</b>: the range from the IPCC's Third Assessment Report. It draws on the same studies, so it is an expert appraisal, not independent evidence.</li>
</ul>
<p><b>What it shows</b>:</p>
<ul>
<li>For the warming levels studied, impacts are "relatively small". The <b>largest</b> estimate is about <b>5%</b> of output (the top circle at 3°C).</li>
<li>Most-studied case: <b>2.5°C</b> (expected around 2070), with a central damage of about <b>1.5% of global output</b>.</li>
<li>Damages are <b>nonlinear and convex</b>: the line gets steeper as it goes right. Some studies find the first ~1°C <b>beneficial</b> (e.g. CO₂ helps crops grow). The <b>incremental cost at 3°C is about twice that at 2°C</b>.</li>
<li>Tipping points are <b>not</b> reliably included.</li>
</ul>
<div class="tip">If you're asked for "Nordhaus's headline damage number", say <b>1–5% of output for 3°C</b>. That compares with per-capita GDP rising <b>500–1,000%</b> over the same period in poor and middle-income countries, so it's roughly <b>one year's growth</b> spread over decades.</div>`},
{t:"The DICE model & IAMs (from the slides)", h:`
<p><b>Integrated assessment models (IAMs)</b> are computer models that join an economy to a climate. Economic activity → emissions → concentrations → warming → damages, which feed back to reduce output. They then search for the policy that makes the world best off.</p>
<p><b>DICE</b> = <b>D</b>ynamic <b>I</b>ntegrated model of <b>C</b>limate and the <b>E</b>conomy, Nordhaus's IAM. Its economic core is a standard growth model (the <b>Ramsey</b> model): a society chooses how much to consume and how much to save and invest each year to maximise the total well-being of present and future generations. DICE adds a climate module to that.</p>
<p>More on IAMs: They project emissions from population and growth, model temperature and sea level, convert future damages to present value, and find the optimal policy. The big three:</p>
<ul><li>Nordhaus's <b>DICE</b></li><li>Richard Tol's <b>FUND</b> (Climate Framework for Uncertainty, Negotiation and Distribution)</li><li>Chris Hope's <b>PAGE</b> (Policy Analysis for the Greenhouse Effect)</li></ul>
<p>They differ in regional detail and in how they handle uncertainty and adaptation.</p>
<p><b>Damage function</b>: a formula turning warming into lost output. A common form is</p>
<div class="eq">Ω(T) = 1 − c·T²</div>
<p>where <b>T</b> = warming in °C, <b>c</b> = a damage coefficient, and <b>Ω</b> (omega) = the fraction of output left after damages. With c = 0.0023 and T = 4, Ω = 1 − 0.0023 × 16 ≈ 0.963, so about 3.7% of output is lost. A lower <i>c</i> means less damage for the same warming. Nordhaus repeatedly <b>recalibrated <i>c</i> downward</b>, which is one of Keen's complaints (Module 9).</p>
<div class="kim">The slides also cover Nordhaus's 1993 JEP paper (DICE vs IPCC warming projections, the expert survey). That paper was mid-term reading and <b>isn't on the end-term list</b>, so it isn't covered here.</div>`},
{t:"A risk premium for the Climate Casino", h:`
<p>The damage estimates on the earlier pages cover only impacts we can identify and price. Nordhaus admits there is more risk than that, and uses the book's casino image to explain it. Think of each year of emissions as a <b>spin of a planetary roulette wheel</b>:</p>
<ul>
<li><b>Red or black</b> (ordinary uncertainty): fast or slow emissions growth; high or low <b>climate sensitivity</b> (how much warming a doubling of CO₂ causes); good or bad adaptation in the grain belts.</li>
<li><b>Zero</b>: big losses of species, ecosystems and landmarks like Venice.</li>
<li><b>Double zero</b> (the tipping points of Module 0): collapse of the West Antarctic Ice Sheet, permafrost melt, reversal of North Atlantic ocean currents, mass extinction in the oceans.</li>
<li>The wheel may also be "weird": we may not know the odds, there may be more losing pockets than we think, and impacts can compound. "The total climate impacts are more than the sum of the individual parts."</li>
</ul>
<p><b>What to do about it</b>: people pay insurance premiums to protect against unlikely but ruinous events. In the same way, Nordhaus suggests adding an <b>insurance (risk) premium</b> on top of the identified damages. Experts' suggestions range from very small to <b>doubling or tripling</b> the damage estimates.</p>`},
{t:"Reservations, and the 2°C verdict", h:`
<p>Nordhaus ends the chapter with his own warnings about the numbers.</p>
<ul>
<li>The estimates cover only <b>quantifiable, market or near-market</b> sectors: farming, real estate, forestry, health.</li>
<li>Many small plus-and-minus items are left out (less heating but more cooling, fewer winter coats, snowmaking for ski resorts, new Arctic harbours). Could they add up to "economic death by 1,000 climatic cuts"? Nordhaus thinks it unlikely.</li>
<li>Species and ecosystem losses are <b>doubly difficult</b>: the physical effects are complex <i>and</i> there are no reliable money values (Module 1's valuation problem).</li>
<li><b>Tipping points</b> are hard to forecast and lie outside markets. He compares them to "geophysical bank runs": like depositors suddenly all withdrawing from a bank, change can be sudden and self-reinforcing.</li>
</ul>
<p>So there are <b>areas of special concern</b> that the numbers don't capture: sea-level rise, stronger hurricanes, ocean acidification and biodiversity loss, plus tipping points.</p>
<p><b>What about 2°C?</b> At the Copenhagen climate summit (COP15, 2009) governments endorsed limiting warming to 2°C. Nordhaus says that target is "both too low and too high":</p>
<div class="vs"><div><h3>Too low</h3><p>given the modest damages identified so far and the high cost of getting there</p></div><div><h3>Too high</h3><p>if, as many earth scientists believe, we have already crossed dangerous tipping thresholds</p></div></div>
<p>Damages alone can't settle it. The way out is to <b>bring in the costs</b> of cutting emissions (Ch 15, Module 4) and balance the two (Ch 18, Module 6).</p>
<div class="kim">Nordhaus also predicts that today's poor countries will become <b>less</b> vulnerable as they get richer: China's and India's incomes rose almost 10× in 50 years, and another 50 years of that would bring them to about $50,000 per head, mostly in services. Critics (Stern, Keen) say this assumes away the damage itself.</div>`},

M.push({t:"Costs of slowing climate change (Nordhaus 15)", c:[
{t:"Four ways to cut emissions", h:`
<p><b>Where this fits.</b> Module 3 measured the <i>benefit</i> of acting: the damage we avoid. Ch 15 measures the <i>cost</i> of acting. Economists call cutting emissions <b>abatement</b>; the costs come up again in Module 6, where Nordhaus sets the two side by side.</p>
<ol>
<li><b>Slow economic growth</b>. This would lower living standards and is "really not in contention".</li>
<li><b>Change lifestyles</b>: curb carbon-intensive activities, e.g. don't fly around the world.</li>
<li><b>Low- or no-carbon technologies and fuels</b>: gas or wind instead of coal for power.</li>
<li><b>Burn fossil fuels but remove the CO₂</b> after combustion (capture).</li>
</ol>
<p>Climate policy should encourage <b>2, 3 and 4</b> across billions of people, firms and governments.</p>
<div class="key">"The central lesson from economics is that attaining the goals of climate-change policy, particularly the ambitious ones, will require substantial investments."</div>`},
{t:"The metric: $ per ton of CO₂ reduced", h:`
<p>To compare a new fridge with a new power plant, we need one common unit. Nordhaus uses the <b>cost per ton of CO₂ avoided</b>: the net extra money spent, divided by the tons of CO₂ not emitted. It is a price for <i>not</i> producing something, like paying to have rubbish carted away. Spend $1,000 to cut 10 t, and the cost is <b>$100/t</b>.</p>
<div class="prob"><b>Example 1 · new fridge</b>Costs $1,000 and saves $50/yr for 10 yrs, so the net cost is $500 (ignoring discounting). It emits 0.3 t less CO₂ per year, or 3 t over 10 years.<br>Cost = 500 / (0.3 × 10) = <b>$167 per ton</b>. It would be higher if discounted.</div>
<div class="prob"><b>Example 2 · gas instead of coal</b>Generating electricity from gas instead of an old coal plant changes running costs by 1¢ per kWh, and gas emits 0.5 t less CO₂ per 1,000 kWh.<br>Put both on the same 1,000 kWh: 1¢ × 1,000 = $10, and 0.5 t avoided.<br>Cost = $10 ÷ 0.5 t = <b>$20 per ton</b>.</div>
<p>That's a difference of about <b>8×</b> between the two options. Across billions of tons, choosing the cheapest options matters enormously.</p>
<div class="tip">Very likely as a Part 2 numerical. Formula: cost per ton = net cost ÷ tons avoided. Watch the units (cents/kWh → $ per 1,000 kWh).</div>`},
{t:"What the cost studies find", h:`
<ul>
<li>There are many <b>cheap</b> options, some with <b>negative cost</b> (discounted energy savings exceed the upfront cost).</li>
<li>Costs <b>rise steeply</b> as cuts deepen. A <b>10–20%</b> cut is cheap or even free; <b>80–90%</b> in a few years is extremely expensive.</li>
<li>There is <b>no silver bullet</b>, just countless options in every sector.</li>
<li>Don't ignore greenhouse gases other than CO₂. Replacing <b>CFCs</b> (chemicals once used in fridges and aerosol cans, phased out to protect the ozone layer) also cut warming.</li>
</ul>
<p><b>Where cuts should come from</b>: a US plan for a 40% cut in greenhouse-gas (GHG) emissions by 2030, modelled by the US Energy Information Administration (EIA), gets most of it from <b>coal</b>. Coal use falls <b>90%</b>, while oil and gas fall only about 5% each. Coal has the most CO₂ per $ of energy, and gas is a cheap substitute.</p>
<div class="kim">"Coal is king" for cheap reductions, but the policies governments like best (efficiency rules for cars and fridges) don't touch coal, and cutting coal meets "ferocious opposition".</div>`},
{t:"Bottom-up vs top-down (Fig 25)", h:`

<div><h3>Engineering / bottom-up</h3><ul><li>Looks at specific technologies (cars, furnaces, power plants)</li><li>Finds <b>negative-cost</b> options: about 15% cut while saving money, another ~15% cheap</li><li>Starts lower but rises <b>more steeply</b>, because it covers only a few dozen technologies and misses behaviour changes like not flying</li></ul></div>

<li>Agreed shape: modest cuts are cheap; <b>deeper cuts and shorter horizons</b> make costs rise sharply.</li></ul>`},

efficient (costs ×2)</text><path class="arr" d="M224.0,72.3 L314.0,72.3"/><text x="220.0" y="76.3" text-anchor="end" class="m">with 50%, no 2°C path exists</text></svg><figcaption>Redrawn from Nordhaus Fig 26. Participation = the share of world emissions covered by countries that join the policy. The dashed line doubles the 50% curve for inefficient policy.</figcaption></figure>
<ul>
<li><b>Utopian case</b> (100% participation, efficient, well timed, no exemptions): <b>2°C costs about 1.5% of world income</b>, about one year's growth. Going lower (1°C) is far more expensive.</li>
<li><b>50% participation</b> (countries with half of emissions join now, the rest next century): costs explode below 4°C, and <b>2°C becomes virtually impossible</b>, not just costly. Kyoto covered only <b>one-fifth</b> of emissions in 2012.</li>
<li><b>Inefficient policy</b> (a hodgepodge of rules, taxes, subsidies and exemptions) <b>doubles</b> costs. With 50% participation plus inefficiency, a 3.5°C target goes from 1.5% to <b>3%</b> of income, and 3¼°C from 4% to <b>8%</b>.</li>
<li><b>EMF-22</b> (the 22nd study of the Energy Modeling Forum, which runs many climate-economy models on the same question): with universal participation about half the models could reach 2°C. With partial participation <b>20 of 22</b> runs found it infeasible ("a horrible economic depression"). The highest cost estimate was <b>12×</b> the lowest.</li>
</ul>
<div class="key">Efficiency here means the same thing as in Module 1's two-firm diagram: <b>equal marginal abatement cost in every sector and country</b>. Participation matters because every region's cheap options must be used. If India cuts nothing, others must make costlier cuts.</div>
<p><b>Bottom line</b>: in an ideal world 2°C costs <b>1–2%</b> of world income a year. Realistically, perhaps <b>3°C</b> is achievable.</p>`},
{t:"Quiz: Costs", q:[
["A household spends $2,000 on insulation and saves $100 a year in energy for 10 years. It avoids 0.5 t of CO₂ a year. Ignoring discounting, what is the cost per ton?",
 ["$400 per ton","$200 per ton","$100 per ton","$40 per ton"],1,
 "Net cost = 2,000 − 1,000 = $1,000. Tons avoided = 0.5 × 10 = 5. $1,000 / 5 = $200 per ton."],
["Why do top-down models usually show no negative-cost options?",
 ["They measure only electricity, where all options are costly","They assume money-saving options would already have been adopted","They include behaviour changes, which always carry a cost","They are calibrated on years before efficient technology existed"],1,
 "In the economic view, if an option saved money firms would already use it, so policy isn't needed to make it happen."],
["Why does the bottom-up cost curve rise more steeply than the top-down one?",
 ["It counts climate damages on top of the abatement costs at each level","It covers few technologies and misses behaviour change","It uses a higher discount rate on future energy savings","It assumes that only half of all countries participate"],1,
 "Bottom-up studies cover a few dozen technologies and miss behaviour changes like not flying, which top-down models capture."],
["In Nordhaus's EIA example of a 40% US emissions cut by 2030, which fuel bears most of the reduction?",
 ["Petroleum, cut by about 90%","Coal, cut by about 90%","Natural gas, cut by about 50%","All three, cut by about a third each"],1,
 "Coal falls 90%, while oil and gas fall about 5% each. Coal has the most CO₂ per dollar of energy."],
["With efficient policy and full participation, roughly what does meeting 2°C cost according to DICE?",
 ["About 0.2% of world income","About 1.5% of world income","About 8% of world income","It is infeasible at any cost"],1,
 "About 1.5%, roughly a year's growth. It becomes virtually infeasible with 50% participation."],
["Which change raises the cost of a given temperature target the most in Nordhaus's analysis?",
 ["Moving from top-down to bottom-up cost estimates","Limited participation by countries","Switching from a carbon tax to cap-and-trade","Including non-CO₂ greenhouse gases"],1,
 "Low participation makes costs explode below 4°C and makes 2°C infeasible. Inefficiency doubles costs on top of that."],
["What does Nordhaus mean by an 'efficient' climate policy?",
 ["One that reaches the lowest possible temperature","Equal marginal abatement cost in every sector and country","One that relies mainly on energy-efficiency standards for appliances and cars","One where every country cuts emissions by the same percentage"],1,
 "Equalising marginal costs minimises total cost. Uniform percentage cuts don't do that."]
]}
]});

/* ───────────────────────── 5. CLIMATE CASINO CH 16 ───────────────────────── */
M.push({t:"Discounting (Nordhaus 16)", c:[
{t:"Why discounting matters so much", h:`
<p><b>Where this fits.</b> Module 4's costs come now; Module 3's damages come decades later. Before comparing them (Module 6) we need a way to put them in the same units. Module 0 introduced present value; this chapter is about which discount rate to use, the most argued-over number in climate economics.</p>
<p>Emission cuts are paid for <b>now</b>, while the benefit (avoided damage) arrives <b>decades later</b>: wind farm → less CO₂ → lower concentrations → less warming → less damage. So we need a way to compare money at different dates.</p>
<p><b>Mortgage analogy</b>: borrow $150,000 for 30 years at 6% and you repay <b>$323,759</b>. The extra $173,759 is the price of having the house now. Money is worth more today because it can be invested.</p>
<div class="eq">real interest rate = nominal rate − inflation &nbsp;&nbsp;(6% − 2% = 4%)</div>
<p>Climate economics always uses <b>real</b> rates.</p>
<div class="eq">PV = X / (1 + r)<sup>n</sup></div>
<p>X = an amount received n years from now; r = the real discount rate.</p>
<p><b>Bond example</b>: $1,000 (real) paid in 50 years, discounted at 4% → <b>$141</b> today, since $141 grows to $1,000 at 4% over 50 years. Add a <b>risk premium</b> if the seller might turn out to be Lehman Brothers rather than "Uncle Sam".</p>

{t:"Why interest exists", h:`
<ul>
<li>Why is $1 today worth more than $1 next year? Because <b>investment is productive</b>: factories, schooling, energy-saving appliances and software all yield more in the future. $100 of new capital yields roughly <b>4–20%</b> a year.</li>
<li>At 4%, $1 next year is worth $1/1.04 = $0.96 today.</li>
<li><b>Consumption</b> is the ultimate goal, in a broad sense: market goods, home-cooked meals, a swim in the ocean. Subtract pollution and add parks.</li>
<li>Climate policy trades <b>consumption today</b> (cut emissions, fly less) for <b>consumption tomorrow</b> (less damage, national parks preserved).</li>
</ul>`},
{t:"Prescriptive vs descriptive", h:`
<p>So what discount rate should climate policy use? Nordhaus says economists split into two camps.</p>
<div class="vs">
<div><h3>Prescriptive (ethical)</h3><ul><li>Start from what we <i>ought</i> to value</li><li>The <b>Stern Review</b>; also John Roemer's sustainability approach</li><li>It is unethical to count future people's <b>welfare</b> for less just because they live later</li><li>So use a very low rate on goods, about <b>1%</b></li></ul></div>
<div><h3>Descriptive (opportunity cost)</h3><ul><li>Start from what investments actually <i>earn</i></li><li><b>Nordhaus</b></li><li>The rate should equal the <b>real return on alternative investments</b>: homes, education, health, other carbon cuts, investing abroad</li><li>About <b>4%</b> real for the US, a bit higher elsewhere</li></ul></div>
</div>
<p><b>The key distinction</b>: discounting <b>goods</b> (money, consumption) is not the same as discounting <b>welfare</b> (how much people's well-being counts). Discounting welfare just for being in the future is called <b>pure time discounting</b>. You can refuse to do that, valuing every generation's well-being equally, and still discount goods, if future people will be <b>richer</b>: an extra $1,000 matters less to a richer person, and richer generations have a weaker ethical claim on today's resources.</p>
<p><b>Nordhaus's jab</b>: it makes no sense to put scarce money into wind farms yielding 1% when you could earn 5–10% elsewhere and use that to help the future.</p>
<p><b>Evidence on what investments earn</b>: US corporate capital about <b>6%</b> after tax, in real terms. Education 4–20%. Real estate 6–10%. Energy efficiency often over 10%, up to 20%.</p>
<div class="kim"><b>Stern's reply</b> (Module 8): "there is no serious ethical argument in favour of pure-time discounting". And the assumption that the future will be richer is <b>endogenous</b>: it depends on what we do now. If we wreck the climate, future generations may be <i>poorer</i>, and then the argument for discounting goods reverses. He also says market returns don't reflect ethical choices.</div>`},
{t:"Government rates & the growth assumption", h:`
<p><b>What governments actually use.</b> In the US, the <b>Office of Management and Budget (OMB)</b> tells federal agencies which rate to use in cost–benefit studies (Circular A-94). Its base case is <b>7%</b> real, called the "marginal pretax return on private investment". The alternative is <b>3%</b>, called the "social rate of time preference", roughly the real return on long-term government bonds.</p>
<p>Nordhaus calls the OMB's reasoning "<b>completely confused</b>". The 7% is the return on corporate investment, which is <i>risky</i> and often funded by borrowing. The 3% is a <i>risk-free</i> government rate. So the gap between them is mostly a <b>risk premium</b> (the extra return investors demand for bearing risk, also called the equity premium), not a difference between investment and consumption. Luckily, he says, both numbers are still reasonable to use.</p>
<p><b>The growth assumption.</b> Descriptive discounting assumes the economy keeps growing, so future people are richer (IT and biotech revolutions, poor countries catching up, globalisation). Nordhaus notes a consistency check: if growth stalled, the climate projections would be wrong too, because high warming comes from high growth. He reads post-2007 slow growth as weak demand, not a fall in productivity. Over the previous decade developing East Asia grew 8.5% a year per person, and sub-Saharan Africa 2.5%.</p>`},
{t:"The $10 m wind-farm calculation (Table 7)", h:`
<div class="prob"><b>Worked example</b>A $10 m wind investment today cuts climate damage by $100 m in 50 years. Is it worth it?
<table>
<tr><th>Discount rate</th><th class="r">PV of $100 m in 50 yrs</th><th>Net of $10 m cost</th></tr>
<tr><td>1%</td><td class="r">$60.8 m</td><td>+$50.8 m ✓</td></tr>
<tr class="hl"><td>4%</td><td class="r">$14.1 m</td><td>+$4.1 m ✓</td></tr>
<tr><td>7% (US government)</td><td class="r">$3.4 m</td><td><span class="neg">−$6.6 m ✗</span></td></tr>
<tr><td>10%</td><td class="r">$0.85 m</td><td><span class="neg">−$9.1 m ✗</span></td></tr>
</table>
4%: (1.04)<sup>−50</sup> = 0.141, so PV = $14.1 m &gt; $10 m and the project passes.</div>
<ul>
<li>"The discount rate may be the <b>single most important factor</b> in determining the value of a long-term investment."</li>
<li>At 1% the value is <b>more than 4×</b> the value at 4%. That is why low-discount analyses like Stern's favour early action: "future damages count for so much".</li>
<li>Compound interest beats intuition: $100 invested by Columbus in 1492 at 6% would exceed the world's wealth. Manhattan's $26 in 1626 at 6% ≈ <b>$152 bn</b>.</li>
</ul>`},
{t:"Ethics: the heavy burden of zero discounting", h:`
<p>Discounting ≠ indifference to the future. It reflects (1) <b>productive capital</b>: other investments also help future generations, such as low-carbon R&amp;D, tropical-disease research and education; and (2) <b>compound interest</b>.</p>
<p><b>The "anxiety discount" argument</b>: weight your children at 1, grandchildren ½, great-grandchildren ¼, and so on:</p>
<div class="eq">1 + ½ + ¼ + ⅛ + … = 2 &nbsp;&nbsp;(finite: you can decide)<br>1 + 1 + 1 + 1 + … = ∞ &nbsp;&nbsp;(zero discounting: paralysis)</div>
<p>With zero discounting we'd "dissolve in a sea of anxiety" about asteroids, robots, "fat tails" (rare disasters that are likelier than they look) and so on. Zero discounting is "an infinitely heavy load on our shoulders". This is the mathematical point of Nobel laureate <b>Tjalling Koopmans</b>.</p>
<div class="key">"The discount rate is the measuring rod for comparing competing investments." Climate investments should compete with health, education and research.</div>
<p><b>Summary of the book's Part III</b> (Ch 15–17, on costs and discounting): keeping within safe limits is feasible. With full efficient participation, 2°C. With delays and partial participation, 3°C. Limiting to 2½–3°C costs <b>1% or less</b> of discounted world income if policy is reasonably efficient. That requires <b>cooperation</b> (most countries within a couple of decades, US included) and <b>equal marginal costs</b> everywhere.</p>`},
{t:"Quiz: Discounting", q:[

["Nordhaus distinguishes the discount rate on goods from the rate on welfare. Why does that matter?",
 ["Goods can be stored but welfare cannot, so only goods are discounted","Generations can count equally while goods are still discounted","Welfare is measured in real terms while goods are measured in nominal money terms","Only governments discount welfare, while firms discount goods"],1,

 ["They assume a much higher climate sensitivity to CO₂","Distant damages keep most of their value","They assume abatement technology will become more expensive over the century","They leave the cost of abatement out of the calculation"],1,

]}

/* ───────────────────────── 6. CLIMATE CASINO CH 18 ───────────────────────── */
M.push({t:"Balancing costs & benefits (Nordhaus 18)", c:[
{t:"The set-up", h:`
<p><b>Where this fits.</b> This is where Modules 3–5 come together. Damages (Module 3) and abatement costs (Module 4), both discounted (Module 5), go on one graph, and the cheapest point is Nordhaus's "optimal" temperature target. Modules 8 and 9 attack it.</p>
<p>Cost–benefit analysis picks the target with the greatest margin of benefits over costs. Everyday versions include driving to the cheaper petrol station or choosing a college on market and nonmarket grounds.</p>
<p>For climate, take each temperature limit (2°C, 3°C, 4°C…) and plot three things as % of global income:</p>
<ul>
<li><b>Abatement cost</b> of staying under that limit: <b>downward-sloping</b> (lower limits cost more). This comes from Ch 15.</li>
<li><b>Damages</b> at that temperature: <b>upward-sloping</b>. This comes from Ch 12.</li>
<li><b>Total = abatement + damages</b>: <b>U-shaped</b>. The bottom of the U is the best target.</li>
</ul>
<p><b>Why a U?</b> Aim very low (say 1.5°C) and damages are small but abatement is enormously expensive. Aim very high (say 5°C) and abatement is cheap but damages are huge. Somewhere in between the two add up to the least. This is Module 0's MB = MC logic in another form: at the bottom of the U, tightening the limit by a little more would add exactly as much abatement cost as it saves in damage.</p>
<p>Omitted: tipping points, acidification and similar hard-to-value impacts, and adjustment dynamics. Temperatures are measured relative to 1900, which was about 0.8°C below today.</p>`},

<li>At very low temperature limits the cost is mostly <b>abatement</b>. At high limits it is mostly <b>damages</b>.</li>
<li>Minimum at <b>2.3°C</b>, with total cost <b>2.9% of income</b> and damages about <b>twice</b> abatement.</li>
<li>Abatement spending is modest, about <b>1%</b> of global income.</li>
</ul>
<div class="key">"If climate-change policies are well designed and perfectly efficient, and if current and future costs count equally, then a target of 2¼°C is justified from an economic perspective." So 2°C is close to optimal <i>under ideal conditions</i>.</div>`},

<table>
<tr><th>Scenario</th><th class="r">Optimal limit</th><th class="r">Total cost</th></tr>
<tr><td>100% participation, no discounting (Fig 29)</td><td class="r">2.3°C</td><td class="r">2.9%</td></tr>
<tr><td>50% participation, no discounting (Fig 30)</td><td class="r"><b>3.8°C</b></td><td class="r">3.8%</td></tr>
<tr><td>50% participation, discounted at 4%, 50-yr lag (Fig 31)</td><td class="r"><b>4.0°C</b></td><td class="r">≈2.5% (read off the figure)</td></tr>
<tr><td>100% participation, discounted ("discount-prone optimists")</td><td class="r">2.8°C</td><td class="r">–</td></tr>
</table>
<ul>
<li>With 50% participation, <b>2°C is unattainable</b>. Paradoxically, most of the cost is then <b>damages</b>: abatement is so expensive that it's better to abate little and live with the damage.</li>
<li><b>Participation moves the optimum by 1.5°C</b> (2.3 → 3.8). <b>Discounting adds only 0.2°C</b> (3.8 → 4.0).</li>
</ul>
<div class="kim"><b>Why discounting matters so little here</b> (it surprised Nordhaus too): the abatement curve is highly nonlinear, steep below 4°C and flat above, while the damage curve has a <b>near-constant slope</b> around 4°C. Lowering the damage curve barely moves the minimum. Nonlinearities drive targets.</div>
<div class="tip">This contrasts with Ch 16, where the discount rate is "the single most important factor" for a single project. In the target-setting graphs, participation dominates. Be ready to explain both.</div>`},
{t:"Tipping points (Fig 32)", h:`
<p>The U-shaped curves assumed damages rise smoothly. Module 0's <b>tipping points</b> don't: past a threshold, damage jumps. Nordhaus asks what happens to the "optimal" target if we add one.</p>

<ul>
<li>Nordhaus <i>assumes</i>, for illustration, tipping damages of <b>0.5%</b> of income at 3.5°C, <b>9%</b> at 4°C and <b>29%</b> at 4¼°C. (In the diagram this is drawn by making the extra damage rise with temperature to the 20th power, which stays near zero and then shoots up.) He says these numbers are "the outer limit of what seems plausible" with no solid empirical basis.</li>
<li>Total cost becomes a sharp <b>V</b> with its minimum <b>at the threshold, 3.5°C</b>. The optimal policy is strenuous action to stay below it, and total costs are much larger.</li>
<li>Lesson: <b>CBA can incorporate catastrophes</b>. The difficulty is <b>empirical</b>: we don't know the threshold, the damage at the threshold, or the curvature.</li>
</ul>`},
{t:"CBA under uncertainty", h:`
<p>The tipping example assumed we <i>know</i> the threshold is at 3.5°C. What if we don't? Nordhaus compares two kinds of uncertainty.</p>
<p>First, a definition: the <b>expected value</b> of an uncertain outcome is its probability-weighted average. A 50% chance of 1% damage and a 50% chance of 3% has an expected value of 0.5 × 1 + 0.5 × 3 = 2%.</p>
<div class="vs">
<div><h3>Smooth damages, uncertain size</h3><p>At 2°C damage is 1% or 3% with even odds, so the expected value is 2%. With smooth curves only the <b>averages</b> matter, and the uncertainty doesn't change the decision.</p></div>
<div><h3>Uncertain tipping point</h3><p>The cliff is at 3°C or at 4°C, with equal odds. Averaging the two cliff-shaped damage curves gives a curve with two jumps (Nordhaus calls it <b>W-shaped</b>). The <b>lower threshold dominates</b>: aim for about <b>3°C</b>, even though the average threshold is 3.5°C, because going past 3°C risks falling off the first cliff.</p></div>
</div>
<p>The second case supports the <b>precautionary principle</b> (Module 1) in its <b>minimax</b> form: choose the policy whose worst possible outcome is least bad. The <b>Rio Declaration</b> (1992 Earth Summit) puts it as "lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures".</p>
<p>But minimax only makes sense if the cliffs are few and not ruinously costly to avoid. If they are just bumps, or too many, or too expensive to avoid, it's better to pay an <b>insurance premium</b> (some extra abatement) than to avoid them at any cost. Nordhaus's example is a possible reversal of the Gulf Stream above 2°C.</p>
<div class="key">General rule: uncertain, nonlinear, cliff-like damages <b>lower</b> the optimal target, as insurance against the worst cases.</div>`},
{t:"Critiques of CBA, and Nordhaus's reply", h:`
<p><b>Critiques</b>: deep uncertainty (sometimes probabilities are unknowable); costs and benefits fall on <b>different people and generations</b>; comparing now with the distant future; putting a price on health and life; inadequate tools for valuing <b>ecosystems and biodiversity</b>.</p>
<p><b>Nordhaus's reply</b>: CBA is daunting but <b>necessary</b> to make reasoned choices. Get order-of-magnitude estimates, include all impacts, and get economists and natural scientists working together. "Compare the price tag with the things we are buying."</p>
<ul>
<li>With only half of countries participating, aiming for 2°C "is like hoping you can take <b>Amtrak to the moon</b>".</li>
<li>A temperature limit is a worthy <b>ultimate</b> goal. Emissions or concentration limits are only <b>instrumental</b>.</li>
<li>It's not enough to say "ecosystems are priceless" or "we must pay any cost to save the polar bears".</li>
</ul>
<div class="kim">Stern's whole 2022 paper (Module 8) answers this chapter: treat 1.5°C as a <b>guard-rail</b> set by risk, then find the cheapest path. Don't derive the target by maximising a CBA.</div>`},

/* ───────────────────────── 7. CLIMATE CASINO CH 19–20 ───────────────────────── */
M.push({t:"Carbon prices & national policy (Nordhaus 19–20)", c:[
{t:"Why a carbon price?", h:`
<p><b>Where this fits.</b> Module 6 picked a target. Ch 19–20 ask how to make billions of people and firms actually hit it. Nordhaus's answer is the Pigouvian idea from Module 1, scaled up: put a price on every tonne of CO₂.</p>
<p>Climate policy is "a tale of two sciences": the <b>natural</b> sciences diagnose the problem, and the <b>social</b> sciences design the cure.</p>
<p>What makes billions of people buy efficient cars, holiday closer to home, redesign factories and invest in low-carbon R&amp;D? The single most important missing mechanism is a <b>high price on CO₂ emissions</b>.</p>
<ul>
<li>CO₂ is an <b>externality</b>. When I run my air conditioner I pay for the electricity but not the CO₂ damage, because the US carbon price is zero.</li>
<li>The fix (Pigou): "Everyone, everywhere, and for the indefinite future must face prices that reflect the social costs of their activities."</li>
<li>A high carbon price signals harm the way a sky-high Manhattan land price signals "this is no place for a golf course".</li>
</ul>
<div class="prob"><b>Household example ($25/t CO₂)</b>10,000 kWh/yr at 10¢ = $1,000. Half coal, half gas → 8 t CO₂.<br>8 × $25 = <b>+$200 a year</b>, a <b>20%</b> rise in the electricity bill.</div>`},
{t:"Two ways, and who writes the cheque", h:`
<p>There are only <b>two</b> ways to put a market price on emissions:</p>
<ol><li><b>Carbon tax</b>: pay per ton emitted, like a petrol tax.</li><li><b>Cap and trade</b>: cap total emissions, issue permits, and let firms trade them.</li></ol>
<p><b>Who pays?</b> Administratively it's cheapest to collect from <b>refineries</b> (oil) and <b>power plants</b> (coal), and to cover imports and exports.</p>
<p>"<b>The only good tax is an invisible tax</b>." Half of the US payroll tax for pensions (Social Security) is formally "paid" by employers, so workers don't feel it, though economists agree it really comes out of wages (the incidence point from Module 0). So taxing <b>upstream</b> may reduce opposition.</p>
<div class="key">Economically it makes <b>no difference</b> whether the producer, refiner or petrol station pays. The carbon price is passed on to consumers either way.</div>`},
{t:"Three jobs a carbon price does", h:`
<ol>
<li><b>Consumers</b> learn which goods are carbon-heavy. Flying gets dearer relative to local trips or the train.</li>
<li><b>Producers</b> learn which inputs are carbon-heavy. Coal power costs rise sharply, gas less, nuclear and wind not at all. In 2012, 16 of 21 US utilities already planned with a CO₂ price averaging just under $25 for 2020.</li>
<li><b>Innovators</b> learn where to aim R&amp;D. GE spent $5 bn on R&amp;D in 2012. Expected high carbon prices shift its bets from coal to wind and nuclear.</li>
</ol>
<p><b>It also economises on information.</b> Should you fly (350 kg CO₂) or drive (400 kg) from Denver to Albuquerque? Then there are the airport trips, how full the plane is, and the carbon embodied in tyres and aluminium. With a universal carbon price, all of that is already in the ticket and fuel prices. You don't need to calculate anything.</p>
<p>Advantages: strong incentives, <b>even-handed</b>, reaches every part of the economy from production to innovation, and <b>economises on information</b>.</p>`},
{t:"Setting the right price", h:`
<p><b>Approach 1 · Social cost of carbon (SCC)</b>: the economic damage from <b>one additional ton</b> of CO₂. It guides tax levels, cap levels, international minimum prices and US regulations (vehicle fuel efficiency, building standards, new power plants). The US government's best estimate was about <b>$25/t for 2015</b>.</p>
<p><b>Approach 2 · IAM price path</b> to hit a temperature target. For <b>2½°C</b> (13 models, full participation, efficient): start at about <b>$25 in 2015</b>, rise about <b>5%/yr real</b> to <b>$53 in 2030</b> and <b>$93 in 2040</b>. Models vary widely.</p>
<table>
<tr><th>Wholesale, $25/t tax (Table 8)</th><th class="r">Before</th><th class="r">After</th><th class="r">Change</th></tr>
<tr><td>Coal ($/mmbtu)</td><td class="r">1.8</td><td class="r">4.1</td><td class="r"><b>+134%</b></td></tr>
<tr><td>Industrial electricity (¢/kWh)</td><td class="r">6.9</td><td class="r">9.0</td><td class="r">+31%</td></tr>
<tr><td>Natural gas ($/mmbtu)</td><td class="r">4.5</td><td class="r">5.8</td><td class="r">+30%</td></tr>
<tr><td>Petroleum ($/mmbtu)</td><td class="r">17.2</td><td class="r">19.1</td><td class="r">+11%</td></tr>
</table>
<p>(mmbtu = a million British thermal units, a standard unit of energy, so each fuel is priced per unit of energy it delivers.) Coal is hit hardest. Petroleum is hit least because it has high value per unit of CO₂.</p>`},
{t:"Household impact & the fiscal case", h:`
<table>
<tr><th>Item, $25/t (Table 9)</th><th class="r">t CO₂</th><th class="r">Extra spend</th><th class="r">%</th></tr>
<tr><td>Year's electricity</td><td class="r">9.34</td><td class="r">$233.40</td><td class="r"><b>19.45</b></td></tr>
<tr><td>Year's driving</td><td class="r">4.68</td><td class="r">$116.90</td><td class="r">7.79</td></tr>
<tr><td>Transcontinental flight</td><td class="r">0.67</td><td class="r">$16.80</td><td class="r">5.61</td></tr>
<tr><td>Communications / financial services</td><td class="r">0.01 / 0.02</td><td class="r">$0.36 / $0.41</td><td class="r">0.04</td></tr>
<tr class="hl"><td>All household consumption</td><td class="r">29.48</td><td class="r">$737</td><td class="r"><b>0.92</b></td></tr>
</table>
<p>Carbon-heavy goods get relatively dearer, so people buy less of them: the "law of downward-sloping demand".</p>
<p><b>US carbon tax path (Table 10)</b>: $25 (2015) → $30 (2020) → $53 (2030). Revenue $147 bn → <b>$168 bn in 2020 (about 1% of GDP)</b> → $277 bn (1.25%). Emissions fall from 6.3 to 5.2 bn t, stabilising at about the 2000 level. US debt/GDP went from 36% (2007) to 76% (2013), so the revenue helps.</p>
<div class="key">"A carbon tax is the closest thing to an ideal tax that can be imagined." It is the only tax that <b>raises efficiency</b>, because it shrinks a harmful activity. It has health co-benefits (less coal), can replace inefficient regulations, and is a possible compromise between fiscal conservatives and environmentalists.</div>`},
{t:"Ch 20: two economic truths & cap and trade", h:`
<ol><li>People and firms must face <b>incentives</b>: carbon fuels must get dearer, "an inconvenient economic truth".</li><li><b>Markets alone won't solve it.</b> There is no genuine "free-market solution". We need national and international <b>institutions</b>, legislated and enforced by governments.</li></ol>
<p><b>Cap and trade</b> (Module 1's tradable permits) has three steps. Legislate a cap on total emissions. Issue <b>allowances</b>, permits to emit one ton each (the book shows a whimsical "United States of Pacifica" certificate for 1,000 t). Then allow the "brilliant innovation" of <b>trade</b>.</p>
<div class="prob"><b>Why trade raises welfare</b>Firm A's obsolete plant gets only <b>$2</b>/t of value from its allowances. Firm B's new server farm would get <b>$202</b>/t. They trade at about $25. Allowances move to the higher-value use, so welfare rises by <b>$200/t</b>.</div>
<ul><li>Precedents: auctions for oil drilling rights, timber and radio spectrum. The <b>US SO₂ programme (1990)</b> worked so well it became the model for <b>Kyoto</b> and the <b>EU ETS</b>.</li>
<li>Because emissions are capped below the free-market level they become scarce like land, so the allowance price rises until demand fits the cap, like a high corn price rationing corn.</li>
<li><b>EU ETS</b> (Fig 35): phase 1 had more allowances than emissions, so the price fell to <b>zero in 2007</b>. Phase 2 started about €20 ($27) and fell to about €8 ($11) by 2012. It dropped almost 75% in a few months of 2008.</li></ul>`},
{t:"Tax vs cap: equivalence & differences", h:`
<p><b>Central equivalence</b>: uncontrolled US emissions are 5 bn t. Either auction a cap of 4 bn t, or levy a tax. If the last ton costs $25 to remove, the permit price becomes $25. A $25 tax produces the same 1 bn t cut. Firms pay <b>4 bn × $25 = $100 bn</b> either as tax or for permits, and the government gets $100 bn either way. "Cap and trade operates just like a tax on pollution": one is a quantity regulation, the other a price regulation.</p>
<p>Where they differ is <b>uncertainty</b>. The <b>marginal abatement cost (MAC)</b> curve shows the cost of cutting one more tonne; it rises because cheap cuts get used first. The regulator doesn't know whether abatement will turn out cheap (green) or costly (orange).</p>

xt><text x="64.0" y="158.0" text-anchor="end">tax t</text><path class="dash" d="M70.0,206.8 L303.0,206.8 L303.0,286.0"/><text x="64.0" y="210.8" text-anchor="end">p<tspan dy='3' font-size='9'>cheap</tspan><tspan dy='-3'>&#8203;</tspan></text><path class="dash" d="M70.0,114.4 L303.0,114.4 L303.0,286.0"/><text x="64.0" y="118.4" text-anchor="end">p<tspan dy='3' font-size='9'>costly</tspan><tspan dy='-3'>&#8203;</tspan></text><text x="303.0" y="302.0" text-anchor="middle" class="c">cap</text><circle class="dot" cx="458.3" cy="154.0" r="3.5"/><circle class="dot" cx="249.2" cy="154.0" r="3.5"/><circle class="dot" cx="303.0" cy="206.8" r="3.5"/><circle class="dot" cx="303.0" cy="114.4" r="3.5"/><text x="536.0" y="119.6" text-anchor="end" class="a">MAC if abatement is cheap</text><text x="430.2" y="29.2" text-anchor="start" class="b">MAC if costly</text><text x="84.0" y="147.0" text-anchor="start" class="">tax: price fixed at t</text><text x="309.0" y="37.8" text-anchor="start" class="">cap: cut fixed</text></svg><figcaption>Horizontal black line = a tax at t per tonne. Vertical purple line = a cap fixing how many tonnes are cut. Firms cut until their MAC equals the price they face.</figcaption></figure>
<ul>
<li><b>Under the tax</b>, the price is fixed at <b>t</b>. Firms cut until MAC = t, so the cut is <b>q<sub>cheap</sub></b> (big) if abatement is cheap and <b>q<sub>costly</sub></b> (small) if it is costly. The <i>quantity</i> is uncertain.</li>
<li><b>Under the cap</b>, the cut is fixed. The permit price ends up where the MAC crosses the cap: <b>p<sub>cheap</sub></b> or <b>p<sub>costly</sub></b>. The <i>price</i> is uncertain.</li>
</ul>
<div class="vs">
<div><h3>For a carbon tax (economists)</h3><ul><li>Tax systems are mature and universal</li><li>Raises <b>revenue</b> to tackle deficits</li><li><b>Stable</b> price; permit prices are volatile because permit supply and demand are price-insensitive</li><li>Free permits (SO₂ 1990, early EU ETS) waste fiscal resources. With <b>auctions</b>, the fiscal effects are equal</li></ul></div>
<div><h3>For cap and trade (negotiators)</h3><ul><li><b>Quantity certain</b>, so it can guarantee staying below "dangerous anthropogenic interference" (the UNFCCC treaty's phrase for human-caused warming that is too risky)</li><li>More <b>political appeal and durability</b>: free allowances are "political glue"</li><li>Taxes are "hard to introduce but easy to cut", so price volatility becomes political volatility</li><li>Environmental rules tend to be irreversible (SO₂ standards are unchanged since 1990)</li></ul></div>
</div>
<p><b>Nordhaus's verdict</b>: "either one!" What matters is raising the price. Forced to choose, he picks the <b>carbon tax</b> for revenue, stability, transparency and predictability. For a tax-averse US, <b>auctioned</b> cap-and-trade beats doing nothing.</p>`},
{t:"Hybrids & thorny details", h:`
<p>Since a tax fixes the price and a cap fixes the quantity, why not combine them? A <b>hybrid</b> is a cap-and-trade system with two price limits:</p>
<ul>
<li>A <b>price floor</b>: permits can't trade below a minimum price, which works like a minimum carbon tax. It stops the price collapsing, as the EU ETS's did in 2007.</li>
<li>A <b>safety valve</b>: if the price climbs too high, the government sells extra permits at a set price (say 50% above the expected price). That puts a ceiling on the price, at the cost of letting emissions exceed the cap.</li>
</ul>
<p>The closer the floor and the valve, the more the system behaves like a <b>tax</b> (price nearly fixed). The further apart, the more it behaves like pure <b>cap and trade</b>. Nordhaus lists the benefits: better public finance, less price volatility, fewer incentives for corruption and less uncertainty.</p>
<p><b>Thorny details</b>:</p>
<ul>
<li><b>Forests and soils</b>: they store carbon. Crediting landowners for storing it, and charging them for cutting trees, would be ideal, but it is beyond current ability to measure.</li>
<li><b>Border adjustments</b>: if the US taxes carbon at $50/t and Canada at $20/t, US industry is at a disadvantage and production may move abroad. A border charge of the difference ($30/t) on imports from Canada evens this out. But what counts? The CO₂ in imported fuel is easy. <b>Embodied</b> CO₂, emitted abroad while making an imported good such as steel or a phone, is much harder to measure. This hardly matters at low carbon prices but would matter a lot at $500–1,000/t.</li>
</ul>
<p><b>The real-world record</b> (to 2012): after Kyoto (1997), negotiations focused on quantity limits and sidelined taxes. India had a <b>$1/t coal tax</b>, China was considering one, and no country had a high, economy-wide carbon tax.</p>`},

M.push({t:"A time for change in economics (Stern 2022)", c:[
{t:"The argument in one breath", h:`
<p><b>Where this fits.</b> Modules 3–7 were Nordhaus: estimate damages and costs, discount, minimise the total, price carbon. Stern is the first critic. He doesn't reject economics; he says these particular tools are too narrow for a problem this large and this risky.</p>
<p>Nicholas Stern, <i>The Economic Journal</i> (2022), originally his Royal Economic Society presidential address. Stern led the UK government's <b>Stern Review (2006)</b>, which first argued that early action is far cheaper than inaction, and is at the London School of Economics (LSE).</p>
<p>The case for action "with urgency and at scale" rests on three things:</p>
<ol><li>the <b>immense magnitude of climate risk</b>;</li><li>the <b>very rapid emissions cuts</b> needed;</li><li>a <b>real opportunity</b> for a new, attractive form of growth (sustainable, resilient, inclusive).</li></ol>
<p>So, he says, the economics must be:</p>
<ul>
<li><b>dynamic</b>: about how the economy changes over decades, not small adjustments around today's economy;</li>
<li>set in a world of <b>many market failures</b>, not just the one externality Pigou's tax fixes;</li>
<li>alert to <b>increasing returns</b>: the more a technology is used, the cheaper it gets (solar panels, batteries), the opposite of the rising cost curves in Module 4;</li>
<li>centred on <b>risk</b>, and on <b>distribution</b> (who wins and who loses).</li>
</ul>
<p>Don't force "a huge and non-standard challenge into a narrow and standard framework", i.e. economists' familiar "workhorse" models.</p>
<div class="key">"It is time for economics and economists to step up." The key issues are <b>risk and change</b>.</div>`},
{t:"The science and why 1.5°C", h:`
<ul>
<li>Already <b>1.1°C</b> above the late 19th century, at the edge of the <b>Holocene</b> temperatures (the stable 10–12,000 years in which agriculture and civilisation emerged).</li>
<li>2021: nearly <b>50°C</b> in northern California and western Canada, and record floods from Germany to China.</li>
<li><b>Wet-bulb temperature</b> combines heat and humidity. Above about 35°C, sweat can't cool the body, so it is deadly even for healthy people in the shade.</li>
<li>The current path is <b>above 3°C</b> (UNEP 2020). The world hasn't seen 3°C for about <b>3 million years</b>, when seas were 10–20 m higher. Deadly wet-bulb heat on the North China Plain and in north India could force hundreds of millions or billions to move.</li>
<li><b>Net-zero logic</b>: stable temperature needs stable concentrations, which needs net-zero flows. The <b>earlier</b> net zero arrives, the <b>lower</b> the temperature at which we stabilise. For 1.5°C, net-zero CO₂ is needed by <b>mid-century</b>.</li>
<li>Emissions hit a record <b>59.1 GtCO₂e</b> (billion tonnes of CO₂-equivalent, Module 0) in 2019. Energy CO₂ was projected to rebound +4.8% in 2021.</li>
</ul>
${bars([["1.5°C",14],["2°C",37]],40,"%","")}
<p class="src">Share of world population exposed to severe heat at least once every 5 years (Dosio et al. 2018), more than double at 2°C. So damage is <b>not linear</b> in temperature.</p>`},
{t:"Guard-rails, not optimisation", h:`
<figure class="dia"><svg viewBox="0 0 560 120" role="img" aria-label="Stern's guard-rail approach: set a risk-based target first, then find the best path to it"><rect class="box" x="15.0" y="30" width="107.0" height="56" rx="8"/><text x="68.5" y="54.0" text-anchor="middle">Science: risks</text><text x="68.5" y="70.0" text-anchor="middle">of 1.5 vs 2°C</text><path class="arr" d="M125.0,58 L153.0,58"/><text x="139.0" y="22.0" text-anchor="middle" class="a"></text><rect class="boxa" x="156.0" y="30" width="107.0" height="56" rx="8"/><text x="209.5" y="54.0" text-anchor="middle">Set guard-rail</text><text x="209.5" y="70.0" text-anchor="middle">(1.5°C, net zero)</text><path class="arr" d="M266.0,58 L294.0,58"/><text x="280.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="297.0" y="30" width="107.0" height="56" rx="8"/><text x="350.5" y="54.0" text-anchor="middle">Find cheapest,</text><text x="350.5" y="70.0" text-anchor="middle">most attractive path</text><path class="arr" d="M407.0,58 L435.0,58"/><text x="421.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="438.0" y="30" width="107.0" height="56" rx="8"/><text x="491.5" y="54.0" text-anchor="middle">Many instruments</text><text x="491.5" y="70.0" text-anchor="middle">+ finance</text></svg><figcaption>Stern: set a risk-based target first, then find the best path to it.</figcaption></figure>
<figure class="dia"><svg viewBox="0 0 560 120" role="img" aria-label="Nordhaus's cost-benefit approach: damages plus abatement costs give an optimal temperature"><rect class="box" x="15.0" y="30" width="107.0" height="56" rx="8"/><text x="68.5" y="54.0" text-anchor="middle">Damage</text><text x="68.5" y="70.0" text-anchor="middle">function</text><path class="arr" d="M125.0,58 L153.0,58"/><text x="139.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="156.0" y="30" width="107.0" height="56" rx="8"/><text x="209.5" y="54.0" text-anchor="middle">Abatement</text><text x="209.5" y="70.0" text-anchor="middle">cost curve</text><path class="arr" d="M266.0,58 L294.0,58"/><text x="280.0" y="22.0" text-anchor="middle" class="a"></text><rect class="box" x="297.0" y="30" width="107.0" height="56" rx="8"/><text x="350.5" y="54.0" text-anchor="middle">Minimise</text><text x="350.5" y="70.0" text-anchor="middle">total cost</text><path class="arr" d="M407.0,58 L435.0,58"/><text x="421.0" y="22.0" text-anchor="middle" class="a"></text><rect class="boxa" x="438.0" y="30" width="107.0" height="56" rx="8"/><text x="491.5" y="54.0" text-anchor="middle">'Optimal'</text><text x="491.5" y="70.0" text-anchor="middle">temperature</text></svg><figcaption>Nordhaus (Ch 18): derive the target by minimising damages plus abatement cost.</figcaption></figure>
<ul>
<li>The top diagram is Stern's order of reasoning; the bottom one is Nordhaus's from Module 6. Stern starts from what the science says is too risky. Nordhaus <i>ends</i> with a temperature that comes out of the cost curves.</li>
<li>The 1.5°C target is a <b>guard-rail</b> against extreme risk. It is consequentialist, but not derived by maximising a standard expected-utility function.</li>
<li>Mass mortality, billions migrating, conflict and ecosystem collapse are hard to price. So first identify the <b>unacceptable</b> risks, then find feasible paths to avoid them.</li>
<li>Expected-utility models can be "rigged up" to give any answer: modest tweaks change the results.</li>
<li><b>Paris (COP21, Dec 2015)</b>: "well below 2°C", with best efforts toward 1.5°C. More than 190 countries agreed <b>without</b> agreeing on a utility function, damage function or discount rate. The net-zero-by-2050 focus came from <b>physical science</b>, not from IAMs.</li>
</ul>`},
{t:"Urgency and a new growth story", h:`
<p><b>Why this decade?</b> Infrastructure will roughly <b>double in 15–20 yrs</b>, the world economy in <b>20–25 yrs</b> and the urban population in <b>40 yrs</b>. Build them high-carbon and you are <b>locked in</b>.</p>
<p><b>Climate action as growth</b>: it is "the only sustainable story of growth", since a high-carbon path would create a world too hostile for growth.</p>
<ul><li>Short run: investment boosts demand when <b>planned saving exceeds planned investment</b> and real rates are low. Economists call that state <b>secular stagnation</b>: chronically weak demand.</li>
<li>Medium run: innovation, efficiency, cleaner cities and healthier ecosystems.</li></ul>
<p><b>Four forces making fast action possible now</b>: (1) low interest rates; (2) rapid technological change; (3) international agreement (Paris; 100+ countries covering 61% of emissions pledging net zero); (4) pressure from young people (Fridays for Future).</p>
<div class="eq">Y = C + I + G + NX</div>
<p>This is the national-income identity: output <b>Y</b> = household consumption <b>C</b> + investment <b>I</b> + government spending <b>G</b> + net exports <b>NX</b>. More sustainable investment raises I, which raises demand now and productive capacity later.</p>`},
{t:"Technology & 'cost or investment?'", h:`
<ul>
<li>Since 2010, costs have fallen: solar PV <b>−85%</b>, onshore wind −56%, CSP −68%, offshore wind −48% (IRENA). Battery packs went from about $1,160/kWh (2010) to $176 (2018). EV sticker-price parity was expected by 2024.</li>
<li>The <b>IEA consistently under-predicted</b> solar's cost decline after 2001.</li>
<li>In 2020, solar or wind was the cheapest new power in countries with <b>over 70% of world GDP</b>. Low-carbon options could be competitive in sectors covering 90% of emissions by 2030.</li>
<li>UK Climate Change Committee: the cost of net zero is about <b>0.5% of GDP in 2050</b>, down from a 1–2% estimate in 2019. The Stern Review (2006) estimated 1–2% of GDP a year for an 80% cut.</li>
<li>About <b>15%</b> of world deaths in 2018 were linked to fossil-fuel air pollution, a big co-benefit of cutting emissions.</li>
</ul>
<div class="key"><b>Increasing returns</b>: deployment itself cuts costs through learning, scale and supply chains. So the cost of net zero is <b>endogenous</b> to how fast we act. Standard IAMs assume <b>diminishing returns and rising marginal costs</b>, so they systematically <b>overstate</b> costs.</div>
<p>"Investment" is a better word than "cost": renewables have high upfront capital but low fuel costs, and they bring returns in productivity, health and cleaner air.</p>`},
{t:"Investment, policy, finance", h:`
<ul>
<li>Raise global investment by about <b>2–3 percentage points (pp) of GDP</b> compared with the previous decade, e.g. from 24% to 26–27% of GDP. About 2pp for the G7, more for emerging and developing economies, and for <b>China</b> a change in the <b>composition</b> rather than the level.</li>
<li>Three routes to the same number: returning to investment levels of three decades ago; the infrastructure gap of 2–3% of world GDP; bottom-up estimates of sustainable investment needs.</li>
<li><b>Four wins from internationalism</b>: coordinated demand expansion (spillovers); resetting expectations together; shared technology direction (increasing returns); climate and biodiversity as <b>global public goods</b>.</li>
<li><b>Policy</b>: carbon pricing matters <b>but is not enough</b>. Add city design, regulation, standards and R&amp;D. Policy should be <b>"predictably flexible"</b> (as in monetary policy), because government-induced policy risk deters investment.</li>
<li><b>Finance</b>: private finance at scale, plus development and <b>concessional</b> finance (loans cheaper than the market would offer) for risky, low-revenue projects. Expand <b>multilateral development banks</b> and the IMF in a "grand bargain".</li>
</ul>`},
{t:"What's changed since the Stern Review", h:`
<p>The core finding of 2006, that <b>the costs of inaction far exceed the costs of action</b>, is now stronger:</p>
<ol>
<li><b>Science</b> is more worrying. Impacts are coming faster and harder (IPCC 2018 on 1.5°C; AR6 in 2021).</li>
<li><b>Clean technology</b> costs fell faster than expected.</li>
<li><b>Politics</b> have been mixed: forward (Paris, China's 2060 neutrality pledge, Biden, COP26, private sector) and backward (Trump, Bolsonaro; the 2008–10 financial crises reduced "bandwidth").</li>
<li><b>Analysis</b> now stresses the <b>dynamics of change</b> and new development paths.</li>
</ol>`},
{t:"How economics must change: IAMs", h:`
<p>Stern means IAMs like Nordhaus's DICE (Module 3): one model joining a simple economy to a simple climate and optimising.</p>
<p><b>How we got here</b>, in Stern's telling:</p>
<ul>
<li><b>Marshall (1890)</b> separated private from social cost.</li>
<li><b>Pigou (1920)</b>: tax the gap between them (Module 1).</li>
<li><b>Meade (1955)</b> and <b>Coase (1960)</b>: externalities can also be handled by assigning property rights and letting people trade them (the idea behind tradable permits).</li>
<li><b>Pearce (1989)</b>, <i>Blueprint for a Green Economy</i>, brought these tools into environmental policy.</li>
<li>Then <b>Nordhaus (1991) "To Slow or Not to Slow?"</b> and Cline (1992) applied them to climate.</li>
</ul>
<p>Nordhaus used standard tools: a Pigouvian tax plus a growth model in which growth is <b>exogenous</b> (assumed from outside, not affected by policy), with climate treated as "small perturbations" to it. Stern calls this "a sensible and valuable early contribution". But within 10–15 years it was clear <b>climate is not a marginal problem</b>.</p>
<p><b>IAM flaws.</b> Stern's list of what IAMs assume: a single welfare function, with its parameters fitted ("calibrated") to data, which the model maximises; growth that is exogenous; and the whole economy lumped into one good ("one-good aggregation"), so there are no separate dirty and clean sectors to shift between. The consequences:</p>
<ul>
<li>They can't handle (1) <b>immense risk</b> to life, or (2) <b>fundamental structural change</b>.</li>
<li><b>Damages implausibly low</b>: DICE (2017) has <b>8.5% of GDP lost at 6°C</b>, which Stern calls "profoundly implausible" for a world that may be existential for billions.</li>
<li><b>Costs implausibly high</b>: diminishing returns and slow technical progress.</li>
<li>With extreme risk, expected utility can go to <b>minus infinity</b> (Weitzman). "<b>Fat-tailed</b>" means very bad outcomes are much more likely than a bell curve would suggest. Any way of bounding the result is arbitrary.</li>
</ul>
<p><b>Stern & Stiglitz (2022)</b> put the problems in three groups: (A) things IAMs <i>cannot</i> address: deep uncertainty, extreme risk, endogenous preferences (people's values changing as society changes, e.g. attitudes to meat or flying); (B) partial progress: distribution and political economy, damage functions with tipping points; (C) possible only with great difficulty: assuming optimal redistribution, ignoring other market failures, marginal rather than systemic analysis, a simplistic view of technology.</p>
<p>IAMs can be <b>one model in a collection</b>, not the central method. Rodrik: "Unrealistic assumptions are ok; unrealistic <i>critical</i> assumptions are not ok."</p>`},
{t:"'Theory says carbon price' is wrong", h:`
<p>A carbon price belongs at centre stage, but the claim that theory says it's the most efficient tool is "a theoretical mistake of real practical significance". There are five mistakes:</p>
<ol>
<li>It ignores <b>other market failures and absent markets</b>.</li>
<li>Under a guard-rail, carbon prices are set to <b>achieve the target</b> with as much economic advantage as possible. They are not simply Pigou's marginal social cost.</li>
<li>With big risks, <b>increasing returns</b>, fixed costs and uncertainty, <b>standards and regulation</b> reduce uncertainty and costs. (Weitzman's 1974 "Prices vs Quantities" paper: when costs are uncertain and damage rises steeply past some point, fixing the quantity can beat fixing the price. Compare Module 7's tax vs cap.)</li>
<li>Many actors feel an <b>obligation</b> to act and aren't narrow self-interested optimisers.</li>
<li>Much of the challenge is <b>collaboration</b> and institutions.</li>
</ol>
<p><b>Stern–Stiglitz Commission (2017)</b>: <b>$50–100/t CO₂ by 2030</b>, prices that guide production toward Paris rather than measure marginal damage. Others: Kaufman et al. $77–124 in 2030; IMF $75 by 2030.</p>
<p><b>Regulation done right</b>: the UK bans new petrol/diesel car sales from <b>2030</b> (EU 2035). The <b>incandescent bulb ban</b> brought on cheap LEDs. Neither "picks winners"; both "regulate out the harmful".</p>`},
{t:"Six market failures (Table 1)", h:`
<table>
<tr><th>Failure</th><th>Policy options</th></tr>
<tr><td><b>GHG externality</b></td><td>Carbon tax, cap-and-trade, emissions standards</td></tr>
<tr><td><b>R, D &amp; D</b> (knowledge spillovers)</td><td>Tax breaks, demonstration support, public research</td></tr>
<tr><td><b>Risk / capital markets</b></td><td>Guarantees, long-term contracts, co-financing, phase-out dates for dirty tech</td></tr>
<tr><td><b>Networks</b> (coordination)</td><td>Grids, public transport, broadband, recycling, city planning</td></tr>
<tr><td><b>Information</b></td><td>Labelling, product standards, awareness</td></tr>
<tr><td><b>Co-benefits</b> (not priced)</td><td>Value ecosystems and health; reform farm subsidies</td></tr>
</table>
<ul><li><b>Absent markets</b>: you can't trade future carbon or undiscovered technologies. A competitive equilibrium with absent markets isn't Pareto efficient, so public strategy must shape <b>expectations</b>.</li>
<li><b>Government limits</b>: governments can't fully commit and have short horizons. Hence durable institutions: the UK <b>Climate Change Act (2008)</b> and its five-year carbon budgets; Germany's Constitutional Court (2021) ruling the Climate Act too weak and unfair to future generations; a Hague court ordering <b>Shell</b> to cut emissions 45% by 2030 against 2019.</li></ul>`},
{t:"Stern on discounting", h:`
<p>Economists "leap too quickly to 'discount rates'". The central concept is the <b>social discount factor λ</b>: the relative social value of an extra unit of consumption in the future compared with now. The social discount rate is how fast λ falls.</p>
<div class="eq">Ramsey: &nbsp; social discount rate = η·g + δ</div>
<ul><li><b>η</b> (eta) = elasticity of marginal utility: how fast an extra $1 loses value as people get richer. η = 1 means an extra $1 is worth half as much to someone twice as rich.</li><li><b>g</b> = growth rate of consumption per person</li><li><b>δ</b> (delta) = <b>pure-time</b> discount rate: counting people less simply because they live later (Module 5)</li></ul>
<p>The formula splits discounting into two reasons: future people may be richer (η·g), and future people may simply count for less (δ). The Stern Review used δ = 0.1%, η = 1 and g ≈ 1.3%, giving 1 × 1.3 + 0.1 = <b>1.4%</b>, the rate Goodwin quotes in Module 2.</p>
<ul>
<li>Pure-time discounting is "<b>discrimination by date of birth</b>". "There is no serious ethical argument in favour of pure-time discounting", except for extinction risk.</li>
<li>The ηg term is legitimate <b>if</b> the future is richer. But that is <b>endogenous</b>: if we act recklessly, g could be negative and future generations poorer.</li>
<li>"The" discount rate is misleading because it depends on the good, the person, the time and the state of the world.</li>
<li><b>Capital markets</b> are the wrong place to find ethical values: they (i) don't reflect ethical social decisions, (ii) embed hard-to-identify risk views, and (iii) are imperfect. A footnote targets Nordhaus for seeming to look there.</li>
</ul>
<div class="tip">Comparing Nordhaus and Stern on discounting is a classic question. Nordhaus uses about <b>4%</b>, descriptive, opportunity cost. Stern uses about <b>1.4%</b> (Review), with δ ≈ 0, prescriptive. Mention Ramsey, the goods vs welfare distinction, and endogenous growth.</div>`},
{t:"New approaches & research agenda", h:`
<p>Good climate economics should (1) capture <b>extreme risk</b>; (2) recognise market failures, absent markets and limits of government; (3) model <b>rapid technical and systemic change with increasing returns</b>; (4) allow <b>endogenous beliefs and preferences</b>; (5) take account of <b>distribution</b>, including that of structural change.</p>
<ul>
<li><b>Systems</b>: electricity supply needs to roughly <b>quadruple</b> in 30 years and be zero-carbon by 2040. Cities will hold two-thirds of people by 2050 (55% in 2018). Fixing food and land systems could gain <b>$5.7 tn/yr by 2030</b> and $10.5 tn by 2050. "You would not sensibly attempt to redesign a city … via only a carbon price."</li>
<li><b>Just transition</b>: some jobs will vanish, so invest in people and places. This is both justice and political feasibility.</li>
<li><b>Whole-economy coordination</b> by prime ministers and finance ministries, not just line ministries.</li>
<li>Innovation (Schumpeter), the circular economy, finance and central banks, and <b>biodiversity</b> (the Dasgupta Review, 2021).</li>
<li>Political economy and behaviour, including Ostrom's polycentric governance.</li>
</ul>
<div class="kim">Stern's message is <b>not</b> anti-growth: he argues for <i>different</i> growth. Contrast with degrowth (Naudé Module 12) and Foster's Midas critique (Module 10).</div>`},

/* ───────────────────────── 9. KEEN (2021) ───────────────────────── */
M.push({t:"'Appallingly bad' climate economics (Keen 2021)", c:[
{t:"Keen's charge", h:`
<p><b>Where this fits.</b> Stern (Module 8) accepted Nordhaus's damage numbers as a starting point and criticised the method. Keen goes after the numbers themselves: the circles in Nordhaus's Fig 22 (Module 3) and the damage function drawn through them.</p>
<p>Steve Keen, <i>Globalizations</i> (2021). Keen is a <b>post-Keynesian</b> economist: part of a school that rejects the mainstream ("neoclassical") assumptions of equilibrium and rational optimising. He wrote <i>Debunking Economics</i>.</p>
<p>Economists' damage forecasts are sanguine compared with scientists' warnings because economists <b>made up their own damage numbers</b> using three spurious methods:</p>
<ol>
<li>Assuming about <b>90% of GDP is unaffected</b> because it happens <b>indoors</b>.</li>
<li>Using today's <b>temperature–GDP relationship across space</b> as a proxy for warming <b>over time</b>.</li>
<li><b>Surveys</b> that diluted scientists' alarm with economists' optimism.</li>
</ol>
<p>Plus: Nordhaus <b>misrepresented</b> the tipping-point science (a 2008 survey of climate scientists by Tim Lenton and colleagues) to justify a smooth, quadratic damage function (the Ω = 1 − cT² of Module 3).</p>
<p>The next pages take each method in turn, then the tipping-point dispute, then Keen's own argument about energy.</p>
<div class="key">Correcting these errors, damages could be "at least an order of magnitude" (10×) worse than economists say, and could threaten the survival of civilisation.</div>`},
{t:"The irony & the IPCC number", h:`
<ul>
<li>Nordhaus's first big paper (1973) attacked Jay Forrester's <i>World Dynamics</i>, an early computer model warning of limits to growth, as <b>"measurement without data"</b>. Keen says Nordhaus's own climate work is "making up numbers to support a pre-existing belief" that climate change is trivial.</li>
<li>Economists write the economic chapters of the <b>IPCC</b>. IPCC (2014): losses for about 2°C are <b>0.2–2.0% of income</b>.</li>
<li>That's a fall in the <b>level</b> of GDP compared with no warming, not a fall in the growth rate, so it means only a trivial dent in growth.</li>
<li>Keen: this "could soon be exposed as the most significant and dangerous hoax in the history of science".</li>
</ul>
<p>The IPCC lists four methods behind its numbers:</p>
<ul>
<li><b>Enumeration</b> (10 studies): price each physical impact and add them up.</li>
<li><b>Statistical</b> (5): estimate how income varies with temperature across places today.</li>
<li><b>CGE</b> (2): computable general equilibrium models, i.e. simulations of a whole economy's markets.</li>
<li><b>Expert elicitation</b> (1): ask experts for their estimates in a survey.</li>
</ul>
<p>Keen's three "spurious methods" are the first, second and fourth of these.</p>
<p>Honourable exceptions Keen names: Pindyck, Weitzman, DeCanio, Cline, Darwin, Kaufmann, Quiggin &amp; Horowitz. DeCanio: business as usual is "a one-time, irreversible experiment of unknown outcome with the habitability of the entire planet".</p>`},
{t:"Flaw 1: enumeration and the indoors fallacy", h:`
<p>Enumeration means pricing each physical impact (crop yields and so on) and adding them up. That sounds fine, but it started from Nordhaus (1991): "human societies thrive in a wide variety of climatic zones".</p>
<p>Keen asks what a <b>cross-sectional</b> comparison (different places compared at the same moment) has to do with <b>changing the whole planet's climate over time</b>. That a cold country and a hot country can both be rich today says nothing about what happens when every country gets hotter at once.</p>
<ul>
<li>Nordhaus (1991): <b>3%</b> of US output highly sensitive, 10% moderately, <b>87% negligibly</b> affected, citing cardiovascular surgery and microprocessor "clean rooms".</li>
<li>But the "negligible" list includes <b>manufacturing and mining (26%)</b>, trade and services (27.9%), government (14%), finance and real estate (11.4%) and more, adding up to <b>86.9%</b>. So it means anything <b>indoors, or even underground</b>.</li>
<li>IPCC 2014 FAQ 10.3 repeats it: manufacturing and services take place "in controlled environments and are not really exposed".</li>
<li>Every enumeration study since has <b>assumed</b> about 90% of GDP is unaffected.</li>
</ul>
<div class="key">The "poker player's tell": saying activities exposed to the <i>weather</i> are vulnerable to climate, and others aren't, <b>equates climate with weather</b>.</div>`},
{t:"Flaw 2: the statistical (cross-sectional) method", h:`
<p>The approach of Robert Mendelsohn and colleagues: estimate how income varies with temperature <b>across US states</b> today, then assume the same relationship holds <b>over time</b> as the planet warms.</p>
<ul>
<li>Florida (22.5°C) and North Dakota (4.7°C) are poorer than New York (7.4°C), but all are rich by world standards, and temperature is hardly the main cause.</li>
<li>Keen's fit: <b>GSP per capita deviation = −0.318% × ΔT²</b>, with a weak correlation of <b>0.31</b>. GSP = gross state product (a US state's GDP), and ΔT = how far a state's temperature is from the US average.</li>
<li>Absurd implication: move hot and cold states to the average temperature to raise GDP. These studies even computed "optimal" temperatures (agriculture 14.2°C, forestry 14.8°C, energy 8.6°C).</li>
<li>Result: some studies found warming <b>beneficial</b>. Mendelsohn et al. (2000) found 2.5°C gives <b>$97–185 bn a year in benefits</b>.</li>
</ul>
<p><b>Why it's wrong</b>: temperature at a place depends on (1) solar energy reaching Earth, (2) <b>energy retained by greenhouse gases</b>, and (3) <b>location</b> (distance from the equator). The method estimates (3) and applies it to (2). Keen compares it to mapping a mountain north–south, then advising on an east–west crossing in the dark.</p>
<p><b>Richard Tol</b> (who compiled the studies in Nordhaus's Fig 22) wrote on Twitter that 10 K (10°C) of warming is less than the temperature gap between Alaska and Maryland, and "We'd move indoors, much like the Saudis have." Keen replies that 10°C of global warming is about <b>860 million Hiroshima bombs</b> of energy in the atmosphere (1.6 per km²), comparable to the end-Permian extinction.</p>`},
{t:"Flaw 3: the expert surveys", h:`
<div class="vs">
<div><h3>Nordhaus (1994)</h3><ul><li>22 asked, 18 answered fully</li><li>10 economists (8 from <b>outside</b> environmental economics), 4 other social scientists, 5 natural scientists</li><li>Summarised as <b>3°C → 3.6% GDP loss</b></li></ul></div>
<div><h3>Lenton et al. (2008)</h3><ul><li>Sent to 193 scientists, 52 replied</li><li>Glaciology, oceanography, ecology, climate modelling</li><li>Told to stay within their own expertise</li></ul></div>
</div>
${bars([["Non-env. economists",0.4],["Natural scientists",12.3]],13,"%","b2")}
<p class="src">Average estimated GDP loss for 3°C by 2090 in Nordhaus's 1994 survey. The scientists' estimates were 20–30× higher.</p>
<ul>
<li>One scientist refused to answer: "I marvel that economists are willing to make quantitative estimates … where the only measures available are estimates of global surface average increases in temperature."</li>
<li>Economists believed in near-limitless adaptation, with impacts "essentially zero". Larry Summers: "I don't care about ants except for drugs."</li>
<li><b>Nordhaus &amp; Moffat (2017)</b> didn't investigate the gap. They dropped non-economists: Google gave 64 m hits and Google Scholar 2.8 m, but they used only <b>EconLit</b> (the economics-journals database, 1,700 hits), then 24, then just <b>11</b> studies. One "new" data point was <b>Nordhaus (2010) itself, a DICE output</b> (3.4°C → 2.8%), so the model was used to calibrate the model.</li>
</ul>`},
{t:"The quadratic damage function", h:`
<div class="eq">GDP(T) = a + b·T + c·T² &nbsp;&nbsp;or &nbsp;&nbsp;Ω(T) = 1 − c·T²</div>
<p>T = warming in °C. In the first form, a, b and c are numbers fitted to data, so GDP is a smooth curve in T. The second form is the DICE version from Module 3: Ω is the share of output left after damage and c is the damage coefficient. Either way, damage rises smoothly with no sudden jumps. That is Keen's target.</p>
<ul>
<li>Nordhaus says the quadratic, with no tipping points, "is consistent with the survey by Lenton et al. (2008)". In <i>Climate Casino</i> he says Lenton found no critical tipping elements within 300 years below 3°C.</li>
<li>Keen calls these "<b>blatant misrepresentations</b>". Lenton's first element, <b>Arctic summer sea ice</b>, tips at <b>0.5–2°C within decades</b>. Lenton: "the greatest (and clearest) threat is to the Arctic". Nordhaus's table invented a "level of concern" column ranking it lowest.</li>
<li>Lenton's conclusion: "Society may be lulled into a false sense of security by <b>smooth projections</b>." Lenton personally confirmed Keen's reading.</li>
<li><b>"How low can you go?"</b> Nordhaus kept cutting <i>c</i>, from <b>0.0035</b> to <b>0.00227</b>. The predicted loss at 4°C (the "optimal" warming in his Nobel lecture) fell from <b>7% (1992) to 3.6% (2018)</b>.</li>
</ul>`},
{t:"Energy, GDP and the 85% problem", h:`
<p>Production functions use only labour and capital, but "<b>labour without energy is a corpse, while capital without energy is a sculpture</b>".</p>
<figure class="dia"><svg viewBox="0 0 560 120" role="img" aria-label="Keen: energy drives GDP, GDP drives CO2, CO2 drives temperature, with correlations near 1"><rect class="box" x="15.0" y="30" width="107.0" height="56" rx="8"/><text x="68.5" y="54.0" text-anchor="middle">Energy</text><text x="68.5" y="70.0" text-anchor="middle">production</text><path class="arr" d="M125.0,58 L153.0,58"/><text x="139.0" y="22.0" text-anchor="middle" class="a">r = 0.997</text><rect class="box" x="156.0" y="30" width="107.0" height="56" rx="8"/><text x="209.5" y="54.0" text-anchor="middle">Global</text><text x="209.5" y="70.0" text-anchor="middle">GDP</text><path class="arr" d="M266.0,58 L294.0,58"/><text x="280.0" y="22.0" text-anchor="middle" class="a">r = 0.998</text><rect class="box" x="297.0" y="30" width="107.0" height="56" rx="8"/><text x="350.5" y="54.0" text-anchor="middle">Excess CO₂</text><text x="350.5" y="70.0" text-anchor="middle">in atmosphere</text><path class="arr" d="M407.0,58 L435.0,58"/><text x="421.0" y="22.0" text-anchor="middle" class="a">r = 0.992</text><rect class="box" x="438.0" y="30" width="107.0" height="56" rx="8"/><text x="491.5" y="54.0" text-anchor="middle">Temperature</text><text x="491.5" y="70.0" text-anchor="middle">anomaly</text></svg><figcaption>Keen's chain of near-perfect correlations (smoothed data for temperature).</figcaption></figure>
<ul>
<li>If we must stop adding CO₂ "now", GDP falls roughly in proportion to the <b>fossil share of energy</b>.</li>
<li>Fossil fuels are about <b>85%</b> of energy (2020), so stopping in 2020 would cut GDP by roughly <b>85%</b>.</li>
<li>Even at 2015's fast renewables growth (about 3%/yr), renewables reach under 40% of energy by 2050, implying a GDP drop of about <b>60%</b>.</li>
<li>So excluding manufacturing, mining, utilities and services from climate impact is "utterly unjustified".</li>
</ul>`},
{t:"Econometrics before ecology, GIGO & gatekeeping", h:`
<ul>
<li><b>Kahn et al. (2019)</b>: +0.04°C/yr (the high-emissions RCP8.5 scenario, Module 0) → <b>−7.22%</b> GDP per capita by 2100, a <b>linear</b> extrapolation of 1960–2014 with no rare disasters. Keen: warming "shifts the entire distribution", so what's rare now (Greenland melting) becomes certain. He compares it to studying speed skating and concluding warmer ice (+2°C) would help.</li>
<li><b>Burke et al. (2015)</b>: <b>−23%</b> by 2100, nonlinear but still extrapolated from today's economies.</li>
<li><b>GIGO</b> (garbage in, garbage out): Keen expected the high <b>discount rate</b> to be the main problem. Instead it's the made-up damage <b>data</b>, so any model calibrated on it is useless.</li>
<li><b>"Simplifying assumptions"</b>: a genuine simplification (Galileo ignoring air resistance) barely matters if false. These assumptions <b>invalidate</b> the conclusions if false. Friedman's "unrealistic assumptions" defence let them through.</li>
<li><b>Gatekeeping</b>: early authors become referees ("the poachers become the gatekeepers"). Tol (2009) admits a "close-knit community" prone to "group-think, peer pressure, and self-censoring".</li>
</ul>
<div class="kim">Compare with <b>Stern</b>: both attack IAM damage functions. Keen goes further: the empirical base is <i>fabricated</i>, and the key error is not discounting but assuming "relatively small damages in the next two centuries". Stern's critique is mainly about risk, increasing returns and policy design.</div>`},
{t:"Quiz: Keen", q:[
["What is Keen's central objection to the 'enumeration' studies of climate damage?",
 ["They price crop losses at world rather than local market prices","They assume ~90% of output is unaffected because it is indoors","They double-count damages already captured by the statistical and CGE studies","They use too high a discount rate on impacts after 2100"],1,
 "Starting from Nordhaus (1991), they exclude manufacturing, mining, services and government, which equates climate with weather."],
["The statistical (cross-sectional) method is flawed, Keen argues, because it",

 "It estimates the location effect and applies it to extra greenhouse energy. That's the mountain mapped north–south and then crossed east–west."],

["Why does Keen object to Nordhaus & Moffat (2017) including Nordhaus (2010) as a data point?",
