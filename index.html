{t:"The exam, exactly", h:`
<p>From the instructor's end-term announcement on Moodle (12 Nov 2026). The end-sem is worth <b>40%</b> of the course.</p>
<div class="vs">
<div><h3>Part 1 · Objective</h3><ul><li>Short or brief answers</li><li>Definitions, distinctions, "who said what", key numbers</li><li>Covers all readings evenly</li></ul></div>
<div><h3>Part 2 · Application</h3><ul><li>Solve a <b>numerical problem</b></li><li><b>Explain using a graph</b></li><li>Or a related applied question</li></ul></div>
</div>
<p><b>Slides disclaimer</b> (Moodle, 12 Aug): "the slides are only indicative of the material covered. There may also be inadvertent errors. Students are expected to learn from the prescribed reading material." That's why every module here is built from the readings, with the slides used to judge emphasis.</p>
<p><b>Mid-term (30 marks)</b>: MCQs with negative marking plus analytical questions, covering Ambirajan, the two "How bad / Pretty bad" posts, Goodwin 13–14, <i>Climate Casino</i>, Stern and Keen. All of those except Ambirajan and the blog posts are <b>repeated</b> in the end-term syllabus.</p>
<div class="tip">Most of the marks for Part 2 come from Goodwin Ch 13–14 and Nordhaus Ch 15–19. Practise the Pigouvian tax, the fishery, public goods, discounting, the U-shaped cost curve, tax vs cap-and-trade and the Leontief inverse until you can draw and solve them cold. Module 18 collects them.</div>`},

<div class="kim">The latest deck (from the Dropbox link in the 12 Aug "Slides" announcement) adds slides 141–176: <b>adaptation</b> (Thampi, IPCC), climate finance, OWID, <i>Spirit of Green</i>, Raworth and Foster. Slides 1–140 are unchanged from the October version. Mid-term-only files (Ambirajan, Nordhaus 1993) are in <code>readings/midterm_only/</code>.</div>`},
{t:"The one story that links it all", h:`
<ol>
<li><b>The mainstream toolkit</b> (Goodwin, Nordhaus): pollution is an <b>externality</b>, and the atmosphere is a <b>commons</b>. Fix it with a <b>price</b>, either a Pigouvian/carbon tax or cap-and-trade. Weigh costs against damages using <b>cost–benefit analysis</b> and <b>discounting</b>. Nordhaus's answer: an "optimal" warming of roughly 2.3–4°C.</li>
<li><b>The critics</b>:
<ul><li><b>Stern</b>: this is about <i>immense risk</i> and structural transformation, not marginal damage. Use guard-rails (1.5°C), invest, innovate, and don't discount pure time.</li>
<li><b>Keen</b>: the damage numbers behind Nordhaus are made up ("fictional empirics").</li>
<li><b>Foster, Clark &amp; York</b>: turning nature into money (the "Midas effect") is the problem itself.</li>
<li><b>Raworth</b>: define a safe and just space (the doughnut) instead of an optimum.</li></ul></li>
<li><b>The growth question</b> (Naudé): green growth or degrowth? Naudé calls both "fairy tales".</li>
<li><b>India in practice</b> (Pollin; Azad): invest 1.5% of GDP in clean energy, create jobs, and use a carbon tax whose revenue funds a <b>right to energy</b>. The numbers come from <b>input–output analysis</b> (Mair &amp; Druckman).</li>
<li><b>Who pays?</b> (Skovgaard; OWID): how climate finance gets framed and counted, and whether climate aid is new money or relabelled aid.</li>
</ol>`},
{t:"How to score in Part 2", h:`
<ul>
<li><b>Label everything.</b> Axes with units, every curve named (D = MB, S = private MC, SMC), equilibrium points (E<sub>M</sub>, E*) and the values on the axes.</li>
<li><b>Shade and name areas</b>: externality damage, tax revenue, deadweight loss. Then state each area as a number.</li>
<li><b>Write the rule you're using</b>, e.g. "efficient where MB = social MC" or "public good: add MB vertically". That line earns marks even if your arithmetic slips.</li>
<li><b>Show the formula before plugging in</b>: PV = FV/(1+r)<sup>n</sup>; x = (I − A)<sup>−1</sup>y.</li>
<li><b>Finish with one interpretation sentence</b>: "At 5% the project fails CBA, at 2% it passes, so the discount rate decides."</li>
</ul>
<div class="kim">Don't mix up the two tax burdens. In the t-shirt example the price buyers pay rises by $2, not by the full $3 tax. Producers absorb the other $1 through a lower net price.</div>`}

M.push({t:"Externalities, valuation & policy (Goodwin 13)", c:[
{t:"What an externality is", h:`
<p><b>Externality</b>: a side effect of a transaction, positive or negative, that falls on people <b>outside</b> the transaction.</p>
<div class="vs">
<div><h3>Negative</h3><ul><li>Pollution from making t-shirts: pesticides on cotton, dyes, transport fuel</li><li>CO₂ from burning fossil fuels</li></ul></div>
<div><h3>Positive</h3><ul><li>Rooftop solar cuts the need for fossil electricity</li><li>Vaccines, education, cycling</li></ul></div>
</div>
<p>Standard welfare analysis counts only buyers and sellers and leaves out "the rest of society". A full analysis has to include everyone affected.</p>
<ul>
<li><b>Demand curve</b> = marginal benefit (MB) = willingness to pay (WTP).</li>
<li><b>Supply curve</b> = <b>private</b> marginal cost.</li>
<li><b>Social marginal cost</b> = private MC + external damage per unit.</li>
</ul>
<div class="key">A negative externality is an extra <b>cost</b>, so you add it to the <b>supply</b> curve. A positive externality is an extra <b>benefit</b>, so you add it to the <b>demand</b> curve.</div>`},
{t:"The t-shirt example (Fig 13.1)", h:`

xt-anchor="end" class="">E*</text><text x="69.3" y="268.4" text-anchor="start" class="m">shaded band = damage: $3 × 25k = $75k</text><path class="dash" d="M437.3,212.7 L381.3,148.1"/><text x="432.0" y="227.3" text-anchor="start" class="b">K = deadweight loss</text></svg><figcaption>Each shirt causes $3 of damage, so social MC sits $3 above supply. The curves are drawn as straight lines that fit the book's numbers.</figcaption></figure>
<ul>
<li>The market ignores the $3 and settles at <b>E<sub>M</sub>: P = $8, Q = 25,000</b>.</li>
<li>Total externality damage = $3 × 25,000 = <b>$75,000</b>, the blue band.</li>
<li>Up to 20,000 shirts, MB ≥ social MC, so those shirts are worth making. Beyond 20,000, social MC &gt; MB, so each extra shirt makes society worse off.</li>
<li>Efficient point <b>E*: Q = 20,000</b>. The market <b>over-produces</b> by 5,000 shirts.</li>
</ul>
<div class="tip">"Is the market outcome efficient?" Answer: no. Market quantity &gt; efficient quantity because producers don't pay the external cost. The orange triangle K is the welfare lost.</div>`},
{t:"Fixing it: the Pigouvian tax (Fig 13.2)", h:`
<p><b>Pigouvian tax</b> (Arthur Pigou, 1920s): a per-unit tax set <b>equal to the external damage</b>. It shifts supply up by the tax, so the new supply curve <i>is</i> the social MC curve. This is called <b>internalising</b> the externality.</p>

age</text><text x="395.3" y="182.7" text-anchor="start" class="m">old E<tspan dy='3' font-size='9'>M</tspan></text></svg><figcaption>$3 tax: buyers pay $10, sellers keep $7, quantity falls to 20,000.</figcaption></figure>
<ul>
<li>Price rises from $8 to <b>$10</b>, so buyers bear <b>$2</b> of the $3 tax. Producers bear $1 through lower profit.</li>
<li>Damage is still $3 per shirt on 20,000 shirts = <b>$60,000</b>.</li>
<li>Tax revenue = $3 × 20,000 = <b>$60,000</b>. <b>Revenue exactly equals the remaining damage</b>, so the government could in principle compensate society in full.</li>
</ul>
<div class="kim"><ul><li>A Pigouvian tax does <b>not</b> drive pollution to zero. The efficient level of pollution is positive.</li><li>The tax itself has <b>no built-in compensation mechanism</b> and doesn't say how revenue should be used. Options: cut other taxes, compensate victims, fund environmental repair.</li><li>It can be <b>regressive</b>: t-shirts are a bigger share of a poor person's budget, so rebates to low-income households make sense.</li><li>If damage per unit rises (more people develop allergies to the dye), raise the tax.</li></ul></div>`},
{t:"Proof the tax raises welfare (appendix)", h:`
<p>Social welfare = consumer surplus + producer surplus (+ tax revenue) − externality damage.</p>
<table>
<tr><th></th><th>No tax (E<sub>M</sub>)</th><th>Pigouvian tax (E<sub>Tax</sub>)</th></tr>
<tr><td>Consumer surplus</td><td>A+B+E+H</td><td>A</td></tr>
<tr><td>Producer surplus</td><td>C+D+F+G+I</td><td>B+C+D</td></tr>
<tr><td>Tax revenue</td><td>none</td><td>E+F+G</td></tr>
<tr><td>Externality damage</td><td>−(E+F+G+H+I+K)</td><td>−(E+F+G)</td></tr>
<tr class="hl"><td><b>Net benefit</b></td><td><b>A+B+C+D − K</b></td><td><b>A+B+C+D</b></td></tr>
</table>
<p>Both consumer and producer surplus <b>fall</b>, yet society gains area <b>K</b>: the "too much production" where costs including damage exceeded benefits.</p>
<div class="key">An ordinary tax creates deadweight loss (Ch 12). A Pigouvian tax <b>removes</b> deadweight loss. With an externality, intervention <b>increases</b> efficiency.</div>
<p>With the straight lines in the diagram, K = ½ × 5,000 × $3 = <b>$7,500</b>. At Q = 25,000, social MC is $11 while MB is $8, so the gap is $3.</p>`},

<ul>
<li>Example: rooftop solar. The private market produces <b>too little</b>.</li>
<li>Fix: a <b>subsidy</b>, a per-unit payment to producers that shifts supply <b>down</b>, so output rises to Q*.</li>
<li>Goodwin: a formal welfare analysis shows the subsidy raises social welfare. The book doesn't work through the details.</li>
</ul>
<div class="kim">Negative externality → over-production → <b>tax</b>. Positive externality → under-production → <b>subsidy</b>. Both are market failures, and both justify intervention.</div>`},
{t:"Should we tax everything?", h:`
<p>Almost every product pollutes a bit, but few economists want a Pigouvian tax on each one, for two reasons:</p>
<ol><li><b>Administrative cost</b> of collecting many small taxes.</li><li><b>Estimation cost</b>: putting a dollar value on every product's damage isn't worth it.</li></ol>
<p><b>Upstream tax</b>: placed as close as possible to where <b>raw materials are extracted</b>, e.g. per ton of coal at the mine. It's simple to run, and you don't need to estimate damage for each final product because the cost flows through to electricity and anything else made with coal.</p>
<p><b>Revenue-neutral tax</b>: the new environmental tax is offset by cutting other taxes, so the average household's total tax bill stays the same. Since green taxes are regressive, cut a regressive tax such as social insurance taxes.</p>
<ul>
<li>Few countries raise more than <b>10%</b> of tax revenue from environmental taxes. Among developed countries the <b>US is lowest</b> (Fig 13.4).</li>
<li><b>Perverse subsidies</b> (Box 13.1): fossil-fuel subsidies are about <b>12×</b> renewable subsidies. In 2009 that was about <b>$550 bn</b> for fossil fuels vs <b>$43–46 bn</b> for renewables. The G20 agreed to phase them out "over the medium term", with no date.</li>
</ul>`},
{t:"Valuing the environment", h:`
<p>To set a Pigouvian tax you need damage <b>in money</b>.</p>
<ul>
<li><b>WTP principle</b>: something's economic value = the most people are willing to pay for it. Social value = <b>sum</b> of individual WTPs.</li>
<li>Because ability to pay differs, WTP means <b>"one dollar, one vote"</b>, not one person, one vote.</li>
<li>If nobody will pay to save a remote insect, its economic value may be <b>zero</b>.</li>
<li><b>Intrinsic value</b>: value in an ethical or ecological sense, apart from WTP, so nature has a right to exist. This is a principle of <b>ecological economics</b>. <b>Traditional environmental economics</b> counts only WTP-backed values.</li>
</ul>
<p><b>Total economic value (TEV)</b> = everything people would pay for:</p>
<ol>
<li><b>Profit-making uses</b>: timber, fishing, grazing, farming</li>
<li><b>Recreation</b>: camping, hiking, wildlife viewing</li>
<li><b>Ecosystem services</b>: tangible free benefits such as nutrient recycling, wetland flood control, carbon storage, water purification, pollination</li>
<li><b>Nonuse benefits</b>: intangible, e.g. knowing a place exists (existence value) or that it will be there for future generations (bequest value)</li>
</ol>
<div class="kim">TEV gives <b>no priority</b> to any one use. When uses clash (clear-cut vs preserve), CBA picks whichever gives the higher total value.</div>`},
{t:"Four nonmarket valuation methods", h:`
<table>
<tr><th>Method</th><th>How</th><th>Example / catch</th></tr>
<tr><td><b>Cost of illness</b></td><td>Direct costs (medical bills, lost wages) + indirect costs (lost schooling, pain, lost productivity)</td><td>US asthma cost $56 bn in 2007, about $3,500 per affected worker. Gives only a <b>lower bound</b> on WTP.</td></tr>
<tr><td><b>Replacement cost</b></td><td>Cost of a human substitute for a lost ecosystem service</td><td>A $50 m water plant to replace a forest's purification. <b>Not a true WTP</b>: it's a lower bound only if the community would actually pay it.</td></tr>
<tr><td><b>Revealed preference</b></td><td>Infer value from behaviour in related markets. <i>Travel cost</i>: visitors pay different "prices" to reach a site, which traces a demand curve. <i>Defensive expenditure</i>: spending to avoid harm.</td><td>Murray River (Australia) consumer surplus US$155/day. Brazil households spend $16–19/month on water defence. Economists see this as the <b>most valid</b> method, but it can't value ecosystem services or nonuse benefits.</td></tr>
<tr><td><b>Stated preference</b></td><td><i>Contingent valuation</i>: survey WTP for a hypothetical outcome. <i>Contingent ranking</i>: rank scenarios.</td><td>Spain $22/yr for less road noise and air pollution. Azores marine biodiversity $121–837 one-off. The <b>only</b> way to get nonuse values, but the <b>most controversial</b> (respondents overstate, ignore budgets).</td></tr>
</table>
<p><b>Exxon Valdez (1989)</b>: a NOAA panel including two Nobel laureates said contingent valuation can be "the starting point of a judicial process" but has a "likely tendency to exaggerate willingness to pay".</p>
<div class="kim">Defensive expenditure is biased toward the rich: poor people suffering from bad water may not be able to buy bottled water, so their WTP is invisible.</div>`},
{t:"Cost–benefit analysis & discounting", h:`
<p><b>CBA</b>: convert every cost and benefit into money to get a single "bottom line" net social value.</p>
<ol><li>List the costs and benefits for each scenario.</li><li>Convert them to money, using nonmarket valuation where needed.</li><li>Add them up for net benefits, sometimes shown as a benefit/cost ratio.</li><li>Pick the most efficient scenario.</li></ol>
<p>Appeal: it <i>looks</i> objective. Reality: it's often incomplete and depends on assumptions.</p>
<div class="eq">PV = X<sub>n</sub> / (1 + r)<sup>n</sup></div>
<div class="prob"><b>Worked example (Goodwin)</b>An air-quality law costs $10 m now. Benefits of $20 m arrive in 25 years.
<ul><li>r = 5%: PV = 20/(1.05)<sup>25</sup> = 20/3.386 = <b>$5.91 m</b> &lt; $10 m → <b>reject</b></li>
<li>r = 2%: PV = 20/(1.02)<sup>25</sup> = 20/1.641 = <b>$12.19 m</b> &gt; $10 m → <b>accept</b> (net +$2.2 m)</li></ul>
The discount rate alone flips the decision.</div>
<ul><li><b>Market approach</b>: set r = return on low-risk investments such as government bonds (30-yr US Treasury was 3% nominal in early 2013). The rationale is opportunity cost, but the rate is volatile.</li>
<li><b>Ethical approach</b>: a positive r means future generations count for less. Economists who care more about long-run damage prefer <b>lower</b> rates.</li>
<li>r = 0 means a far-future impact counts the same as one today.</li></ul>`},
{t:"Valuing lives & other CBA problems", h:`
<p><b>Value of a statistical life (VSL)</b>: society's WTP to avoid <b>one</b> death, inferred from small changes in risk, without asking whose death.</p>
<div class="eq">VSL = (WTP per household × number of households) / lives saved</div>
<div class="prob"><b>Worked example</b>Households will pay $10/yr for a policy that saves 50 lives. There are 100 m households.<br>Total WTP = $1 bn → VSL = $1 bn / 50 = <b>$20 m</b>.<br>A policy costing $500 m that saves 50 lives costs $10 m per life. That is below the VSL, so it passes CBA.</div>
<ul>
<li>US agencies' VSL went from about <b>$2 m</b> (1980s) to nearly <b>$10 m</b>. The EPA used $9.1 m in 2010, up from as low as $6.8 m under Bush (Box 13.2).</li>
<li>Other CBA problems: (1) <b>uncertainty</b>, (2) <b>missing monetary values</b>, (3) <b>sensitivity to assumptions</b>.</li>
<li><b>Precautionary principle</b>: when there is a low-probability risk of catastrophe, err on the side of caution.</li>
</ul>
<div class="kim">If different assumptions give different answers, you still have to make a subjective choice. That is why CBA is "often not as objective as it may seem".</div>`},
{t:"Four policy tools", h:`
<table>
<tr><th>Tool</th><th>Plus</th><th>Minus</th></tr>
<tr><td><b>Pollution standards</b> (tailpipe limits; DDT ban)</td><td>Definite result. Good for clear health hazards.</td><td>Not cost-effective because every firm cuts the same regardless of cost. No incentive to go beyond the standard.</td></tr>
<tr><td><b>Technology-based</b> (catalytic converters, US 1975)</td><td>Cheap to monitor and enforce. Standardisation can lower the technology's cost over time.</td><td>Not cost-effective. No flexibility.</td></tr>
<tr><td><b>Pigouvian tax</b></td><td>Market-based. Lowest total cost. Price certainty for firms.</td><td>Total pollution is unknown in advance. Politically unpopular.</td></tr>
<tr><td><b>Tradable permits</b></td><td>Market-based. Same lowest cost as a tax. Quantity is certain. Green groups can buy and retire permits.</td><td>Permit price is volatile. Firms lobby for free permits.</td></tr>
</table>
<div class="key">The last two are <b>market-based</b>: they send a price signal and leave each firm to choose how much to cut. The first two are <b>command-and-control</b>.</div>`},
{t:"How a firm responds to a pollution tax (Fig 13.5)", h:`

<div class="key">Every firm ends up with the same marginal cost of reduction (= T). That is why a tax, or a permit market, reaches a given total cut at the <b>lowest total cost</b>. A uniform standard forces the high-cost firm to cut as much as the low-cost one.</div>`},
{t:"Tax vs permits, and the evidence", h:`
<div class="vs">
<div><h3>Tax</h3><ul><li><b>Price</b> certain → easier long-term investment</li><li><b>Quantity</b> uncertain (depends on unknown MCR curves)</li><li>May need politically painful increases</li></ul></div>
<div><h3>Tradable permits</h3><ul><li><b>Quantity</b> certain (= permits issued)</li><li><b>Price</b> uncertain and can swing wildly</li><li>Fewer permits each period → tighter cap</li></ul></div>
</div>
<p><b>EU ETS price swings</b>: about €30/t in 2006 → €0.10 in 2007 (too many permits) → over €20 in 2008 → under €3 in 2013.</p>
<p><b>US SO₂ trading</b> (1990 Clean Air Act Amendments, Box 13.3): target was 50% of 1980 levels by 2010. Emissions actually fell <b>83%</b>, and cost savings were about <b>50%</b> versus a uniform standard. It covers 2,000+ power plants, mostly with free permits; about 3% are auctioned.</p>
<p><b>US Clean Air Act (1970)</b>: the six major pollutants fell <b>68%</b> from 1970 to 2011, and lead fell 97%. In 2010 compliance cost $53 bn against benefits of $160 bn–$3.8 tn, so <b>$3–$72 of benefit per $1</b>. The Act explicitly <b>rules out CBA</b> when setting standards.</p>
<p><b>Jobs vs environment</b>: the evidence says the trade-off is "a myth". Environmental protection creates and displaces jobs, and the net effect is positive (US 2008). A UK 2007 study found no significant job loss. Federal environmental rules from 2000–10 cost $24–29 bn and brought $82–550 bn in benefits.</p>
<div class="kim">The two instruments reach the same reduction at the same cost. The difference is <b>where the uncertainty lies</b>: price under permits, quantity under a tax.</div>`},
{t:"Quiz: Goodwin Ch 13", q:[
["In the t-shirt market the external damage is $3 per shirt and the market sells 25,000 shirts at $8. After an optimal Pigouvian tax, which statement is correct?",
 ["Price rises to $11 and quantity falls to 20,000, so buyers carry the whole tax","Price rises to $10 and the tax revenue of $60,000 equals the remaining damage","Price rises to $10 and the remaining damage falls to zero because it is internalised","Price stays at $8 because the tax is collected upstream from the producers"],1,
 "The tax shifts supply up by $3. The new equilibrium is $10 and 20,000 shirts. Damage of $3 × 20,000 = $60,000 remains and exactly equals revenue. Buyers bear $2, producers $1."],
["Why does a Pigouvian tax raise total welfare even though consumer and producer surplus both fall?",
 ["Tax revenue is larger than the lost consumer and producer surplus combined","It removes area K, where social MC exceeded MB","Producers pass the full tax on, so the loss falls only on consumers","It reduces external damage to zero, which outweighs the surplus loss"],1,
 "Net benefit rises from A+B+C+D−K to A+B+C+D. Revenue only offsets the damage that remains."],
["A regulator estimates the value of a forest's water purification from the cost of building a treatment plant. What is the main weakness of this estimate?",
 ["It measures only nonuse values, not the tangible services of the forest","It is a cost of substitution and need not reflect what people would actually pay","It systematically overstates value because plants cost more than forests","It relies on surveys, so respondents can exaggerate their answers"],1,
 "Replacement cost is not WTP. It is a lower bound only if the community would actually pay for the plant."],
["Which valuation method is the only one that can capture nonuse (existence) values?",
 ["Travel cost models based on visitors' journey expenses","Defensive expenditures such as bottled water purchases","Contingent valuation (stated WTP) surveys","Cost of illness estimates built from medical bills and lost wages"],2,
 "Revealed preference needs actual behaviour, and nonuse benefits involve none. Only stated preference methods can reach them."],
["A $100 m regulation yields $250 m of benefits in 25 years. At 5% the PV is about $74 m. At 3% it is about $119 m. What should you conclude?",
 ["Reject at both rates, because benefits arrive too far in the future","Accept at both rates, because undiscounted benefits are 2.5× the cost","Reject at 5% but accept at 3%, so the choice of rate decides the result","Accept at 5% but reject at 3%, since a higher rate favours long-term projects"],2,
 "250/1.05²⁵ ≈ 73.8 < 100 and 250/1.03²⁵ ≈ 119.4 > 100. This is Goodwin's Aqualand exercise."],
["Households will pay $10 a year for a policy that cuts pollution deaths by 50. There are 100 million households. What is the implied value of a statistical life?",
 ["$2 million","$20 million","$200 million","$10 million"],1,
 "Total WTP is $1 bn. Dividing by 50 lives gives $20 m per statistical life."],
["What is the key advantage of an upstream carbon tax, levied at the coal mine?",
 ["It guarantees a fixed quantity of emissions each year","No need to estimate damage for each final product","It ensures that consumers do not end up bearing any of the tax burden","It makes the tax progressive rather than regressive"],1,
 "The cost flows through to electricity and everything made with coal. It is administratively simple, but it is still passed on to consumers and still regressive."],
["Firm A can cut pollution cheaply and firm B only at high cost. Both face the same pollution tax. What happens?",
 ["Both cut the same amount, as under a uniform standard","A cuts more than B, and both end with MCR equal to the tax","B cuts more than A, because B faces larger damages","Neither cuts at all, since each firm simply pays the tax instead"],1,
 "Each firm cuts until its MCR equals T. The low-cost firm does more, which minimises total cost."],
["Which pair correctly matches each instrument with what it leaves uncertain?",
 ["Carbon tax: the price of emissions. Permits: the quantity of emissions","Carbon tax: the quantity of emissions. Permits: the price of emissions","Both leave quantity uncertain, but permits have lower admin costs","Both leave price uncertain, but taxes raise more government revenue"],1,
 "A tax fixes the price and lets quantity adjust. A cap fixes the quantity and lets price adjust. The EU ETS swung from €30 to €0.10."],
["Goodwin's view on whether environmental regulation costs jobs is that",
 ["regulation causes large net job losses, which are justified by the health gains","the trade-off is largely a myth, with net job effects near zero or positive","job losses are avoided only when the new taxes are made fully revenue-neutral","the evidence is too thin to conclude anything, so each case needs its own CBA"],1,
 "A US 2008 study found a positive net effect, and a UK 2007 study found no significant effect. Goodwin calls the trade-off a myth."]
]}
]});

M.push({t:"Public goods & the commons (Goodwin 14)", c:[
{t:"When there is no market at all", h:`
<p>Ch 13 starts from a market and corrects it. Ch 14 asks what happens when <b>ownership is unclear</b>, so there may be no market at all:</p>
<ul><li>Oceans, apart from coastal zones</li><li>Unowned forests and wetlands with no clear management rules</li><li><b>The atmosphere</b>: "crucial to all of us but owned by nobody"</li><li>Public parks, beaches, river fisheries; public airwaves</li></ul>
<p>Two properties sort all goods:</p>
<ul><li><b>Excludable</b>: the owner can stop others from using it.</li><li><b>Rival</b>: one person's use leaves less for others.</li></ul>`},
{t:"The four types of goods (Table 14.1)", h:`
<div class="tw"><table>
<tr><th></th><th>Rival</th><th>Nonrival</th></tr>
<tr><th>Excludable</th><td><b>Private goods</b><br>t-shirts, groceries, cars, haircuts</td><td><b>Artificially scarce (club) goods</b><br>cable TV, health clubs, toll roads</td></tr>
<tr><th>Nonexcludable</th><td><b>Common property resources</b><br>ocean fisheries, groundwater, a community basketball court</td><td><b>Public goods</b><br>national defence, free radio, public education, national parks</td></tr>
</table></div>
<ul>
<li><b>Nonrival</b> → the marginal cost of serving one more user is <b>zero</b>.</li>
<li><b>Congestion</b>: a nonrival good turns rival once demand passes a point. A crowded park or gym behaves like a CPR.</li>
<li>"Public good" ≠ "government-owned". An NGO's nature reserve can be a public good, and public grazing land leased to one rancher is a private good.</li>
</ul>
<div class="key">For every type except private goods, private markets <b>almost always fail</b>. That alone justifies intervention on efficiency grounds.</div>
<div class="tip">Classic short question: classify movie seats (private, or club up to capacity), traffic lights (public), a lake on private land (club or private), a lake on public land (CPR or public), rental cars (private), a pure river used for drinking and dumping (CPR), a free hospital for the poor (publicly provided private good). Say why: excludable? rival?</div>`},
{t:"Artificially scarce goods (Fig 14.1)", h:`

<ul>
<li>At $30/month, <b>80,000</b> households subscribe and revenue = $30 × 80,000 = <b>$2.4 m/month</b>.</li>
<li>The efficient rule is MB = MC = 0, so serve <b>all 120,000</b> households who value it at all.</li>
<li>Serving the other 40,000 for free would add the orange triangle to welfare, but no profit-maker will do it.</li>
<li><b>Price discrimination</b> (charging by WTP) could reach some of them, but it's often illegal or impractical. College financial aid is one exception, though it's driven by ethics, not zero MC.</li>
<li>Club goods are often supplied by <b>monopolies</b>, so regulation may cap prices or require cheaper rates for poor households.</li>
</ul>`},

lass="dot" cx="347.0" cy="106.8" r="3.5"/><circle class="dot" cx="456.6" cy="162.2" r="3.5"/><text x="516.8" y="223.5" text-anchor="end" class="">RT (revenue per trip)</text><text x="62.0" y="178.2" text-anchor="start" class="a">PC = $15k (private cost)</text><text x="460.0" y="72.3" text-anchor="end" class="b">SC (social cost)</text></svg><figcaption>Every trip costs $15,000. Each early trip earns $25,000. After T<sub>0</sub>, crowding cuts everyone's catch.</figcaption></figure>
<ul>
<li><b>PC</b> = private cost per trip, a flat <b>$15,000</b> (labour, boat, fuel).</li>
<li><b>RT</b> = revenue per trip: $25,000 up to <b>T<sub>0</sub></b> (profit $10,000), then <b>falling</b> as the fishery crowds.</li>
<li>Beyond T<sub>0</sub>, each new trip lowers <i>everyone else's</i> catch. That lost profit is an external cost, so <b>SC</b> (social cost) rises above PC.</li>
<li><b>Efficient level T*</b>: where RT = SC, so the new trip's profit just offsets the losses it causes to others.</li>
<li><b>Open access goes to T<sub>e</sub></b>: boats keep entering while RT &gt; PC, until profit per trip = 0. The stock can then crash.</li>
</ul>
<div class="key">This is a negative externality <b>among the users themselves</b>: each user imposes costs on the others. The unregulated outcome T<sub>e</sub> &gt; T* is inefficient and can be ecologically unsustainable.</div>
<div class="kim">The book's text has a slip. It says SC is "out-of-pocket costs of $10,000 plus the external cost", but the private cost per trip is <b>$15,000</b> (the $10,000 is the initial profit). In an exam, use PC = $15,000.</div>`},
{t:"Policies for the commons", h:`
<ol>
<li><b>Per-trip fee</b> = the external cost each trip imposes (a Pigouvian tax on access). Adjust it until trips fall to T*.</li>
<li><b>Individual transferable quotas (ITQs)</b>: a manager sets a total allowable catch low enough to protect the resource, then issues tradable rights. They can be <b>given free or auctioned</b>. Auction revenue can fund the resource or compensate fishers forced out. The <b>price</b> is set by supply and demand, not the government. Used in Australia, Canada, Iceland and the US.</li>
</ol>
<p><b>Box 14.1 · Long Island clams</b>: 22 permits, total 300,000 bushels/yr (about 13,600 each), each worth about $135,000 in gross revenue (2011). The old rule of one permit per boat blocked efficiency gains. In 2011 "cooperative harvesting" let one boat use several permits, with the same total cap but lower cost.</p>
<div class="tip">ITQs are to fisheries what tradable permits are to pollution. If asked for "two policies for a CPR", give the fee and ITQs and say how each reaches T*.</div>`},
{t:"Tragedy of the commons, and Ostrom", h:`
<p><b>Garrett Hardin (1968)</b>, an ecologist: picture a pasture open to all. Adding one more cow gives the herder about <b>+1</b> in gain, while the overgrazing cost is shared, so he bears only a <b>fraction</b> of it. Every rational herder keeps adding: "Freedom in a commons brings ruin to all."</p>
<p><b>Elinor Ostrom</b> (Nobel, 2009) pushed back: commons can be managed successfully <b>by the people who use them</b>, through social norms, customs and local institutions, rather than by governments or private firms. Many such systems have lasted for generations.</p>
<div class="vs">
<div><h3>Common property</h3><p>Shared, but use may be regulated by custom and rules.</p></div>
<div><h3>Open access</h3><p>Anyone, unlimited, no rules. This is where Hardin's tragedy actually happens.</p></div>
</div>
<div class="kim">Goodwin notes that degradation often follows when <b>market institutions encroach</b> on community-managed commons. If an exam asks about limitations of the tragedy argument, cite Ostrom, the common-property vs open-access distinction, and that community rules can work.</div>`},
{t:"Public goods & free riders (Fig 14.3)", h:`
<p>Nonexcludable + nonrival → nobody needs to pay to benefit. Private markets usually supply <b>zero</b>. Donations (public radio, conservation NGOs) help but fall short because of <b>free riders</b>, people who benefit without paying.</p>

<ul>
<li>At 10 acres, Doug's MB is $5 and Sasha's is $2, so social MB = <b>$7</b>.</li>
<li>Preservation costs $7/acre, so the optimum is <b>10 acres</b>, where social MB = MC.</li>
<li>Cost = $70 → tax each $35. Doug gets at least $50 of benefit and accepts. Sasha may object.</li>
<li>Scaled to about 115 m US households: $35 × 115 m ≈ <b>$4 bn</b>.</li>
<li>For a public good, <b>WTP &lt; MB</b>: Doug gains $5 but may say he'll pay $3 or nothing (free riding). Surveys are unreliable, so provision becomes a <b>political</b> decision funded by taxes.</li>
</ul>
<div class="key">Private good: add demand curves <b>horizontally</b> (quantities). Public good: add MB curves <b>vertically</b> (prices).</div>`},
{t:"Climate change as a commons & public good", h:`
<ul>
<li>The Stern Review (2006) called climate change "the greatest and widest-ranging <b>market failure</b> ever seen". Lagarde (IMF, 2013): "the greatest economic challenge of the twenty-first century".</li>
<li>CO₂ per capita (Goodwin's data): US about 18 t, Germany 9, China 7, <b>India 1.4</b>, Kenya 0.3. So equal % cuts for all would lock in inequality.</li>
<li><b>Bathtub</b>: CO₂ stays for decades to centuries, so even a 50% cut in emissions still lets concentrations rise.</li>
<li>IPCC: global CO₂ must fall <b>50–80% by 2050</b>.</li>
<li>CBA of climate is hard because of <b>uncertainty</b> and the <b>long time horizon</b>: costs now, benefits later. So the <b>discount rate</b> is critical.</li>
<li>Earlier studies suggested a modest tax of $20–40 per ton of carbon. <b>Stern</b> said BAU damage is at least <b>5%</b> and up to <b>20%</b> of GDP, with a tax above <b>$300/t C</b>. The main reason is his <b>1.4%</b> discount rate vs 4–5% elsewhere, plus the precautionary principle.</li>
<li>A stable climate is a <b>global public good</b>, and cutting emissions creates a positive externality. Free-riding means it needs <b>international agreement</b>.</li>
</ul>`},
{t:"Kyoto & the Earth Atmospheric Trust", h:`
<p><b>Kyoto Protocol (1997)</b>: industrialised countries took targets for 2012 relative to 1990 (US −7%, France −8%, Japan −6%). Developing countries like China and India had no binding targets.</p>
<ul><li>191 countries ratified. The <b>US signed but never ratified</b> and Bush rejected it in 2001. It entered into force in 2005 after Russia ratified in Nov 2004.</li>
<li>The overall −5% target was roughly met, but mostly through <b>Russia's post-1991 economic collapse</b>, not policy.</li>
<li>The sticking point remains whether developing countries should face mandatory cuts.</li></ul>
<p><b>Earth Atmospheric Trust</b> (Barnes, Costanza, Ostrom and others, 2008): treat the atmosphere as a commons that everyone owns equally.</p>
<ul><li>A <b>global cap-and-trade</b> scheme with all permits <b>auctioned</b>, raising about <b>$1–4 trillion</b> a year.</li><li>Part goes to low-carbon tech, adaptation and repair. Half or more is paid out as an <b>equal per-capita dividend</b>, about <b>$300/person/yr</b>.</li><li>That partly offsets higher prices in rich countries and is a big income boost in poor ones, so it cuts poverty too.</li></ul>
<div class="kim">Kyoto is a free-rider story, and the Trust applies CPR logic (equal ownership, auctioned rights, dividends). Compare it with Azad's right to energy, where carbon-tax revenue also comes back to the poor.</div>`},
{t:"Quiz: Goodwin Ch 14", q:[
["A toll road that rarely has traffic jams is best classified as",
 ["a common property resource, since anyone who pays can use it at the same time","a club (artificially scarce) good","a public good, since one more car adds nothing to the cost","a private good, since a price is charged for each use of it"],1,
 "Non-payers can be excluded (excludable), but many can drive at once (nonrival) until congestion sets in."],
["In the fishery model, why does open access lead to T<sub>e</sub> rather than T*?",
 ["Fishers stop when total profit peaks, but the stock regenerates more slowly","Each fisher enters while revenue per trip exceeds private cost, ignoring losses to others","The private cost per trip rises with each entry until it finally equals the revenue per trip","Revenue per trip stays at $25,000 until the stock suddenly collapses at T<sub>e</sub>"],1,
 "Entry continues until RT = PC, where profit per trip is zero. The external cost of lowering others' catch is ignored."],
["An aquifer: pumping costs 50 pesos a day. Revenue per farm with 1–9 farms is 100, 100, 100, 90, 80, 65, 55, 40, 20. How many farms pump with no regulation, and what is the efficient number?",
 ["7 farms pump; efficient number is 4","9 farms pump; efficient number is 3","6 farms pump; efficient number is 5","7 farms pump; efficient number is 3"],0,
 "Profit per farm: 50, 50, 50, 40, 30, 15, 5, −10, −30. Farms enter while profit > 0, so 7. Total profit (n × profit) peaks at 160 with 4 farms."],
["Katya's MB for acres 1–6 of habitat: 50, 40, 30, 20, 10, 0. Miguel's: 30, 25, 20, 15, 10, 5. Habitat costs $40 an acre. What is the efficient amount?",
 ["2 acres, where Katya's own MB equals $40","3 acres: summed MB is 50 there, 35 at the fourth","4 acres, where Miguel's and Katya's MB add to $35","1 acre, since only the first acre clears $40 for both"],1,
 "Add vertically: 80, 65, 50, 35, 20, 5. The third acre (50) is above $40; the fourth (35) is not."],
["Why is a person's willingness to pay for a public good typically below their marginal benefit?",
 ["Public goods are rival, so heavy use lowers the benefit to each user","They benefit anyway, so they have an incentive to free ride","Their benefit is nonuse, which never shows up in any market","Government provision crowds out the private demand for the good"],1,
 "Free-rider incentive: nonexcludability means you get the benefit whatever you pay."],
["What was Elinor Ostrom's main correction to Hardin's tragedy of the commons?",
 ["Commons are best privatised, because owners will then internalise overuse","Users often manage commons well through norms and local rules","Only strong central governments can prevent overuse of shared resources","The tragedy applies to public goods rather than to common resources"],1,
 "Ostrom (Nobel 2009) documented long-lasting community management. The tragedy really describes open access, not every commons."],
["The Earth Atmospheric Trust proposal combines",
 ["a global carbon tax with revenue used to cut income taxes in each country","auctioned global permits with part of the revenue paid out per head","free permits for poor countries with a carbon tax on rich ones","national quotas set by Kyoto with trading allowed only between OECD states"],1,
 "All permits are auctioned ($1–4 tn/yr), with half or more paid as about $300 per person per year."],
["According to Goodwin, the overall Kyoto target for industrialised countries was roughly met mainly because of",
 ["the EU emissions trading scheme driving deep cuts after 2005","the economic collapse of Russia after the Soviet Union ended","US federal regulations under the Clean Air Act amendments","China and India adopting voluntary intensity targets"],1,
 "The −5% was met largely thanks to Russia's post-1991 collapse, not deliberate policy."],
["Goodwin attributes the gap between the Stern Review and earlier studies mainly to",
 ["Stern's higher estimate of climate sensitivity to CO₂","Stern's lower discount rate of 1.4% versus 4–5%","Stern's use of a quadratic rather than linear damage function","Stern's assumption of faster economic growth in poor countries"],1,
 "He also weighted catastrophic risk more (precautionary principle), but the discount rate is the main driver."],
["Cable TV costs nothing to send to one more home. At $30 a month 80,000 subscribe, but 120,000 value it. What is the efficient number served?",
 ["80,000, because that is where demand meets the price set by the firm","120,000, since MC is zero and all with positive MB should be served","100,000, halfway between, which maximises revenue and welfare together","0, because without a supply curve no equilibrium quantity can exist"],1,
 "Efficient where MB = MC = 0, so all 120,000. The monopoly price leaves out 40,000 and creates a welfare loss."]
]}
]});

M.push({t:"Adding up the damages (Nordhaus 12)", c:[
{t:"Five themes from the impact chapters", h:`
<p>Nordhaus first goes "house to house" through each sector (farming, health, oceans, hurricanes, species), then adds it all up. Five themes:</p>
<ol>
<li>Damages are <b>externalities of rapid economic growth</b>. Zero growth would greatly reduce the threat.</li>
<li><b>Managed systems</b> (the industrial economy) vs <b>unmanaged or unmanageable</b> systems (ocean acidification). Worry most about the unmanaged ones.</li>
<li>High-income market economies are <b>increasingly insulated</b> from climate. Agriculture is shrinking, and even farming depends less on raw nature.</li>
<li>Forecasting impacts on economies a century from now is like looking through a <b>"fuzzy telescope"</b>.</li>
<li>The most troubling impacts are <b>far from the market</b>: ecosystems, species, acidification, cultural treasures. "Economics can contribute least in areas where we need it most."</li>
</ol>`},
{t:"Vulnerability by sector (Table 5)", h:`
<p>US industries grouped by exposure, as a share of national income:</p>
<table>
<tr><th>Group</th><th>Examples</th><th class="r">1948</th><th class="r">2011</th></tr>
<tr><td>Heavily impacted</td><td>farming, forestry, fishing</td><td class="r">9.1%</td><td class="r"><b>1.2%</b></td></tr>
<tr><td>Moderately impacted</td><td>coastal real estate, transport, construction, utilities</td><td class="r">11.6%</td><td class="r">9.0%</td></tr>
<tr><td>Lightly / negligibly</td><td>manufacturing, finance, health, government, mining…</td><td class="r">79.3%</td><td class="r"><b>89.8%</b></td></tr>
</table>
<ul>
<li>Example: <b>neurosurgery</b> happens in "highly controlled environments", so climate barely matters.</li>
<li>Services went from 25% of the economy (1929) to 52%. Farming is about 1% of the US workforce (2012).</li>
<li>Low and middle-income countries: agriculture's share of GDP fell from 25% (1970) to 10% (2010). Of 166 countries, only <b>4</b> show a rising share: DR Congo, Sierra Leone, Central African Republic, Zambia.</li>
</ul>
<p>Nordhaus calls this shift away from climate-exposed sectors "one of the central findings of the economics of climate change".</p>
<div class="kim">This is exactly what <b>Keen</b> attacks (Module 9). He says Nordhaus assumes about 87–90% of GDP is unaffected because it happens "indoors", which confuses <i>weather</i> with <i>climate</i>.</div>`},

<ul>
<li>Studies compiled by <b>Richard Tol</b>. For the warming levels studied, impacts are "relatively small". The <b>largest</b> estimate is about <b>5%</b> of output.</li>
<li>Most-studied case: <b>2.5°C</b> (expected around 2070), with a central damage of about <b>1.5% of global output</b>.</li>
<li>The IPCC estimate (arrow at 4°C) draws on the same studies, so it is an expert appraisal, not independent.</li>
<li>Damages are <b>nonlinear and convex</b>. The first ~1°C may even be <b>beneficial</b> (CO₂ fertilisation of crops). The <b>incremental cost at 3°C is about twice that at 2°C</b>.</li>
<li>Tipping points are <b>not</b> reliably included.</li>
</ul>
<div class="tip">If you're asked for "Nordhaus's headline damage number", say <b>1–5% of output for 3°C</b>. That compares with per-capita GDP rising <b>500–1,000%</b> over the same period in poor and middle-income countries, so it's roughly <b>one year's growth</b> spread over decades.</div>`},
{t:"The DICE model & IAMs (from the slides)", h:`
<p><b>DICE</b> = <b>D</b>ynamic <b>I</b>ntegrated model of <b>C</b>limate and the <b>E</b>conomy. It takes a standard neoclassical optimal-growth (<b>Ramsey</b>) model and adds a climate module: economic activity → emissions → climate change → damages → policy.</p>
<p><b>Integrated assessment models (IAMs)</b> combine physical science and economics. They project emissions from population and growth, model temperature and sea level, convert future damages to present value, and find the optimal policy. The big three:</p>
<ul><li>Nordhaus's <b>DICE</b></li><li>Richard Tol's <b>FUND</b> (Climate Framework for Uncertainty, Negotiation and Distribution)</li><li>Chris Hope's <b>PAGE</b> (Policy Analysis for the Greenhouse Effect)</li></ul>
<p>They differ in regional detail and in how they handle uncertainty and adaptation.</p>
<p><b>Damage function</b>: the fraction of output left after damages, often Ω(T) = 1 − cT² (quadratic). A lower <i>c</i> means less damage for the same warming. Nordhaus repeatedly <b>recalibrated <i>c</i> downward</b> (Keen's point).</p>
<div class="kim">The slides also cover Nordhaus's 1993 JEP paper (DICE vs IPCC warming projections, the expert survey). That paper was mid-term reading and <b>isn't on the end-term list</b>, so it isn't covered here.</div>`},
{t:"A risk premium for the Climate Casino", h:`
<p>Think of each year of emissions as a <b>spin of a planetary roulette wheel</b>:</p>
<ul>
<li>Red or black: fast or slow emissions growth, high or low climate sensitivity, good or bad adaptation in the grain belts.</li>
<li><b>Zero</b>: big loss of species, ecosystems, landmarks like Venice.</li>
<li><b>Double zero</b>: collapse of the West Antarctic Ice Sheet, permafrost melt, reversal of North Atlantic currents, ocean mass extinction.</li>
<li>The wheel may be "weird": we may not know the numbers, there may be more red pockets than we think, and outcomes compound nonlinearly. "The total climate impacts are more than the sum of the individual parts."</li>
</ul>
<p>So add an <b>insurance (risk) premium</b> on top of the identified damages. Experts' suggestions range from very small to <b>doubling or tripling</b> the damage estimates.</p>`},
{t:"Reservations, and the 2°C verdict", h:`
<p><b>Cautions about the estimates:</b></p>
<ul>
<li>They cover only <b>quantifiable, market or near-market</b> sectors (farming, real estate, forestry, health).</li>
<li>Many small ± items are left out (heating vs cooling, winter coats, ski snowmaking, Arctic harbours). Could these add up to "economic death by 1,000 climatic cuts"? Nordhaus thinks it unlikely.</li>
<li>Species and ecosystem losses are <b>doubly difficult</b>: the physical impacts are complex <i>and</i> there are no reliable valuations.</li>
<li><b>Tipping points</b> are hard to forecast and lie outside markets, much like existential national-security debates ("geophysical bank runs").</li>
</ul>
<p><b>Four areas of special concern</b> outside the market: sea-level rise, hurricane intensification, ocean acidification, biodiversity loss, plus tipping points.</p>
<p><b>Copenhagen 2°C (2009)</b> is "both too low and too high":</p>
<div class="vs"><div><h3>Too low</h3><p>given the identified (modest) damages and the high cost of getting there</p></div><div><h3>Too high</h3><p>if, as many earth scientists believe, we've already crossed dangerous tipping thresholds</p></div></div>
<p>The way out is to <b>bring in costs</b> (Ch 15) and balance them (Ch 18).</p>
<div class="kim">Nordhaus also predicts that today's poor countries become <b>less</b> vulnerable: China and India's incomes rose almost 10× in 50 years, and another 50 years of that would bring them to about $50,000 per head, mostly in services. Critics (Stern, Keen) say this assumes away the damage itself.</div>`},

M.push({t:"Costs of slowing climate change (Nordhaus 15)", c:[
{t:"Four ways to cut emissions", h:`
<ol>
<li><b>Slow economic growth</b>. This would lower living standards and is "really not in contention".</li>
<li><b>Change lifestyles</b>: curb carbon-intensive activities, e.g. don't fly around the world.</li>
<li><b>Low- or no-carbon technologies and fuels</b>: gas or wind instead of coal for power.</li>
<li><b>Burn fossil fuels but remove the CO₂</b> after combustion (capture).</li>
</ol>
<p>Climate policy should encourage <b>2, 3 and 4</b> across billions of people, firms and governments.</p>
<div class="key">"The central lesson from economics is that attaining the goals of climate-change policy, particularly the ambitious ones, will require substantial investments."</div>`},
{t:"The metric: $ per ton of CO₂ reduced", h:`
<p>It's a price for <i>not</i> producing something, like paying to have trash carted away. Spend $1,000 to cut 10 t, and the cost is <b>$100/t</b>.</p>
<div class="prob"><b>Example 1 · new fridge</b>Costs $1,000 and saves $50/yr for 10 yrs, so the net cost is $500 (ignoring discounting). It emits 0.3 t less CO₂ per year, or 3 t over 10 years.<br>Cost = 500 / (0.3 × 10) = <b>$167 per ton</b>. It would be higher if discounted.</div>
<div class="prob"><b>Example 2 · gas instead of coal</b>The old coal plant costs 1¢/kWh more to run. Gas emits 0.5 t less CO₂ per 1,000 kWh.<br>Cost = ($10 / 1,000 kWh) ÷ (0.5 t / 1,000 kWh) = <b>$20 per ton</b>.</div>
<p>That's a difference of almost <b>10×</b> between the two options. Across billions of tons, choosing the cheapest options matters enormously.</p>
<div class="tip">Very likely as a Part 2 numerical. Formula: cost per ton = net cost ÷ tons avoided. Watch the units (cents/kWh → $ per 1,000 kWh).</div>`},
{t:"What the cost studies find", h:`
<ul>
<li>There are many <b>cheap</b> options, some with <b>negative cost</b> (discounted energy savings exceed the upfront cost).</li>
<li>Costs <b>rise steeply</b> as cuts deepen. A <b>10–20%</b> cut is cheap or even free; <b>80–90%</b> in a few years is extremely expensive.</li>
<li>There is <b>no silver bullet</b>, just countless options in every sector.</li>
<li>Don't ignore non-fossil gases. Replacing CFCs, for example, also cut warming.</li>
</ul>
<p><b>Where cuts should come from</b>: a US plan for a 40% GHG cut by 2030 (EIA model) gets most of it from <b>coal</b>. Coal use falls <b>90%</b>, while oil and gas fall only about 5% each. Coal has the most CO₂ per $ of energy, and gas is a cheap substitute.</p>
<div class="kim">"Coal is king" for cheap reductions, but the policies governments like best (efficiency rules for cars and fridges) don't touch coal, and cutting coal meets "ferocious opposition".</div>`},

0,97.7 L528.0,95.3 L532.0,92.9 L536.0,90.4"/><path class="dash" d="M56.0,184.3 L344.0,184.3 L344.0,286.0"/><text x="344.0" y="302.0" text-anchor="middle">30%</text><text x="50.0" y="188.3" text-anchor="end">≈0.5%</text><circle class="dot" cx="344.0" cy="184.3" r="3.5"/><text x="491.6" y="41.0" text-anchor="end" class="a">Engineering (bottom-up)</text><text x="536.0" y="108.4" text-anchor="end" class="b">Economic (top-down)</text><text x="65.6" y="272.3" text-anchor="start" class="a">negative-cost options</text></svg><figcaption>Average cost of reductions as % of income, 2025. Stylised to the book's description.</figcaption></figure>
<div class="vs">
<div><h3>Engineering / bottom-up</h3><ul><li>Looks at specific technologies (cars, furnaces, power plants)</li><li>Finds <b>negative-cost</b> options: about 15% cut while saving money, another ~15% cheap</li><li>Starts lower but rises <b>more steeply</b>, because it covers only a few dozen technologies and misses behaviour changes like not flying</li></ul></div>
<div><h3>Economic / top-down</h3><ul><li>Statistical links between energy use, prices and incomes (aggregates)</li><li>Assumes <b>no negative-cost options</b>: if they existed, they'd already be used</li><li>Rises more gently because it allows for all ways to cut</li></ul></div>
</div>
<ul><li>At a <b>30%</b> cut both give a little over <b>0.5% of income</b>. For the 2012 US that is about <b>$15/t</b> and about <b>$100 bn/yr</b>.</li>
<li>Nordhaus uses <b>top-down</b> because it matches observed behaviour. Knowing negative-cost options exist doesn't mean we can find and exploit them. "The jury is still out."</li>

<ul>
<li><b>Utopian case</b> (100% participation, efficient, well timed, no exemptions): <b>2°C costs about 1.5% of world income</b>, about one year's growth. Going lower (1°C) is far more expensive.</li>
<li><b>50% participation</b> (countries with half of emissions join now, the rest next century): costs explode below 4°C, and <b>2°C becomes virtually impossible</b>, not just costly. Kyoto covered only <b>one-fifth</b> of emissions in 2012.</li>
<li><b>Inefficient policy</b> (a hodgepodge of rules, taxes, subsidies and exemptions) <b>doubles</b> costs. With 50% participation plus inefficiency, a 3.5°C target goes from 1.5% to <b>3%</b> of income, and 3¼°C from 4% to <b>8%</b>.</li>
<li><b>EMF-22</b> model comparison: with universal participation about half the models could reach 2°C. With partial participation <b>20 of 22</b> runs found it infeasible ("a horrible economic depression"). The highest cost estimate was <b>12×</b> the lowest.</li>
</ul>
<div class="key">Efficiency means <b>equal marginal abatement cost in every sector and country</b>. Participation matters because every region's cheap options must be used. If India cuts nothing, others must make costlier cuts.</div>
<p><b>Bottom line</b>: in an ideal world 2°C costs <b>1–2%</b> of world income a year. Realistically, perhaps <b>3°C</b> is achievable.</p>`},
{t:"Quiz: Costs", q:[
["A household spends $2,000 on insulation and saves $100 a year in energy for 10 years. It avoids 0.5 t of CO₂ a year. Ignoring discounting, what is the cost per ton?",
 ["$400 per ton","$200 per ton","$100 per ton","$40 per ton"],1,
 "Net cost = 2,000 − 1,000 = $1,000. Tons avoided = 0.5 × 10 = 5. $1,000 / 5 = $200 per ton."],
["Why do top-down models usually show no negative-cost options?",
 ["They measure only electricity, where all options are costly","They assume money-saving options would already have been adopted","They include behaviour changes, which always carry a cost","They are calibrated on years before efficient technology existed"],1,
 "In the economic view, if an option saved money firms would already use it, so policy isn't needed to make it happen."],
["Why does the bottom-up cost curve rise more steeply than the top-down one?",
 ["It counts climate damages on top of the abatement costs at each level","It covers few technologies and misses behaviour change","It uses a higher discount rate on future energy savings","It assumes that only half of all countries participate"],1,
 "Bottom-up studies cover a few dozen technologies and miss behaviour changes like not flying, which top-down models capture."],
["In Nordhaus's EIA example of a 40% US emissions cut by 2030, which fuel bears most of the reduction?",
 ["Petroleum, cut by about 90%","Coal, cut by about 90%","Natural gas, cut by about 50%","All three, cut by about a third each"],1,
 "Coal falls 90%, while oil and gas fall about 5% each. Coal has the most CO₂ per dollar of energy."],
["With efficient policy and full participation, roughly what does meeting 2°C cost according to DICE?",
 ["About 0.2% of world income","About 1.5% of world income","About 8% of world income","It is infeasible at any cost"],1,
 "About 1.5%, roughly a year's growth. It becomes virtually infeasible with 50% participation."],
["Which change raises the cost of a given temperature target the most in Nordhaus's analysis?",
 ["Moving from top-down to bottom-up cost estimates","Limited participation by countries","Switching from a carbon tax to cap-and-trade","Including non-CO₂ greenhouse gases"],1,
 "Low participation makes costs explode below 4°C and makes 2°C infeasible. Inefficiency doubles costs on top of that."],
["What does Nordhaus mean by an 'efficient' climate policy?",
 ["One that reaches the lowest possible temperature","Equal marginal abatement cost in every sector and country","One that relies mainly on energy-efficiency standards for appliances and cars","One where every country cuts emissions by the same percentage"],1,
 "Equalising marginal costs minimises total cost. Uniform percentage cuts don't do that."]
]}
]});

M.push({t:"Discounting (Nordhaus 16)", c:[
{t:"Why discounting matters so much", h:`
<p>Emission cuts are paid for <b>now</b>, while the benefit (avoided damage) arrives <b>decades later</b>: wind farm → less CO₂ → lower concentrations → less warming → less damage. So we need a way to compare money at different dates.</p>
<p><b>Mortgage analogy</b>: borrow $150,000 for 30 years at 6% and you repay <b>$323,759</b>. The extra $173,759 is the price of having the house now. Money is worth more today because it can be invested.</p>
<div class="eq">real interest rate = nominal rate − inflation &nbsp;&nbsp;(6% − 2% = 4%)</div>
<p>Climate economics always uses <b>real</b> rates.</p>
<div class="eq">PV = FV / (1 + r)<sup>n</sup></div>
<p><b>Bond example</b>: $1,000 (real) paid in 50 years, discounted at 4% → <b>$141</b> today, since $141 grows to $1,000 at 4% over 50 years. Add a <b>risk premium</b> if the seller might turn out to be Lehman Brothers rather than "Uncle Sam".</p>

{t:"Why interest exists", h:`
<ul>
<li>Interest reflects that <b>investment is productive</b>: factories, schooling, energy-saving appliances and software all yield more in the future. $100 of new capital yields roughly <b>4–20%</b> a year.</li>
<li>At 4%, $1 next year is worth $1/1.04 = $0.96 today.</li>
<li><b>Consumption</b> is the ultimate goal, in a broad sense: market goods, home-cooked meals, a swim in the ocean. Subtract pollution and add parks.</li>
<li>Climate policy trades <b>consumption today</b> (cut emissions, fly less) for <b>consumption tomorrow</b> (less damage, national parks preserved).</li>
</ul>`},
{t:"Prescriptive vs descriptive", h:`
<div class="vs">
<div><h3>Prescriptive (normative)</h3><ul><li><b>Stern Review</b>; also John Roemer's sustainability approach</li><li>Unethical to discount the <b>welfare of future generations</b></li><li>Very low rate on goods, about <b>1%</b></li></ul></div>
<div><h3>Descriptive (opportunity cost)</h3><ul><li><b>Nordhaus</b></li><li>The rate should equal the <b>actual return on alternative investments</b> (homes, education, health, carbon cuts, investing abroad)</li><li>About <b>4%</b> real for the US, a bit higher elsewhere</li></ul></div>
</div>
<p><b>Key distinction</b>: the discount rate on <b>goods</b> is not the same as the discount rate on <b>welfare</b> (people). You can value all generations equally and still discount goods if future people will be <b>richer</b>, because richer generations have a weaker ethical claim on resources.</p>
<p><b>Nordhaus's jab</b>: it makes no sense to put scarce funds into wind farms yielding 1% when you're borrowing at 5–10%.</p>
<p><b>Evidence on returns</b>: US corporate capital about <b>6%</b> post-tax real. Education 4–20%. Real estate 6–10%. Energy efficiency often over 10%, up to 20%.</p>
<div class="kim"><b>Stern's reply</b> (Module 8): "there is no serious ethical argument in favour of pure-time discounting". Future wealth is <b>endogenous</b>, because if we wreck the climate future generations may be <i>poorer</i>. And capital markets don't reflect ethical social choices.</div>`},
{t:"Government rates & the growth assumption", h:`
<p><b>US OMB Circular A-94</b>: base case <b>7%</b> real ("marginal pretax return on private investment"); alternative <b>3%</b> ("social rate of time preference", about the real return on long-term government debt).</p>
<p>Nordhaus calls the OMB reasoning "<b>completely confused</b>". The 7% is a <i>risky</i> return on leveraged corporate capital and the 3% is a <i>risk-free</i> rate, so the gap is a <b>risk (equity) premium</b>, not investment vs consumption. Luckily the numbers are still reasonable to use.</p>
<p><b>Growth assumption</b>: descriptive discounting assumes growth continues (IT and biotech revolutions, catch-up, globalisation). If growth stalls, the climate projections are also wrong, because high warming assumes high growth. Post-2007 slow growth reflects weak demand, not falling productivity. Developing East Asia grew 8.5%/yr per capita over the past decade and sub-Saharan Africa 2.5%.</p>`},
{t:"The $10 m wind-farm calculation (Table 7)", h:`
<div class="prob"><b>Worked example</b>A $10 m wind investment today cuts climate damage by $100 m in 50 years. Is it worth it?
<table>
<tr><th>Discount rate</th><th class="r">PV of $100 m in 50 yrs</th><th>Net of $10 m cost</th></tr>
<tr><td>1%</td><td class="r">$60.8 m</td><td>+$50.8 m ✓</td></tr>
<tr class="hl"><td>4%</td><td class="r">$14.1 m</td><td>+$4.1 m ✓</td></tr>
<tr><td>7% (US government)</td><td class="r">$3.4 m</td><td><span class="neg">−$6.6 m ✗</span></td></tr>
<tr><td>10%</td><td class="r">$0.85 m</td><td><span class="neg">−$9.1 m ✗</span></td></tr>
</table>
4%: (1.04)<sup>−50</sup> = 0.141, so PV = $14.1 m &gt; $10 m and the project passes.</div>
<ul>
<li>"The discount rate may be the <b>single most important factor</b> in determining the value of a long-term investment."</li>
<li>At 1% the value is <b>more than 4×</b> the value at 4%. That is why low-discount analyses like Stern's favour early action: "future damages count for so much".</li>
<li>Compound interest beats intuition: $100 invested by Columbus in 1492 at 6% would exceed the world's wealth. Manhattan's $26 in 1626 at 6% ≈ <b>$152 bn</b>.</li>
</ul>`},
{t:"Ethics: the heavy burden of zero discounting", h:`
<p>Discounting ≠ indifference to the future. It reflects (1) <b>productive capital</b>: other investments also help future generations, such as low-carbon R&amp;D, tropical-disease research and education; and (2) <b>compound interest</b>.</p>
<p><b>The "anxiety discount" argument</b>: weight your children at 1, grandchildren ½, great-grandchildren ¼, and so on:</p>
<div class="eq">1 + ½ + ¼ + ⅛ + … = 2 &nbsp;&nbsp;(finite: you can decide)<br>1 + 1 + 1 + 1 + … = ∞ &nbsp;&nbsp;(zero discounting: paralysis)</div>
<p>With zero discounting we'd "dissolve in a sea of anxiety" about asteroids, robots, fat tails and so on. Zero discounting is "an infinitely heavy load on our shoulders". This is the mathematical point of Nobel laureate <b>Tjalling Koopmans</b>.</p>
<div class="key">"The discount rate is the measuring rod for comparing competing investments." Climate investments should compete with health, education and research.</div>
<p><b>Part III summary</b>: keeping within safe limits is feasible. With full efficient participation, 2°C. With delays and partial participation, 3°C. Limiting to 2½–3°C costs <b>1% or less</b> of discounted world income if policy is reasonably efficient. That requires <b>cooperation</b> (most countries within a couple of decades, US included) and <b>equal marginal costs</b> everywhere.</p>`},
{t:"Quiz: Discounting", q:[
["A project costs $10 m today and avoids $100 m of damage in 50 years. At what discount rate does it first fail a cost–benefit test, among those in Nordhaus's Table 7?",
 ["1%, because the PV is about $60.8 m","4%, because the PV is about $14.1 m","7%, because the PV is about $3.4 m","It passes at every rate in the table"],2,
 "At 7% the PV is $3.39 m, so the net value is −$6.6 m. At 4% it still passes with $14.1 m."],
["The nominal interest rate is 6% and inflation is 2%. The real rate Nordhaus would use is",
 ["8%","4%","3%","12%"],1,
 "Real = nominal − inflation = 4%."],
["Which statement best describes the descriptive (opportunity-cost) view of discounting?",
 ["Future generations deserve less weight because they are less certain to exist","The rate should match returns available on alternative investments","The rate should be near zero so that all generations count equally","The rate should equal the inflation rate so that real values are preserved"],1,
 "Nordhaus's view: capital is scarce, and climate investments must compete with education, health and other uses."],
["Nordhaus distinguishes the discount rate on goods from the rate on welfare. Why does that matter?",
 ["Goods can be stored but welfare cannot, so only goods are discounted","Generations can count equally while goods are still discounted","Welfare is measured in real terms while goods are measured in nominal money terms","Only governments discount welfare, while firms discount goods"],1,
 "Rich generations have a weaker ethical claim, so discounting goods doesn't mean valuing people less."],
["What does the 'anxiety discount' example (weights 1, ½, ¼, …) show?",
 ["Future generations should be weighted equally to avoid unfairness across time","Some discounting keeps total concern finite","Discount rates should rise over time as uncertainty grows","Parents care more about grandchildren than children"],1,
 "The sum is 2, which is finite. With zero discounting the sum is infinite, which is Koopmans's point."],
["Nordhaus criticises the US OMB's use of 7% and 3% rates because",
 ["both rates are far too low for long-lived climate projects","the gap is really a risk premium, not investment vs consumption","the 3% rate is a nominal rate that ignores inflation","the 7% rate rests on outdated returns from before 1970"],1,
 "7% is a risky leveraged corporate return and 3% is risk-free government borrowing."],
["Why do analyses with low discount rates, like the Stern Review, recommend early and strong action?",
 ["They assume a much higher climate sensitivity to CO₂","Distant damages keep most of their value","They assume abatement technology will become more expensive over the century","They leave the cost of abatement out of the calculation"],1,
 "At 1% the 50-year value is more than 4× the 4% value, and the gap widens over 100–200 years."]
]}
]});

/* ───────────────────────── 6. CLIMATE CASINO CH 18 ───────────────────────── */
M.push({t:"Balancing costs & benefits (Nordhaus 18)", c:[
{t:"The set-up", h:`
<p>Cost–benefit analysis picks the target with the greatest margin of benefits over costs. Everyday versions include driving to the cheaper petrol station or choosing a college on market and nonmarket grounds.</p>
<p>For climate, take each temperature limit (2°C, 3°C, 4°C…) and plot three things as % of global income:</p>
<ul>
<li><b>Abatement cost</b> of staying under that limit: <b>downward-sloping</b> (lower limits cost more). This comes from Ch 15.</li>
<li><b>Damages</b> at that temperature: <b>upward-sloping</b>. This comes from Ch 12.</li>
<li><b>Total = abatement + damages</b>: <b>U-shaped</b>. The bottom of the U is the best target.</li>
</ul>
<p>Omitted: tipping points, acidification and similar hard-to-value impacts, and adjustment dynamics. Temperatures are measured relative to 1900, which was about 0.8°C below today.</p>`},

<li>At very low temperature limits the cost is mostly <b>abatement</b>. At high limits it is mostly <b>damages</b>.</li>
<li>Minimum at <b>2.3°C</b>, with total cost <b>2.9% of income</b> and damages about <b>twice</b> abatement.</li>
<li>Abatement spending is modest, about <b>1%</b> of global income.</li>
</ul>
<div class="key">"If climate-change policies are well designed and perfectly efficient, and if current and future costs count equally, then a target of 2¼°C is justified from an economic perspective." So 2°C is close to optimal <i>under ideal conditions</i>.</div>`},

<table>
<tr><th>Scenario</th><th class="r">Optimal limit</th><th class="r">Total cost</th></tr>
<tr><td>100% participation, no discounting (Fig 29)</td><td class="r">2.3°C</td><td class="r">2.9%</td></tr>
<tr><td>50% participation, no discounting (Fig 30)</td><td class="r"><b>3.8°C</b></td><td class="r">3.8%</td></tr>
<tr><td>50% participation, discounted at 4%, 50-yr lag (Fig 31)</td><td class="r"><b>4.0°C</b></td><td class="r">–</td></tr>
<tr><td>100% participation, discounted ("discount-prone optimists")</td><td class="r">2.8°C</td><td class="r">–</td></tr>
</table>
<ul>
<li>With 50% participation, <b>2°C is unattainable</b>. Paradoxically, most of the cost is then <b>damages</b>: abatement is so expensive that it's better to abate little and live with the damage.</li>
<li><b>Participation moves the optimum by 1.5°C</b> (2.3 → 3.8). <b>Discounting adds only 0.2°C</b> (3.8 → 4.0).</li>
</ul>
<div class="kim"><b>Why discounting matters so little here</b> (it surprised Nordhaus too): the abatement curve is highly nonlinear, steep below 4°C and flat above, while the damage curve has a <b>near-constant slope</b> around 4°C. Lowering the damage curve barely moves the minimum. Nonlinearities drive targets.</div>
<div class="tip">This contrasts with Ch 16, where the discount rate is "the single most important factor" for a single project. In the target-setting graphs, participation dominates. Be ready to explain both.</div>`},

<li>Assume tipping damages of <b>0.5%</b> of income at 3.5°C, <b>9%</b> at 4°C and <b>29%</b> at 4¼°C (temperature to the 20th power). Nordhaus says this is "the outer limit of what seems plausible".</li>

{t:"CBA under uncertainty", h:`
<div class="vs">
<div><h3>Expected-value case</h3><p>At 2°C damage is 1% or 3% with even odds, so the expected value is 2%. Only the <b>averages</b> matter, and uncertainty doesn't change the decision.</p></div>
<div><h3>Uncertain tipping point</h3><p>The threshold is at 3°C or 4°C with equal odds, giving a <b>W-shaped</b> damage curve. The <b>lower threshold dominates</b>: aim for about <b>3°C</b> even though the expected threshold is 3.5°C.</p></div>
</div>
<p>The second case supports the <b>minimax</b> form of the <b>precautionary principle</b> (prevent the worst outcome). <b>Rio Declaration, 1992</b>: "lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures".</p>
<p>But minimax only holds if the cliffs are few and not ruinously costly to avoid. If they're just bumps, or too many, or too expensive to avoid, you pay an <b>insurance premium</b> instead of full avoidance. Nordhaus's example is a possible Gulf Stream reversal above 2°C.</p>
<div class="key">General rule: uncertain, nonlinear, cliff-like damages <b>lower</b> the optimal target, as insurance against worst cases.</div>`},
{t:"Critiques of CBA, and Nordhaus's reply", h:`
<p><b>Critiques</b>: deep uncertainty (sometimes probabilities are unknowable); costs and benefits fall on <b>different people and generations</b>; comparing now with the distant future; putting a price on health and life; inadequate tools for valuing <b>ecosystems and biodiversity</b>.</p>
<p><b>Nordhaus's reply</b>: CBA is daunting but <b>necessary</b> to make reasoned choices. Get order-of-magnitude estimates, include all impacts, and get economists and natural scientists working together. "Compare the price tag with the things we are buying."</p>
<ul>
<li>With only half of countries participating, aiming for 2°C "is like hoping you can take <b>Amtrak to the moon</b>".</li>
<li>A temperature limit is a worthy <b>ultimate</b> goal. Emissions or concentration limits are only <b>instrumental</b>.</li>
<li>It's not enough to say "ecosystems are priceless" or "we must pay any cost to save the polar bears".</li>
</ul>
<div class="kim">Stern's whole 2022 paper (Module 8) answers this chapter: treat 1.5°C as a <b>guard-rail</b> set by risk, then find the cheapest path. Don't derive the target by maximising a CBA.</div>`},
{t:"Quiz: Balancing costs & benefits", q:[
["In Nordhaus's cost–benefit graph, why is the total cost curve U-shaped?",
 ["Abatement costs rise with temperature while damages fall","Abatement is costly at low limits, damages at high ones","Discounting pushes costs up at both low and high temperatures","Participation is low at both extremes of the temperature range, raising costs"],1,
 "Total = falling abatement cost + rising damages. Both extremes are expensive."],
["Moving from full to 50% participation (no discounting) shifts the optimal limit from 2.3°C to about",
 ["2.8°C","3.8°C","4.5°C","3.0°C"],1,
 "3.8°C, and total costs rise from 2.9% to 3.8% of income. 2.8°C is the full-participation case with discounting."],
["Adding 4% discounting to the limited-participation case moves the optimum only from 3.8°C to 4.0°C. Why so little?",
 ["Damages are already discounted inside the abatement-cost curve itself","Abatement cost bends sharply while damages have a near-constant slope","A 4% rate is too low to change damages that occur fifty years away","Discounting raises abatement costs by as much as it lowers damages"],1,
 "Lowering a nearly straight damage curve barely moves a minimum set by a sharply bending cost curve."],
["With a cliff-like tipping point at 3.5°C, the total cost curve becomes",
 ["flat, so any target between 3°C and 4°C is equally good","V-shaped with its minimum right at the 3.5°C threshold","U-shaped with its minimum shifted up to about 4.5°C","downward-sloping, so the highest temperature is optimal"],1,
 "Strenuous action to stay just below the threshold is optimal, and total costs are much higher."],
["The tipping point is equally likely at 3°C or 4°C. What does Nordhaus's analysis recommend?",
 ["Aim for 3.5°C, the expected value of the threshold","Aim for about 3°C, since the lower threshold dominates","Aim for 4°C, since abatement below that is too costly","Ignore the threshold, since expected values cancel out"],1,
 "With a W-shaped damage curve you avoid the first cliff you're likely to hit. This is a minimax precautionary result."],
["According to Nordhaus, the main obstacle to including tipping points in CBA is",
 ["analytical: models can't handle discontinuous functions","empirical: threshold, damage and curvature are unknown","ethical: catastrophic losses can't be given a money value","political: governments refuse to fund such research"],1,
 "He stresses that CBA can include catastrophes. The problem is the missing empirical parameters."]
]}
