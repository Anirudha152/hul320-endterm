/* ───────────────────────── 14. AZAD & CHAKRABORTY (2020) ───────────────────────── */
M.push({t:"Right to energy in India (Azad)", c:[
{t:"The gap this paper fills", h:`
<p>Azad &amp; Chakraborty (Energy Policy, 2020).</p>
<p>Pollin &amp; Chakraborty showed green growth can cut emissions and create jobs. But they said little about <b>redistribution</b>.</p>
<p><b>This paper's question:</b> can India's growth be made <b>equitable and environmentally sustainable at the same time</b>?</p>
<p>Their tool: a <b>carbon tax</b>, a textbook <b>Pigouvian tax</b>. The big question is <b>what to do with the tax money</b>. Their answer: redistribute it.</p>`},
{t:"Background: growth, inequality, energy poverty", h:`
<ul>
<li>India's growth rate rose a lot since the <b>1980s</b>.</li>
<li>Inequality rose a lot since the <b>1990s</b>. Everyone agrees on this.</li>
<li>Growth + rising inequality usually comes with rising energy use.</li>
<li>Inequality also shows in <b>energy access</b>: in 2014, over <b>20%</b> of Indians had no electricity, and many with it faced daily blackouts.</li>
</ul>
<p>The proposal aims to give the poor <b>formal, clean energy</b> and tackle <b>energy poverty</b>.</p>`},
{t:"The problem: carbon taxes are regressive", h:`
<p>Two ways to control emissions from the demand side:</p>
<ul><li><b>Carbon cap</b>: a direct limit on quantity</li><li><b>Carbon tax</b>: makes carbon costly</li></ul>
<p>A carbon tax is usually <b>regressive</b>: it takes a bigger share of a poor person's income.</p>
<ul>
<li>Why? The poor spend <b>most of their income</b> on consumption. The rich save more.</li>
<li>This holds <b>even though</b> the poor have much <b>smaller</b> carbon footprints.</li>
<li>The <b>more unequal</b> the society, the more regressive the burden.</li>
</ul>
<div class="key">The challenge: use a carbon tax <b>without</b> hurting the poor.</div>`},
{t:"Energy Policy with Equity (EPE)", h:`
<p>The proposal is called <b>Energy Policy with Equity (EPE)</b>. It tackles both sides:</p>
<div class="vs">
<div><h3>Supply side</h3><ul><li>Public investment to change India's energy mix</li><li>The 1.5% of GDP from Pollin's paper</li></ul></div>
<div><h3>Demand side</h3><ul><li>A carbon tax</li><li>Its revenue pays for <b>both</b> the investment and the Right to Energy</li></ul></div>
</div>
<p><b>Right to Energy</b>: free energy (an <b>in-kind</b> transfer) to people who emit <b>less than the economy average</b>.</p>
<ul><li>The tax revenue <b>equals</b> the extra spending needed, so it is <b>revenue-neutral</b>.</li><li>Public investment will also "<b>crowd in</b>" private investment.</li></ul>`},
{t:"Where the clean energy money goes", h:`
<p>Part 1 of the tax revenue: the extra <b>1.5% of GDP</b> (on top of the current 0.6%) for 20 years. Key areas:</p>
<ul>
<li><b>Buildings</b>: 70% of India's 2030 building stock was to be built in 2011–2030. Build efficient from the start.</li>
<li><b>Industrial</b> energy efficiency</li>
<li><b>Transport</b>: uses half of India's petrol and a quarter of all energy</li>
</ul>
<p>Part 2 of the revenue: the <b>Right to Energy</b>.</p>`},
{t:"Why free energy instead of cash?", h:`
<p><b>Advantages of in-kind (free energy) over cash transfers:</b></p>
<ul>
<li>Cash only reaches people with <b>bank/financial access</b>.</li>
<li>Cash doesn't push the poor away from <b>free but dirty</b> fuels (like firewood). Clean energy costs money; firewood doesn't.</li>
<li>Basic rights to resources should not be judged only in narrow utility terms.</li>
</ul>
<p><b>More limits of cash:</b></p>
<ul>
<li>Adjusting cash for inflation is hard and not frequent.</li>
<li>Cash can <b>cause</b> inflation when supply can't increase.</li>
<li>Even in Brazil, cash transfers work <b>alongside</b> in-kind transfers, not instead of them.</li>
</ul>`},
{t:"How the Right to Energy works", h:`
<ol>
<li><b>Free electricity up to a cutoff.</b> Paid for from carbon tax revenue.</li>
<li><b>Above the cutoff</b>, market prices apply and rise.</li>
<li>The cutoff is set using the <b>Climate Injustice Quotient (CIQ)</b>.</li>
<li><b>Universal travel pass</b>: fuel prices rise with the tax, so each person gets a pre-loaded pass for <b>any public transport</b> (public or private operator). Its value covers the lost transport budget of the <b>bottom 70%</b>.</li>
</ol>
<p>Unlike cash, free clean energy makes people <b>switch</b> to healthier energy. They also <b>save time</b> (e.g. no collecting firewood).</p>
<div class="tip">The authors say universal access to electricity and public transport, funded by carbon revenue, is a <b>better substitute</b> for "carbon dividends" (cash).</div>`},
{t:"The maths: revenue side", h:`
<p>Clean energy spending (supply side):</p>
<div class="eq">G<sub>f</sub> = 0.015 · Y</div>
<p>Y = GDP. So G<sub>f</sub> is 1.5% of GDP.</p>
<p>Carbon tax revenue:</p>
<div class="eq">R = t·C̄ − 0.01·t·C̄ = 0.99·t·C̄</div>
<ul>
<li><b>t</b> = carbon tax rate, <b>C̄</b> = total carbon emitted</li>
<li>1% is lost to admin costs</li>
<li>Tax is collected <b>upstream</b>, where carbon enters the economy: <b>mine heads, oil refineries, ports</b>. That means fewer collection points, lower admin cost, less leakage.</li>
</ul>`},
{t:"The maths: spending side", h:`
<p>Free energy up to cutoff ē:</p>
<div class="eq">G<sub>e</sub><sup>energy</sup> = (p<sub>e</sub> + t·c<sub>e</sub>) · ē</div>
<p>p<sub>e</sub> = current energy price, c<sub>e</sub> = carbon content of energy. So (p<sub>e</sub> + t·c<sub>e</sub>) is the price <b>after</b> the tax.</p>
<p>Travel passes up to amount T:</p>
<div class="eq">G<sub>e</sub><sup>transport</sup> = (1 + t·c<sub>t</sub>) · T</div>
<p>Revenue-neutral: revenue = spending.</p>
<div class="eq">0.99·t·C̄ = G<sub>f</sub> + G<sub>e</sub></div>
<p>Solve for t (the tax rate is <b>endogenous</b>, i.e. it comes out of the model):</p>
<div class="eq">t = (0.015·Y + p<sub>e</sub>·ē + T) / (0.99·C̄ − c<sub>e</sub>·ē − c<sub>t</sub>·T)</div>`},
{t:"Method: two steps", h:`
<ol>
<li><b>Carbon content of each commodity</b>, using India's <b>input–output tables</b></li>
<li><b>Impact on household budgets</b>, using <b>NSS</b> household survey data</li>
</ol>
<p>Carbon content (tonnes CO₂ per $):</p>
<div class="tw"><table>
<tr><th>Item</th><th class="r">tCO₂ per $</th></tr>
<tr class="hl"><td>Fuel &amp; electricity</td><td class="r"><b>0.0135</b> (highest)</td></tr>
<tr><td>Industrial goods</td><td class="r">0.0028</td></tr>
<tr><td>Transport</td><td class="r">0.0027</td></tr>
<tr><td>Housing</td><td class="r">0.0018</td></tr>
<tr><td>Clothing &amp; footwear</td><td class="r">0.0011</td></tr>
<tr><td>Medical &amp; education, misc services</td><td class="r">0.0004</td></tr>
<tr><td>Food</td><td class="r">0.0003 (lowest)</td></tr>
</table></div>
<p><b>Household footprint</b> = Σ (spending on each item × its carbon content)</p>`},
{t:"Consumption inequality findings", h:`
<ul>
<li>The richest decile consumes almost <b>10 times</b> more than the poorest.</li>
<li>As income rises, the <b>food share</b> of spending falls. Food has the lowest emissions.</li>
<li><b>Fuel and electricity</b> inequality rises dramatically. This shows how deprived the poorest are of energy.</li>
</ul>`},
{t:"Climate Injustice Quotient (CIQ)", h:`
<div class="eq">CIQ = (group's share of total carbon footprint) / (group's share of population)</div>
<p>For a decile, population share = 10%. So CIQ = footprint share / 0.10.</p>
<ul><li>CIQ &lt; 1 → emits <b>less</b> than its fair share</li><li>CIQ &gt; 1 → emits <b>more</b> than its fair share</li></ul>
${bars([["Decile 1",0.53],["Decile 4",0.74],["Decile 7",0.96],["Decile 8",1.09],["Decile 9",1.29],["Decile 10",2.40]],2.4,"")}
<div class="key"><b>Bottom 7 deciles: CIQ &lt; 1. Top 3 deciles: CIQ &gt; 1.</b> So the free energy goes to the bottom 70%.</div>`},
{t:"Full CIQ table (Table 4)", h:`
<div class="tw"><table>
<tr><th>Decile</th><th class="r">Footprint per capita (t)</th><th class="r">HH size</th><th class="r">Footprint per HH</th><th class="r">Share of footprint</th><th class="r">CIQ</th></tr>
<tr><td>1</td><td class="r">0.34</td><td class="r">6.5</td><td class="r">2.18</td><td class="r">0.053</td><td class="r">0.53</td></tr>
<tr><td>2</td><td class="r">0.41</td><td class="r">6.3</td><td class="r">2.58</td><td class="r">0.062</td><td class="r">0.62</td></tr>
<tr><td>3</td><td class="r">0.47</td><td class="r">6.0</td><td class="r">2.84</td><td class="r">0.068</td><td class="r">0.68</td></tr>
<tr><td>4</td><td class="r">0.52</td><td class="r">5.9</td><td class="r">3.07</td><td class="r">0.074</td><td class="r">0.74</td></tr>
<tr><td>5</td><td class="r">0.58</td><td class="r">5.8</td><td class="r">3.38</td><td class="r">0.081</td><td class="r">0.81</td></tr>
<tr><td>6</td><td class="r">0.66</td><td class="r">5.5</td><td class="r">3.64</td><td class="r">0.088</td><td class="r">0.88</td></tr>
<tr class="hl"><td>7</td><td class="r">0.75</td><td class="r">5.3</td><td class="r">4.00</td><td class="r">0.096</td><td class="r"><b>0.96</b></td></tr>
<tr><td>8</td><td class="r">0.89</td><td class="r">5.1</td><td class="r">4.52</td><td class="r">0.109</td><td class="r">1.09</td></tr>
<tr><td>9</td><td class="r">1.12</td><td class="r">4.8</td><td class="r">5.37</td><td class="r">0.129</td><td class="r">1.29</td></tr>
<tr><td>10</td><td class="r">2.37</td><td class="r">4.2</td><td class="r">9.95</td><td class="r">0.240</td><td class="r"><b>2.40</b></td></tr>
</table></div>
<ul><li>CIQ = share of footprint ÷ 0.10, e.g. decile 10: 0.240/0.10 = 2.40.</li>
<li>Poorer households are <b>larger</b> (6.5 vs 4.2 people), so per-capita gaps are wider than per-household gaps.</li>
<li>Decile 7 is the last with CIQ &lt; 1, which is why its median use (412 kWh/person/yr) sets the free cutoff.</li></ul>`},
{t:"Setting the free electricity cutoff", h:`
<ul>
<li>Take the <b>median per person</b> use of the <b>7th decile</b>: <b>412 kWh/year</b>.</li>
<li>Multiply by average household size, <b>5.5</b>.</li>
<li>Free entitlement = <b>2268 kWh/year</b> per household = <b>189 kWh/month</b>.</li>
</ul>
<p>Use more than this → you pay full price for <b>all</b> units, not just the extra.</p>
<p>So only households that stay <b>under</b> the limit benefit. Everyone else pays the higher price.</p>
<p>Travel pass: each person gets a pass worth the <b>median transport cost</b> after the tax.</p>`},
{t:"The numbers", h:`
<ul>
<li>Carbon tax needed: <b>$60.4 per tonne of CO₂</b>.</li>
<li>Electricity price rises from <b>$0.08 → $0.10 per kWh</b> (+25%).</li>
</ul>
<div class="eq">Carbon charge = carbon tax rate × carbon footprint</div>
<ul>
<li>In <b>absolute</b> terms, the charge rises with income (the rich have bigger footprints).</li>
<li>In <b>relative</b> terms, it is <b>regressive</b>: as a share of spending, it falls as income rises.</li>
</ul>
<div class="eq">Net benefit = energy benefits − carbon charge</div>
<p>Energy benefits = free electricity + universal transport card.</p>`},
{t:"Who gains, who pays (per person, USD)", h:`
<div class="tw"><table>
<tr><th>Decile</th><th class="r">Carbon charge</th><th class="r">Net benefit: potential</th><th class="r">Net benefit: minimum</th></tr>
<tr><td>1 (poorest)</td><td class="r">20.3</td><td class="r">+32.5</td><td class="r">+2.0</td></tr>
<tr><td>4</td><td class="r">31.5</td><td class="r">+24.9</td><td class="r">+4.5</td></tr>
<tr><td>7</td><td class="r">45.6</td><td class="r">+15.1</td><td class="r">+8.8</td></tr>
<tr><td>8</td><td class="r">53.5</td><td class="r neg">−35.6</td><td class="r neg">−35.6</td></tr>
<tr><td>10 (richest)</td><td class="r">143.1</td><td class="r neg">−125.2</td><td class="r neg">−125.2</td></tr>
</table></div>
<ul>
<li><b>Potential</b> = if they use all the free energy available.</li>
<li><b>Minimum</b> = at their current median use.</li>
</ul>
<div class="key">Bottom 70% <b>gain</b> even in the minimum case. Top 30% <b>pay</b>. The policy turns a regressive tax into a progressive package.</div>`},
{t:"Benefits of EPE", h:`
<ul>
<li><b>Equal access</b> to electricity for every household</li>
<li><b>More jobs</b>: green energy has higher employment elasticity than fossil fuels</li>
<li><b>Less electricity theft</b>, since basic energy is free</li>
<li><b>Lower emissions</b>: the tax flows into prices by carbon content</li>
<li>Even the poor <b>move away from traditional fuels</b> because clean energy is free for them</li>
<li>Fewer <b>pollution-related deaths and illness</b></li>
</ul>`},
{t:"Pollin vs Azad", h:`
<div class="tw"><table>
<tr><th></th><th>Pollin &amp; Chakraborty (2015)</th><th>Azad &amp; Chakraborty (2020)</th></tr>
<tr><td>Main question</td><td>Can growth, jobs and emission cuts go together?</td><td>Can growth be equitable <b>and</b> sustainable?</td></tr>
<tr><td>Focus</td><td>Supply side: investment</td><td>Demand side + redistribution</td></tr>
<tr><td>Key tool</td><td>1.5% of GDP in clean energy</td><td>Carbon tax ($60.4/t) funding that 1.5% + Right to Energy</td></tr>
<tr><td>Use of IO tables</td><td>Jobs per $1 million</td><td>Carbon content of goods</td></tr>
<tr><td>Headline result</td><td>53% CO₂ cut; ~6.3 m net jobs</td><td>Bottom 70% gain; top 30% pay</td></tr>
</table></div>`},
{t:"Quick check", h:`
<details><summary>Why is a carbon tax regressive, and how does EPE fix it?</summary>The poor spend a larger share of income on consumption, so the tax takes a bigger share of their income. EPE uses the revenue to give free electricity up to 189 kWh/month and travel passes, so the bottom 70% end up better off.</details>
<details><summary>Define CIQ and give the key result.</summary>CIQ = a group's share of carbon footprint ÷ its share of population. Bottom 7 deciles have CIQ &lt; 1, top 3 have CIQ &gt; 1 (top decile 2.40).</details>
<details><summary>How is the free electricity cutoff found?</summary>7th decile median per-person use (412 kWh/yr) × household size 5.5 = 2268 kWh/yr = 189 kWh/month.</details>
<details><summary>Why in-kind rather than cash?</summary>Cash needs bank access, doesn't push people off free dirty fuels, is hard to index to inflation, and can cause inflation.</details>`},
{t:"Exam angles on Azad", h:`
<ul>
<li><b>CIQ numerical</b>: if the top decile has 24% of the carbon footprint, CIQ = 0.24/0.10 = <b>2.4</b>. If the bottom decile has 5.3%, CIQ = 0.53.</li>
<li><b>Net benefit</b> = energy benefits (free electricity + travel pass) − carbon charge. The carbon charge = tax rate × household footprint.</li>
<li>Why upstream collection? There are few points (mine heads, refineries, ports), so admin cost and leakage are low. This is Goodwin's upstream-tax logic.</li>
<li>Why in-kind? It reaches people without bank access, pushes switching away from free dirty fuels, and is easier to protect against inflation.</li>
</ul>
<div class="kim"><b>Compare revenue uses</b>: Goodwin suggests rebates for regressive taxes. Nordhaus suggests deficit reduction ($168 bn = 1% of US GDP). Hansen and the Earth Atmospheric Trust return cash dividends. Azad uses revenue for <b>clean investment plus free energy in kind</b>.</div>`},
{t:"Quiz: Right to energy", q:[

]}

/* ───────────────────────── 15. INPUT–OUTPUT (MAIR & DRUCKMAN) ───────────────────────── */
M.push({t:"Input–output analysis (Mair & Druckman)", c:[
{t:"What is it?", h:`
<ul>
<li>Developed by <b>Wassily Leontief</b> (1936, 1966).</li>
<li>A tool to study how the <b>sectors</b> of an economy depend on each other.</li>
<li>At its core: a set of <b>linear equations</b>.</li>
<li>An <b>IO table</b> records the transactions between industries, for one region and one time period.</li>
</ul>
<p>Simple idea: to make a car, you need steel, which needs coal, which needs trucks... IO traces all these chains.</p>
<div class="key">IO is how Pollin counted <b>jobs</b> and Azad counted <b>carbon content</b>.</div>`},
{t:"Reading an IO table", h:`
<p>A made-up 3-sector economy ($):</p>
<div class="tw"><table>
<tr><th></th><th class="r">Agri</th><th class="r">Manuf</th><th class="r">Services</th><th class="r">Final demand</th><th class="r">Total output</th></tr>
<tr><td><b>Agriculture</b></td><td class="r">60</td><td class="r">40</td><td class="r">100</td><td class="r">20</td><td class="r"><b>220</b></td></tr>
<tr><td><b>Manufacturing</b></td><td class="r">80</td><td class="r">30</td><td class="r">150</td><td class="r">30</td><td class="r"><b>300</b></td></tr>
<tr><td><b>Services</b></td><td class="r">50</td><td class="r">180</td><td class="r">40</td><td class="r">15</td><td class="r"><b>295</b></td></tr>
<tr><td>Value added</td><td class="r">30</td><td class="r">50</td><td class="r">5</td><td></td><td></td></tr>
<tr><td><b>Total inputs</b></td><td class="r"><b>220</b></td><td class="r"><b>300</b></td><td class="r"><b>295</b></td><td></td><td></td></tr>
</table></div>
<ul>
<li><b>Row</b> = what a sector <b>sells</b> (its outputs). Agriculture sells 40 to manufacturing.</li>
<li><b>Column</b> = what a sector <b>buys</b> (its inputs). Manufacturing buys 40 from agriculture.</li>
</ul>
<p>Example: to make a <b>wool jumper</b>, a clothing maker buys wool (agriculture), knitting machines (manufacturing), and banking and insurance (services).</p>
<p class="src">In the source table, the manufacturing and services rows don't sum exactly to total output. The method is what matters.</p>`},
{t:"Parts of the table", h:`
<p><b>Total inputs = total output</b> for every sector. Why? It is an <b>accounting identity</b>. If farming output is worth 220, that 220 must show up somewhere as spending on inputs or value added.</p>
<p>Inputs come in two kinds:</p>
<ul>
<li><b>Intermediate inputs</b>: bought from other sectors and used up in production (the shaded middle block).</li>
<li><b>Factors of production</b>: inputs <b>not</b> from other sectors. Shown as <b>gross value added</b>.</li>
</ul>
<p><b>Value added</b> is a <b>residual</b>: total output minus intermediate inputs. It equals payments to labour (wages), capital (profits), government (taxes) and imports.</p>
<p><b>Final demand</b>: buyers <b>outside</b> the production cycle who buy for their own use, not to make something else. Household consumption, investment, government purchases, net exports.</p>`},
{t:"Writing it as equations", h:`
<ul>
<li><b>z<sub>ij</sub></b> = sales from sector i to sector j. E.g. z<sub>12</sub> = agriculture → manufacturing.</li>
<li><b>y<sub>i</sub></b> = final demand for sector i's goods</li>
<li><b>x<sub>i</sub></b> = total output of sector i</li>
</ul>
<p>Output = sum across the row:</p>
<div class="eq">x<sub>1</sub> = z<sub>11</sub> + z<sub>12</sub> + z<sub>13</sub> + y<sub>1</sub><br>x<sub>2</sub> = z<sub>21</sub> + z<sub>22</sub> + z<sub>23</sub> + y<sub>2</sub><br>x<sub>3</sub> = z<sub>31</sub> + z<sub>32</sub> + z<sub>33</sub> + y<sub>3</sub></div>
<p>In matrix form (i = a column of 1s, which just adds up each row):</p>
<div class="eq">x = Zi + y</div>`},
{t:"Leontief production function: 3 assumptions", h:`
<p>A production function links inputs to the maximum output. To unlock IO, we assume:</p>
<ol>
<li><b>Fixed proportions</b>: inputs are used in a fixed recipe. No swapping one input for another. No efficiency change (constant technology).</li>
<li><b>Linear</b>: double the output → double the inputs. <b>No economies of scale</b>. (This is a limitation.)</li>
<li><b>One homogeneous good per sector</b>: each sector makes one "average" product, sold to everyone.</li>
</ol>
<p>These often don't hold exactly. But they give a good <b>approximate</b> picture of average links between sectors.</p>`},
{t:"Technical coefficients", h:`
<p>Divide each input by the <b>output of the sector that buys it</b>:</p>
<div class="eq">a<sub>ij</sub> = z<sub>ij</sub> / x<sub>j</sub></div>
<p>Meaning: <b>how much input from sector i is needed to make $1 of output in sector j</b>.</p>
<p>Example, agriculture's column (x<sub>1</sub> = 220):</p>
<div class="eq">a<sub>11</sub> = 60/220 = 0.27<br>a<sub>21</sub> = 80/220 = 0.36<br>a<sub>31</sub> = 50/220 = 0.23</div>
<p>So $1 of farm output needs $0.27 of farm inputs, $0.36 of manufacturing, $0.23 of services.</p>
<div class="tw"><table>
<tr><th></th><th class="r">Agri</th><th class="r">Manuf</th><th class="r">Services</th></tr>
<tr><td>Agriculture</td><td class="r">0.27</td><td class="r">0.13</td><td class="r">0.34</td></tr>
<tr><td>Manufacturing</td><td class="r">0.36</td><td class="r">0.10</td><td class="r">0.51</td></tr>
<tr><td>Services</td><td class="r">0.23</td><td class="r">0.60</td><td class="r">0.14</td></tr>
</table></div>`},
{t:"Getting to the Leontief inverse", h:`
<p>Since z<sub>ij</sub> = a<sub>ij</sub>·x<sub>j</sub>, rewrite the equations:</p>
<div class="eq">x<sub>1</sub> = a<sub>11</sub>x<sub>1</sub> + a<sub>12</sub>x<sub>2</sub> + a<sub>13</sub>x<sub>3</sub> + y<sub>1</sub> &nbsp;(and same for x<sub>2</sub>, x<sub>3</sub>)</div>
<p>In matrix form, with <b>A</b> = matrix of technical coefficients and <b>I</b> = identity matrix:</p>
<div class="eq">x = Ax + y<br>y = (I − A)x<br><b>x = (I − A)<sup>−1</sup>y</b></div>
<p><b>(I − A)<sup>−1</sup></b> is the <b>Leontief inverse</b>.</p>
<div class="key">The Leontief inverse gives the <b>total output needed</b> (direct + indirect, along all supply chains) to meet a given final demand.</div>
<p>Change final demand y → see how much each sector's output must change.</p>`},
{t:"Extended IO: adding carbon", h:`
<p>Add a <b>satellite account</b>: an extra row under the table, in <b>physical units</b> (tonnes of carbon, hours worked). Governments usually don't compile these.</p>
<div class="tw"><table>
<tr><th></th><th class="r">Agri</th><th class="r">Manuf</th><th class="r">Services</th></tr>
<tr><td>Total output ($)</td><td class="r">220</td><td class="r">300</td><td class="r">295</td></tr>
<tr class="hl"><td>Carbon (tonnes)</td><td class="r">10</td><td class="r">20</td><td class="r">5</td></tr>
</table></div>
<p>Treat it like a factor of production. Carbon isn't really an "input", but it's a useful way to think: farming <b>could not</b> have produced its output without emitting this carbon.</p>
<p>Carbon per $ of output:</p>
<div class="eq">u<sub>j</sub> = e<sub>j</sub> / x<sub>j</sub> &nbsp;→&nbsp; u<sub>1</sub> = 10/220 ≈ 0.045, u<sub>2</sub> = 20/300 ≈ 0.067, u<sub>3</sub> = 5/295 ≈ 0.017</div>`},
{t:"Total emissions from final demand", h:`
<div class="eq">c = u<sub>1</sub>x<sub>1</sub> + u<sub>2</sub>x<sub>2</sub> + u<sub>3</sub>x<sub>3</sub> = u′x</div>
<p>Plug in x = (I − A)<sup>−1</sup>y:</p>
<div class="eq"><b>c = u′(I − A)<sup>−1</sup>y</b></div>
<ul>
<li><b>y</b>: final demand for each sector</li>
<li><b>(I − A)<sup>−1</sup></b>: Leontief inverse, all the supply chains</li>
<li><b>u′</b>: emissions per unit of output</li>
<li><b>c</b>: total emissions to satisfy that final demand</li>
</ul>
<div class="key">In words: final demand needs production across many sectors, which creates <b>direct and indirect</b> emissions. This is the standard environmentally extended IO model.</div>`},
{t:"Multipliers", h:`
<p>A <b>multiplier</b> = total impact per <b>$1 of final demand</b>.</p>
<p>Divide c by y:</p>
<div class="eq">m = u′(I − A)<sup>−1</sup></div>
<p>Each element of <b>m</b> tells you: spend $1 more on this sector → how much carbon is emitted across the whole economy.</p>
<p>Same trick for <b>jobs</b>. Let l′ = direct jobs per unit of output:</p>
<div class="eq">m<sub>L</sub> = l′(I − A)<sup>−1</sup></div>
<ul>
<li><b>Direct</b> jobs: in the sector that gets the spending</li>
<li><b>Indirect</b> jobs: in its supply chain</li>
</ul>`},
{t:"Worked example: jobs", h:`
<div class="tw"><table>
<tr><th>Sector</th><th class="r">Direct</th><th class="r">Indirect</th><th class="r">Total per ₹1 crore</th></tr>
<tr><td>Agriculture</td><td class="r">20</td><td class="r">5</td><td class="r">25</td></tr>
<tr><td>Manufacturing</td><td class="r">10</td><td class="r">8</td><td class="r">18</td></tr>
<tr><td>Construction</td><td class="r">25</td><td class="r">10</td><td class="r">35</td></tr>
</table></div>
<p>Invest ₹100 crore in construction → 100 × 35 = <b>3,500 jobs</b>.</p>
<p>Split ₹100 crore across sectors:</p>
<div class="tw"><table>
<tr><th>Sector</th><th class="r">Investment</th><th class="r">× multiplier</th><th class="r">Jobs</th></tr>
<tr><td>Agriculture</td><td class="r">₹20 cr</td><td class="r">25</td><td class="r">500</td></tr>
<tr><td>Manufacturing</td><td class="r">₹30 cr</td><td class="r">18</td><td class="r">540</td></tr>
<tr><td>Construction</td><td class="r">₹50 cr</td><td class="r">35</td><td class="r">1,750</td></tr>
<tr class="hl"><td><b>Total</b></td><td class="r">₹100 cr</td><td class="r"></td><td class="r"><b>2,790</b></td></tr>
</table></div>
<div class="eq">ΔL = l′(I − A)<sup>−1</sup>Δy</div>
<p>This is exactly how Pollin got "290 jobs per $1 million" for renewables.</p>`},
{t:"Quick check", h:`
<details><summary>What do rows and columns of an IO table show?</summary>Rows = a sector's sales (outputs). Columns = a sector's purchases (inputs).</details>
<details><summary>Why do total inputs equal total output?</summary>Accounting identity: every rupee of output value must be accounted for as intermediate inputs or value added (value added is the residual).</details>
<details><summary>What are the three Leontief assumptions?</summary>Fixed input proportions (constant technology), linear inputs–outputs (no economies of scale), one homogeneous good per sector.</details>
<details><summary>Calculate a<sub>21</sub> from the example.</summary>a<sub>21</sub> = z<sub>21</sub>/x<sub>1</sub> = 80/220 = 0.36.</details>
<details><summary>What does c = u′(I − A)<sup>−1</sup>y give you?</summary>Total (direct + indirect) emissions caused across all supply chains by a given final demand.</details>
<details><summary>₹40 cr in agriculture and ₹60 cr in construction: how many jobs?</summary>40×25 + 60×35 = 1,000 + 2,100 = 3,100 jobs.</details>`},
{t:"Practice: a 2-sector Leontief problem", h:`
<div class="prob"><b>Exam-style numerical</b>Two sectors, Energy (1) and Goods (2). Total outputs are x<sub>1</sub> = 100 and x<sub>2</sub> = 200. Inter-industry sales: z<sub>11</sub> = 20, z<sub>12</sub> = 40, z<sub>21</sub> = 30, z<sub>22</sub> = 20. Emissions: Energy 10 t, Goods 40 t.<br>(a) Find final demand. (b) Find A. (c) Find the Leontief inverse. (d) Find the carbon multipliers. (e) If final demand for Goods rises by 10, how do outputs and emissions change?</div>
<details class="work"><summary>Show worked solution</summary>
<ol>
<li><b>Final demand</b>: y<sub>1</sub> = 100 − 20 − 40 = <b>40</b>. y<sub>2</sub> = 200 − 30 − 20 = <b>150</b>.</li>
<li><b>A</b> (divide each column by that sector's output): a<sub>11</sub> = 20/100 = 0.2, a<sub>21</sub> = 30/100 = 0.3, a<sub>12</sub> = 40/200 = 0.2, a<sub>22</sub> = 20/200 = 0.1.
<div class="eq">A = [0.2 0.2; 0.3 0.1] &nbsp;&nbsp; I − A = [0.8 −0.2; −0.3 0.9]</div></li>
<li><b>Inverse</b>: det = 0.8×0.9 − (−0.2)(−0.3) = 0.72 − 0.06 = 0.66. Swap the diagonal, flip the signs of the off-diagonal, divide by det:
<div class="eq">(I − A)<sup>−1</sup> = (1/0.66)[0.9 0.2; 0.3 0.8] = [1.364 0.303; 0.455 1.212]</div>
Check: 1.364×40 + 0.303×150 = 100 ✓ and 0.455×40 + 1.212×150 = 200 ✓.</li>
<li><b>Carbon intensities</b>: u = (10/100, 40/200) = (0.1, 0.2). Multipliers m = u′(I − A)<sup>−1</sup>:
<div class="eq">m<sub>1</sub> = 0.1×1.364 + 0.2×0.455 = 0.227 &nbsp;&nbsp; m<sub>2</sub> = 0.1×0.303 + 0.2×1.212 = 0.273</div>
Check: 0.227×40 + 0.273×150 = 9.1 + 40.9 = 50 t = 10 + 40 ✓.</li>
<li><b>Δy<sub>2</sub> = 10</b>: Δx = (I − A)<sup>−1</sup>Δy = (0.303×10, 1.212×10) = (<b>3.03, 12.12</b>). Δc = m<sub>2</sub> × 10 = <b>2.73 t</b>. Energy output rises even though only Goods demand changed: that's the indirect effect.</li>
</ol></details>
<div class="tip">For a 2×2 inverse: [a b; c d]<sup>−1</sup> = (1/(ad − bc))·[d −b; −c a]. Always check your answer by multiplying back to get x.</div>`},
{t:"Quiz: Input–output", q:[
["In an input–output table, reading along a row tells you",
 ["what a sector buys from every other sector, including imports","what a sector sells","the value added generated by each sector","the emissions produced by each sector"],1,
 "Rows show sales (outputs). Columns show purchases (inputs)."],
["Sector 1 has total output 220 and buys 80 from sector 2. The technical coefficient a₂₁ is",
 ["0.36","0.27","2.75","0.80"],0,

["Why is value added described as a 'residual' in an IO table?",

["Jobs multipliers are 25 (agriculture) and 35 (construction) per ₹1 crore. Investing ₹40 cr in agriculture and ₹60 cr in construction creates",

]}
]});

/* ───────────────────────── 15b. ADAPTATION: THAMPI (2023) + NOBLE ET AL. (IPCC AR5 CH 14) ───────────────────────── */
M.push({t:"Optional: adaptation (slides only, not in syllabus)", c:[
{t:"Why this module exists", h:`
<p>The <b>latest slides</b> (Dropbox, 12 Nov 2026, slides 141–149) add an adaptation topic. It sits between input–output and climate finance and has two readings:</p>
<ul>
<li><b>Noble, Huq et al. (2014)</b>, "Adaptation needs and options", IPCC AR5 WGII <b>Ch 14</b>, pp. 839–849.</li>
<li><b>Thampi, Anjana (2023)</b>, "Climate adaptation and job creation: Addressing the climate and livelihoods crises in India", PERI Working Paper 587. It's on Moodle (week of 27 Oct) as "Thampi".</li>
</ul>
<div class="kim"><b>Optional.</b> Neither reading is on the end-term announcement's syllabus. They appear only in the latest slides, and Thampi is on Moodle. This module is kept for completeness, but it's left out of the final quiz, revision sheet and practice set. Study it last, if at all.</div>`},
{t:"IPCC: what adaptation is", h:`
<p><b>AR5 definition</b>: "The process of adjustment to actual or expected climate and its effects. In human systems, adaptation seeks to moderate harm or exploit beneficial opportunities. In natural systems, human intervention may facilitate adjustment."</p>
<ul>
<li>SREX and AR5 added <b>purposefulness</b>: "<i>seeks to</i> moderate" rather than AR4's "moderates".</li>
<li><b>Autonomous</b> adaptation (unplanned, e.g. diversifying a livelihood for economic reasons) is a term the literature uses inconsistently.</li>
</ul>
<div class="vs">
<div><h3>Incremental adaptation</h3><p>Keeps the <b>essence and integrity</b> of existing systems: new crop varieties, changed planting times, more efficient irrigation.</p></div>
<div><h3>Transformational adaptation</h3><p>Changes the <b>fundamental attributes</b> of a system: switching from crops to livestock, migrating, a "paradigm shift" (a phrase used by the Green Climate Fund). It isn't always needed, and done badly it can create inequities.</p></div>
</div>
<p><b>Adaptation deficit</b>: the gap between a system's current state and the state that would minimise harm from the <i>existing</i> climate, i.e. inadequate adaptation to today's climate. It is often part of a wider "development deficit". Delay widens it, and failing to close it leaves residual damages.</p>`},
{t:"IPCC: needs and vulnerability", h:`
<ul>
<li><b>Vulnerability</b> = "propensity or predisposition to be adversely affected". Before AR4 it had three parts: <b>exposure + sensitivity + adaptive capacity</b>. In AR5 it is <b>sensitivity + capacity</b> only, and exposure moves into <b>risk</b>.</li>
<li><b>Adaptation needs</b> = the gap between what might happen as the climate changes and what we would like to happen.</li>
<li>Two ways of framing them: the <b>risk-hazard</b> approach (the physical hazard at a place) and the <b>social vulnerability</b> approach (<i>why</i> some groups are vulnerable: institutions, poverty, gender). The framing has shifted toward social and economic drivers.</li>
<li>Types of need (after Burton et al.): <b>biophysical</b> (ecosystem services; fisheries supply over 20% of animal protein for about 1.5 bn people), <b>social</b> (gender, age, health, ethnicity, class; poverty and inequality matter most; poverty traps), <b>institutional</b> (Ostrom's definition of institutions; local governments are pivotal), <b>private sector</b> (firms' risks are regulatory, physical, reputational and litigation; action has been slow), and <b>information, capacity and finance</b> (adaptation got only about one-fifth of fast-start finance).</li>
</ul>`},
{t:"IPCC: adaptation options (Table 14-1)", h:`
<table>
<tr><th>Category</th><th>Sub-type</th><th>Examples</th></tr>
<tr><td rowspan="4"><b>Structural / physical</b></td><td>Engineered &amp; built</td><td>Sea walls, levees, water storage, cyclone shelters, building codes</td></tr>
<tr><td>Technological</td><td>New crop varieties, efficient irrigation, early-warning systems, insulation</td></tr>
<tr><td>Ecosystem-based</td><td>Wetland and mangrove restoration, green roofs, community-based resource management</td></tr>
<tr><td>Services</td><td>Social safety nets, food banks, public health, water and sanitation</td></tr>
<tr><td rowspan="3"><b>Social</b></td><td>Educational</td><td>Awareness campaigns, extension services, shared local knowledge</td></tr>
<tr><td>Informational</td><td>Hazard mapping, early warning, climate services</td></tr>
<tr><td>Behavioural</td><td>Evacuation planning, migration, livelihood diversification, crop switching</td></tr>
<tr><td rowspan="3"><b>Institutional</b></td><td>Economic</td><td>Taxes and subsidies, insurance, catastrophe bonds, payments for ecosystem services, cash transfers</td></tr>
<tr><td>Laws &amp; regulations</td><td>Zoning, building standards, fishing quotas, land tenure</td></tr>
<tr><td>Government policies</td><td>National adaptation plans, disaster planning, community-based adaptation</td></tr>
</table>
<ul>
<li><b>Engineered options are still the most common</b>, but they face uncertainty, high cost and long lifetimes, and they can backfire. After the 1953 North Sea storm surge, England built sea walls that later destabilised the coast. The fix is <b>phased capacity expansion</b> (Thames Estuary 2100, Dutch Delta Works).</li>
<li>Technology transfer is <b>easier for adaptation than for mitigation</b>: adaptation technologies are often familiar and unpatented.</li>
<li>Ecosystem-based adaptation: of 44 NAPAs, 50% acknowledged ecosystem services and 22% used them. Protecting New York City's watershed was cheaper than a filtration plant.</li>
<li>Selection criteria: <b>no-regrets / low-regrets / win-win</b> options and multi-criteria analysis. <b>Maladaptation</b> is when an action raises vulnerability elsewhere or in the future.</li>
</ul>`},
{t:"Thampi: two crises at once", h:`
<p><b>The climate crisis in India:</b></p>
<ul>
<li>India was <b>7th</b> of the 10 countries most affected by extreme weather in 2019.</li>
<li>1970–2021: <b>434 disasters</b> affected <b>2.3 bn</b> people and caused about <b>USD 140 bn</b> in damage (ESCAP).</li>
<li>Average annual loss from cascading climate risk: <b>4.8% of GDP</b> under RCP4.5 and <b>8.1%</b> under RCP8.5.</li>
<li>RCP4.5 projects <b>+2.3°C</b> for India by 2040–69, with more heatwaves (worst in the north and north-west), erratic monsoons, <b>20–30 cm</b> of sea-level rise by 2100, and cyclones on the east coast (Odisha, Andhra Pradesh, Tamil Nadu).</li>
<li>ILO: heat stress could cost the equivalent of <b>34 m</b> full-time jobs by 2030.</li>
</ul>
<p><b>The livelihoods crisis:</b> high growth without secure jobs. <b>80–90%</b> of workers are informal, farm output growth is slow, and regional gaps are wide.</p>
<ul>
<li><b>Forstater (2004)</b>: tackling only the ecological problem or only the jobs problem can make the other worse.</li>
<li><b>"Adaptation apartheid"</b> (Desmond Tutu, 2007): rich people in rich countries are protected while the poorest fend for themselves. Government-led adaptation is mostly in rich countries.</li>
<li>Most adaptation in practice is <b>behavioural or cultural</b> (households cutting water use). <b>Institutional</b> responses (drought-relief programmes, formal water rules) are a minority, and some responses are maladaptive. Only 2 of India's 37 heat action plans did vulnerability assessments. The NAPCC (2008) is "simultaneously significant and hollow".</li>
</ul>
<p><b>Two questions</b>: (1) Are livelihoods in some regions more vulnerable? (2) Can institutional adaptation address both crises at once?</p>`},
{t:"The Livelihood Vulnerability Index (LVI)", h:`
<p>It uses a <b>contextual vulnerability</b> approach: vulnerability is shaped by social, economic, political, institutional and technological processes as well as biophysical change. In IPCC terms that means sensitivity plus capacity to adapt. It's calculated for NSS regions from PLFS 2021-22, AIDIS 2019 and SAS 2019.</p>
<p><b>The eight indicators</b>:</p>
<ol>
<li>Informal non-agricultural employment</li>
<li>Households not owning land (no fallback assets)</li>
<li>Workers in natural-resource sectors (agriculture, forestry, fishing, mining, quarrying)</li>
<li>Share of SC/ST population (marginalised communities)</li>
<li>Women primarily in unpaid domestic work (gendered labour, the double burden)</li>
<li>Share of farm plots irrigated (<b>inversely</b> related to vulnerability)</li>
<li>Reliance on groundwater for irrigation</li>
<li>Crop loss from drought, flood or disaster with no insurance claim received</li>
</ol>
<p>Indicators 6–8 are <b>rural only</b>, so the rural LVI uses 8 indicators and the urban LVI uses 5.</p>
<div class="eq">NI<sub>ir</sub> = (I<sub>ir</sub> − min<sub>r</sub>I<sub>ir</sub>) / (max<sub>r</sub>I<sub>ir</sub> − min<sub>r</sub>I<sub>ir</sub>) &nbsp;&nbsp;(irrigation: (max − I) / (max − min))</div>
<div class="eq">LVI<sub>r</sub> = (Σ<sub>i</sub> NI<sub>ir</sub>) / n</div>
<p>Each indicator is scaled 0–1 across regions, then averaged, separately for rural and urban areas. Rural LVI ranges from 0.21 to 0.68 and urban from 0.24 to 0.54. It is a <b>relative</b> measure: a low score doesn't mean a region is safe in absolute terms.</p>
<p><b>Most vulnerable rural regions</b>: western and southern Rajasthan, inland northern Maharashtra, northern Chhattisgarh, Kachchh (Gujarat), Ranchi plateau (Jharkhand). <b>Most vulnerable urban</b>: northern Chhattisgarh, northern Odisha, southern upper Ganga plains (UP), inland north-east Telangana, northern Rajasthan. Since these cut across state lines, Thampi argues for planning by <b>agro-climatic region</b>.</p>`},
{t:"Worked LVI example", h:`
<div class="prob"><b>Exam-style numerical</b>Three regions, two indicators. <b>Informal non-farm employment</b>: A 60%, B 80%, C 70%. <b>Irrigated plots</b>: A 40%, B 20%, C 70%. Compute the LVI and rank the regions.</div>
<details class="work"><summary>Show worked solution</summary>
<ol>
<li>Informal (positive): min = 60, max = 80, range = 20. NI: A = 0, B = 1, C = 0.5.</li>
<li>Irrigated (<b>inverse</b>): max = 70, min = 20, range = 50. NI = (70 − I)/50: A = 0.6, B = 1, C = 0.</li>
<li>LVI = average: A = (0 + 0.6)/2 = <b>0.30</b>, B = (1 + 1)/2 = <b>1.00</b>, C = (0.5 + 0)/2 = <b>0.25</b>.</li>
<li>Ranking: B &gt; A &gt; C. B is most vulnerable, with the most informality and the least irrigation.</li>
</ol>
<p>Common mistake: normalising irrigation the "positive" way. More irrigation means <i>less</i> vulnerability.</p></details>`},
{t:"Jobs from adaptation (IO method)", h:`
<p>Thampi picks <b>five adaptation activities</b>, one per hazard: safe houses (disasters), cooling centres or winter shelters (heat or cold), seawalls (coast), water storage reservoirs (drought), and restored wetlands or mangroves (floods).</p>
<p><b>Method</b>, the same as Pollin and Azad: India's 2018 OECD input–output table plus PLFS 2017-18 data. Employment per unit of output × Leontief inverse gives <b>direct + indirect</b> jobs. Each activity's inputs are weighted by cost shares (e.g. a safe house draws on mining, wood, metal products, construction and repair). Induced jobs are excluded, so the figures are <b>underestimates</b>.</p>
${bars([["Safe houses",176.9],["Cooling centres",157.0],["Seawalls",135.8],["Water storage",98.7],["Wetlands/mangroves",83.2],["Adaptation avg",130.3],["Mitigation avg",157.7],["Fossil fuels",47.1]],180,"","")}
<p class="src">Jobs per USD 1 million invested (Thampi Tables 1–3). Adaptation average = 69.8 direct + 60.5 indirect.</p>
<ul>
<li><b>Mitigation</b> (⅔ renewables, ⅓ efficiency): 157.7 jobs per $1 m. Bioenergy is highest at 241, then retrofits at 181.1 and solar at 117.1.</li>
<li><b>Fossil fuels</b>: only 47.1 jobs per $1 m (5.4 direct + 41.7 indirect).</li>
</ul>`},
{t:"The combined programme", h:`
<table>
<tr><th>Spend</th><th class="r">Jobs</th><th class="r">% of 2017-18 labour force</th></tr>
<tr><td>Adaptation: 1.5% of GDP (≈ USD 50 bn), India's estimated annual adaptation cost (ESCAP)</td><td class="r"><b>6.5 m</b></td><td class="r">1.3%</td></tr>
<tr><td>Mitigation: an extra 1.5% of GDP</td><td class="r">7.9 m</td><td class="r">1.6%</td></tr>
<tr class="hl"><td><b>Net gain</b>: 3% of GDP on adaptation + mitigation instead of fossil fuels</td><td class="r"><b>9.7 m</b></td><td class="r">~2%</td></tr>
</table>
<ul>
<li>India's annual adaptation cost is <b>USD 45.3 bn</b>, the highest in South and South-West Asia, whose total is $61.5 bn under RCP8.5.</li>
<li>Past disaster costs: a 2020 cyclone caused over USD 13 bn of damage, and a 2014 flood USD 16.9 bn.</li>
<li><b>Regional balance</b>: solar jobs are concentrated in the west and south, while coal job losses fall in the east. Adaptation is needed everywhere, so it can offset those imbalances.</li>
<li>The vision is that the new jobs are <b>formal</b>, with secure earnings, which would be transformative where 80–90% of work is informal.</li>
</ul>
<div class="key">Thampi extends Pollin (2015) and Azad (2020): mitigation alone → mitigation + redistribution → <b>mitigation + adaptation</b>. In all three, India spends about 1.5% of GDP per programme and measures jobs with input–output tables.</div>
<div class="tip">Numerical check: $50 bn × 130.3 jobs per $1 m = 50,000 × 130.3 ≈ <b>6.5 m</b> jobs.</div>`},
{t:"Quiz: Adaptation", q:[
["In IPCC AR5, which component was moved out of 'vulnerability' and into 'risk'?",
 ["Sensitivity","Exposure","Adaptive capacity","Resilience"],1,
 "AR5 vulnerability = sensitivity + capacity to adapt. Exposure now sits within risk."],
["A farmer switching from crops to livestock in response to drying conditions is an example of",
 ["incremental adaptation, since the farm keeps operating on the same land and assets","transformational, since it changes the system's fundamental attributes","maladaptation, since livestock raise methane emissions","an adaptation deficit, since it responds to the current climate"],1,
 "Incremental keeps the system's essence (new varieties, planting dates). Changing the livelihood itself is transformational."],
["The 'adaptation deficit' refers to",
 ["the gap between rich and poor countries' adaptation spending","inadequate adaptation to the climate that already exists today","the shortfall in the USD 100 bn climate finance target","the share of adaptation in total climate finance"],1,
 "It is the gap between the current state and one that minimises harm from existing climate. It is often part of a development deficit."],
["In Thampi's LVI, which indicator is normalised as (max − I)/(max − min)?",
 ["Share of SC/ST population","Share of farm plots irrigated","Reliance on groundwater for irrigation","Crop loss without an insurance claim"],1,
 "Irrigation lowers vulnerability, so it's inverted. Groundwater reliance raises vulnerability, so it's normalised normally."],
["Informal employment shares are A 60%, B 80%, C 70%. What is region C's normalised value?",

["Per USD 1 million in Thampi's estimates, which ranking is correct?",

["Which statement about adaptation options does the IPCC chapter support?",

]}

/* ───────────────────────── 16. CLIMATE FINANCE: SKOVGAARD CH 9 + OWID ───────────────────────── */
M.push({t:"Climate finance & aid (Skovgaard 9; OWID)", c:[
{t:"What 'climate finance' means here", h:`
<p>Jakob Skovgaard, <i>The Economisation of Climate Change: How the G20, the OECD and the IMF Address Fossil Fuel Subsidies and Climate Finance</i> (2021), Ch 9 "Climate Finance: Key Issues".</p>
<p><b>Definition used</b>: flows <b>from developed to developing countries</b> "whose expected effect is to reduce net greenhouse gas emissions and/or to enhance resilience" to climate change (Gupta et al. 2014). Flows within countries, to rich countries, or South–South are excluded.</p>
<ul>
<li>It is a <b>dual</b> issue: an environmental purpose pursued with an economic instrument. So it is the UNFCCC issue in which <b>finance ministries</b> are most involved.</li>
<li>Public climate finance is <b>fiscal expenditure</b>, unlike fossil-fuel subsidy reform, the book's other topic.</li>
<li>Mitigation gets the bulk of the money, and private finance is several times larger than public finance.</li>
</ul>`},
{t:"From Rio to Paris", h:`
<table>
<tr><th>Year</th><th>Milestone</th></tr>
<tr><td><b>1992 Rio</b> (UNFCCC)</td><td>Developed countries shall "provide <b>new and additional</b> financial resources" (Art 4.3), under <b>Common but Differentiated Responsibilities and Respective Capabilities (CBDR)</b> (Art 4.2). <b>Annex II</b> (OECD members in 1992) pay. Annex I = Annex II + economies in transition. Developing = non-Annex I.</td></tr>
<tr><td>1990s</td><td>Climate finance treated as a subtype of "environmental finance" (alongside the biodiversity and desertification conventions). Flows modest.</td></tr>
<tr class="hl"><td><b>2009 Copenhagen (COP15)</b></td><td>Developed countries commit to "mobilizing jointly <b>USD 100 billion a year by 2020</b> … from a wide variety of sources, public and private". Fast-start finance of <b>$30 bn for 2010–12</b>. First mention of the <b>Green Climate Fund</b>. Developing countries had asked for 1–1.5% of developed-country GDP. <b>Delivery</b> (slides, OECD data): $83.3 bn mobilised in 2020, short of the target; <b>$115.9 bn in 2022, two years late</b>.</td></tr>
<tr><td>2010 Cancun (COP16)</td><td>Green Climate Fund formally established.</td></tr>
<tr><td><b>2015 Paris (COP21)</b></td><td>$100 bn continues to 2025; a new goal to be set before 2025 from a <b>floor of $100 bn</b>. Developing countries "encouraged" to contribute voluntarily (Art 9.2). <b>"New and additional" dropped.</b> Definitions still unresolved.</td></tr>
</table>
<div class="kim">"Mobilised" was never defined, which left open what counts toward the $100 bn. That is the biggest fight in the chapter.</div>`},
{t:"What counts? The onion diagram", h:`
<figure class="dia"><svg viewBox="0 0 640 395" role="img" aria-label="Onion diagram: dedicated climate funds at the centre, then other public finance, mobilised private finance and all other flows"><circle cx="182" cy="190" r="170" class="f3"/><circle cx="182" cy="190" r="128" class="f2"/><circle cx="182" cy="190" r="88" class="f1"/><circle cx="182" cy="190" r="46" class="boxa"/><circle cx="182" cy="190" r="170" class="ink" style="stroke-width:1"/><text x="182" y="186" text-anchor="middle" style="font-size:11px;font-weight:600">1 · Climate</text><text x="182" y="200" text-anchor="middle" style="font-size:11px;font-weight:600">funds</text><text x="182" y="126" text-anchor="middle" style="font-size:11px">2 · Other public</text><text x="182" y="86" text-anchor="middle" style="font-size:11px">3 · Mobilised private</text><text x="182" y="42" text-anchor="middle" style="font-size:11px">4 · Everything else</text><text x="370" y="40" class="a">1</text><text x="394" y="40">UNFCCC funds (GCF…) $0.6–1.6 bn</text><text x="394" y="55" class="m">+ other climate funds (CIFs) $1.4–2.4 bn</text><text x="370" y="92" class="a">2</text><text x="394" y="92">MDB climate finance $17–20 bn</text><text x="394" y="107" class="m">+ bilateral ODA ≈ $30 bn (most disputed)</text><text x="370" y="144" class="a">3</text><text x="394" y="144">Private finance mobilised by MDBs</text><text x="394" y="159" class="m">and bilateral agencies ≈ $15–17 bn</text><text x="370" y="196" class="a">4</text><text x="394" y="196">Domestic, North–North, South–South</text><text x="394" y="211" class="m">≈ $680 bn</text><text x="370" y="248" class="a">5?</text><text x="394" y="248">'Brown' finance (fossil, logging…)</text><text x="394" y="263" class="m">several times larger, outside the onion</text><text x="370" y="306" class="m">annual flows, 2015–16 (UNFCCC SCF 2018)</text><text x="182" y="385" text-anchor="middle" class="m">more contested as climate finance →</text></svg><figcaption>UNFCCC Standing Committee on Finance (2018). Undisputed flows sit at the centre; the bigger the flow, the bigger the ring.</figcaption></figure>
<ol>
<li><b>Dedicated multilateral climate funds</b>: GCF and Adaptation Fund ($0.6–1.6 bn/yr), plus the World Bank's Climate Investment Funds ($1.4–2.4 bn). Some argue <i>only</i> this layer counts.</li>
<li><b>Public finance through non-climate channels</b>: MDB climate lending ($17–20 bn) and bilateral ODA (about $30 bn). The latter is <b>most controversial</b>: donors label their own projects (<b>over-coding</b>), and it may not be "new and additional".</li>
<li><b>Private finance mobilised</b> by MDBs and bilateral agencies through guarantees and risk-sharing ($15–17 bn).</li>
<li><b>Everything else</b>: domestic, North–North and South–South flows (about $680 bn).</li>
<li>Some add a fifth layer of <b>"brown finance"</b> (fossil fuels, logging, cement) that is several times larger than the green total.</li>
</ol>
<p><b>Instruments</b>: grants clearly count. <b>Loans are disputed</b>, and most climate finance is loans or equity (MDBs lend almost exclusively). One fix is to count only the <b>grant equivalent</b> of a concessional loan: its market value minus its actual value. Only private finance <b>leveraged by public</b> money counts toward the $100 bn.</p>`},
{t:"Generating finance: equity vs efficiency", h:`
<div class="vs">
<div><h3>Equity norms</h3><ul><li><b>CBDR</b>: rich countries bear more, arguably all</li><li><b>Historical responsibility</b>: pay in proportion to past emissions</li><li>So public finance is crucial, and climate finance is distinct from aid</li></ul></div>
<div><h3>Efficiency norm</h3><ul><li>Maximum benefit per dollar, matching the worldview of economic institutions</li><li>So private finance is crucial, and use synergies with development aid</li><li>Governments often maximise <i>national</i> rather than global benefit</li></ul></div>
</div>
<ul>
<li><b>Burden-sharing key</b> by GDP or by emissions? Should emerging economies pay? China is sceptical of historical responsibility. The Least Developed Countries urged emerging economies to contribute. The <b>US</b> (including under Obama) opposed burden-sharing. The EU favoured both. <b>No key was adopted.</b></li>
<li><b>New and additional</b> to the <b>0.7% of GNI</b> aid target, which few donors meet. Several developing countries say only finance above 0.7% should count.</li>
<li>Developing countries and NGOs see climate finance as an <b>entitlement</b> (owed for historical responsibility), so it should come as grants with minimal conditions. Aid, by contrast, rests on the duty of the wealthy to help the poor.</li>
<li>"Innovative sources" such as aviation levies are popular with NGOs but resisted by states, which don't want to give up control over taxation.</li>
</ul>`},
{t:"Allocating finance & who decides", h:`
<table>
<tr><th></th><th>Generation</th><th>Allocation</th></tr>
<tr><td><b>Equity</b></td><td>CBDR, historical responsibility → public money from the North, distinct from aid</td><td><b>Vulnerability</b> → prioritise poor and vulnerable countries and <b>adaptation</b>. Those affected should help decide.</td></tr>
<tr><td><b>Efficiency</b></td><td>Maximise global benefit → private finance, synergies with aid</td><td>Maximise global benefit → <b>emerging economies</b> and <b>mitigation</b></td></tr>
</table>
<ul>
<li><b>Mitigation</b> is a <b>global public good</b>: donors benefit wherever it happens, and it is Pareto-improving because abatement is cheaper in developing countries. <b>Adaptation</b> brings donors only indirect benefits (e.g. fewer climate refugees), so it is argued for on vulnerability and responsibility grounds.</li>
<li>LDCs and Small Island Developing States want a <b>50:50</b> mitigation–adaptation split. Donors prefer mitigation.</li>
<li>If climate finance is treated as aid, <b>donors decide</b> where it goes. If it is treated as restitution, recipients should have a say. Efficiency arguments de facto favour developed countries.</li>
</ul>`},
{t:"The fragmented system", h:`
<ul>
<li><b>UNFCCC</b> is the most important institution (the $100 bn target, CBDR, the Standing Committee on Finance's data). It decides by <b>consensus</b>, which gives developing countries leverage. But most decisions are made <b>outside</b> it. Its funds (GCF, Adaptation Fund, LDC Fund, partly the GEF) disbursed only $0.6–1.6 bn in 2015–16, and the Trump administration refused to contribute.</li>
<li><b>Other UN bodies</b>: UNDP and UNEP implement projects. The High-level Advisory Group on Climate Change Financing (2010) under Ban Ki-moon studied sources. UNEP Finance Initiative.</li>
<li><b>World Bank</b>: favoured by developed countries because votes follow financial contributions and GDP. It runs the CIFs, promoted the CDM, and is criticised for fossil-fuel lending.</li>
<li><b>Regional MDBs</b> (AfDB, ADB, EBRD, IDB): scaled up climate finance, but less active than the World Bank.</li>
<li><b>Civil society</b>: think tanks (Climate Policy Initiative, ODI, WRI) produce data. NGOs (Climate Action Network, Greenpeace, WWF, Oxfam) push equity.</li>
<li><b>Corporate actors</b>: investor networks such as IIGCC. They focus on mitigation.</li>
<li><b>Domestic level matters most</b>: allocation is driven by donor income, environmental attention, responsibility, recipient vulnerability and government ideology.</li>
</ul>
<div class="key">The dividing line: developed countries want <b>broad definitions, efficiency and control</b>. Developing countries want <b>narrow definitions, equity and influence</b>.</div>`},
{t:"OWID: how much aid is spent on climate?", h:`
<p>Hannah Ritchie &amp; Pablo Arriagada, <i>Our World in Data</i> (Oct 2026), using the OECD <b>RioMarkers</b> database (pointed out by Richard Tol). It covers <b>bilateral</b> aid only, about 90% of development aid.</p>
<ul>
<li>2024: about <b>$210 bn</b> of bilateral aid committed. <b>31%</b> was non-allocable (refugee costs in donor countries, admin, budget support, debt relief). <b>69% (about $145 bn)</b> went to specific projects.</li>
<li>About <b>$50 bn</b> of that (34% of allocable aid) was climate-related: <b>mitigation-only $17 bn</b>, <b>adaptation-only $16 bn</b>, <b>both $17 bn</b>. The other $96 bn (66%) wasn't marked as climate.</li>
</ul>
${bars([["Bilateral project aid",34],["All bilateral aid",24],["All development aid",20]],40,"%","")}
<p class="src">Climate-related share of each total, 2024. "About one-fifth" of all aid assumes zero multilateral climate aid, so the true share is probably a bit higher.</p>
<ul>
<li><b>Trend</b>: about $22 bn (<b>18%</b>) in 2010 → <b>$50 bn (34%)</b> in 2024. 2010 is underestimated because 37% of aid was unscreened then; under 10% has been unscreened since 2014. Funding has shifted from mostly mitigation toward adaptation.</li>
</ul>`},
{t:"OWID: principal vs significant, and the two worries", h:`
<p>RioMarkers tags climate as a <b>principal</b> objective (the project probably wouldn't exist without climate change) or a <b>significant</b> (secondary) one. More than <b>half</b> of climate-tagged funding is secondary-only, yet counted at its <b>full value</b>.</p>
<div class="key">Counting only principal-objective projects drops climate's share of bilateral project aid from <b>34% to 13%</b>.</div>
<table>
<tr><th>Example</th><th>Tag</th><th>Why it's ambiguous</th></tr>
<tr><td>Japan → Iraq, Samawah water supply, $310 m</td><td>Adaptation, principal</td><td>Drought-proof water is a core development need anyway</td></tr>
<tr><td>France → Tanzania, Kakono hydro plant, $122 m</td><td>Principal</td><td>Energy access is a development goal in itself</td></tr>
<tr><td>South Korea → Tanzania, hospital and training centre, $163 m</td><td>Mitigation, secondary</td><td>A standard hospital, with all $163 m counted because of energy-efficient design</td></tr>
</table>
<div class="vs">
<div><h3>Displacement</h3><p>Climate projects crowd out traditional aid: clean energy instead of bed nets or maternal nutrition.</p></div>
<div><h3>Relabelling</h3><p>Old aid gets a climate tag, ticking off climate pledges with <b>no new money</b>.</p></div>
</div>
<p>The ideal is <b>additionality</b>. Ritchie guesses both worries are happening, but the data can't say how much of each.</p>
<div class="kim">This is Skovgaard's <b>over-coding</b> and <b>"new and additional"</b> debate, measured. Use OWID's numbers as evidence in a Skovgaard answer.</div>`},

{t:"How to use this section", h:`
<p>Part 2 of the exam asks you to "solve a numerical problem" or "explain with the help of a graph". Every problem here comes from a syllabus reading (several are the textbook's own exercises).</p>
<ol>
<li>Try each one on paper before opening the solution.</li>

</ol>
<div class="tip">The examiner's "related" category probably means variations: change the tax, the discount rate or the participation rate and say which way the answer moves. Each problem ends with a "what if" for that.</div>`},

<li><b>(b)</b> Damage = $0.60 × 80,000 = <b>$48,000 per day</b> (the shaded band).</li>
<li><b>(c)</b> Optimal Pigouvian tax = marginal external damage = <b>$0.60/gal</b>.</li>
<li><b>(d)</b> The tax shifts supply up by $0.60. Sellers now need $0.60 more at each quantity. Find the price where Qd equals what sellers supply at (P − 0.60): at P = $3.80, Qd = 70 and Qs(3.20) = 70 ✓. New equilibrium: <b>buyers pay $3.80, sellers keep $3.20, Q = 70,000</b>.</li>
<li><b>(e)</b> Revenue = $0.60 × 70,000 = <b>$42,000/day</b>, which equals the remaining damage.</li>
<li><b>Incidence</b>: buyers pay $0.40 more and sellers receive $0.20 less. Demand is steeper than supply here, so buyers bear more.</li>
<li><b>Deadweight loss removed</b> (orange triangle) = ½ × 10,000 × $0.60 = <b>$3,000/day</b>. (At Q = 80, social MC is $4.00 and MB is $3.40.)</li>
</ol></details>
<p><b>What if</b> damage doubled to $1.20? The tax doubles and Q falls further. Goodwin's general point: raise the tax when harm rises.</p>`},
{t:"P2 · Discounting a regulation (Goodwin Ex 13.5)", h:`
<div class="prob"><b>Problem</b>Aqualand: a water law costs <b>$100 m now</b>, and its benefits of <b>$250 m arrive in 25 years</b>. (a) Recommend at r = 5%. (b) At r = 3%?</div>
<details class="work"><summary>Show worked solution</summary>
<div class="eq">PV = 250 / (1.05)<sup>25</sup> = 250 / 3.386 = $73.8 m &nbsp;&lt;&nbsp; $100 m → reject</div>
<div class="eq">PV = 250 / (1.03)<sup>25</sup> = 250 / 2.094 = $119.4 m &nbsp;&gt;&nbsp; $100 m → accept (+$19.4 m)</div>
<p>The decision flips with r. Break-even: (1+r)<sup>25</sup> = 2.5, so r ≈ <b>3.7%</b>.</p></details>
<div class="prob"><b>Problem</b>Nordhaus's bond: what would you pay today for ₹1,000 (real) in 50 years at 4%? And a $10 m wind farm that avoids $100 m of damage in 50 years: does it pass at 4% and at 7%?</div>
<details class="work"><summary>Show worked solution</summary>
<ul><li>1,000 / 1.04<sup>50</sup> = 1,000 / 7.107 = <b>₹141</b>.</li>
<li>Wind: 4% gives $14.1 m &gt; $10 m, so it passes. 7% gives $3.39 m, so net is <b>−$6.6 m</b> and it fails.</li>
<li>Real rate check: nominal 6%, inflation 2% → real 4%.</li></ul></details>
<p><b>Handy powers</b>: 1.02<sup>25</sup> = 1.641, 1.03<sup>25</sup> = 2.094, 1.05<sup>25</sup> = 3.386, 1.04<sup>50</sup> = 7.107, 1.07<sup>50</sup> = 29.46, 1.01<sup>50</sup> = 1.645.</p>`},
{t:"P3 · Value of a statistical life & CBA", h:`
<div class="prob"><b>Problem</b>A clean-air rule costs <b>$500 m</b> and avoids <b>50 deaths</b>. A survey finds households will pay <b>$10/yr</b>, and there are <b>100 m</b> households. Should the rule pass? What if WTP were $4?</div>
<details class="work"><summary>Show worked solution</summary>
<ol><li>Total WTP = $10 × 100 m = $1 bn → VSL = $1 bn / 50 = <b>$20 m</b>.</li>
<li>Cost per life saved = $500 m / 50 = <b>$10 m</b> &lt; VSL, so it passes. Equivalently, benefits of $1 bn exceed costs of $500 m.</li>
<li>At $4: WTP = $400 m &lt; $500 m, so it fails CBA, and VSL = $8 m &lt; $10 m per life.</li></ol>
<p>Add the caveats: ethics of pricing life, survey bias, and the precautionary principle.</p></details>`},
{t:"P4 · Firm response to a tax & cost-effectiveness", h:`
<div class="prob"><b>Problem</b>A firm emits 20 units. Its marginal cost of reducing r units is <b>MCR = 2r</b>. A tax of <b>$20/unit</b> is imposed. (a) How much does it cut? (b) Find areas A, B and C from Fig 13.5. (c) Two firms: A has MCR = r and B has MCR = 3r. The regulator wants 20 units cut in total. Compare a uniform standard (10 each) with a tax.</div>
<details class="work"><summary>Show worked solution</summary>
<ol>
<li><b>(a)</b> Cut while MCR &lt; T: 2r = 20 → <b>r = 10</b>, so it emits 10.</li>
<li><b>(b)</b> Cleanup cost B = area under MCR from 0 to 10 = ½ × 10 × 20 = <b>$100</b>. Tax on the remaining 10 units: A = 10 × 20 = <b>$200</b>. With no cuts it would pay 20 × 20 = $400, so it saves C = 400 − 200 − 100 = <b>$100</b>. Total cost A + B = $300 &lt; $400.</li>
<li><b>(c) Standard</b>: A's cost = ½·10·10 = $50. B's cost = ½·10·30 = $150. <b>Total $200.</b></li>
<li><b>Tax T</b>: A cuts r<sub>A</sub> = T and B cuts r<sub>B</sub> = T/3. Total = 4T/3 = 20 → <b>T = $15</b>, so r<sub>A</sub> = 15 and r<sub>B</sub> = 5. Costs: A = ½·15·15 = $112.5, B = ½·5·15 = $37.5. <b>Total $150.</b></li>
<li>The tax saves <b>$50 (25%)</b> because it equalises MCR across firms (both at $15). Tradable permits giving the same total cut produce the same allocation, at a permit price of $15.</li>
</ol></details>`},
{t:"P5 · Common property: the aquifer (Goodwin Ex 14.2)", h:`
<div class="prob"><b>Problem</b>Pumping costs <b>50 pesos/day</b>. Revenue per farm for 1–9 farms: 100, 100, 100, 90, 80, 65, 55, 40, 20. (a) How many farms pump with no regulation? (b) Is it efficient? (c) What is the efficient number?</div>
<details class="work"><summary>Show worked solution</summary>
<div class="tw"><table>
<tr><th>Farms</th><th class="r">1</th><th class="r">2</th><th class="r">3</th><th class="r">4</th><th class="r">5</th><th class="r">6</th><th class="r">7</th><th class="r">8</th><th class="r">9</th></tr>
<tr><td>Profit/farm</td><td class="r">50</td><td class="r">50</td><td class="r">50</td><td class="r">40</td><td class="r">30</td><td class="r">15</td><td class="r">5</td><td class="r neg">−10</td><td class="r neg">−30</td></tr>
<tr class="hl"><td>Total profit</td><td class="r">50</td><td class="r">100</td><td class="r">150</td><td class="r"><b>160</b></td><td class="r">150</td><td class="r">90</td><td class="r">35</td><td class="r neg">−80</td><td class="r neg">−270</td></tr>
</table></div>
<ol><li><b>(a)</b> Farms enter while profit per farm &gt; 0, so <b>7 farms</b> (the 8th would lose 10).</li>
<li><b>(b)</b> No. Each new farm lowers the others' revenue, and that external cost is ignored. Total profit is only 35.</li>
<li><b>(c)</b> Total profit peaks at <b>4 farms (160)</b>. The 5th farm adds 30 to itself but costs the other four 40 in total (10 each), so net −10.</li></ol>
<p>Policies to get from 7 to 4: a per-day fee or permits (ITQ-style), or Ostrom-style community rules. This mirrors the fishery graph: T<sub>e</sub> = 7, T* = 4.</p></details>`},
{t:"P6 · Public good: habitat (Goodwin Ex 14.3)", h:`
<div class="prob"><b>Problem</b>Marginal benefits for acres 1–6. Katya: 50, 40, 30, 20, 10, 0. Miguel: 30, 25, 20, 15, 10, 5. Cost = <b>$40/acre</b>. (a) Draw social MB. (b) Efficient acres? (c) Policy? (d) Who resists?</div>
<details class="work"><summary>Show worked solution</summary>
<ol><li><b>(a)</b> Add <b>vertically</b>: social MB = 80, 65, 50, 35, 20, 5.</li>
<li><b>(b)</b> Preserve while social MB ≥ $40: acres 1–3 qualify, and the 4th (35) doesn't. So <b>3 acres</b>.</li>
<li><b>(c)</b> Public provision funded by taxes. Free riding means voluntary contributions fall short. Total cost = 3 × $40 = $120, e.g. $60 each.</li>
<li><b>(d)</b> Miguel. His benefit over 3 acres is 30 + 25 + 20 = $75 against Katya's $120. An equal $60 tax still leaves him positive, but he has the bigger incentive to understate his WTP.</li></ol>
<p>Contrast: for a private good you would add quantities <b>horizontally</b>.</p></details>`},
{t:"P7 · Cost per ton & carbon pricing (Nordhaus)", h:`
<div class="prob"><b>Problem</b>(a) A $1,000 fridge saves $50/yr for 10 yrs and 0.3 tCO₂/yr. Cost per ton? (b) Gas power costs 1¢/kWh less than old coal and emits 0.5 t less per 1,000 kWh. Cost per ton? (c) A household uses 10,000 kWh (half coal, half gas, 8 t) at 10¢. Effect of $25/t? (d) A plant burns enough coal to emit 16 m t CO₂. Its tax bill at $25/t?</div>
<details class="work"><summary>Show worked solution</summary>
<ol><li>(a) Net cost = 1,000 − 500 = $500, tons = 3, so <b>$167/t</b>.</li>
<li>(b) The switch costs nothing extra (gas is <i>cheaper</i> to run than the old coal plant), so this is the opportunity cost Nordhaus computes: ($10 per 1,000 kWh) ÷ (0.5 t per 1,000 kWh) = <b>$20/t</b>. The ranking is the point: <b>gas-for-coal is about 8× cheaper per ton</b> than the fridge.</li>
<li>(c) 8 × $25 = <b>+$200 (+20%)</b>.</li>
<li>(d) 16 m × $25 = <b>$400 m</b> a year. (The book says a big plant pays "almost $400 million".)</li></ol></details>
<div class="prob"><b>Problem</b>Cap and trade. Uncontrolled emissions are 5 bn t and the cap is 4 bn t, auctioned. The last ton costs $25 to abate. (a) Permit price? (b) Revenue? (c) What tax gives the same result? (d) Firm A values a permit at $2/t and firm B at $202/t. Welfare gain from trade?</div>
<details class="work"><summary>Show worked solution</summary>
<ol><li>(a) <b>$25</b> (equal to the marginal abatement cost).</li><li>(b) 4 bn × $25 = <b>$100 bn</b>.</li><li>(c) A <b>$25 tax</b>, which also yields $100 bn and a 1 bn t cut.</li><li>(d) <b>$200/t</b>. The price only splits the gain between A and B.</li></ol></details>`},
{t:"P8 · Right to energy & jobs (India)", h:`
<div class="prob"><b>Problem</b>(a) Decile shares of carbon footprint: D1 5.3%, D7 9.6%, D10 24%. Compute the CIQs. Who qualifies for free energy? (b) The 7th-decile median is 412 kWh per person per year, and household size is 5.5. Find the monthly free cutoff. (c) A decile-8 person pays a $53.5 carbon charge and gets $17.9 of benefits. Net?</div>
<details class="work"><summary>Show worked solution</summary>
<ol><li>(a) CIQ = share / 0.10: D1 = <b>0.53</b>, D7 = <b>0.96</b>, D10 = <b>2.40</b>. CIQ &lt; 1 means a fair or under-share, so the bottom 7 deciles qualify.</li>
<li>(b) 412 × 5.5 = 2,266 ≈ <b>2,268 kWh/yr = 189 kWh/month</b>.</li>
<li>(c) 17.9 − 53.5 = <b>−$35.6</b>, a net payer (matching the paper's decile-8 figure).</li></ol></details>
<div class="prob"><b>Problem</b>India spends $10 bn: (i) all on renewables, (ii) $6 bn renewables and $4 bn efficiency, (iii) all on fossil fuels. Jobs? (Use 290, 230 and 129 jobs per $1 m.)</div>
<details class="work"><summary>Show worked solution</summary>
<ol><li>(i) 10,000 × 290 = <b>2.9 m</b>.</li><li>(ii) 6,000 × 290 + 4,000 × 230 = 1.74 m + 0.92 m = <b>2.66 m</b>.</li><li>(iii) 10,000 × 129 = <b>1.29 m</b>.</li><li>Net gain of (i) over (iii) = 1.61 m. Clean energy is about 2.2× as job-intensive.</li></ol></details>
<p>For a Leontief inverse problem, see the worked 2-sector example in Module 15.</p>`},
{t:"Graph answers: microeconomics (model outlines)", h:`
<details class="sa"><summary>Explain with a graph why the market over-produces a polluting good, and how a Pigouvian tax fixes it.</summary>
<p>Axes: P vs Q. Draw D = MB, S = private MC, and SMC = S + marginal external damage. Market E<sub>M</sub> is where D = S. Efficient E* is where D = SMC, at lower Q and higher P. Shade the damage band and the deadweight-loss triangle between SMC and D from Q* to Q<sub>M</sub>. A tax equal to marginal damage shifts S up to SMC: quantity falls to Q*, revenue equals remaining damage, and the deadweight loss disappears. Mention incidence, regressivity and revenue use.</p></details>
<details class="sa"><summary>Positive externality (solar) and a subsidy.</summary>
<p>Social MB = private MB + external benefit, so it lies above D. Market Q<sub>M</sub> is too low. A per-unit subsidy shifts S down and output rises to Q*, where social MB = MC.</p></details>
<details class="sa"><summary>Show how a firm responds to a pollution tax, and why taxes are cost-effective.</summary>
<p>Axes: $ vs pollution level. MCR rises steeply toward low pollution (it's drawn falling toward Q<sub>max</sub>). The tax is a horizontal line T. The firm cuts to Q<sub>Tax</sub>, where MCR = T. Areas: A is the tax still paid, B the cleanup cost, C the saving. With many firms, everyone ends with MCR = T, so a given total cut is reached at least cost, unlike a uniform standard.</p></details>
<details class="sa"><summary>Fishery as a common property resource.</summary>
<p>Axes: $ vs trips. PC is flat at $15k. RT is flat at $25k to T<sub>0</sub>, then falls. SC rises above PC after T<sub>0</sub> (lost profits of others). T* is where RT = SC. Open access goes to T<sub>e</sub>, where RT = PC and profit is zero. Fixes: a per-trip fee equal to the external cost, or ITQs. Mention Hardin vs Ostrom.</p></details>
<details class="sa"><summary>Public good provision with two people.</summary>
<p>Draw each person's MB and add them <b>vertically</b>. The optimum is where ΣMB = MC (Doug $5 + Sasha $2 = $7 at 10 acres). Explain free riding (WTP &lt; MB), why markets supply roughly zero, and the need for tax-funded provision.</p></details>
<details class="sa"><summary>Artificially scarce good (cable TV).</summary>
<p>MC = 0. Price $30 serves 80k households, but the efficient number is all 120k with positive MB. The triangle between 80k and 120k under demand is the welfare loss. Price discrimination or regulation can help.</p></details>`},
{t:"Graph answers: climate-policy graphs (model outlines)", h:`
<details class="sa"><summary>Use Nordhaus's cost–benefit graph to explain the 'optimal' temperature target and what shifts it.</summary>
<p>Axes: % of income vs temperature limit. Abatement cost slopes down, damages slope up, and the total is U-shaped. Ideal case: minimum at 2.3°C, 2.9% of income. Limited participation shifts abatement up and right, giving 3.8°C. Discounting lowers damages, giving 4.0°C (a small effect because the cost curve is nonlinear while damages are near-linear). A tipping point at 3.5°C makes the curve V-shaped with its minimum at the threshold. Then critique it: Stern's guard-rail, Keen's fictional damages, and missing nonmarket impacts.</p></details>
<details class="sa"><summary>Why do cap-and-trade and a carbon tax differ under uncertainty?</summary>
<p>Axes: $/t vs reduction. Draw two possible MAC curves. A tax (horizontal line) fixes price, so the reduction varies (big cut if cheap, small if costly). A cap (vertical line) fixes the reduction, so price varies (EU ETS swings). Under certainty they're equivalent (the $100 bn example). Then discuss revenue, volatility, political durability and hybrids (floor plus safety valve).</p></details>
<details class="sa"><summary>Bottom-up vs top-down cost curves.</summary>
<p>Axes: average cost (% income) vs % cut. Bottom-up starts negative (about 15% of cuts save money) but rises more steeply, because it covers few technologies and misses behaviour change. Top-down starts at zero, because it assumes no free lunches. Both give about 0.5% of income at a 30% cut.</p></details>
<details class="sa"><summary>Participation and the cost of temperature targets.</summary>
<p>Axes: cost vs temperature limit. With full participation, 2°C costs about 1.5% of income. With 50% participation, costs explode below 4°C and 2°C is infeasible. Inefficient policy doubles costs. Link to the free-rider problem and Kyoto (one-fifth coverage).</p></details>

M.push({t:"Revision & final quiz", c:[
{t:"Who says what (one line each)", h:`
<table>
<tr><th>Author</th><th>Core claim</th></tr>
<tr><td><b>Goodwin 13</b></td><td>Externalities justify intervention. A Pigouvian tax equal to marginal damage raises welfare (gain = area K). Market-based tools (taxes, permits) minimise abatement cost.</td></tr>
<tr><td><b>Goodwin 14</b></td><td>Public goods, CPRs and club goods all fail in markets. Add MB vertically for public goods. Open access gives T<sub>e</sub> &gt; T*. Ostrom: communities can manage commons. Climate is a global public good.</td></tr>
<tr><td><b>Nordhaus 12</b></td><td>Damages are about 1–5% of output at 3°C, convex, with modern economies insulated. The worst risks lie outside markets. Add a risk premium. 2°C is "both too low and too high".</td></tr>
<tr><td><b>Nordhaus 15</b></td><td>Cost is measured in $/t. Cheap at first, steep later. Bottom-up vs top-down. Participation and efficiency drive costs: 2°C costs about 1.5% with full participation and is infeasible at 50%.</td></tr>
<tr><td><b>Nordhaus 16</b></td><td>Descriptive (opportunity-cost) discounting at about 4%. Distinguish goods from welfare discounting. Zero discounting is an infinite burden (Koopmans).</td></tr>
<tr><td><b>Nordhaus 18</b></td><td>U-shaped total cost: 2.3°C ideal, 3.8°C with half participation, 4.0°C with discounting. Tipping points make it V-shaped. CBA is still necessary.</td></tr>
<tr><td><b>Nordhaus 19–20</b></td><td>The carbon price is central (about $25/t in 2015, rising ~5%/yr). Tax and cap-and-trade are equivalent in theory but differ in practice. He'd take either, a tax if forced. Hybrids.</td></tr>
<tr><td><b>Stern 2022</b></td><td>Immense risk plus rapid transformation. Use a guard-rail (1.5°C), not CBA. Increasing returns, so IAMs overstate costs. Many market failures, so a carbon price isn't enough. No pure-time discounting. Invest 2–3pp of GDP.</td></tr>
<tr><td><b>Keen 2021</b></td><td>Damage estimates are "fictional empirics": the indoors fallacy, cross-section ≠ time, biased surveys, a misused Lenton. Energy drives GDP. The real damage could be an order of magnitude larger.</td></tr>
<tr><td><b>Foster et al. 2009</b></td><td>The Midas Effect: three transmutation myths. Capitalism is the root cause. 350 ppm. Hansen's dividend tax, contraction &amp; convergence, ecological revolution.</td></tr>
<tr><td><b>Nordhaus SoG 8</b></td><td>Green vs mainstream sustainability (Jacobs' weak/strong vs Solow's living standards). Substitution, with caution about red lines.</td></tr>
<tr><td><b>Raworth 2012</b></td><td>The doughnut: a social foundation (11 dimensions) plus an ecological ceiling (9 boundaries, 3 crossed). Ending poverty is cheap; the rich cause the stress. Equity plus efficiency.</td></tr>
<tr><td><b>Naudé 4–5</b></td><td>Green growth has only relative decoupling (DMC vs MF, Jevons). Degrowth is a planned throughput cut, but 63% of emissions come from the South and IPAT works against it. Both are "fairy tales".</td></tr>
<tr><td><b>Pollin 2015</b></td><td>India: 1.5% of GDP for 20 years. CO₂ falls 53% to 1.5 t per person. Jobs: 290/230 vs 129 per $1 m, net +6.3 m.</td></tr>
<tr><td><b>Azad 2020</b></td><td>A carbon tax ($60.4/t, revenue-neutral, collected upstream) funds the 1.5% plus a Right to Energy (189 kWh/month, travel pass). CIQ: the bottom 70% gain.</td></tr>
<tr><td><b>Mair &amp; Druckman</b></td><td>IO: rows sell, columns buy. a<sub>ij</sub> = z<sub>ij</sub>/x<sub>j</sub>. x = (I − A)<sup>−1</sup>y. c = u′(I − A)<sup>−1</sup>y. Multipliers.</td></tr>
<tr><td><b>Skovgaard 9</b></td><td>Climate finance: $100 bn (2009), CBDR, the onion of what counts, equity vs efficiency, a fragmented system. North: broad definitions and control. South: narrow definitions and equity.</td></tr>
<tr><td><b>OWID</b></td><td>About 1/3 of bilateral project aid ($50 bn, 2024) is climate-tagged. Only 13% if counting principal objectives only. Displacement vs relabelling.</td></tr>
</table>`},
